<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reporte de Gestión</title><link rel="stylesheet" href="/assets/s.css"><script type="application/json" id="d">{"slug": "karla-sermeno", "nombre": "Karla Sermeno", "estado": "listo", "rango": "Semana del 2 al 8 de noviembre de 2026", "rangoCorto": "2–8 nov", "rangoAnt": "26 oct–1 nov", "tasa": {"pct": 0, "num": 0, "den": 8, "botSola": 0, "ella": 0, "mutuo": 0, "leadSola": 0, "pctAnt": 22}, "historico": [{"etq": "26 oct–1 nov", "tasa": 22}, {"etq": "2–8 nov", "tasa": 0}], "intro": ["Karla, antes de nada: esta semana entraron <b>8 leads de publicidad</b>. Es una muestra muy chica — una cita de más o de menos mueve el porcentaje veinte puntos — así que lee los números absolutos y no el porcentaje. De esas 8 personas, le escribiste a 3 y a esas 3 les mandaste nota de voz. Tres de tres: eso es una proporción que casi nadie tiene.", "Y aun así, ninguna de las 8 agendó. Las 5 que no recibieron un mensaje tuyo preguntaron cosas muy concretas y se quedaron sin respuesta de nadie: Jaquelin preguntó «Cuánto cobras por ese largo», Kenia escribió en inglés pidiendo precio y dirección, Vanessa pidió la dirección y dijo que le queda un poco lejos. <b>Todo lo demás en este reporte es consecuencia de eso.</b>"], "kpis": [{"k": "Leads de anuncio", "s": "Leads", "v": 8, "ant": 9, "t": "8", "at": "9"}, {"k": "Les escribiste antes", "s": "Escribiste", "v": 3, "ant": 5, "t": "3", "at": "5 de 9"}, {"k": "Con nota de voz", "s": "Voz", "v": 3, "ant": 5, "t": "3", "at": "5 de 9"}, {"k": "Agendaron", "s": "Agendaron", "v": 0, "ant": 2, "t": "0", "at": "2"}, {"k": "Les escribiste después", "s": "Después", "v": 0, "ant": 1, "t": "—", "at": "1 de 2"}, {"k": "Les mandaste la foto", "s": "Foto", "v": 0, "ant": 0, "t": "—", "at": "0 de 2"}], "barras": [{"label": "Leads a los que le escribiste", "num": 3, "den": 8, "meta": 60}, {"label": "Leads con nota de voz", "num": 3, "den": 8, "meta": 40}, {"label": "Citas a las que mandaste la foto", "num": 0, "den": 0, "meta": 60, "vacio": "Esta semana no hubo citas de leads de publicidad, así que esta barra no aplica."}], "origen": [], "origenNota": "Esta semana no se creó ninguna cita a partir de un lead de publicidad. La semana pasada se crearon 2, y en las dos habías escrito tú antes: ese 22% salió de tu trabajo, no del bot. El bot, en tu cuenta, no ha cerrado ninguna cita por sí solo en dos semanas.", "metodo": [{"c": "En la clase te explicamos la rutina diaria: revisar las conversaciones de por lo menos los dos días anteriores y buscar cuatro grupos — quien dejó de responder, quien preguntó y no agendó, quien quedó a medias, y a quien se le dieron horarios y no confirmó.", "h": "Tus mensajes a leads de publicidad fueron el lunes 2 (5), el martes 3 (3) y el miércoles 4 (3). Del jueves al domingo, cero. Jaquelin escribió el 2/11 a las 21:55 «Cuánto cobras por ese largo» después de 5 mensajes y nadie le respondió nunca.", "p": "Con 8 leads en la semana, tenías tiempo de sobra para tocar a las 8. Se quedaron 5 sin un solo mensaje tuyo, y las tres preguntas más fáciles de la semana — precio, dirección, corte — murieron ahí."}, {"c": "En la clase te enseñamos que no se responde únicamente con el precio, pero tampoco se deja sin responder: «con mucho gusto te doy toda la información, pero antes cuéntame, ¿qué te gustaría mejorar exactamente?» Los dos extremos fallan, y el peor es el silencio.", "h": "Kenia escribió el 4/11: «I want a natural balayage! And probably a hair cut. How much is it, and where are you located». Eso es una persona diciendo qué quiere, qué más quiere y pidiendo precio y dirección, todo en un mensaje. No hubo respuesta.", "p": "Kenia es el lead más caliente que tuviste esta semana y es el único de los ocho que ya sabía exactamente qué quería. Se fue sin que nadie le contestara."}, {"c": "En la clase te recordamos que las sardinas también compran, y que una objeción no es un no at's underneath. Could you send me a photo of your hair now and one of the look you want? The strand test and hair evaluation are free, 30 minutes. Would a weekday or a Saturday work better for you?"}, {"t": "Jaquelin y Vanessa, antes del martes", "d": "Jaquelin preguntó cuánto cobras por ese largo. Vanessa pidió la dirección y dijo que le queda lejos. Las dos están tibias.", "g": "Vanessa, estamos en 36983 Rehoboth Avenue Ext., Unit B. Sé que no queda a la vuelta, pero como tu cabello está virgen el resultado se te va a notar muchísimo y vale el viaje. La evaluación con prueba de mechón son 30 minutos y es gratis. ¿Te sirve un sábado por la mañana?"}, {"t": "Que la semana no se corte el miércoles", "d": "Del jueves al domingo no salió ningún mensaje tuyo a leads nuevos. Con 8 leads por semana, diez minutos al día alcanzan para no dejar ninguna sin tocar."}], "pie": "Los números salen de tu cuenta de EpikFlow entre el lunes 2 y el domingo 8 de noviembre. Esta semana la muestra es muy chica — 8 leads — así que conviene leer los absolutos y no el porcentaje. Solo cuentan como tuyos los mensajes que salieron de tu teléfono o de tu equipo desde la plataforma, así que si algo quedó fuera es porque no pudimos verlo, nunca al revés."}</script><script src="/assets/a.js" defer></script></html>
