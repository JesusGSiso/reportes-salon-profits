<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reporte de Gestión</title><link rel="stylesheet" href="/assets/s.css"><script type="application/json" id="d">{"slug": "catalina-conde-florez", "nombre": "Catalina Conde Florez", "estado": "listo", "rango": "Semana del 2 al 8 de noviembre de 2026", "rangoCorto": "2–8 nov", "rangoAnt": "26 oct–1 nov", "tasa": {"pct": 25, "num": 12, "den": 48, "botSola": 8, "ella": 13, "mutuo": 4, "leadSola": 0, "pctAnt": 18}, "historico": [{"etq": "2–8 nov", "tasa": 25}], "intro": ["Catalina, esta semana tu tasa subió del 18% al <b>25%</b>, y hay un número que no tiene nadie más en la cartera: <b>13 de esos 25 puntos son enteramente tuyos</b> — citas que salieron de conversaciones donde entraste tú y el bot no participó. Le escribiste a 30 de 48 personas, mandaste 7 notas de voz y creaste 8 de las 14 citas desde tu teléfono. En cuanto a trabajo manual sobre la pauta, eres la referencia de la cartera.", "Y hay un patrón muy claro en el reparto de ese trabajo: el lunes mandaste 44 mensajes, el martes 30, el miércoles 25, el jueves 18, el viernes 9, el sábado 4 y el domingo 7. <b>La semana se te apaga.</b> Las 17 personas que no recibieron un mensaje tuyo entraron casi todas de jueves a domingo, y varias estaban a un paso de agendar. <b>Todo lo demás en este reporte es consecuencia de eso.</b>"], "kpis": [{"k": "Leads de anuncio", "s": "Leads", "v": 48, "ant": 91, "t": "48", "at": "91"}, {"k": "Les escribiste antes", "s": "Escribiste", "v": 30, "ant": 87, "t": "30", "at": "87 de 91"}, {"k": "Con nota de voz", "s": "Voz", "v": 7, "ant": 15, "t": "7", "at": "15 de 91"}, {"k": "Agendaron", "s": "Agendaron", "v": 12, "ant": 16, "t": "12", "at": "16"}, {"k": "Les escribiste después", "s": "Después", "v": 6, "ant": 8, "t": "6", "at": "8 de 16"}, {"k": "Les mandaste la foto", "s": "Foto", "v": 1, "ant": 0, "t": "1", "at": "0 de 16"}], "barras": [{"label": "Leads a los que le escribiste", "num": 30, "den": 48, "meta": 60}, {"label": "Leads con nota de voz", "num": 7, "den": 48, "meta": 40}, {"label": "Citas a las que mandaste la foto", "num": 1, "den": 12, "meta": 60}], "origen": [{"k": "El bot", "v": 6, "c": "#2F6F68"}, {"k": "Tú, desde el teléfono", "v": 8, "c": "#C0522F"}], "origenNota": "De las 14 citas creadas, 8 las creaste tú desde el teléfono y 6 el bot. Y en el desglose de arriba verás «Tú 13%»: eso significa que en esas conversaciones el bot no puso nada antes de la cita — el trabajo fue tuyo entero. Es el número más alto de crédito propio de toda la cartera esta semana.", "metodo": [{"c": "En la clase te explicamos la rutina diaria: revisar las conversaciones de por lo menos los dos días anteriores y buscar cuatro grupos — quien dejó de responder, quien preguntó y no agendó, quien quedó a medias, y a quien se le dieron horarios y no confirmó.", "h": "Tu reparto de la semana: 44 mensajes el lunes, 30 el martes, 25 el miércoles, 18 el jueves, 9 el viernes, 4 el sábado, 7 el domingo. De las 17 leads sin un mensaje tuyo, la mayoría entró entre el viernes y el domingo: Valeria el 7/11, Guille el 7/11, Carolyn el 6/11.", "p": "El lunes arrancas con todo y el fin de semana llegas con la batería en cero. Pero el sábado y el domingo entraron 11 leads nuevos, y a esas horas eres tú la única que puede contestar: la gente escribe cuando no trabaja."}, {"c": "En la clase te enseñamos el embudo de opciones: ¿entre semana o fin de semana? → ¿mañana o tarde? → ¿a las 10 o a las 11? Tres pasos, y nunca se deja la pregunta abierta.", "h": "Lety respondió el 8/11 a las 22:25 con una sola palabra: «Entre semana». Ese es el paso 1 del embudo contestado. Nadie le dio el paso 2. Lo mismo con Joselyn («Hace 3 días»), Olga («Hace una semana») y Michelle («No tiene nada»): las cuatro contestaron la pregunta que se les hizo y ahí murió la conversación.", "p": "Lety estaba literalmente a dos mensajes de tener una cita en tu calendario. Esas cuatro conversaciones quedaron a medias con la lead esperando — es el grupo que la clase llama «quedó a medias» y es el más caro de perder."}, {"c": "En la clase te explicamos que después de que agenda hay un segundo trabajo — empujarla para que asista — y que la foto es lo que sostiene esa espera.", "h": "De las 12 que agendaron, les escribiste a 6 y le mandaste foto a 1. Jeka cerró el 8/11 con «Gracias 🙏», Luciana con «Ok gracias» y 🥳 con «Muchas gracias»: las tres con cita y sin un mensaje tuyo después.", "p": "Traer 12 citas de 48 leads es un trabajo enorme; perder a la mitad en el camino al sillón por falta de un mensaje es el desperdicio más barato de arreglar que tiene tu reporte."}], "cierre": "Catalina, no hay nada que enseñarte sobre cómo hacerlo: el método ya está grabado, ya lo viste, y esta semana lo probaste en tu propia cuenta mejor que nadie — 13 puntos de tasa salidos de conversaciones donde solo hablaste tú. Eso es lo que la clase llama trabajar la pauta, y lo hiciste. Lo que hay que cambiar es el reparto: mientras los 44 mensajes del lunes se vuelvan 4 el sábado, vas a seguir perdiendo justo a las que entran el fin de semana, que son las que más te necesitan porque no hay nadie más contestando. Y una cosa más: a tus clientas de siempre les mandas un «entre semana» y vienen igual. Quien te vio en un anuncio el sábado a las diez de la noche contestó «entre semana» y se quedó esperando tu siguiente mensaje; si no llega, el lunes ya está hablando con otro salón.", "funciono": "A <b>Mis</b>, el 4 de noviembre, le pasó lo que la clase describe palabra por palabra: preguntó «el precio por favor» y tú, en vez de responder con una cifra, le contestaste sobre el día y la hora — «¿qué hora?» — y la llevaste a la cita. Esa conversación es la prueba de que sabes mover a la gente del precio al siguiente paso. Y de las 48 leads de la semana, 8 citas las creaste tú misma desde el teléfono: ninguna otra cuenta de la cartera se acerca a eso.", "acciones": [{"t": "Lety, hoy, con dos horas concretas", "d": "Contestó «Entre semana» el domingo por la noche y se quedó ahí. Es la cita más fácil de la semana: solo falta el paso 2 y el 3 del embudo.", "g": "Lety, perfecto, entre semana entonces 💛 ¿Prefieres en la mañana o en la tarde? Tengo martes a las 10:00 o jueves a las 4:00 — la evaluación capilar son 20 minutos y es gratis."}, {"t": "Joselyn, Olga y Michelle quedaron a medias", "d": "Las tres contestaron la última pregunta y nadie siguió. Joselyn dijo «hace 3 días», Olga «hace una semana», Michelle «no tiene nada». Están tibias y te llevan cinco días esperando."}, {"t": "Guarda diez minutos para el sábado y el domingo", "d": "El sábado mandaste 4 mensajes y el domingo 7, y en esos dos días entraron 11 leads nuevos. No hace falta trabajar más: hace falta que una parte del lunes se mueva al fin de semana."}, {"t": "La foto a las 11 citas que faltan", "d": "De 12 citas, una recibió foto. El día antes, una foto de un trabajo tuyo parecido a lo que ella pidió — eso es lo que hace que aparezca."}], "pie": "Los números salen de tu cuenta de EpikFlow entre el lunes 2 y el domingo 8 de noviembre. Solo cuentan como tuyos los mensajes que salieron de tu teléfono o de tu equipo desde la plataforma, así que si algo quedó fuera es porque no pudimos verlo, nunca al revés."}</script><script src="/assets/a.js" defer></script></html>
