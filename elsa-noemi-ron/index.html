rra no aplica."}], "origen": [{"k": "El bot", "v": 4, "c": "#2F6F68"}], "origenNota": "Las 4 citas de la semana las creó el bot y en ninguna apareciste tú antes. Tu bot trabaja bien: cuando preguntan el precio responde «la evaluación es gratuita y sin abono, el precio del tratamiento te lo confirmo después de verte», que es exactamente lo que enseñamos. Pero el bot consigue la cita; quien convence de pagar un tratamiento de aclaramiento eres tú, y esta semana esa parte no existió.", "metodo": [{"c": "En la clase te explicamos que el bot es apoyo, no reemplazo: responde rápido, inicia la conversación y filtra, pero tú interpretas la necesidad y cierras. La caída a cero cuando entra el bot es el patrón más común y el más caro.", "h": "18 leads de publicidad esta semana, 0 mensajes tuyos. Ni uno. La semana pasada fueron 4 de 37, y esta semana bajó a 0 de 18.", "p": "Las 4 citas que salieron son las que el bot pudo cerrar solo. Las otras 14 conversaciones se quedaron donde el bot las dejó."}, {"c": "En la clase de seguimiento diario te explicamos revisar todos los días las conversaciones de por lo menos los dos días anteriores y buscar cuatro grupos: quien dejó de responder, quien preguntó y no agendó, quien quedó a medias, a quien se le dieron horarios y no confirmó.", "h": "<b>Gabriela</b> escribió el 24/10 a las 13:58: «Depilación láser. Aclaró un poco pero luego volvió a oscurecer. No he intentado nada más». <b>Martha</b> el 24/10: «Por aclaramiento de la zona». <b>Maricruz</b> el 22/10 contestó al mensaje del bot que decía «me quedé a medias». Ninguna de las tres recibió un mensaje tuyo.", "p": "Gabriela te contó su caso completo —qué se hizo, qué pasó y que no ha probado nada más— y Maricruz dijo literalmente que se quedó a medias. Eran dos conversaciones listas para cerrar y se quedaron ahí."}, {"c": "En la clase te enseñamos no responder únicamente con el precio y usar el molde: «claro que sí, con mucho gusto te doy toda la información, pero antes cuéntame, ¿qué te gustaría mejorar exactamente?». Esa pregunta es la puerta de entrada.", "h": "4 leads preguntaron el precio esta semana. A los 4 les respondió el bot. Miguel el 19/10 a las 18:43 «Cuando es el costo» y Maricruz el 21/10 «El precio»: en los dos contestó el bot y la conversación terminó ahí.", "p": "La pregunta de precio es el momento en que la lead está dispuesta a hablar. Cuatro veces se abrió esa puerta esta semana y cuatro veces solo estaba el bot del otro lado."}], "cierre": "Nada de esto es una opinión nuestra: está grabado en el área de miembros, en la clase de seguimiento diario y en la de nota de voz, y esta semana quedó probado en tu propia cuenta. El bot llegó hasta donde puede llegar —4 citas de 18— y de ahí no pasó porque no había nadie detrás. Y mientras la pauta quede solo en sus manos el número no se va a mover: tus clientas de siempre vuelven solas porque ya confían en ti, pero quien te vio en un anuncio está cotizando y comparando, y a esa hay que construirle la confianza. El trabajo ya lo estás haciendo —107 mensajes esta semana lo demuestran—; lo que falta es apuntar una parte de ese trabajo a las personas nuevas.", "funciono": "No tengo esta semana una conversación tuya con un lead de publicidad que pueda mostrarte, porque no hubo ninguna. Así que te muestro una del bot, para que veas hasta dónde llega él y dónde empiezas tú. A Maricruz, que preguntó el precio el 21/10, el bot le respondió: «La evaluación es gratuita y sin abono. El precio del aclaramiento te lo confirmo después de verte». Eso está bien hecho y es justo lo que enseñamos. Pero ahí se detuvo, y Maricruz terminó respondiendo que se había quedado a medias. Ese «a medias» es exactamente el espacio que ocupas tú con un audio de 40 segundos, y es el espacio que esta semana quedó vacío 18 veces.", "acciones": [{"t": "Gabriela y Martha, hoy, con nota de voz", "d": "Gabriela te contó que se hizo láser, que aclaró y volvió a oscurecer, y que no ha probado nada más. Martha te dijo que quiere aclaramiento de la zona. Las dos están a un audio de agendar.", "g": "Hola Gabriela, soy Elsa. Leí lo que me contaste: que te hiciste láser, que aclaró un poco y después volvió a oscurecer. Eso lo veo muchísimo y tiene explicación, no es que tu piel no responda. En la evaluación —que es gratis, presencial y de 30 minutos, sin abono— te digo exactamente por qué pasó y qué sí te funcionaría. Cuéntame una cosa: ¿hace cuánto fue el último láser?"}, {"t": "Maricruz dijo que quedó a medias", "d": "Preguntó el precio el martes y la conversación se cortó. Es la persona más cerca de agendar que tienes esta semana.", "g": "Hola Maricruz, soy Elsa, perdón por la demora. Vi que preguntaste el precio y quiero explicártelo bien: en aclaramiento el costo cambia muchísimo según la zona y el tono que tengas ahora, por eso la evaluación es gratis y sin abono. Para irte preparando: ¿qué zona te gustaría aclarar y hace cuánto la tienes así?"}, {"t": "Un lead al día, nada más", "d": "No te pido 18. Te pido 1 al día: entra en la conversación del lead que más claro te dijo qué le pasa y mándale un audio. Cierras la semana con 7 y tu número cambia solo."}], "pie": "Los números salen de tu cuenta de EpikFlow entre el lunes 19 y el domingo 25 de octubre. Solo cuentan como tuyos los mensajes que salieron de tu teléfono o de tu equipo desde la plataforma, así que si algo quedó fuera es porque no pudimos verlo, nunca al revés."}</script><script src="/assets/a.js" defer></script></html>
