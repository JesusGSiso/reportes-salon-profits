<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reporte de Gestión</title><link rel="stylesheet" href="/assets/s.css"><script type="application/json" id="d">{"slug": "elsa-noemi-ron", "nombre": "Elsa Noemi Ron", "estado": "listo", "rango": "Semana del 28 de septiembre al 4 de octubre de 2026", "rangoCorto": "28 sep–4 oct", "rangoAnt": "21–27 sep", "tasa": {"pct": 33, "num": 21, "den": 63, "botSola": 28, "ella": 0, "mutuo": 5, "leadSola": 0, "pctAnt": null}, "historico": [{"etq": "28 sep–4 oct", "tasa": 33}], "intro": ["Volvió a entrar publicidad en tu cuenta después de dos semanas sin leads, y entró fuerte: 63 personas. De esas, 21 agendaron. Una tasa del 33%, que es un buen número de arranque y hay que decirlo primero.", "Ahora, de dónde salió. De las 63 personas, tú le escribiste a 8. No mandaste ninguna nota de voz. Y las 21 citas las cerró el bot — en 18 trabajó completamente solo y en 3 hubo algo tuyo. Esta semana el bot te consiguió 21 personas que van a cruzar tu puerta sin haber hablado contigo. <b>Todo lo demás en este reporte es consecuencia de eso.</b>"], "kpis": [{"k": "Leads de anuncio", "s": "Leads", "v": 63, "ant": 0, "t": "63", "at": "0"}, {"k": "Les escribiste antes", "s": "Escribiste", "v": 8, "ant": 0, "t": "8", "at": "sin leads"}, {"k": "Con nota de voz", "s": "Voz", "v": 0, "ant": 0, "t": "0", "at": "sin leads"}, {"k": "Agendaron", "s": "Agendaron", "v": 21, "ant": 0, "t": "21", "at": "0"}, {"k": "Les escribiste después", "s": "Después", "v": 4, "ant": 0, "t": "4", "at": "sin leads"}, {"k": "Les mandaste la foto", "s": "Foto", "v": 0, "ant": 0, "t": "0", "at": "sin leads"}], "barras": [{"label": "Leads a los que le escribiste", "num": 8, "den": 63, "meta": 60}, {"label": "Leads con nota de voz", "num": 0, "den": 63, "meta": 40}, {"label": "Citas a las que mandaste la foto", "num": 0, "den": 21, "meta": 60}], "origen": [{"k": "El bot", "v": 21, "c": "#2F6F68"}], "origenNota": "Las 21 citas las creó el bot, y en 18 de ellas no habías escrito nada antes. Kareen escribió 18 mensajes, Miryam 16 y Hannah 13 — las tres agendaron y las tres hablaron solo con el bot. Una nota técnica: en tu cuenta se ven pocos mensajes salientes con tu firma (51 en diecisiete días), así que es posible que algo de tu trabajo esté saliendo por un canal que no podemos ver. Si estás escribiéndoles por otro número o por Instagram, dinos y lo arreglamos; pero lo que sí podemos ver dice 8 de 63.", "metodo": [{"c": "En la clase de seguimiento te explicamos la rutina diaria: todos los días revisar las conversaciones de por lo menos los dos días anteriores, y buscar a quien dejó de responder, a quien preguntó y no agendó, a quien quedó a medias y a quien se le dieron horarios y no confirmó.", "h": "53 de tus 63 leads no recibieron ni un mensaje tuyo. Lipe escribió el 3 de octubre a las 17:31: \"Cuando me puedes sar una cita\". Gabriela, ese mismo día: \"La dirección por favor\". Tatty: \"Ok uno va no más. Si cita previa?\". Ninguna de las tres agendó ni tuvo respuesta tuya. Tus mensajes del lunes 28 y del domingo 4 fueron cero.", "p": "Lipe pidió una cita con esas palabras exactas y se quedó sin una. Con 63 leads en una semana, las que se caen por falta de un mensaje son las que marcan la diferencia entre 33% y 50%. Esas tres solas habrían subido tu tasa cinco puntos."}, {"c": "En la clase te explicamos que el bot es apoyo, no reemplazo: responde rápido, inicia y filtra, pero tú interpretas la necesidad y cierras. La confianza la construyes tú, y en un servicio íntimo eso pesa el doble.", "h": "18 de las 21 citas las cerró el bot sin que tú aparecieras. En las conversaciones de aclaramiento, el bot recogió historias personales — una lead contó que el cambio le apareció en su segundo embarazo y se mantuvo después — y las contestó él.", "p": "Ese es el tipo de cosa que una mujer cuenta una sola vez, y la contó a un bot. Va a llegar a tu consultorio sin saber si la persona que la va a atender entendió lo que dijo. En aclaramiento y en estética íntima, la confianza previa es lo que hace que la persona se presente y vuelva."}, {"c": "En la clase te enseñamos la nota de voz con cinco elementos: tu nombre, una validación, la necesidad que la lead expresó, una solución posible y una pregunta para continuar. Con energía, y nunca la misma para dos personas.", "h": "Cero notas de voz en 63 leads.", "p": "En tu servicio es la herramienta más poderosa que tienes y la más fácil de usar: treinta segundos de tu voz diciéndole a una mujer que lo que le pasa es común y tiene solución valen más que cualquier texto. Es la única de tus seis cifras en cero absoluto."}, {"c": "Tu segundo trabajo, después de que agendan, es empujar a la que ya tiene cita para que asista: el mensaje de recordatorio y la foto de un resultado parecido.", "h": "De las 21 que agendaron, a 4 les escribiste después. A 17 no.", "p": "Veintiuna citas es una semana llena, pero una cita que no se confirma es una silla vacía. Un mensaje tuyo el día antes es lo más barato que puedes hacer para proteger el trabajo que ya está hecho."}], "cierre": "Esta semana demostró que tu cuenta convierte: 63 leads y 21 citas sin que tuvieras que hacer casi nada, porque el bot está bien montado. Eso es buena noticia y es nuestra parte. Pero el método ya está grabado y ya lo viste en la clase de seguimiento, y esta semana se probó en tu propia cuenta: las 3 citas donde tu trabajo aparece son las únicas que llevan tu nombre, y Lipe, que pidió una cita por escrito, no la tuvo porque nadie leyó su mensaje. Mientras se siga trabajando así el número va a depender del bot y las sillas se van a vaciar solas — tus clientas de siempre llegan porque ya confían en ti, pero quien te vio en un anuncio y solo habló con un robot no tiene con quién sentir compromiso el día de la cita.", "funciono": "El 30 de septiembre, Ana preguntó \"Buenas que precio tienen\" y le contestaste tú: \"Claro 😊 La evaluación para aclarar zonas íntimas es gratis, presencial, dura 30 minutos…\". Clara, cálida y sin cerrar la puerta — exactamente el molde de la clase. Fue el día que más trabajaste (6 mensajes) y es la prueba de que el guion lo tienes. Y las 21 citas de la semana, con 63 leads en el primer arranque de pauta en dos semanas, son un piso alto: tu cuenta tiene demanda real. Lo que falta es que la demanda se encuentre contigo y no solo con el bot.", "acciones": [{"t": "Lipe, Gabriela y Tatty: hoy", "d": "Los tres pidieron cita o dirección entre el 3 y el 4 de octubre y ninguno recibió respuesta tuya. Son los más fáciles de la semana porque ya dijeron que quieren venir.", "g": "Hola Lipe, soy Elsa. Claro que sí te doy cita. Estoy en 107-11 Jamaica Ave, Richmond Hill. Antes dime una cosa para preparar tu evaluación: ¿qué zona te gustaría trabajar y desde cuándo lo notas? Y para la hora: ¿te queda mejor entre semana o fin de semana?"}, {"t": "Las 21 que tienen cita: confírmalas tú", "d": "17 de las 21 no han recibido un mensaje tuyo desde que agendaron. Mándales uno el día antes de su cita, presentándote. Es lo que evita la silla vacía.", "g": "Hola [nombre], soy Elsa, la que te va a atender mañana a las [hora]. Te escribo yo misma para que sepas con quién vienes. Es una evaluación tranquila, en privado, de 30 minutos y sin compromiso. ¿Alguna duda antes de venir?"}, {"t": "Cinco notas de voz esta semana", "d": "Llevas cero en 63 leads. Empieza por las cinco que más han escrito. En tu servicio, oír tu voz es lo que le quita a la lead la vergüenza de preguntar.", "g": "Hola [nombre], soy Elsa. Me cuentas lo de [lo que ella dijo] y quiero que sepas que lo veo todos los días, es muchísimo más común de lo que la gente cree y sí tiene solución. Lo que necesito es verlo en persona para decirte cuántas sesiones te hacen falta. La evaluación es gratis y es en privado. ¿Te reservo entre semana o fin de semana?"}], "pie": "Los números salen de tu cuenta de EpikFlow entre el lunes 28 de septiembre y el domingo 4 de octubre de 2026. Solo cuentan como tuyos los mensajes que salieron de tu teléfono o de tu equipo desde la plataforma, así que si algo quedó fuera es porque no pudimos verlo, nunca al revés."}</script><script src="/assets/a.js" defer></script></html>
