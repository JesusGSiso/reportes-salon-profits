<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reporte de Gestión</title><link rel="stylesheet" href="/assets/s.css"><script type="application/json" id="d">{"slug": "elsa-noemi-ron", "nombre": "Elsa Noemi Ron", "estado": "listo", "rango": "Semana del 5 al 11 de octubre de 2026", "rangoCorto": "5–11 oct", "rangoAnt": "28 sep–4 oct", "tasa": {"pct": 22, "num": 13, "den": 58, "botSola": 22, "ella": 0, "mutuo": 0, "leadSola": 0, "pctAnt": 33}, "historico": [{"etq": "28 sep–4 oct", "tasa": 33}, {"etq": "5–11 oct", "tasa": 22}], "intro": ["Tu cuenta es de las que más gente nueva recibe de toda la cartera: <b>58 personas por publicidad en una semana</b>, y 13 agendaron. Eso suena bien hasta que se mira de dónde salió: en las 13 citas el bot trabajó solo. En ninguna apareces tú antes de que la cita existiera, ni esta semana ni la pasada.", "Y el número que lo explica todo: de 58 personas, <b>a 53 no les llegó ningún mensaje tuyo</b>. Le escribiste a 5. El bot está sosteniendo tu cuenta entero y lo hace bien, pero un bot no puede hacer lo único que convierte a la que duda: hablarle como persona. La tasa bajó de 33% a 22% con prácticamente los mismos leads. <b>Todo lo demás en este reporte es consecuencia de eso.</b>"], "kpis": [{"k": "Leads de anuncio", "s": "Leads", "v": 58, "ant": 63, "t": "58", "at": "63"}, {"k": "Les escribiste antes", "s": "Escribiste", "v": 5, "ant": 8, "t": "5", "at": "8 de 63"}, {"k": "Con nota de voz", "s": "Voz", "v": 1, "ant": 0, "t": "1", "at": "0 de 63"}, {"k": "Agendaron", "s": "Agendaron", "v": 13, "ant": 21, "t": "13", "at": "21"}, {"k": "Les escribiste después", "s": "Después", "v": 5, "ant": 4, "t": "5", "at": "4 de 21"}, {"k": "Les mandaste la foto", "s": "Foto", "v": 0, "ant": 0, "t": "0", "at": "0 de 21"}], "barras": [{"label": "Leads a los que le escribiste", "num": 5, "den": 58, "meta": 60}, {"label": "Leads con nota de voz", "num": 1, "den": 58, "meta": 40}, {"label": "Citas a las que mandaste la foto", "num": 0, "den": 13, "meta": 60, "vacio": "Esta semana no hubo citas, así que esta barra no aplica."}], "origen": [{"k": "El bot", "v": 13, "c": "#2F6F68"}], "origenNota": "Las 13 citas las creó el bot, y mirando quién había hablado con la persona <b>antes</b> de que existiera la cita, también fue el bot solo en las 13. Esto no se dice como reclamo: el bot está haciendo un trabajo enorme en tu cuenta. Se dice porque marca dónde está tu margen — hoy tu número es exactamente el techo de lo que un sistema puede hacer sin ti.", "metodo": [{"c": "El bot es apoyo, no reemplazo. Responde rápido, inicia y filtra, pero tú interpretas la necesidad y tú cierras.", "h": "<b>53 de 58 personas cerraron la semana sin un mensaje tuyo.</b> Tus mensajes a leads fueron 22 en toda la semana, repartidos entre el martes y el domingo. El bot mandó 425.", "p": "Las 13 que agendaron son las que el bot alcanzó a convencer solo: las más fáciles. Las otras 45 son las que necesitaban una persona, y ahí no había nadie. Ese es todo el espacio que tienes para crecer."}, {"c": "La rutina diaria: revisar todos los días las conversaciones de los dos días anteriores, y buscar a quien quedó a medias o pidió algo y no obtuvo respuesta.", "h": "Ramonita te escribió el 10/10 a las 20:44: «<b>¿Puedo hablar contigo mañana por teléfono?</b>». Marisol preguntó «¿Dónde están ubicados?» el domingo. Brenda escribió «Mi nombre es Brenda» y antes había preguntado el costo. Rossy cambió 13 mensajes y terminó con «la del bikini y axilas». Ninguna recibió un mensaje tuyo.", "p": "Ramonita está pidiendo hablar contigo por teléfono: no hay señal de compra más fuerte que esa y nadie la recogió. Rossy ya eligió el servicio. Son citas que estaban a un mensaje de distancia."}, {"c": "No respondas únicamente con el precio: devuelve la necesidad antes del número, y crea confianza con dos o tres preguntas.", "h": "8 personas preguntaron el precio esta semana y a las 8 les respondió el bot. Ivon preguntó dónde están y cuánto cuesta el 11/10 a las 21:37; Alfredo escribió «ok, los precios» el 10/10; María «qué precio tiene» el 9/10. En ninguna entraste tú después.", "p": "El bot contesta bien y encuadra la evaluación como gratis — eso está. Pero quien pregunta el precio ya está decidiendo, y lo que inclina esa decisión es que la dueña del lugar le diga qué le conviene <b>a ella</b>. Esa frase solo la puedes decir tú."}, {"c": "Después de que agenda, empujar a la que ya agendó para que asista, con el mensaje y la foto del lugar.", "h": "De las 13 que agendaron le escribiste a 5 y a <b>ninguna</b> le mandaste la foto. Y en tu agenda de esta semana hay una cantidad grande de citas marcadas como no-show y canceladas.", "p": "Cuando la cita la cierra un sistema y nadie la confirma después con voz propia, el compromiso es con el sistema. Mandar la foto del local y un mensaje el día antes es lo más barato que existe para que la gente llegue — y es lo que más te está costando ahora."}], "cierre": "Nada de esto se aprende de nuevo: es la clase de seguimiento diario que ya viste, aplicada a la semana que acaba de pasar. Lo que tienes es una cuenta con muchísimo volumen y una sola persona atendiéndola — el bot. Y eso ya se probó en tu propia cuenta: las 13 citas de esta semana son el máximo que el bot consigue solo, y bajaron respecto a las 21 de la semana pasada sin que entrara menos gente. Mientras no entres tú, el número va a seguir donde lo deje el sistema. Tus clientas de siempre vuelven solas porque ya confían en ti; quien te vio en un anuncio no trae esa confianza, y a 53 personas esta semana nadie se la construyó.", "funciono": "La primera nota de voz. Esta semana salió 1 — la primera en dos semanas de medición — y aunque sea una sola, marca que se puede. Y hay algo más que vale reconocer: cuando el bot entrega una conversación ya caliente, tus 5 mensajes de seguimiento después de la cita salieron. El músculo está; lo que falta es que empiece antes, no después.", "acciones": [{"t": "Ramonita quiere hablar contigo por teléfono", "d": "Te lo pidió el viernes por la noche. Es la conversión más fácil de las 58.", "g": "Hola Ramonita, soy Elsa. Claro que sí, con mucho gusto hablamos. ¿Te llamo hoy en la tarde o mañana en la mañana? Y cuéntame mientras tanto: ¿qué es lo que más te gustaría mejorar de tu piel?"}, {"t": "Rossy, Marisol y Brenda — hoy", "d": "Rossy ya eligió bikini y axilas, Marisol pidió la ubicación y Brenda preguntó el costo y dio su nombre. Las tres escribieron el domingo y nadie les respondió.", "g": "Hola [nombre], soy Elsa, la dueña. Perdón la demora, te escribo yo directamente. Estoy en 107-11 Jamaica Ave, Richmond Hill. La evaluación es gratis y dura 30 minutos. ¿Te queda mejor entre semana o el fin de semana?"}, {"t": "Diez mensajes al día, no más", "d": "Con 58 leads por semana no hace falta contestarlas todas: con 10 al día alcanzas a 70. Empieza por las que preguntaron precio — son las que ya están decidiendo.", "g": "Hola [nombre], soy Elsa. Vi que preguntaste por el precio y quería contestarte yo. Antes de hablar de números cuéntame: ¿qué es lo que más te gustaría mejorar? Con eso te digo exactamente qué te conviene y cuánto sale en tu caso."}], "pie": "Los números salen de tu cuenta de EpikFlow entre el lunes 5 y el domingo 11 de octubre. Solo cuentan como tuyos los mensajes que salieron de tu teléfono o de tu equipo desde la plataforma, así que si algo quedó fuera es porque no pudimos verlo, nunca al revés."}</script><script src="/assets/a.js" defer></script></html>
