e", "num": 5, "den": 12, "meta": 60}, {"label": "Leads con nota de voz", "num": 3, "den": 12, "meta": 40}, {"label": "Citas a las que mandaste la foto", "num": 0, "den": 1, "meta": 60, "vacio": "Esta semana no hubo citas, así que esta barra no aplica."}], "origen": [{"k": "El bot", "v": 1, "c": "#2F6F68"}], "origenNota": "La única cita de la semana la creó el bot, y en esa conversación tú no apareciste antes de que se agendara. A las 5 personas a las que sí les escribiste, ninguna agendó todavía. Con una sola cita no se puede sacar ninguna ley: lo que hay que mirar esta semana no es el porcentaje, es si las conversaciones avanzaron. Varias de estas citas son para noviembre y todavía no han ocurrido.", "metodo": [{"c": "Rutina diaria: revisar las conversaciones de por lo menos los dos días anteriores, todos los días. El teléfono apaga incendios; el seguimiento organizado se hace sentada.", "h": "Mandaste 11 mensajes en toda la semana: 1 el miércoles 28, <b>9 el viernes 30</b> y 1 el sábado 31. Lunes, martes, jueves y domingo, cero.", "p": "Los leads que entraron el lunes y el martes llegaron al viernes ya fríos, y los del domingo ni se tocaron. <b>6 de los 12</b> no recibieron ningún mensaje tuyo. No es falta de ganas: es que se hizo de una sola sentada en vez de un rato cada día."}, {"c": "Las sardinas también compran, y lo que hay que buscar cada día es a quien dejó de responder y a quien quedó a medias.", "h": "<b>Tereza</b> mandó <b>13 mensajes</b> y cerró con un sticker el 27 de octubre. <b>Charo</b> escribió cuatro veces y su último mensaje, el 1 de noviembre, fue literalmente «Si». Ninguna de las dos recibió un mensaje tuyo.", "p": "Trece mensajes es alguien muy interesado, y un «Si» es una puerta abierta de par en par. Esas dos conversaciones estaban más cerca de una cita que los seis leads nuevos del domingo, y se quedaron quietas."}, {"c": "Embudo de opciones para agendar: nunca «¿cuándo quieres venir?». Tres pasos: ¿entre semana o fin de semana? → ¿mañana o tarde? → ¿a las 10 o a las 11?", "h": "<b>Mariny</b> ya había contado lo suyo —«Pues hace como 5 meses»— y ahí se cortó la conversación. De las 5 personas a las que escribiste, a ninguna se le puso una elección concreta de horarios encima de la mesa.", "p": "Con Mariny la parte difícil estaba hecha: ya estaba contando su historia. Faltaba el paso de dos líneas que convierte una conversación en una cita, y es el que no se dio."}], "cierre": "Esta semana no es una semana mala, es una semana que empezó. Pasaste de 0 a 5 leads tocados y de 0 a 3 notas de voz, y eso es exactamente el método que viste en la clase: tú construyes la confianza que el bot no puede construir. Lo que falta es volverlo rutina en vez de jornada: un rato corto cada día en lugar de nueve mensajes un viernes. Mientras sea una vez por semana, la persona que te vio en un anuncio ya se enfrió, porque ella no te conoce como tus clientas de siempre: ellas vuelven solas, y a la de publicidad hay que alcanzarla en las primeras 48 horas.", "funciono": "Las <b>3 notas de voz</b>. La semana pasada fueron cero, y en un servicio como el tuyo —una evaluación facial, algo íntimo— tu voz es lo que hace que la persona se atreva a venir. Y el viernes 30 demostraste que cuando te sientas, sacas nueve mensajes sin problema. La capacidad está probada; ahora es repartirla en la semana.", "acciones": [{"t": "Tereza y Charo, hoy", "d": "Son las dos conversaciones más avanzadas que tuviste y las dos están frías. Tereza mandó 13 mensajes; Charo dijo «Si» el domingo.", "g": "Hola Charo, soy Elsa. Perfecto entonces. Para apartarte el espacio de la evaluación gratuita, dime: ¿te viene mejor entre semana o fin de semana?"}, {"t": "Cierra a Mariny con el embudo", "d": "Ya te contó su historia. No vuelvas a explicarle el servicio: dale a elegir.", "g": "Mariny, con lo que me cuentas te viene bien la evaluación facial gratuita, son 30 minutos y sin compromiso. ¿Prefieres mañana o tarde?"}, {"t": "Veinte minutos al día, no una jornada", "d": "Esta semana fue 1 día de verdad y 4 en blanco. Pon una alarma: lunes a sábado, 20 minutos, y abre siempre las conversaciones de los dos días anteriores.", "g": "Nota de voz para quien lleve dos días sin responder: «Hola [nombre], soy Elsa. Me quedé pensando en lo que me contaste de [lo suyo]. En la evaluación gratuita te digo exactamente qué se puede hacer en tu caso. ¿Qué es lo que más te gustaría mejorar de tu piel?»"}], "pie": "Los números salen de tu cuenta de EpikFlow entre el lunes 26 de octubre y el domingo 1 de noviembre. Solo cuentan como tuyos los mensajes que salieron de tu teléfono o de tu equipo desde la plataforma, así que si algo quedó fuera es porque no pudimos verlo, nunca al revés."}</script><script src="/assets/a.js" defer></script></html>
