nadie se la hiciera. Alberto cruzó 16 mensajes y cerró con «👍👍». Quique escribió «Te avisaré. Gracias» el 15/10 y nadie volvió a buscarlo.", "p": "Son las tres conversaciones más avanzadas de la semana y las tres murieron solas. Esta semana no salió ninguna nota de voz, que es lo más rápido para rescatarlas."}], "cierre": "Nada de esto significa que el sistema no funcione: el bot te trajo 6 citas sin que tuvieras que hacer nada. Lo que la clase de seguimiento te pide es la otra mitad — entrar donde la persona ya levantó la mano. El método ya está grabado y ya lo viste, y esta semana se probó en tu propia cuenta por ausencia: los tres leads que pidieron día, hora y ubicación son los que más cerca estaban y los únicos que se quedaron sin una palabra tuya. Tus clientas de siempre vuelven porque ya te conocen; quien te vio en un anuncio no, y una nota de voz tuya de treinta segundos hace ese trabajo mejor que cualquier mensaje escrito.", "funciono": "El sábado 17 te sentaste y salieron 6 mensajes: es el día con más trabajo tuyo de la semana y demuestra que cuando entras, entras bien. Y de las 6 personas que agendaron, a 3 les escribiste después de tener la cita. El bot también está haciendo bien una parte difícil: cuando le preguntan el precio, no suelta una cifra y ya — lleva a la evaluación gratuita, como enseña la clase. Ese es el molde; lo que falta es que la conversación la tomes tú desde ahí.", "acciones": [{"t": "Hoy: Judith, Vicente y Angy", "d": "Los tres preguntaron día, hora o ubicación y no tienen cita. Escríbeles tú, antes de cualquier otra cosa.", "g": "Hola [nombre], soy Elsa. Vi tu mensaje. Te agendo yo misma la evaluación, que es gratis y dura 30 minutos: ¿te queda mejor entre semana o el fin de semana?"}, {"t": "Una nota de voz esta semana", "d": "Esta semana salieron cero. Empieza por la lead que te dijo «en mis glúteos y entrepiernas»: ya te contó exactamente lo que necesita.", "g": "Hola, soy Elsa. Escuché lo de los glúteos y la entrepierna, y sí es
