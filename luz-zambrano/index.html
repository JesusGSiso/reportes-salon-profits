"El bot", "v": 9, "c": "#2F6F68"}, {"k": "Tú, desde el teléfono", "v": 5, "c": "#C0522F"}], "origenNota": "De las 12 personas que agendaron, en 3 participaste tú antes de la cita y 9 las cerró el bot solo. La semana pasada ese reparto era al revés: 10 de 15 llevaban tu mano. El bot no cambió; lo que cambió fue cuándo entras tú en la conversación.", "metodo": [{"c": "«Nota de voz con cinco elementos»: su nombre, una validación, la necesidad que ella te dijo, una solución posible y una pregunta para continuar. Con energía, y nunca la misma para dos personas.", "h": "Esta semana: cero notas de voz, en 116 mensajes. La semana pasada fueron 6.", "p": "Es justo lo que te diferencia de cualquier otro estudio que también cobra por micropigmentación. Sin tu voz, la persona solo tiene texto — y texto lo manda cualquiera."}, {"c": "A quien ya agendó hay que sostenerla hasta la cita: un mensaje tuyo y una foto de un resultado real.", "h": "De las 12 que agendaron, 7 recibieron mensaje tuyo y ninguna una foto. Isis cerró con «Si» el 20/09, Normi con «Si allí estaré» el 20/09, Mayra con «Ok esta bien» el 17/09 y Claudia te mandó una foto el 19/09: ninguna de las cuatro volvió a saber de ti.", "p": "Cuatro personas con cita y sin ningún contacto tuyo antes del día. Esa es la parte del embudo donde se pierde sin que se note."}, {"c": "«Revisa todos los días las conversaciones de por lo menos los dos días anteriores» y busca a quien preguntó y no agendó.", "h": "Nueve personas no recibieron ni un mensaje tuyo. Dos de ellas escribieron literalmente «Hola. Quiero agendar para la evaluación gratuita de micropigmentación de cejas» —Marha el 19/09 y otra el 17/09— y ninguna agendó. Michelle y 💞Blessed escribieron «es primera vez» y quedaron ahí.", "p": "Esas dos ya habían dicho que sí. Es la conversión más barata que existe y se dejó pasar."}], "cierre": "Tu semana no es una semana mala: 34% es un número que muchas quisieran, y escribiste los siete días. El problema es de dirección, no de cantidad. El método de la clase de seguimiento ya lo tienes probado en tu propia cuenta — la semana pasada, con notas de voz y participando en 10 de 15 citas, la tasa fue más alta. Esta semana, con el mismo trabajo pero sin voz y entrando más tarde, bajó. Mientras se siga escribiendo solo texto y solo hasta que la persona agenda, el número va a depender de lo que el bot logre solo: tus clientas de siempre vuelven porque ya te conocen la mano, pero la que te vio en un anuncio necesita oírte para confiar en que tú eres la que le va a diseñar la cara.", "funciono": "Hay algo que en tu cuenta está muy bien resuelto: cuando preguntan el precio, la respuesta no es una cifra. A Mayra el 17/09 («Y el precio de las cejas») y a Priss el 16/09 se les respondió que el precio no se da por chat porque depende de la técnica y del estilo, y se les empujó a la evaluación gratuita. Ese es exactamente el molde de la clase, y por eso 13 personas preguntaron precio y tu tasa sigue en 34%. Ahora lleva ese mismo movimiento a la nota de voz: eso sí solo lo puedes hacer tú.", "acciones": [{"t": "Una nota de voz al día", "d": "Cero en toda la semana. No hacen falta veinte: empieza por una diaria, a la lead que más te haya contado qué quiere.", "g": "Hola [nombre], soy Luz 😊 te mando un audio para que me escuches. Me dijiste que quieres unas cejas más definidas pero sin que se vean marcadas; eso es justo lo que trabajo en la evaluación, que la diseñamos sobre tu cara antes de decidir nada. Cuéntame, ¿hace cuánto te las arreglaste por última vez?"}, {"t": "Isis, Normi, Mayra y Claudia tienen cita y no saben nada de ti", "d": "Las cuatro confirmaron y ninguna recibió mensaje tuyo después. Escríbeles con una foto de un resultado real.", "g": "Hola [nombre] 😍 te confirmo tu cita el [día] a las [hora]. Mira cómo quedaron unas cejas parecidas a lo que tú quieres, para que vayas viendo. ¿Alguna duda antes de venir?"}, {"t": "Las dos que pidieron la evaluación y nadie contestó", "d": "Marha (19/09) y otra lead (17/09) escribieron pidiendo agendar la evaluación gratuita y no recibieron nada tuyo. Son las más fáciles de la semana.", "g": "Hola [nombre], soy Luz 😊 perdona la demora. Te tengo cupo para la evaluación gratuita: ¿te queda mejor entre semana o el fin de semana?"}], "pie": "Los números salen de tu cuenta de EpikFlow entre el 14 y el 20 de septiembre. Solo cuentan como tuyos los mensajes que salieron de tu teléfono o de tu equipo desde la plataforma, así que si algo quedó fuera es porque no pudimos verlo, nunca al revés."}</script><script src="/assets/a.js" defer></script></html>
