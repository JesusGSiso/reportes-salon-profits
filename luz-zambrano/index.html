<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reporte de Gestión</title><link rel="stylesheet" href="/assets/s.css"><script type="application/json" id="d">{"slug": "luz-zambrano", "nombre": "Luz Zambrano", "estado": "listo", "rango": "Semana del 26 de octubre al 1 de noviembre de 2026", "rangoCorto": "26 oct–1 nov", "rangoAnt": "19–25 oct", "tasa": {"pct": 20, "num": 5, "den": 25, "botSola": 8, "ella": 0, "mutuo": 12, "leadSola": 0, "pctAnt": 34}, "historico": [{"etq": "7–13 sep", "tasa": 37}, {"etq": "14–20 sep", "tasa": 34}, {"etq": "21–27 sep", "tasa": 31}, {"etq": "28 sep–4 oct", "tasa": 41}, {"etq": "5–11 oct", "tasa": 12}, {"etq": "12–18 oct", "tasa": 41}, {"etq": "19–25 oct", "tasa": 34}, {"etq": "26 oct–1 nov", "tasa": 20}], "intro": ["Esta semana bajaste de <b>34% a 20%</b>, y cuando mirás dónde bajó, bajó en todo lo que depende de tus manos: pasaste de escribirle a 13 leads a escribirle a <b>9</b>; de 4 notas de voz a <b>0</b>; de 1 foto después de agendar a <b>0</b>. No es que no sepas hacerlo —lo hiciste la semana pasada—, es que esta semana no lo hiciste.", "Y hay un detalle que lo resume: el lunes mandaste 15 mensajes y el jueves 19, pero el <b>miércoles 28 y el viernes 30 no mandaste ninguno</b>. Mientras esos dos días estaban en blanco, entraron leads nuevos que nadie tocó: <b>15 de los 25</b> no recibieron un mensaje tuyo. <b>Todo lo demás en este reporte es consecuencia de eso.</b>"], "kpis": [{"k": "Leads de anuncio", "s": "Leads", "v": 25, "ant": 29, "t": "25", "at": "29"}, {"k": "Les escribiste antes", "s": "Escribiste", "v": 9, "ant": 13, "t": "9", "at": "13 de 29"}, {"k": "Con nota de voz", "s": "Voz", "v": 0, "ant": 4, "t": "0", "at": "4 de 29"}, {"k": "Agendaron", "s": "Agendaron", "v": 5, "ant": 10, "t": "5", "at": "10"}, {"k": "Les escribiste después", "s": "Después", "v": 3, "ant": 7, "t": "3", "at": "7 de 10"}, {"k": "Les mandaste la foto", "s": "Foto", "v": 0, "ant": 1, "t": "0", "at": "1 de 10"}], "barras": [{"label": "Leads a los que le escribiste", "num": 9, "den": 25, "meta": 60}, {"label": "Leads con nota de voz", "num": 0, "den": 25, "meta": 40}, {"label": "Citas a las que mandaste la foto", "num": 0, "den": 5, "meta": 60, "vacio": "Esta semana no hubo citas, así que esta barra no aplica."}], "origen": [{"k": "El bot", "v": 3, "c": "#2F6F68"}, {"k": "Tú, desde el teléfono", "v": 2, "c": "#C0522F"}], "origenNota": "De las 5 citas de leads de pauta, 3 las creó el bot y 2 las creaste tú desde el teléfono. Y en 3 de las 5 personas que agendaron estabas tú en la conversación antes de que hubiera cita. Eso es lo bueno de la semana: donde apareciste, se cerró. El problema es que apareciste en menos sitios que la semana pasada.", "metodo": [{"c": "Rutina diaria: revisar las conversaciones de por lo menos los dos días anteriores y buscar cuatro grupos —quien dejó de responder, quien preguntó y no agendó, quien quedó a medias, a quien se le dieron horarios y no confirmó.", "h": "El miércoles 28 y el viernes 30 no mandaste ningún mensaje a leads de pauta. <b>15 de 25 leads</b> se quedaron sin un mensaje tuyo, y cuatro de ellos ya habían avanzado: Betilde escribió «en el momento oportuno te escribiré», ❤️Dana preguntó «Y donde están localizados», Andrea dijo «Buenos días ya me ise» y Maria escribió «El costo» el 28.", "p": "Esos dos días en blanco son el agujero por donde se fue la semana. La tasa pasó de 34% a 20% y la cuenta es simple: menos conversaciones tocadas, menos citas."}, {"c": "La nota de voz con cinco elementos: tu nombre, una validación, la necesidad que ella expresó, una solución posible y una pregunta para continuar. Nunca la misma para dos personas.", "h": "<b>0 notas de voz</b> esta semana. La semana pasada mandaste 4, y esa fue la semana del 34%.", "p": "No es una habilidad que te falte, es un hábito que se te cayó en una semana. En micropigmentación la clienta está confiando su cara a alguien que no conoce: tu voz hace la mitad del trabajo de convencerla."}, {"c": "No respondas únicamente con el precio: «con mucho gusto te doy toda la información, pero antes cuéntame, ¿qué te gustaría mejorar exactamente?». Y manda la pregunta gancho: una foto de cómo están sus cejas ahora.", "h": "V te preguntó el 1 de noviembre «Si me decido cuál es el precio del servicio?» y tu respuesta fue «Trabajo el domingo solo agarro 2 personas».", "p": "Le contestaste tu horario a una pregunta sobre su decisión. Era el momento exacto de pedirle una foto de sus cejas y preguntarle qué quiere lograr; en vez de eso la conversación se quedó en logística y no hubo cita."}, {"c": "A la que ya agendó hay que empujarla para que asista: mensaje y foto de un resultado parecido antes de la cita.", "h": "De las <b>5 citas</b>, le escribiste después a 3 y mandaste foto a <b>0</b>. Angelica tuvo nueve mensajes, agendó, cerró con «Ok gracias 🙏» y no volviste a aparecer.", "p": "Angelica hizo todo lo que tenía que hacer y se quedó sola con un bot. Es el momento más barato de asegurar que llegue y lo dejamos pasar cinco de cinco veces."}], "cierre": "Lo importante de esta semana es que la comparación no es contra una teoría: es contra <b>tu propia semana pasada</b>, en la misma cuenta y con los mismos anuncios. Con 13 leads tocados y 4 notas de voz hiciste 34%; con 9 y 0 hiciste 20%. El método ya está grabado, ya lo viste, y ya lo demostraste tú misma hace siete días. Mientras haya días en blanco el número va a seguir cayendo, porque tus clientas de siempre vuelven solas —ya confían en tu mano— y la que te vio en un anuncio desaparece si nadie le escribe en 48 horas.", "funciono": "En <b>3 de las 5</b> personas que agendaron estabas tú en la conversación antes de la cita: cuando entras, cierra. El lunes 26 mandaste 15 mensajes y el jueves 29 mandaste 19, así que la capacidad está. Y mirá cómo está respondiendo el bot cuando preguntan precio, porque ese guion es para copiarlo: a Betilde le dijo «el precio no lo doy por chat porque depende de la técnica, el estilo y cómo están tus cejas», y a Paola «en la evaluación gratis te hago un diseño para que veas cómo te queda». Eso es vender el siguiente paso, no el procedimiento.", "acciones": [{"t": "Reserva 20 minutos el lunes, el miércoles y el viernes", "d": "No más horas: horas fijas. Esta semana hubo dos días en blanco y 15 leads sin tocar. Abre las conversaciones de los dos días anteriores y empieza por Betilde, Dana, Andrea y Maria.", "g": "Hola Betilde, soy Luz. Te mando una cosita para que decidas con calma: ¿me mandas una foto de cómo están tus cejas ahora? Con eso te digo en la evaluación qué técnica te queda mejor. ¿Te viene mejor entre semana o fin de semana?"}, {"t": "Tres notas de voz, hoy", "d": "Pasaste de 4 a 0 y la tasa cayó 14 puntos. Empieza por V, que preguntó por el precio y quedó sin respuesta real.", "g": "Nota de voz: «Hola V, soy Luz. Claro que sí, con mucho gusto te doy toda la información. Pero antes contame: ¿qué te gustaría mejorar exactamente de tus cejas? Mandame una foto de cómo las tenés ahora y te digo qué se puede hacer en tu caso.»"}, {"t": "A las 5 que ya tienen cita, mándales la foto", "d": "Fueron 0 de 5 esta semana. Un antes y después de un caso parecido, el día anterior a la cita. Empieza por Angelica.", "g": "Angelica, mira cómo quedaron las cejas de una clienta con un caso muy parecido al tuyo [foto]. Te espero el {día} a las {hora}, ¿me confirmás?"}], "pie": "Los números salen de tu cuenta de EpikFlow entre el lunes 26 de octubre y el domingo 1 de noviembre. Solo cuentan como tuyos los mensajes que salieron de tu teléfono o de tu equipo desde la plataforma, así que si algo quedó fuera es porque no pudimos verlo, nunca al revés."}</script><script src="/assets/a.js" defer></script></html>
