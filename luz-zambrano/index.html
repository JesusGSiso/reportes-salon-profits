1, "ant": 0, "t": "1", "at": "0 de 12"}], "barras": [{"label": "Leads a los que le escribiste", "num": 13, "den": 29, "meta": 60}, {"label": "Leads con nota de voz", "num": 4, "den": 29, "meta": 40}, {"label": "Citas a las que mandaste la foto", "num": 1, "den": 10, "meta": 60, "vacio": "Esta semana no hubo citas, así que esta barra no aplica."}], "origen": [{"k": "El bot", "v": 8, "c": "#2F6F68"}, {"k": "Tú, desde el teléfono", "v": 2, "c": "#C0522F"}], "origenNota": "De las 10 citas, 8 las creó el bot y 2 las pusiste tú desde el teléfono. En 2 de las 10 tú habías puesto conversación antes. El bot de tu cuenta trabaja bien: cuando le preguntan el precio responde «el precio lo veo en la evaluación gratuita porque depende de la técnica», que es justo lo que enseñamos. Pero el bot consigue la cita; la confianza para pagar los $299 la construyes tú, y en 8 de 10 esa parte no se trabajó.", "metodo": [{"c": "En la clase de seguimiento diario te explicamos que la rutina es diaria: todos los días revisar las conversaciones de por lo menos los dos días anteriores y buscar cuatro grupos —quien dejó de responder, quien preguntó y no agendó, quien quedó a medias, a quien se le dieron horarios y no confirmó.", "h": "Escribiste el lunes (5 mensajes), el miércoles (7), el viernes (26) y el domingo (11). Martes, jueves y sábado: cero. <b>Amada</b> escribió el 24/10 a las 13:09 «Mandeme su direccion» y nadie le respondió. Josefina dijo el 25/10 «Que me queden muy obscuras» —su miedo exacto— y tampoco.", "p": "Amada pidió la dirección. No hacía falta venderle nada, solo mandarle el mapa. Era sábado y el sábado estaba en cero."}, {"c": "En la clase te enseñamos el embudo de opciones para agendar y que nunca se pregunte «¿cuándo quieres venir?», porque eso invita al «yo te aviso». Son tres pasos: ¿entre semana o fin de semana? → ¿mañana o tarde? → ¿a las 10 o a las 11?", "h": "<b>Maria</b> cerró su conversación el 21/10 a las 15:25 con «Y yo le voy a avisar», y <b>Rose</b> el 20/10 a las 09:11 con «En Noviembre le escribo para ir a verla. Es en Conroe?». Ninguna de las dos recibió un horario concreto, y ninguna de las dos volvió.", "p": "Esas son las dos palabras que la clase te pidió evitar, y aparecieron dos veces en la misma semana. En cambio con Maricela el domingo sí diste el embudo y ahí sí hubo cita."}, {"c": "En la clase de nota de voz te explicamos los cinco elementos: su nombre, una validación, la necesidad que te expresó, una solución posible y una pregunta para continuar. Es lo que construye la confianza que un lead de publicidad no trae, porque no es un referido: está cotizando y comparando.", "h": "Mandaste 4 notas de voz a 29 leads. La lead que se llama Luz escribió el 20/10 a las 17:41 «Las dos juntas y que con el tiempo tenga que hacer otro procedimiento»: te dijo qué quiere y qué le preocupa, y no recibió audio ni mensaje tuyo.", "p": "4 de 29 es 14%. Tu voz es tu mejor herramienta —se nota en cómo escribes— y esta semana la usaron 4 personas de 29."}], "cierre": "Nada de esto es una opinión nuestra: está grabado en la clase de seguimiento diario, en la de nota de voz y en la del embudo de opciones, y esta semana quedó probado en tu propia cuenta. Con Maricela aplicaste el método entero el domingo y salió cita; con Maria y con Rose no diste horario y se fueron con un «yo le aviso». Y mientras los días alternen entre 26 mensajes y cero, el número no va a subir del 34%: tus clientas de siempre vuelven solas porque ya confían en ti y ya saben cómo trabajas, pero quien te vio en un anuncio no trae esa confianza. Hay que construírsela, y tú ya demostraste el domingo que sabes exactamente cómo.", "funciono": "La conversación con <b>Maricela</b> del domingo 25 es el reporte entero en un caso. Preguntó a las 19:07 «Hola buenas tardes que costo tiene el procedimiento?». El bot respondió bien y <b>16 minutos después entraste tú</b>: «por el momento tengo una evaluación completamente gratis, ¿es primera vez o ya tienes algún procedimiento
