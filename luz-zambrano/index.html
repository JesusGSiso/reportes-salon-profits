la hace funcionar. La clase es explícita en esto: la publicidad genera la oportunidad y el bot filtra, pero la confianza la construyes tú, y por texto eso va mucho más lento. Tus clientas de siempre no necesitan oírte porque ya te conocen; estas 26 te vieron en un anuncio y están comparando. Un audio de veinte segundos te saca de la comparación.", "funciono": "Le escribiste a 20 de 26 leads, los siete días de la semana. Esa cobertura no la tiene nadie más en la cartera y es la base sobre la que todo lo demás se construye. Ya tienes la parte que cuesta disciplina; falta la que cuesta veinte segundos.", "acciones": [{"t": "Cinco notas de voz esta semana", "d": "Una sola en 26 leads. No hace falta a todas: empieza por las que ya te respondieron y no agendaron.", "g": "Hola [nombre], soy Luz. Cuéntame, ¿cómo tienes tus cejas ahora y qué te gustaría lograr? Mándame una foto de cómo están y otra de cómo te gustarían, y en la evaluación te digo exactamente qué técnica te conviene."}, {"t": "Escríbele a Norma y a Heydy", "d": "Norma agendó y nunca supo de ti. Heydy escribió el 27 pidiendo la evaluación gratuita y sigue sin respuesta.", "g": "Hola Heydy, soy Luz. Claro que sí, te aparto la evaluación gratuita. ¿Te queda mejor entre semana o el fin de semana?"}, {"t": "Cuando pregunten precio, una pregunta antes", "d": "La única vez que respondiste precio esta semana fue con dos números y nada más. Devuelve una pregunta primero.", "g": "Claro que sí, con mucho gusto te explico todo. Pero antes cuéntame, ¿qué te gustaría mejorar exactamente de tus cejas? Así te digo qué te conviene y cuánto sería."}], "pie": "Los números salen de tu cuenta de EpikFlow entre el lunes 21 y el domingo 27 de septiembre. Solo cuentan como tuyos los mensajes que salieron de tu teléfono o de tu equipo desde la plataforma, así que si algo quedó fuera es porque no pudimos verlo, nunca al revés."}</script><script src="/assets/a.js" defer></script></html>
