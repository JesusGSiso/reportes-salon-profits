<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reporte de Gestión</title><link rel="stylesheet" href="/assets/s.css"><script type="application/json" id="d">{"slug": "luz-zambrano", "nombre": "Luz Zambrano", "estado": "listo", "rango": "Semana del 12 al 18 de octubre de 2026", "rangoCorto": "12–18 oct", "rangoAnt": "5–11 oct", "tasa": {"pct": 41, "num": 12, "den": 29, "botSola": 24, "ella": 0, "mutuo": 17, "leadSola": 0, "pctAnt": 12}, "historico": [{"etq": "24–30 ago", "tasa": 40}, {"etq": "31 ago–6 sep", "tasa": 22}, {"etq": "7–13 sep", "tasa": 37}, {"etq": "14–20 sep", "tasa": 34}, {"etq": "21–27 sep", "tasa": 31}, {"etq": "28 sep–4 oct", "tasa": 41}, {"etq": "5–11 oct", "tasa": 12}, {"etq": "12–18 oct", "tasa": 41}], "intro": ["Esta semana es, de largo, la mejor de la cartera. Entraron 29 leads de la pauta y agendaron 12: tu tasa pasó de 12% a <b>41%</b>, y las citas de 3 a 12. Y no es suerte del bot: 5 de esas 12 llevan tu conversación dentro. Escribiste los siete días, con 24 mensajes el jueves. Volvieron las notas de voz (3, después de una semana en cero) y le escribiste a 9 de las 12 que agendaron.", "Con un número así, lo que queda por arreglar son detalles — pero son detalles que cuestan citas. Cuatro personas escribieron, con estas palabras exactas, «Quiero info sobre la evaluación gratuita de micropigmentación de cejas» y ninguna recibió un mensaje tuyo ni tiene cita. Y de las 12 que agendaron, <b>ninguna</b> recibió la foto del resultado. <b>Todo lo demás en este reporte es consecuencia de eso.</b>"], "kpis": [{"k": "Leads de anuncio", "s": "Leads", "v": 29, "ant": 25, "t": "29", "at": "25"}, {"k": "Les escribiste antes", "s": "Escribiste", "v": 14, "ant": 13, "t": "14", "at": "13 de 25"}, {"k": "Con nota de voz", "s": "Voz", "v": 3, "ant": 0, "t": "3", "at": "0 de 25"}, {"k": "Agendaron", "s": "Agendaron", "v": 12, "ant": 3, "t": "12", "at": "3"}, {"k": "Les escribiste después", "s": "Después", "v": 9, "ant": 3, "t": "9", "at": "3 de 3"}, {"k": "Les mandaste la foto", "s": "Foto", "v": 0, "ant": 0, "t": "0", "at": "0 de 3"}], "barras": [{"label": "Leads a los que le escribiste", "num": 14, "den": 29, "meta": 60}, {"label": "Leads con nota de voz", "num": 3, "den": 29, "meta": 40}, {"label": "Citas a las que mandaste la foto", "num": 0, "den": 12, "meta": 60, "vacio": "Esta semana no hubo citas, así que esta barra no aplica."}], "origen": [{"k": "El bot", "v": 8, "c": "#2F6F68"}, {"k": "Tú, desde el teléfono", "v": 8, "c": "#C0522F"}], "origenNota": "Se crearon 16 citas con leads de anuncio: 8 las puso el bot y 8 las pusiste tú desde el teléfono y la plataforma. Y mirando quién participó antes de la cita, 5 de las 12 personas que agendaron habían hablado contigo: la semana pasada eran 2 de 3, pero sobre 12 citas eso es mucho más trabajo tuyo dentro del número. Varias de estas citas son para los próximos días, así que todavía no han ocurrido; eso no es un pendiente tuyo.", "metodo": [{"c": "En la clase de seguimiento te explicamos que el bot es apoyo, no reemplazo: él filtra y responde rápido, pero quien pide la cita ya está levantando la mano y ahí entras tú para cerrarla.", "h": "Cuatro personas escribieron pidiendo la evaluación con las mismas palabras y se quedaron sin cita y sin un mensaje tuyo: Ivon el 14/10 («Quiero agendar para la evaluación gratuita»), Olivia el 17/10, Sol el 18/10 a las 22:02 y Sandra el 18/10 a las 23:31.", "p": "Eran 4 de los 29 leads de la semana. Con esas cuatro tu tasa de 41% habría sido 55%."}, {"c": "A quien ya agendó hay que empujarlo para que asista, y la foto del resultado antes de la cita es lo que lo sostiene — sobre todo cuando la persona no te conoce.", "h": "Les escribiste a 9 de las 12 que agendaron, que está muy bien. Pero ninguna recibió la foto. Y tres se quedaron sin ningún mensaje tuyo: Yanira, que cruzó 12 mensajes y cerró el 18/10 con «Por favor», y Elizabeth, que después de 10 mensajes dijo «Ok gracias» el 15/10.", "p": "Son 12 citas en la agenda y es la semana con más gente por venir. La foto es lo único que falta para que lleguen todas."}, {"c": "Las sardinas también compran: a quien dijo «te aviso» o ya contó su necesidad se le vuelve con la pregunta gancho — para cejas, una foto de cómo las tiene ahora.", "h": "Susana escribió el 12/10 «regreso el sábado y le aviso antes, muchas gracias». Ese sábado ya pasó y nadie le escribió. Osminarivera te dijo el 13/10 «Yo casi no tengo cejas, por eso me gustaría hacérmelas» y tampoco recibió nada tuyo.", "p": "Las dos dijeron en voz alta que quieren hacerlo. Ninguna agendó."}], "cierre": "Esta semana no hay nada que reprocharte: el 41% es el número más alto de toda la cartera y 5 de las 12 citas son tuyas. Lo que la clase de seguimiento pide ahora es cerrar los dos extremos — la persona que escribe pidiendo la cita y la persona que ya la tiene puesta. Las cuatro que pidieron la evaluación y las doce que esperan la foto son, juntas, más citas de las que ganaste esta semana. Y es exactamente donde se construye la confianza que una lead de anuncio no trae: antes de agendar y antes de venir.", "funciono": "Dos conversaciones, las dos con el método entero. Ana, el 15/10: «me gustaría agendar, pero me gustaría saber el precio antes que nada» — y en lugar de un número le contestaste tú que la evaluación es gratis y que el precio se ve ahí. Y Katherine, el 18/10: pidió que la evaluaras y le dijeras cómo quedarían, y le confirmaste el sábado a una hora concreta. Eso es vender el siguiente paso, no el procedimiento. Añade que escribiste los siete días de la semana y que volvieron las notas de voz después de una semana en cero.", "acciones": [{"t": "Hoy: las cuatro que pidieron la evaluación", "d": "Ivon, Olivia, Sol y Sandra escribieron pidiéndola y no tienen cita. Son las cuatro citas más fáciles que vas a tener esta semana.", "g": "Hola [nombre], soy Luz. Vi que quieres tu evaluación gratuita de cejas, te la agendo yo misma. ¿Te queda mejor entre semana o el sábado?"}, {"t": "La foto a las 12 que ya agendaron", "d": "Ninguna la recibió. Mándala con el recordatorio, y empieza por Yanira y Elizabeth, que no tienen ni un mensaje tuyo.", "g": "Mira cómo quedaron unas cejas parecidas a las tuyas — eso es a donde vamos. Te espero el [día] a las [hora]."}, {"t": "Susana, que dijo que avisaba el sábado", "d": "El sábado pasó. Escríbele tú con la pregunta gancho en vez de esperar su aviso.", "g": "Hola Susana, soy Luz. Me dijiste que regresabas el sábado. Mándame una foto de cómo tienes las cejas ahora y te digo qué te recomiendo en la evaluación."}], "pie": "Los números salen de tu cuenta de EpikFlow entre el lunes 12 y el domingo 18 de octubre de 2026. Solo cuentan como tuyos los mensajes que salieron de tu teléfono o de tu equipo desde la plataforma, así que si algo quedó fuera es porque no pudimos verlo, nunca al revés."}</script><script src="/assets/a.js" defer></script></html>
