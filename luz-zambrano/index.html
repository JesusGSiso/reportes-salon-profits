<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reporte de Gestión</title><link rel="stylesheet" href="/assets/s.css"><script type="application/json" id="d">{"slug": "luz-zambrano", "nombre": "Luz Zambrano", "estado": "listo", "rango": "Semana del 28 de septiembre al 4 de octubre de 2026", "rangoCorto": "28 sep–4 oct", "rangoAnt": "21–27 sep", "tasa": {"pct": 41, "num": 11, "den": 27, "botSola": 33, "ella": 0, "mutuo": 8, "leadSola": 0, "pctAnt": 31}, "historico": [{"etq": "24–30 ago", "tasa": 40}, {"etq": "31 ago–6 sep", "tasa": 22}, {"etq": "7–13 sep", "tasa": 37}, {"etq": "14–20 sep", "tasa": 34}, {"etq": "21–27 sep", "tasa": 31}, {"etq": "28 sep–4 oct", "tasa": 41}], "intro": ["41% de agendamiento: 11 citas de 27 leads. Subiste diez puntos respecto a la semana pasada y es tu mejor número de las seis semanas medidas. Es también el salto más grande de toda la cartera esta semana.", "Y aquí está lo incómodo: ese salto no salió de tu trabajo. Le escribiste a 11 leads en lugar de 20, no mandaste ni una nota de voz en los siete días, y de las 11 citas el bot cerró 9 solo. Tu número subió mientras tu participación bajaba, porque el bot de tu cuenta maneja el precio exactamente como enseña la clase. Eso es bueno hoy y frágil a partir de mañana. <b>Todo lo demás en este reporte es consecuencia de eso.</b>"], "kpis": [{"k": "Leads de anuncio", "s": "Leads", "v": 27, "ant": 26, "t": "27", "at": "26"}, {"k": "Les escribiste antes", "s": "Escribiste", "v": 11, "ant": 20, "t": "11", "at": "20 de 26"}, {"k": "Con nota de voz", "s": "Voz", "v": 0, "ant": 1, "t": "0", "at": "1 de 26"}, {"k": "Agendaron", "s": "Agendaron", "v": 11, "ant": 8, "t": "11", "at": "8"}, {"k": "Les escribiste después", "s": "Después", "v": 6, "ant": 4, "t": "6", "at": "4 de 8"}, {"k": "Les mandaste la foto", "s": "Foto", "v": 0, "ant": 1, "t": "0", "at": "1 de 8"}], "barras": [{"label": "Leads a los que le escribiste", "num": 11, "den": 27, "meta": 60}, {"label": "Leads con nota de voz", "num": 0, "den": 27, "meta": 40}, {"label": "Citas a las que mandaste la foto", "num": 0, "den": 11, "meta": 60}], "origen": [{"k": "El bot", "v": 11, "c": "#2F6F68"}, {"k": "Tú, desde el teléfono", "v": 3, "c": "#C0522F"}], "origenNota": "De las 14 citas que se crearon con leads de publicidad, 11 las creó el bot y 3 las creaste tú. En participación: 9 las cerró el bot solo y 2 fueron de esfuerzo de las dos. Tres de las que agendaron — Nadia, Mari y Nena — escribieron 11 mensajes cada una y ninguna recibió un mensaje tuyo. El bot las llevó enteras.", "metodo": [{"c": "En la clase te enseñamos el embudo de opciones para agendar: nunca dejar la pelota en su cancha, sino tres pasos — ¿entre semana o fin de semana? → ¿mañana o tarde? → ¿a las 10 o a las 11?", "h": "María te escribió el 3 de octubre a las 12:53: \"Si me parece el precio, el diseño y el tiem[po]\". Le respondiste: \"Ok perfecto feliz día ☀️\". No agendó.", "p": "María acababa de decirte que sí a las tres cosas que suelen frenar una venta — el precio, el diseño y el tiempo. Ese era el momento exacto de dar el horario, y la conversación se cerró con una despedida. Es la cita más cara que se perdió esta semana en toda la cartera, porque ya estaba dicha."}, {"c": "En la clase te enseñamos la nota de voz con cinco elementos: tu nombre, una validación, la necesidad que la lead expresó, una solución posible y una pregunta para continuar. Con energía, y nunca la misma para dos personas.", "h": "Cero notas de voz en 27 leads. La semana pasada mandaste una; esta semana ninguna. De tus 41 mensajes a leads, todos fueron texto.", "p": "En micropigmentación la lead tiene miedo — de que le queden mal, de que se vea artificial, de gastar y arrepentirse. Ese miedo no se baja por escrito. Es la única de tus seis cifras que está en cero absoluto, y es la que más rápido movería tu número si la empezaras."}, {"c": "En la clase de seguimiento te explicamos la rutina diaria: todos los días revisar las conversaciones de por lo menos los dos días anteriores, y buscar a quien dejó de responder, a quien preguntó y no agendó y a quien quedó a medias.", "h": "10 de 27 leads no recibieron mensaje tuyo. Blanca escribió el domingo 4 a las 22:25: \"Hola. Quiero agendar para la evaluación gratuita de micropigmentación de cejas\" — pidió la cita con esas palabras. Emely cerró el 1 de octubre con \"Déjeme preguntarle a mi esposo\". Angelinamedrano preguntó \"donnde esta ubicada\". Ninguna tuvo respuesta tuya.", "p": "Blanca no necesitaba convencerse de nada: estaba pidiendo agendar. Y Emely es el caso clásico de la clase — \"déjeme preguntarle a mi esposo\" no es un no, es una lead que necesita un argumento para llevarle a casa, y nadie se lo dio. Tus días lo muestran: 18 mensajes el miércoles 30 y entre 1 y 6 el resto de la semana."}, {"c": "En la clase de seguimiento te dijimos: nada de mensajes de lista. La lead reconoce al instante cuando le están escribiendo a ella o cuando es un seguimiento masivo. En su lugar va la pregunta gancho, ligada a algo que ella misma dijo.", "h": "A Stephanie le escribiste el 3 de octubre a las 20:25: \"Hola, buenas tardes, reinita, le estoy haciendo seguimiento a las personas que están interesadas…\".", "p": "Ese mensaje le dice a Stephanie que es parte de una lista. No respondió. La misma intención con la pregunta gancho — una foto de cómo están sus cejas ahora — convierte el mensaje de lista en una conversación."}], "cierre": "Tu 41% es real y está bien ganado por el sistema: el bot de tu cuenta hace lo que la clase pide — no da el precio por chat, lo deja para la evaluación — y eso está convirtiendo. Pero el método ya está grabado y ya lo viste, y esta semana se probó en tu propia cuenta de la forma más clara posible: María te dijo que sí al precio, al diseño y al tiempo, y la conversación murió en un \"feliz día\". Blanca pidió agendar y nadie le contestó. Mientras se siga trabajando así, el número va a seguir dependiendo del bot — y tus clientas de siempre llegan solas porque ya confían en ti, pero quien te vio en un anuncio y pidió la cita por escrito sin recibir respuesta ya la pidió en otro lado.", "funciono": "Dos cosas. Primero el resultado: 41% es tu mejor semana y el salto más grande de la cartera, y de las 11 que agendaron le escribiste después a 6 — tu seguimiento posterior a la cita mejoró de 4 a 6. Segundo, el guion del precio que el bot está usando en tu cuenta, porque es el tuyo y funciona: \"el precio no lo doy por chat porque depende de la técnica, el estilo y cómo están tus cejas; la evaluación es gratis\". Nueve leads preguntaron precio esta semana y a ninguna se le dio una cifra suelta. Ese es exactamente el molde de la clase y en tu cuenta está produciendo citas. Lo único que falta es que la que lo diga seas tú, con tu voz.", "acciones": [{"t": "María: retómala hoy", "d": "Te dijo que le parecían bien el precio, el diseño y el tiempo. Falta la hora. Escríbele con el embudo de tres pasos y la cierras en dos mensajes.", "g": "María, me quedé pensando en lo que me dijiste. Vamos a dejarlo agendado para que no se te pase: ¿te queda mejor entre semana o fin de semana? … Perfecto, ¿mañana o tarde? … Listo, ¿a las 10 o a las 11?"}, {"t": "Blanca y Emely", "d": "Blanca pidió agendar el domingo a las 22:25 y nadie le contestó. Emely necesita un argumento para hablar con su esposo. Las dos están tibias hoy, frías el miércoles.", "g": "Hola Emely, soy Luz. Claro que sí, coméntalo con él. Te mando algo que le puede ayudar a decidir: la evaluación es gratis, son 30 minutos, te diseño las cejas sobre tu rostro y ahí ves exactamente cómo te van a quedar antes de pagar nada. Si no te convence, no seguimos. ¿Te reservo un espacio entre semana o fin de semana?"}, {"t": "Tres notas de voz esta semana", "d": "Llevas cero. No te pedimos 27: tres, a las tres leads que más te han escrito. Tu guion del precio ya es el correcto — dilo con tu voz y vas a ver la diferencia.", "g": "Hola [nombre], soy Luz. El precio de la micropigmentación no te lo puedo dar por chat de verdad, porque depende de cómo están tus cejas ahora y de la técnica que te quede bien. Mándame una foto de cómo las tienes y te digo qué veo. Y si quieres, te reservo la evaluación, que es gratis: ahí te las diseño sobre tu cara y decides viéndolo."}], "pie": "Los números salen de tu cuenta de EpikFlow entre el lunes 28 de septiembre y el domingo 4 de octubre de 2026. Solo cuentan como tuyos los mensajes que salieron de tu teléfono o de tu equipo desde la plataforma, así que si algo quedó fuera es porque no pudimos verlo, nunca al revés."}</script><script src="/assets/a.js" defer></script></html>
