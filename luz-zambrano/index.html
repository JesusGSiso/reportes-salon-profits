<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reporte de Gestión</title><link rel="stylesheet" href="/assets/s.css"><script type="application/json" id="d">{"slug": "luz-zambrano", "nombre": "Luz Zambrano", "estado": "listo", "rango": "Semana del 31 de agosto al 6 de septiembre de 2026", "rangoCorto": "31 ago–6 sep", "rangoAnt": "24–30 ago", "tasa": {"pct": 22, "num": 7, "den": 32, "botSola": 16, "ella": 0, "mutuo": 6, "leadSola": 0, "pctAnt": 40}, "historico": [{"etq": "24–30 ago", "tasa": 40}, {"etq": "31 ago–6 sep", "tasa": 22}], "intro": ["Luz, esta semana entraron <b>32 personas por la publicidad</b> y agendaron 7. Trabajaste de lunes a viernes —37 mensajes solo entre el lunes y el miércoles— y mandaste 3 notas de voz, cuando la semana pasada habían sido cero. Eso cuenta.", "Pero el <b>sábado 6 de septiembre no revisaste ninguna conversación</b>, y ese es el día en que más gente escribe. Stella y Dyani escribieron la frase exacta de tu anuncio —«Quiero agendar para la evaluación gratuita de micropigmentación de cejas»— y ninguna recibió respuesta tuya. En total, <b>18 de las 32 personas</b> no tuvieron ni un mensaje tuyo en toda la semana. <b>Todo lo demás en este reporte es consecuencia de eso.</b>"], "kpis": [{"k": "Leads de anuncio", "s": "Leads", "v": 32, "ant": 45, "t": "32", "at": "45"}, {"k": "Les escribiste antes", "s": "Escribiste", "v": 11, "ant": 16, "t": "11", "at": "16 de 45"}, {"k": "Con nota de voz", "s": "Voz", "v": 3, "ant": 0, "t": "3", "at": "0 de 45"}, {"k": "Agendaron", "s": "Agendaron", "v": 7, "ant": 18, "t": "7", "at": "18"}, {"k": "Les escribiste después", "s": "Después", "v": 5, "ant": 8, "t": "5", "at": "8 de 18"}, {"k": "Les mandaste la foto", "s": "Foto", "v": 0, "ant": 1, "t": "0", "at": "1 de 18"}], "barras": [{"label": "Leads a los que le escribiste", "num": 11, "den": 32, "meta": 60}, {"label": "Leads con nota de voz", "num": 3, "den": 32, "meta": 40}, {"label": "Citas a las que mandaste la foto", "num": 0, "den": 7, "meta": 60, "vacio": "Esta semana no hubo citas, así que esta barra no aplica."}], "origen": [{"k": "El bot", "v": 5, "c": "#2F6F68"}, {"k": "Tú, desde el teléfono", "v": 3, "c": "#C0522F"}], "origenNota": "Se crearon 8 citas: 5 el bot y 3 tú a mano. De los 22 puntos de tu tasa, <b>16 salieron del bot solo</b> y apenas 6 son citas donde tú habías entrado antes. La semana pasada eran 18 puntos tuyos. Ahí está la diferencia entre 40% y 22%.", "metodo": [{"c": "«Rutina diaria: revisa las conversaciones de por lo menos los dos días anteriores.» Todos los días, incluido el fin de semana, que es cuando la gente tiene tiempo de escribir.", "h": "Escribiste el 31/08 (20 mensajes), 01/09 (1), 02/09 (17), 03/09 (12), 04/09 (5) y 05/09 (5). <b>El sábado 06/09: ninguno.</b> Ese sábado Stella escribió a las 23:37 «Hola. Quiero agendar para la evaluación gratuita de micropigmentación de cejas» e Irma preguntó a las 18:34 «Dond estan ubicados».", "p": "Stella pidió la cita con la frase literal del anuncio y sigue sin respuesta. Dyani había escrito exactamente lo mismo el viernes a las 21:35."}, {"c": "«Embudo de opciones para agendar»: cuando ya te dio el día, tú das las horas. Nunca dejarlo en el aire.", "h": "El 04/09 a las 13:02 Susy escribió <b>«Entre semana. Podria se viernes en la mañana»</b> — ya había elegido día y franja — y no recibió un mensaje tuyo. Solo faltaba ofrecerle dos horas.", "p": "Ese viernes pasó y Susy no vino. Era la cita más cerrada de la semana."}, {"c": "«Nota de voz con los 5 elementos»: su nombre, una validación, la necesidad que ella dijo, una solución posible y una pregunta. Nunca la misma para dos personas.", "h": "Mandaste <b>3</b> notas de voz de 32 leads (9%). Es más que las 0 de la semana pasada, pero la meta es 40%.", "p": "Las tres que sí recibieron audio son justo las conversaciones que avanzaron. Es tu palanca más barata y la tienes casi sin usar."}], "cierre": "Luz, tu semana no se cayó por falta de ganas: se cayó por dónde pusiste los días. De lunes a miércoles trabajaste bien, y el fin de semana —cuando la gente que vio el anuncio por fin tiene tiempo de escribir— no entró nadie a contestar. El método está grabado en la clase de seguimiento del área de miembros y ya lo viste: diez minutos al día, todos los días, buscando los cuatro grupos. Mientras el sábado y el domingo queden solo en manos del bot, el número va a seguir dependiendo de la suerte. Y recuerda por qué importa: quien te escribe desde un anuncio no te conoce y está viendo otras cuentas al mismo tiempo; tu clienta de siempre te espera el lunes, esta señora no.", "funciono": "El 31 de agosto Ingreed te escribió que otra profesional le había cotizado «$500 y hasta 3 sesiones» — la objeción de precio más difícil que hay— y tú le contestaste <b>con una nota de voz</b>. Eso es exactamente lo que enseña la clase: cuando la conversación se pone dura, la voz construye la confianza que un texto no puede. Fue una de tus 3 notas de voz de la semana. Si haces eso mismo con las diez personas que quedaron colgadas, la semana se ve distinta.", "acciones": [{"t": "Contesta hoy a Stella y a Dyani", "d": "Las dos escribieron la frase exacta del anuncio pidiendo la evaluación gratuita y ninguna tuvo respuesta. Son las dos citas más fáciles que tienes:", "g": "Hola Stella, soy Luz 💛 perdona la demora. Claro que sí, te reservo tu evaluación gratuita de cejas. ¿Te queda mejor entre semana o el fin de semana?"}, {"t": "Cierra a Susy con horas", "d": "Ya te dijo viernes en la mañana. No le preguntes cuándo, dale dos opciones concretas: «¿te sirve a las 10 o a las 11?»."}, {"t": "Una nota de voz al día", "d": "Fueron 3 en toda la semana. Empieza por las que ya preguntaron precio —Alma, Tanys, Estela— y en vez de texto, mándales audio con su nombre y una pregunta al final. El audio con Ingreed te funcionó."}], "pie": "Los números salen de tu cuenta de EpikFlow entre el lunes 31 de agosto y el domingo 6 de septiembre. Solo cuentan como tuyos los mensajes que salieron de tu teléfono o de tu equipo desde la plataforma, así que si algo quedó fuera es porque no pudimos verlo, nunca al revés."}</script><script src="/assets/a.js" defer></script></html>
