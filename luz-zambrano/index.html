<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reporte de Gestión</title><link rel="stylesheet" href="/assets/s.css"><script type="application/json" id="d">{"slug": "luz-zambrano", "nombre": "Luz Zambrano", "estado": "listo", "rango": "Semana del 5 al 11 de octubre de 2026", "rangoCorto": "5–11 oct", "rangoAnt": "28 sep–4 oct", "tasa": {"pct": 12, "num": 3, "den": 25, "botSola": 4, "ella": 0, "mutuo": 8, "leadSola": 0, "pctAnt": 41}, "historico": [{"etq": "24–30 ago", "tasa": 40}, {"etq": "31 ago–6 sep", "tasa": 22}, {"etq": "7–13 sep", "tasa": 37}, {"etq": "14–20 sep", "tasa": 34}, {"etq": "21–27 sep", "tasa": 31}, {"etq": "28 sep–4 oct", "tasa": 41}, {"etq": "5–11 oct", "tasa": 12}], "intro": ["Esta semana entraron prácticamente los mismos leads que la pasada (25 contra 27) y le escribiste a más gente que la pasada (13 contra 11). Y aun así las citas se desplomaron: de 11 a 3, de 41% a 12%. Cuando entra lo mismo, se trabaja igual y el resultado cae a un tercio, la respuesta nunca está en el total — está en <b>cuándo</b> y <b>a quién</b>.", "Mira tus mensajes por día: lunes 5, martes 6, miércoles 7, <b>jueves 33</b>, viernes 0, sábado 0, domingo 1. El jueves hiciste casi todo y después cerraste. Y en ese apagón de tres días quedaron tres personas que escribieron, textualmente, «<b>Hola. Quiero agendar para la evaluación gratuita de micropigmentación de cejas</b>» — Mary y Lauro el viernes, Barbara el domingo. Ninguna recibió un mensaje tuyo. <b>Todo lo demás en este reporte es consecuencia de eso.</b>"], "kpis": [{"k": "Leads de anuncio", "s": "Leads", "v": 25, "ant": 27, "t": "25", "at": "27"}, {"k": "Les escribiste antes", "s": "Escribiste", "v": 13, "ant": 11, "t": "13", "at": "11 de 27"}, {"k": "Con nota de voz", "s": "Voz", "v": 0, "ant": 0, "t": "0", "at": "0 de 27"}, {"k": "Agendaron", "s": "Agendaron", "v": 3, "ant": 11, "t": "3", "at": "11"}, {"k": "Les escribiste después", "s": "Después", "v": 3, "ant": 6, "t": "3", "at": "6 de 11"}, {"k": "Les mandaste la foto", "s": "Foto", "v": 0, "ant": 0, "t": "0", "at": "0 de 11"}], "barras": [{"label": "Leads a los que le escribiste", "num": 13, "den": 25, "meta": 60}, {"label": "Leads con nota de voz", "num": 0, "den": 25, "meta": 40}, {"label": "Citas a las que mandaste la foto", "num": 0, "den": 3, "meta": 60, "vacio": "Esta semana no hubo citas, así que esta barra no aplica."}], "origen": [{"k": "El bot", "v": 2, "c": "#2F6F68"}, {"k": "Tú, desde el teléfono", "v": 1, "c": "#C0522F"}], "origenNota": "Fueron 3 citas: 2 las creó el bot y 1 la creaste tú. Y aquí hay algo bueno que no se ve en el titular: en <b>2 de las 3</b> el trabajo fue tuyo y del bot juntos. Tu proporción de participación es la mejor de la cartera esta semana — el problema no es la calidad de lo que haces cuando entras, es a cuántas alcanzas.", "metodo": [{"c": "La rutina diaria: revisar todos los días las conversaciones de por lo menos los dos días anteriores. Es diaria, no un día a la semana.", "h": "Jueves 33 mensajes; viernes, sábado y domingo <b>1 en total</b>. En esos tres días escribieron Mary y Lauro («quiero agendar para la evaluación gratuita») y Barbara el domingo con el mismo texto. Las tres sin respuesta tuya.", "p": "Esas tres personas venían del anuncio con la frase de reserva ya escrita: eran tres citas hechas. Es exactamente la diferencia entre las 11 de la semana pasada y las 3 de esta."}, {"c": "El embudo de opciones para agendar, y buscar cada día a quien se le dieron horarios y no confirmó.", "h": "Carolina te escribió 7 mensajes, preguntó el precio y el 10/10 a las 19:24 cerró con «<b>Y para miércoles no tienes algo</b>». Lupita preguntó la dirección el 6/10. Ninguna de las dos recibió respuesta tuya.", "p": "Carolina está proponiendo un día concreto: esa conversación solo necesitaba «el miércoles tengo a las 10 o a las 2, ¿cuál te va mejor?». Es la cita más barata de la semana y se quedó esperando."}, {"c": "La nota de voz con los 5 elementos: tu nombre, una validación, la necesidad que ella expresó, una solución posible y una pregunta para continuar. Nunca la misma para dos personas.", "h": "<b>Cero notas de voz</b> esta semana y cero la semana pasada. En 52 leads de publicidad en dos semanas no ha salido un solo audio tuyo.", "p": "Es tu único indicador en cero y es el que más confianza construye con alguien que no te conoce. «Nobody» te escribió el 9/10 «no quiero ofender, que se vea mal, mal hechas, sin simetría, descuadre a mi cara» — eso es miedo puro, y el miedo no se responde por escrito: se responde con tu voz."}, {"c": "No respondas únicamente con el precio: devuelve la necesidad antes del número.", "h": "9 personas preguntaron precio esta semana. A tres les contestaste tú y lo hiciste bien — a Abby el 8/10: «la evaluación es completamente gratis, yo te hago un diseño, te digo qué técnica te queda». A las otras seis les contestó el bot y ahí se quedaron.", "p": "Las tres que contestaste tú siguieron conversando; de las seis del bot ninguna agendó. No hay mejor prueba de que tu respuesta vale más que la del sistema."}], "cierre": "Aquí no hay nada nuevo que aprender: hace siete días hiciste 41% con los mismos leads. El método está grabado, ya lo viste, y esta semana se probó en tu propia cuenta en los dos sentidos — las tres personas que pidieron agendar con esas palabras exactas cayeron en los tres días que no abriste, y las tres citas que sí salieron llevan tu huella en dos de ellas. Mientras el trabajo se siga concentrando en un día, el número va a saltar de 41 a 12 sin que cambie nada más. Tus clientas de siempre vuelven solas porque ya confían en ti; quien te vio en un anuncio no espera al jueves siguiente.", "funciono": "Las respuestas de precio que diste tú. A Abby el 8/10 le escribiste: «la evaluación es completamente gratis, yo te hago un diseño, te digo qué técnica te queda mejor» — devolviste el valor antes del número, que es exactamente el molde de la clase. Y se nota en el resultado global: en 2 de las 3 citas de la semana apareces tú antes del agendamiento, la mejor proporción de participación de toda la cartera. Cuando entras, cierras.", "acciones": [{"t": "Las tres que pidieron agendar — hoy", "d": "Barbara (domingo), Mary y Lauro (viernes) escribieron «quiero agendar para la evaluación gratuita». Llevan entre 1 y 3 días esperando y todavía se recuperan.", "g": "Hola [nombre], soy Luz. Perdón la demora, te contesto yo. Claro que sí, te aparto tu evaluación gratis — dura 30 minutos y ahí te hago el diseño sobre tu rostro. ¿Te queda mejor entre semana o el fin de semana?"}, {"t": "Carolina quiere el miércoles", "d": "Te lo pidió el viernes por la noche y sigue sin respuesta. Dale dos horas concretas, no un «sí hay».", "g": "Hola Carolina, sí tengo miércoles. Te puedo dar a las 10:00 am o a las 2:00 pm, ¿cuál te queda mejor? Te aparto el espacio ahora."}, {"t": "Tu primera nota de voz", "d": "Llevas dos semanas sin mandar ninguna. Empieza por «Nobody», que te escribió con miedo a quedar mal. Un audio de 30 segundos vale más que diez mensajes.", "g": "Hola, soy Luz. Leí lo que me escribiste y te entiendo perfecto — ese miedo a que queden gruesas o sin simetría es el más común y es totalmente válido. Por eso la evaluación es gratis: te diseño las cejas sobre tu cara antes de tocar nada, y tú decides viéndolas. Cuéntame, ¿hace cuánto te las hiciste la última vez?"}], "pie": "Los números salen de tu cuenta de EpikFlow entre el lunes 5 y el domingo 11 de octubre. Solo cuentan como tuyos los mensajes que salieron de tu teléfono o de tu equipo desde la plataforma, así que si algo quedó fuera es porque no pudimos verlo, nunca al revés."}</script><script src="/assets/a.js" defer></script></html>
