<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reporte de Gestión</title><link rel="stylesheet" href="/assets/s.css"><script type="application/json" id="d">{"slug": "luz-zambrano", "nombre": "Luz Zambrano", "estado": "listo", "rango": "Semana del 2 al 8 de noviembre de 2026", "rangoCorto": "2–8 nov", "rangoAnt": "26 oct–1 nov", "tasa": {"pct": 41, "num": 9, "den": 22, "botSola": 18, "ella": 0, "mutuo": 23, "leadSola": 0, "pctAnt": 20}, "historico": [{"etq": "14–20 sep", "tasa": 34}, {"etq": "21–27 sep", "tasa": 31}, {"etq": "28 sep–4 oct", "tasa": 41}, {"etq": "5–11 oct", "tasa": 12}, {"etq": "12–18 oct", "tasa": 41}, {"etq": "19–25 oct", "tasa": 34}, {"etq": "26 oct–1 nov", "tasa": 20}, {"etq": "2–8 nov", "tasa": 41}], "intro": ["Luz, esta semana duplicaste tu número: del 20% de la semana pasada al <b>41%</b>. De 22 personas que llegaron por la pauta, 9 agendaron, y eres la que mejor convierte de toda la cartera esta semana. No fue el bot: le escribiste tú a 15 de las 22, y 6 de las 11 citas las creaste tú misma desde el teléfono. En más de la mitad de los agendamientos hubo un mensaje tuyo antes de que la cita existiera. Eso es exactamente lo que la clase de seguimiento llama trabajar la pauta.", "Lo que queda flojo es la segunda mitad del trabajo, la que empieza <b>después</b> de que agendan: de las 9 que agendaron, les escribiste a 4, y a ninguna le mandaste una foto. <b>Todo lo demás en este reporte es consecuencia de eso.</b>"], "kpis": [{"k": "Leads de anuncio", "s": "Leads", "v": 22, "ant": 25, "t": "22", "at": "25"}, {"k": "Les escribiste antes", "s": "Escribiste", "v": 15, "ant": 9, "t": "15", "at": "9 de 25"}, {"k": "Con nota de voz", "s": "Voz", "v": 3, "ant": 0, "t": "3", "at": "0 de 25"}, {"k": "Agendaron", "s": "Agendaron", "v": 9, "ant": 5, "t": "9", "at": "5"}, {"k": "Les escribiste después", "s": "Después", "v": 4, "ant": 3, "t": "4", "at": "3 de 5"}, {"k": "Les mandaste la foto", "s": "Foto", "v": 0, "ant": 0, "t": "0", "at": "0 de 5"}], "barras": [{"label": "Leads a los que le escribiste", "num": 15, "den": 22, "meta": 60}, {"label": "Leads con nota de voz", "num": 3, "den": 22, "meta": 40}, {"label": "Citas a las que mandaste la foto", "num": 0, "den": 9, "meta": 60}], "origen": [{"k": "El bot", "v": 5, "c": "#2F6F68"}, {"k": "Tú, desde el teléfono", "v": 6, "c": "#C0522F"}], "origenNota": "De las 11 citas que se crearon, 6 las creaste tú desde el teléfono y 5 el bot. En el desglose de arriba verás que «Tú» marca 0 y «esfuerzo de los dos» marca 23: eso es porque en todas esas conversaciones el bot también había escrito antes de la cita. Cuando los dos ponen algo, el crédito es compartido — nunca se te quita, pero tampoco se te da entero. 23 de tus 41 puntos salieron de conversaciones donde entraste tú.", "metodo": [{"c": "En la clase te explicamos que el trabajo no termina cuando agenda: después hay que empujarla para que asista, y la foto es la pieza que sostiene esa espera — una foto de un trabajo tuyo parecido a lo que ella pidió.", "h": "De las 9 que agendaron, les escribiste a 4. A las otras 5 no las volviste a tocar. Y de las 9, ninguna recibió una foto. Monica cerró su conversación el 3/11 con «Gracias nos vemos pronto. Mi nombre es Mónica» y ahí quedó.", "p": "Esta es la pieza más corta de arreglar de todo tu reporte: ya hiciste lo difícil, que fue traerlas hasta la cita. Las 5 que no volvieron a saber de ti son las que más riesgo tienen de no aparecer."}, {"c": "En la clase te enseñamos que no se responde únicamente con el precio, y que antes de la cifra va la pregunta: «con mucho gusto te doy toda la información, pero antes cuéntame, ¿qué te gustaría mejorar exactamente?»", "h": "7 leads preguntaron precio. En 6 contestó solo el bot. En una entraste tú: a Liskeila, el 6/11, le escribiste «Reina, la evaluación es completamente gratis sin ningún compromiso. Si ya después usted decide…».", "p": "Ese mensaje tuyo a Liskeila es el molde exacto de la clase, escrito por ti. Lo hiciste una vez de siete. Las otras seis — Tanya, Julisa, Maria, Helen, Bea, Zulema — se quedaron con la respuesta del bot."}, {"c": "En la clase te explicamos la rutina diaria: revisar las conversaciones de por lo menos los dos días anteriores y buscar a quien dejó de responder, quien preguntó y no agendó, y quien quedó a medias. Y que las sardinas también compran: hay quien escribe un año después.", "h": "Escribiste 6 de los 7 días; el sábado 7 no salió ningún mensaje tuyo. Y justo ahí quedaron dos: Luz escribió el 7/11 «Usted corrige cejas muy oscuras?» y nadie le contestó; Maria mandó 10 mensajes y cerró el 7/11 con «Hmmm por ahora no se».", "p": "Maria es la sardina del manual: 10 mensajes, interesada, insegura. Preguntó precio, le contestó el bot y se enfrió. Con 22 leads en la semana, esas dos valen 9 puntos de tasa."}], "cierre": "Luz, esta semana no hay nada que corregirte en la primera mitad: el método ya está grabado, tú ya lo viste, y esta semana lo probaste en tu propia cuenta — 41% es tu techo histórico y lo alcanzaste escribiendo tú, no esperando al bot. Lo que falta es terminar el trabajo. Mientras la foto y el mensaje de después no entren en la rutina, vas a seguir trayendo gente hasta la puerta y perdiendo una parte en el camino de la puerta a la silla. Y sobre las que preguntan precio: a tus clientas de siempre les puedes decir una cifra y vienen igual, porque ya confían en tu mano. Quien te vio en un anuncio el martes está comparando; a ella el precio no le dice nada todavía, y por eso la pregunta va primero.", "funciono": "El mensaje que le mandaste a <b>Liskeila</b> el 6 de noviembre es la clase entera en dos líneas: ella pidió «costos y técnicas», y en vez de la cifra le respondiste que la evaluación es gratis y sin compromiso y le dejaste la decisión a ella después de verse. Eso es vender el siguiente paso, no el procedimiento. Y la conversación de Tanya el 8 de noviembre muestra el embudo completo funcionando: entre semana o fin de semana, mañana o tarde, tres horas concretas — y cita cerrada. Lo tienes. Es cuestión de repetirlo en las siete, no en una.", "acciones": [{"t": "La foto, a las 9 que ya tienen cita", "d": "Ninguna de las 9 recibió foto. Mándale a cada una, el día antes, una foto de un trabajo tuyo parecido a lo que ella pidió. Es lo que hace que se imagine el resultado y no se arrepienta la noche anterior.", "g": "Mónica, te comparto un trabajo que hice la semana pasada con una clienta que tenía las cejas parecidas a las tuyas, para que veas el acabado. Nos vemos el jueves 💕"}, {"t": "Contéstale tú a Luz y a Maria", "d": "Luz preguntó el sábado si corriges cejas muy oscuras y nadie le respondió. Maria mandó 10 mensajes y terminó con un «por ahora no sé». Las dos están tibias, no frías.", "g": "Luz, sí corrijo cejas oscuras, es de lo que más hago. Mándame una foto de cómo las tienes ahora y te digo exactamente qué se puede hacer en tu caso."}, {"t": "El molde de Liskeila, a las otras seis", "d": "Lo que le escribiste a Liskeila funciona. Úsalo con Tanya, Julisa, Maria, Helen, Bea y Zulema, que preguntaron precio y se quedaron solo con el bot."}], "pie": "Los números salen de tu cuenta de EpikFlow entre el lunes 2 y el domingo 8 de noviembre. Solo cuentan como tuyos los mensajes que salieron de tu teléfono o de tu equipo desde la plataforma, así que si algo quedó fuera es porque no pudimos verlo, nunca al revés."}</script><script src="/assets/a.js" defer></script></html>
