<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reporte de Gestión</title><link rel="stylesheet" href="/assets/s.css"><script type="application/json" id="d">{"slug": "javier-melendez", "nombre": "Javier Melendez", "estado": "listo", "rango": "Semana del 26 de octubre al 1 de noviembre de 2026", "rangoCorto": "26 oct–1 nov", "rangoAnt": "19–25 oct", "tasa": {"pct": 27, "num": 17, "den": 63, "botSola": 8, "ella": 0, "mutuo": 19, "leadSola": 0, "pctAnt": 19}, "historico": [{"etq": "28 sep–4 oct", "tasa": 21}, {"etq": "5–11 oct", "tasa": 8}, {"etq": "12–18 oct", "tasa": 20}, {"etq": "19–25 oct", "tasa": 19}, {"etq": "26 oct–1 nov", "tasa": 27}], "intro": ["Esta es tu mejor semana de las cinco que llevamos midiendo: <b>27% de agendamiento</b>, contra 19% la semana pasada. Y no fue suerte. Le escribiste a <b>44 de 63 leads</b> (el 70%, por encima de la meta), mandaste <b>37 notas de voz</b> y en <b>12 de las 17 citas</b> estabas tú en la conversación antes de que se agendara. Eso es exactamente el método: el bot responde y filtra, tú entras y cierras.", "Donde se cae es <b>después</b> de que la persona agenda. De las 17 citas, 6 no recibieron ni un mensaje tuyo y a <b>1 sola</b> le mandaste una foto. El trabajo más difícil ya lo hiciste; lo que falta es el empujón de treinta segundos para que lleguen. <b>Todo lo demás en este reporte es consecuencia de eso.</b>"], "kpis": [{"k": "Leads de anuncio", "s": "Leads", "v": 63, "ant": 36, "t": "63", "at": "36"}, {"k": "Les escribiste antes", "s": "Escribiste", "v": 44, "ant": 17, "t": "44", "at": "17 de 36"}, {"k": "Con nota de voz", "s": "Voz", "v": 37, "ant": 13, "t": "37", "at": "13 de 36"}, {"k": "Agendaron", "s": "Agendaron", "v": 17, "ant": 7, "t": "17", "at": "7"}, {"k": "Les escribiste después", "s": "Después", "v": 11, "ant": 6, "t": "11", "at": "6 de 7"}, {"k": "Les mandaste la foto", "s": "Foto", "v": 1, "ant": 0, "t": "1", "at": "0 de 7"}], "barras": [{"label": "Leads a los que le escribiste", "num": 44, "den": 63, "meta": 60}, {"label": "Leads con nota de voz", "num": 37, "den": 63, "meta": 40}, {"label": "Citas a las que mandaste la foto", "num": 1, "den": 17, "meta": 60, "vacio": "Esta semana no hubo citas, así que esta barra no aplica."}], "origen": [{"k": "El bot", "v": 14, "c": "#2F6F68"}, {"k": "Tú, desde el teléfono", "v": 9, "c": "#C0522F"}], "origenNota": "De las citas que se crearon con leads de pauta esta semana, 14 las creó el bot y 9 las creaste tú a mano desde el teléfono o desde la plataforma. Pero lo que importa es quién estaba en la conversación antes: en 12 de las 17 personas que agendaron estabas tú. Esa es la diferencia entre esta semana y las anteriores, y es la razón del 27%. Ojo: buena parte de estas citas son para noviembre y todavía no han ocurrido, así que no son un pendiente tuyo.", "metodo": [{"c": "A la que ya agendó hay que empujarla para que asista: el mensaje de confirmación y, sobre todo, la foto de un resultado parecido al suyo.", "h": "De las <b>17 citas</b>, le escribiste después a 11 y mandaste foto a <b>1</b>. Mónica agendó, tuvo ocho mensajes con el bot y se despidió con «Okay Gracias !» sin que tú aparecieras ni una vez.", "p": "La persona se queda con la última cosa que vio, y si lo último fue un bot confirmando una hora, la cita es frágil. Es el paso más corto de todo el reporte y el que está más vacío."}, {"c": "La rutina diaria es revisar las conversaciones de por lo menos los dos días anteriores y buscar a quien quedó a medias o a quien se le dieron horarios y no confirmó.", "h": "Escribiste los siete días (15, 5, 17, 24, 17, 32 y 6 mensajes), así que la rutina la tienes. Pero quedaron tres conversaciones avanzadas sin cerrar: Acuario escribió «Ah este número podemos aser sita», Claudia «Si pero tengo q preguntar si me puede yebar» y Ada contestó «No» después de cinco mensajes. Ninguna recibió un mensaje tuyo.", "p": "Son tres personas que ya habían dicho que sí en algún grado. Las otras 13 sin tocar llegaron el domingo y todavía están frescas: esas no son un reclamo. Estas tres sí."}, {"c": "No respondas únicamente con el precio: «con mucho gusto te doy toda la información, pero antes cuéntame, ¿qué te gustaría mejorar exactamente?».", "h": "Siete leads preguntaron precio. El bot contestó en seis y tú en una: a Victoria, que preguntó «Y el costo», le mandaste una nota de voz. <b>Victoria es la única de las siete en la que entraste y el patrón cambió.</b>", "p": "El bot contesta correctamente (dice que el escáner es gratis y que el precio se orienta después de evaluar), pero no hace la pregunta que construye confianza. Esa es tuya, y cuando la haces funciona."}], "cierre": "Esta semana el método se probó en tu propia cuenta y el resultado está en el número: entraste en 12 de las 17 conversaciones que terminaron en cita, y la tasa subió de 19% a 27%. No hay nada que descubrir ni que cambiar de raíz; lo que falta es cerrar el círculo después de la cita, que es el trozo más corto. Mientras el último mensaje antes de la cita lo mande el bot y no tú, la persona que te vio en un anuncio sigue sin tener una razón de peso para levantarse y manejar hasta el estudio: tus clientas de siempre vienen porque ya confían, y esa confianza con la de pauta hay que construirla hasta el último mensaje.", "funciono": "Victoria preguntó «Y el costo» y en lugar de soltar un número le mandaste una nota de voz. Eso es el método completo en un solo movimiento: no respondiste solo con el precio, pusiste tu voz y le diste una razón para seguir hablando. Y no fue un caso aislado: 37 notas de voz en la semana, casi el 60% de tus leads. Súmale que en 12 de las 17 citas estabas tú antes de que se agendara, y el 27% deja de ser casualidad.", "acciones": [{"t": "Cierra las tres que quedaron a medias", "d": "Acuario, Claudia y Ada. Son las únicas tres conversaciones avanzadas de la semana sin respuesta tuya, y las tres estaban a un mensaje de agendar.", "g": "Hola Acuario, soy Javier de KBELLA. Sí, por este número te agendo. Dime: ¿te viene mejor entre semana o fin de semana?"}, {"t": "Manda la foto a las 17 que ya tienen cita", "d": "Esta semana la mandaste en 1 de 17. Un antes y después de un caso parecido al suyo, el día anterior a la cita.", "g": "Mira el antes y después de una clienta con un caso muy parecido al tuyo [foto]. Te espero el {día} a las {hora} para tu escáner facial, ¿confirmas que vienes?"}, {"t": "Cuando el bot ya contestó el precio, entra tú con audio", "d": "De los 7 que preguntaron precio esta semana entraste en 1, y fue la que cambió. Haz lo de Victoria con los otros seis.", "g": "Nota de voz: su nombre, «claro que sí», la necesidad que ella te dijo tal como la dijo, qué se puede hacer en su caso, y cierras con «¿qué es lo que más te gustaría mejorar de tu piel?»"}], "pie": "Los números salen de tu cuenta de EpikFlow entre el lunes 26 de octubre y el domingo 1 de noviembre. Solo cuentan como tuyos los mensajes que salieron de tu teléfono o de tu equipo desde la plataforma, así que si algo quedó fuera es porque no pudimos verlo, nunca al revés."}</script><script src="/assets/a.js" defer></script></html>
