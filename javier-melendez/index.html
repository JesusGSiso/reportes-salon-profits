<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reporte de Gestión</title><link rel="stylesheet" href="/assets/s.css"><script type="application/json" id="d">{"slug": "javier-melendez", "nombre": "Javier Melendez", "estado": "listo", "rango": "Semana del 19 al 25 de octubre de 2026", "rangoCorto": "19–25 oct", "rangoAnt": "12–18 oct", "tasa": {"pct": 19, "num": 7, "den": 36, "botSola": 14, "ella": 0, "mutuo": 5, "leadSola": 0, "pctAnt": 20}, "historico": [{"etq": "28 sep–4 oct", "tasa": 21}, {"etq": "5–11 oct", "tasa": 8}, {"etq": "12–18 oct", "tasa": 20}, {"etq": "19–25 oct", "tasa": 19}], "intro": ["Javier, de los 36 leads de anuncio que entraron esta semana le escribiste a 17. Eso es el <b>47%</b>, y es de los números más altos de toda la cartera: la mayoría no pasa del 20%. Mandaste además 13 notas de voz. El método lo estás aplicando.", "Lo que frena el resultado es <b>cuándo</b> lo aplicas. El lunes, martes y miércoles escribiste 5, 12 y 13 mensajes; el jueves 2 y el viernes 1. Y justo ahí, en los días flojos, quedaron 15 leads sin un solo mensaje tuyo, varios de ellos ya calientes. <b>Todo lo demás en este reporte es consecuencia de eso.</b>"], "kpis": [{"k": "Leads de anuncio", "s": "Leads", "v": 36, "ant": 45, "t": "36", "at": "45"}, {"k": "Les escribiste antes", "s": "Escribiste", "v": 17, "ant": 24, "t": "17", "at": "24 de 45"}, {"k": "Con nota de voz", "s": "Voz", "v": 13, "ant": 21, "t": "13", "at": "21 de 45"}, {"k": "Agendaron", "s": "Agendaron", "v": 7, "ant": 9, "t": "7", "at": "9"}, {"k": "Les escribiste después", "s": "Después", "v": 6, "ant": 4, "t": "6", "at": "4 de 9"}, {"k": "Les mandaste la foto", "s": "Foto", "v": 0, "ant": 0, "t": "0", "at": "0 de 9"}], "barras": [{"label": "Leads a los que le escribiste", "num": 17, "den": 36, "meta": 60}, {"label": "Leads con nota de voz", "num": 13, "den": 36, "meta": 40}, {"label": "Citas a las que mandaste la foto", "num": 0, "den": 7, "meta": 60, "vacio": "Esta semana no hubo citas, así que esta barra no aplica."}], "origen": [{"k": "El bot", "v": 7, "c": "#2F6F68"}], "origenNota": "Las 7 citas las creó el bot, pero en 2 de ellas tú habías puesto conversación antes: eso es esfuerzo de los dos, no del bot solo, y es de lo mejor que tiene la cartera esta semana. Las otras 5 salieron del bot sin que aparecieras. El reparto no dice que el bot venda mejor que tú: dice que el bot está en las 36 conversaciones y tú en 17.", "metodo": [{"c": "En la clase de seguimiento diario te explicamos que la rutina es diaria: todos los días revisar las conversaciones de por lo menos los dos días anteriores y buscar cuatro grupos —quien dejó de responder, quien preguntó y no agendó, quien quedó a medias, a quien se le dieron horarios y no confirmó.", "h": "Lunes 5 mensajes, martes 12, miércoles 13, jueves 4, viernes 2, sábado 1, domingo 6. Josenita escribió el 25/10 a las 22:05 «Hola 🧖🏻‍♀️ Me gustaría más información sobre el escáner facial gratuito» y Tatiana lo mismo el 23/10 a las 16:47; ninguna de las dos recibió un mensaje tuyo.", "p": "El trabajo se concentró en tres días y lo que entró los otros cuatro se quedó sin dueño. 15 de los 36 leads no tuvieron ni un mensaje tuyo."}, {"c": "En la clase te enseñamos no responder únicamente con el precio y usar el molde: «claro que sí, con mucho gusto te doy toda la información, pero antes cuéntame, ¿qué te gustaría mejorar exactamente?».", "h": "4 leads preguntaron el costo esta semana y a los 4 les respondió el bot. Aida escribió el 20/10 a las 13:38 «El jueves o viernes de la otra semana cuánto sería el costo» y Sandra el 22/10 «Está bien, pero los precios más o menos en cuanto están?». En las dos contestó el bot.", "p": "Son 4 personas que te estaban abriendo la puerta para hablar y la conversación la llevó el bot. El escáner gratis lo explica bien él; la confianza para pagar un protocolo de varios cientos de dólares no."}, {"c": "En la clase te explicamos que las sardinas también compran: el bot ayuda a identificar a los peces dorados, pero eso no autoriza a soltar al resto. Hay quien escribe un año después.", "h": "Myrna escribió el 22/10 a las 20:49 «Espero ir lo más pronto posible» y Reynoso el 23/10 a las 23:16 «Cicatrices», que es exactamente lo que trata tu protocolo. Ninguno de los dos volvió a tener noticias tuyas, y ninguno agendó.", "p": "Esas dos personas ya habían dicho que sí y ya habían dicho qué les duele. Era el momento de la nota de voz, y pasó la semana completa sin que llegara."}], "cierre": "Nada de esto es una opinión nuestra: está en la clase de seguimiento diario y en la de nota de voz, en el área de miembros, y esta semana quedó probado en tu propia cuenta. Los tres días que seguiste la rutina produjeron las 2 citas en las que participaste; los cuatro días flojos produjeron 15 personas sin tocar. Y mientras el ritmo dependa de cómo venga el día, el número no se va a mover: la clienta que ya te conoce vuelve sola porque ya confía, pero quien te vio en un anuncio no trae esa confianza. Hay que construírsela, y eso solo pasa si entras tú.", "funciono": "Esta semana tienes lo más difícil resuelto. Le escribiste al <b>47% de los leads</b> antes de que hubiera cita y mandaste <b>13 notas de voz</b>: eso es nivel alto, no promedio. Y en 2 de las 7 citas tú habías puesto conversación antes de que el bot cerrara, que es la señal de que el método funciona cuando lo usas. También subiste el seguimiento después de la cita: de 4 la semana pasada a 6 esta. No hay que cambiar lo que haces, hay que repartirlo en los siete días.", "acciones": [{"t": "Los 15 que nadie tocó", "d": "Empieza por Myrna y Reynoso, que ya te dijeron qué quieren. Después los del viernes y el sábado, que son los más frescos. Una nota de voz, no un texto.", "g": "Hola [nombre], soy Javier. Vi que te interesa el escáner y que mencionaste [lo que escribió]. Antes de agendarte quiero entender bien: ¿qué es lo que más te gustaría mejorar de tu piel y hace cuánto lo tienes así? Con eso te digo si el escáner te sirve o si lo tuyo necesita otra cosa."}, {"t": "Entra tú cuando pregunten el precio", "d": "Las 4 personas que preguntaron el costo esta semana las atendió el bot. Esta semana, en cuanto veas la pregunta de precio, entra tú en menos de dos horas con el molde de la clase.", "g": "Claro que sí, con mucho gusto te doy toda la información. Pero antes cuéntame, ¿qué te gustaría mejorar exactamente? Según lo que vea en el escáner te digo si necesitas una sesión o un protocolo, y así no te doy un precio que no es el tuyo."}, {"t": "Reparte la semana", "d": "Tus mejores días fueron martes y miércoles con 12 y 13 mensajes. El jueves, viernes y sábado sumaste 7 entre los tres. Pon 20 minutos fijos cada mañana para revisar los dos días anteriores: no hace falta más."}], "pie": "Los números salen de tu cuenta de EpikFlow entre el lunes 19 y el domingo 25 de octubre. Solo cuentan como tuyos los mensajes que salieron de tu teléfono o de tu equipo desde la plataforma, así que si algo quedó fuera es porque no pudimos verlo, nunca al revés."}</script><script src="/assets/a.js" defer></script></html>
