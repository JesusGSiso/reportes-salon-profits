<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reporte de Gestión</title><link rel="stylesheet" href="/assets/s.css"><script type="application/json" id="d">{"slug": "javier-melendez", "nombre": "Javier Melendez", "estado": "listo", "rango": "Semana del 5 al 11 de octubre de 2026", "rangoCorto": "5–11 oct", "rangoAnt": "28 sep–4 oct", "tasa": {"pct": 8, "num": 2, "den": 26, "botSola": 8, "ella": 0, "mutuo": 0, "leadSola": 0, "pctAnt": 21}, "historico": [{"etq": "28 sep–4 oct", "tasa": 21}, {"etq": "5–11 oct", "tasa": 8}], "intro": ["Esta semana trabajaste más que la pasada y convertiste menos, y eso merece una explicación honesta. Le escribiste a 19 de 26 leads —el 73%, el mejor número de toda la cartera— y mandaste 18 notas de voz. Nadie en Salon Profits está mandando esa proporción de audios. Eso no se discute.", "Y aun así se agendaron 2 personas, cuando la semana pasada fueron 6. El dato que explica la diferencia es este: <b>en ninguna de las 2 citas de esta semana apareces tú antes de que la cita existiera</b> — las dos las cerró el bot solo. O sea que las 19 conversaciones en las que invertiste tu voz no terminaron en una cita. No es que no trabajes: es que el trabajo se queda en conversación y nunca llega al momento de ofrecer el día y la hora. <b>Todo lo demás en este reporte es consecuencia de eso.</b>"], "kpis": [{"k": "Leads de anuncio", "s": "Leads", "v": 26, "ant": 29, "t": "26", "at": "29"}, {"k": "Les escribiste antes", "s": "Escribiste", "v": 19, "ant": 16, "t": "19", "at": "16 de 29"}, {"k": "Con nota de voz", "s": "Voz", "v": 18, "ant": 12, "t": "18", "at": "12 de 29"}, {"k": "Agendaron", "s": "Agendaron", "v": 2, "ant": 6, "t": "2", "at": "6"}, {"k": "Les escribiste después", "s": "Después", "v": 1, "ant": 3, "t": "1", "at": "3 de 6"}, {"k": "Les mandaste la foto", "s": "Foto", "v": 0, "ant": 0, "t": "0", "at": "0 de 6"}], "barras": [{"label": "Leads a los que le escribiste", "num": 19, "den": 26, "meta": 60}, {"label": "Leads con nota de voz", "num": 18, "den": 26, "meta": 40}, {"label": "Citas a las que mandaste la foto", "num": 0, "den": 2, "meta": 60, "vacio": "Esta semana no hubo citas, así que esta barra no aplica."}], "origen": [{"k": "El bot", "v": 2, "c": "#2F6F68"}], "origenNota": "Las 2 citas de leads de publicidad las creó el bot, y mirando quién había hablado con la persona <b>antes</b> de que existiera la cita, también fue el bot solo en las dos. Esto no significa que tu gestión no sirva — tú estás tomando las conversaciones difíciles, las que piden explicación y confianza. Significa que en esas conversaciones falta el último paso: proponer el día.", "metodo": [{"c": "El embudo de opciones para agendar. Nunca «¿cuándo quieres venir?», porque eso invita al «yo te aviso». Son tres pasos: ¿entre semana o fin de semana? → ¿mañana o tarde? → ¿a las 10 o a las 11?", "h": "En las 19 conversaciones que trabajaste a mano, con 18 notas de voz incluidas, <b>ninguna terminó en una cita creada con tu participación</b>. Las que sí agendaron las cerró el bot por su cuenta. Y hay dos mensajes tuyos que muestran exactamente dónde se corta: a Cristina le escribiste el 7/10 «Quedo atenta por aquí para ayudarte ☺️» y a Alejandra el 9/10 «Quedo atenta por aquí».", "p": "«Quedo atenta por aquí» deja la decisión del lado de la persona, y una persona que te vio en un anuncio no toma esa decisión sola. Es el momento exacto en que se pierde una conversación que ya estaba caliente: hiciste todo el trabajo de confianza y no pediste el cierre."}, {"c": "La rutina diaria: revisar todos los días las conversaciones de por lo menos los dos días anteriores, y buscar a quien quedó a medias.", "h": "El domingo 11 no salió ni un mensaje tuyo, y ese día tres personas escribieron: Milena pidió «más información sobre el escáner facial gratuito» a las 20:34, otra lo mismo a las 00:31, y un tercer lead te escribió a las 22:17 «Yo estoy en Davie cerca de Home Depot, ¿podría enviarme su número de teléfono por favor?». Las tres cerraron la semana sin respuesta tuya.", "p": "Ese último mensaje es alguien pidiendo tu teléfono para hablar contigo: es lo más caliente que llega en una semana. Un día sin revisar en fin de semana cuesta justamente los leads más decididos, porque son los que escriben fuera de hora."}, {"c": "Las sardinas también compran, y hay quien escribe un año después. El bot ayuda a identificar a los peces dorados, pero eso no autoriza a abandonar al resto.", "h": "Elisa te mandó <b>17 mensajes</b> y cerró el 6/10 con «Igualmente, bendiciones» sin recibir un solo mensaje atribuible a ti. Yolanda escribió 5 veces y terminó en «Gracias» el 9/10. Las dos tuvieron conversación completa — con el bot.", "p": "Una persona que escribe 17 veces no es una curiosa: es alguien que quería que le hablaras. Esas conversaciones no están muertas, están esperando. Y como no agendaron, hoy cuentan como leads perdidos aunque el interés siga ahí."}, {"c": "Después de que agenda, empujar a la que ya agendó para que asista, con el mensaje y la foto del lugar.", "h": "De las 2 que agendaron, le escribiste a 1 y a ninguna le mandaste la foto. En la semana anterior fue igual: 0 fotos de 6 citas.", "p": "Con tan pocas citas, cada plantón duele el doble. La foto del lugar y un mensaje el día antes es lo más barato que existe para que la persona llegue, y llevas dos semanas sin mandar ninguna."}], "cierre": "Lo que falta acá no es esfuerzo: es un paso, y es siempre el mismo. La clase de seguimiento te lo dio con el molde escrito — el embudo de tres opciones, nunca la pregunta abierta — y el método ya está grabado y ya lo viste. Esta semana se probó en tu propia cuenta: las 19 conversaciones que trabajaste con tu voz y tu tiempo no produjeron ni una cita, y las 2 que salieron las cerró un sistema que sí pide el día y la hora. Mientras el cierre siga quedando a criterio del lead, el número se va a quedar en 8%. Tus pacientes de siempre vuelven solos porque ya confían en ti; quien te vio en un anuncio no trae esa confianza, y hay que llevarlo de la mano hasta la hora exacta.", "funciono": "Las 18 notas de voz de 26 leads. Es el 69% y es, de lejos, la mejor cifra de toda la cartera esta semana — la meta que nos pusimos es 40%. Estás haciendo lo más difícil del método: poner tu voz, tu nombre y tu criterio clínico delante de gente que no te conoce. Todo este reporte dice una sola cosa: ya tienes lo caro resuelto, te falta lo barato.", "acciones": [{"t": "Reabre las tres del domingo, hoy mismo", "d": "Milena, el lead de Davie que te pidió el teléfono, y la del 11/10 a medianoche. Llevan un día esperando y eso todavía se recupera.", "g": "Hola [nombre], soy Javier. Perdón por la demora, te contesto yo directamente. El escáner facial es gratis y sin compromiso, dura 30 minutos. ¿Te queda mejor entre semana o el fin de semana?"}, {"t": "Cambia «quedo atenta» por el embudo de tres pasos", "d": "Es el único cambio que mueve este número. Cada vez que ibas a cerrar con «quedo atenta por aquí», cierra con una pregunta de dos opciones. Empieza por Cristina y Alejandra, que quedaron ahí.", "g": "Te propongo algo concreto para que no se nos pase: ¿te queda mejor entre semana o el fin de semana? — y después: ¿mañana o tarde? — y después: ¿a las 10 o a las 11?"}, {"t": "Elisa y Yolanda, con una pregunta gancho", "d": "Elisa mandó 17 mensajes y Yolanda 5, las dos sin un mensaje tuyo. Mándales un audio con una pregunta concreta, no un «¿sigues interesada?».", "g": "Hola [nombre], soy Javier. Vi toda tu conversación y quería hablarte yo. Cuéntame una cosa: ¿qué es lo que más te gustaría mejorar de tu piel ahora mismo? Con eso te digo en un minuto si el escáner te sirve."}], "pie": "Los números salen de tu cuenta de EpikFlow entre el lunes 5 y el domingo 11 de octubre. Solo cuentan como tuyos los mensajes que salieron de tu teléfono o de tu equipo desde la plataforma, así que si algo quedó fuera es porque no pudimos verlo, nunca al revés."}</script><script src="/assets/a.js" defer></script></html>
