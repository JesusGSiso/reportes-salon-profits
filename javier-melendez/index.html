e mismo día.", "p": "18 de los 45 leads no recibieron ni un mensaje tuyo. Los días flojos son exactamente los días de los leads que se quedaron sin nada."}, {"c": "El bot es apoyo, no reemplazo: cuando alguien pregunta el precio ya está levantando la mano y ahí entras tú, con la pregunta de necesidad antes de dar cualquier número.", "h": "3 leads preguntaron precio esta semana y a las 3 les respondió el bot: Mirta el 13/10 («Cuánto cuesta y el tratamiento saca arrugas»), Eliel el 14/10 («Dame precios de la sesión o sesiones que tengo que hacerme») y Raquel el 18/10 («Déjame evaluar la próxima semana, quiero saber precios»).", "p": "Raquel se fue con un «la próxima semana» sin fecha. Es la conversación que más cerca estaba y la que menos atención recibió."}], "cierre": "Lo que estás haciendo antes de la cita funciona y los números lo demuestran: 21 notas de voz, 24 leads tocados y 3 citas que no existirían sin ti. Eso ya está. Lo que falta es la segunda mitad del método, la que la clase llama empujar a la que ya agendó: el mensaje y la foto antes de la cita. Es lo más rápido de arreglar de todo este reporte, porque son 9 personas, no 45. Y la gente que llega por un anuncio no trae la confianza hecha: la foto y el mensaje son justo lo que se la dan antes de que se suba al carro para venir.", "funciono": "Las notas de voz. 21 en una semana, sobre 45 leads, es el 47% — por encima de la meta de 40% y mucho más de lo que hace la mayoría. Y se nota en el resultado: 3 de las 9 citas de la semana tienen tu conversación dentro, cuando la semana pasada no había ninguna. El viernes 16 mandaste 17 mensajes en un día: ese es el ritmo que hay que repetir los lunes y los martes.", "acciones": [{"t": "Hoy: la foto a las 9 que ya agendaron", "d": "Ninguna de las 9 recibió la foto del resultado. Empieza por las que tienen cita esta semana: Milena, M y Silvia, que no tienen ni un mensaje tuyo.", "g": "Hola [nombre], soy Javier. Te espero el [día] a las [hora]. Te mando una foto de un resultado parecido al tuyo para que veas a dónde vamos."}, {"t": "Raquel, antes de que se enfríe", "d": "Preguntó precios el domingo y dijo que evaluaba «la próxima semana». Esa semana es esta: ponle fecha hoy.", "g": "Hola Raquel, soy Javier. Antes de hablar de precios cuéntame: ¿qué es lo que más te gustaría mejorar de tu piel? Con eso te digo exactamente qué necesitas. El escáner es gratis: ¿te va mejor entre semana o el fin de semana?"}, {"t": "Lunes y martes como el viernes", "d": "El viernes mandaste 17 mensajes; el lunes 2 y el martes 1. Los 18 leads que no tocaste cayeron justo en los días flojos. Mueve 15 minutos del viernes al lunes."}], "pie": "Los números salen de tu cuenta de EpikFlow entre el lunes 12 y el domingo 18 de octubre de 2026. Solo cuentan como tuyos los mensajes que salieron de tu teléfono o de tu equipo desde la plataforma, así que si algo quedó fuera es porque no pudimos verlo, nunca al revés."}</script><script src="/assets/a.js" defer></script></html>
