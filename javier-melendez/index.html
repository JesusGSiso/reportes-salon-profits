<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reporte de Gestión</title><link rel="stylesheet" href="/assets/s.css"><script type="application/json" id="d">{"slug": "javier-melendez", "nombre": "Javier Melendez", "estado": "listo", "rango": "Semana del 28 de septiembre al 4 de octubre de 2026", "rangoCorto": "28 sep–4 oct", "rangoAnt": "21–27 sep", "tasa": {"pct": 21, "num": 6, "den": 29, "botSola": 11, "ella": 0, "mutuo": 10, "leadSola": 0, "pctAnt": 26}, "historico": [{"etq": "28 sep–4 oct", "tasa": 21}], "intro": ["Esta semana entraron 29 leads de publicidad y agendaron 6: una tasa del 21%. La semana pasada entraron 31, agendaron 8, y la tasa fue del 26%. Casi el mismo volumen de leads, cinco puntos menos de resultado. La diferencia no está en la publicidad.", "La semana pasada le escribiste a 26 de 31 leads y mandaste 21 notas de voz. Esta semana le escribiste a 16 de 29 y mandaste 12 notas de voz. El trabajo bajó casi a la mitad y el número bajó con él: las citas donde tú participaste cayeron de 7 a 3, y las que el bot cerró solo subieron de 1 a 3. <b>Todo lo demás en este reporte es consecuencia de eso.</b>"], "kpis": [{"k": "Leads de anuncio", "s": "Leads", "v": 29, "ant": 31, "t": "29", "at": "31"}, {"k": "Les escribiste antes", "s": "Escribiste", "v": 16, "ant": 26, "t": "16", "at": "26 de 31"}, {"k": "Con nota de voz", "s": "Voz", "v": 12, "ant": 21, "t": "12", "at": "21 de 31"}, {"k": "Agendaron", "s": "Agendaron", "v": 6, "ant": 8, "t": "6", "at": "8"}, {"k": "Les escribiste después", "s": "Después", "v": 3, "ant": 6, "t": "3", "at": "6 de 8"}, {"k": "Les mandaste la foto", "s": "Foto", "v": 0, "ant": 0, "t": "0", "at": "0 de 8"}], "barras": [{"label": "Leads a los que le escribiste", "num": 16, "den": 29, "meta": 60}, {"label": "Leads con nota de voz", "num": 12, "den": 29, "meta": 40}, {"label": "Citas a las que mandaste la foto", "num": 0, "den": 6, "meta": 60}], "origen": [{"k": "El bot", "v": 6, "c": "#2F6F68"}, {"k": "Tú, desde el teléfono", "v": 1, "c": "#C0522F"}], "origenNota": "De las 7 citas que se crearon con leads de publicidad, 6 las creó el bot y 1 la creaste tú. Pero lo que importa es el desglose de arriba: en 3 de las 6 leads que agendaron hubo esfuerzo de las dos partes y en 3 el bot lo hizo solo. La semana pasada esa proporción era 7 y 1. Es el mismo bot, el mismo anuncio y la misma semana de trabajo: lo que cambió fue cuántas conversaciones tocaste.", "metodo": [{"c": "En la clase de seguimiento te explicamos la rutina diaria: todos los días revisar las conversaciones de por lo menos los dos días anteriores, y buscar a quien dejó de responder, a quien preguntó y no agendó, a quien quedó a medias y a quien se le dieron horarios y no confirmó.", "h": "11 de las 29 leads no recibieron ni un mensaje tuyo. Cuatro llegaron el sábado 4 de octubre — Amparo (22:51), Orlando (21:13), Nury (12:31) y Adriana (12:17) — todas con el mismo mensaje: \"Me gustaría más información sobre el escáner facial gratuito\". Ninguna tuvo respuesta tuya.", "p": "Esas cuatro son leads de menos de 48 horas pidiendo justo lo que ofreces, y el escáner es gratis: no hay objeción de precio que resolver. Mapy escribió 5 veces y cerró el 30 de septiembre con \"Muchas gracias☺️\", que es la despedida de alguien que ya se fue."}, {"c": "En la clase te explicamos que el bot es apoyo, no reemplazo: responde rápido, inicia y filtra, pero tú interpretas la necesidad y cierras. La confianza la construyes tú.", "h": "Tocaste 16 de 29 leads esta semana, contra 26 de 31 la semana pasada. Las citas con esfuerzo de las dos partes pasaron de 7 a 3; las que el bot cerró solo, de 1 a 3.", "p": "Ahí está el reporte completo en una línea. No es una teoría nuestra: son dos semanas seguidas de tu propia cuenta, con el mismo anuncio y el mismo bot, y la única variable que se movió fue cuánto entraste tú. Cuando entras, se agenda con tu nombre encima; cuando no, el bot salva lo que puede y el resto se cae."}, {"c": "En la clase te enseñamos la nota de voz con cinco elementos: tu nombre, una validación, la necesidad que la lead expresó, una solución posible y una pregunta para continuar. Con energía, y nunca la misma para dos personas.", "h": "Mandaste 12 notas de voz esta semana. La semana pasada mandaste 21.", "p": "Doce sigue siendo un número alto para la cartera, y las que mandaste están en las conversaciones que avanzaron. Pero nueve leads que la semana pasada habrían recibido audio esta semana recibieron solo al bot, y seis de ellas ni eso."}], "cierre": "Este reporte es inusual porque la comparación está limpia: dos semanas consecutivas, mismo anuncio, mismo bot, volumen de leads casi idéntico. Lo único que cambió fue tu trabajo, y el resultado se movió exactamente en la misma dirección. Eso significa que el método ya está probado en tu propia cuenta y no hace falta discutirlo: la semana del 21 al 27 de septiembre es la demostración. Lo que falta es sostenerlo, y mientras se siga trabajando de otra manera el número no se va a mover: tus clientas de siempre llegan solas porque ya confían en ti, pero quien te vio en un anuncio no trae esa confianza y hay que construírsela una conversación a la vez.", "funciono": "Las 3 citas de esfuerzo mutuo. En las 16 leads que sí tocaste, tu trabajo aparece en la mitad de los agendamientos de la semana, y escribiste los siete días sin fallar uno — el jueves 2 y el viernes 3 de octubre mandaste 10 y 8 mensajes. La rutina diaria la tienes montada; lo que se encogió esta semana fue cuánta gente entró en ella. Y la semana pasada, con 26 de 31 leads tocadas y 21 notas de voz, llegaste a 26% de agendamiento con 7 de 8 citas llevando tu huella. Ese es tu techo real y es reciente.", "acciones": [{"t": "Las cuatro del sábado, hoy", "d": "Amparo, Orlando, Nury y Adriana escribieron el 4 de octubre pidiendo información del escáner facial gratuito y nadie les contestó aún. Son las leads más fáciles de la semana: lo que piden es gratis.", "g": "Hola [nombre], soy Javier de KBELLA. Sí, el escáner facial es gratis y sin compromiso. Antes de agendarte cuéntame una cosa: ¿qué es lo que más te gustaría mejorar de tu piel ahora mismo? Con eso preparo la evaluación enfocada en eso."}, {"t": "Vuelve a 25 leads tocadas", "d": "La semana pasada tocaste 26 de 31 y la tasa fue 26%. Esta semana 16 de 29 y fue 21%. No hace falta inventar nada nuevo: hace falta volver al número de la semana pasada.", "g": ""}, {"t": "El embudo de opciones, no la pregunta abierta", "d": "Irene y Marylin se quedaron a medias después de contar lo que les molestaba. En vez de esperar que ellas propongan hora, dales el embudo de tres pasos que vimos en clase.", "g": "Para la evaluación, ¿te queda mejor entre semana o fin de semana? … Perfecto, ¿mañana o tarde? … Listo, ¿a las 10 o a las 11?"}], "pie": "Los números salen de tu cuenta de EpikFlow entre el lunes 28 de septiembre y el domingo 4 de octubre de 2026. Solo cuentan como tuyos los mensajes que salieron de tu teléfono o de tu equipo desde la plataforma, así que si algo quedó fuera es porque no pudimos verlo, nunca al revés."}</script><script src="/assets/a.js" defer></script></html>
