<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reporte de Gestión</title><link rel="stylesheet" href="/assets/s.css"><script type="application/json" id="d">{"slug": "andrea-martinez-canelon", "nombre": "Andrea Martinez Canelon", "estado": "listo", "rango": "Semana del 19 al 25 de octubre de 2026", "rangoCorto": "19–25 oct", "rangoAnt": "12–18 oct", "tasa": {"pct": 20, "num": 5, "den": 25, "botSola": 16, "ella": 0, "mutuo": 4, "leadSola": 0, "pctAnt": 12}, "historico": [{"etq": "14–20 sep", "tasa": 3}, {"etq": "21–27 sep", "tasa": 12}, {"etq": "28 sep–4 oct", "tasa": 8}, {"etq": "5–11 oct", "tasa": 0}, {"etq": "12–18 oct", "tasa": 12}, {"etq": "19–25 oct", "tasa": 20}], "intro": ["Andrea, esta semana <b>pasaste las dos metas</b>: le escribiste a 16 de los 25 leads que entraron (64%, la meta era 60%) y mandaste 12 notas de voz (48%, la meta era 40%). En toda la cartera solo otra cuenta llega a eso. Y tu tasa de agendamiento subió del 12% al 20%.", "Como ya tienes resuelto el trabajo de entrar en las conversaciones, este reporte es sobre lo otro: <b>cerrar</b>. De las 16 personas a las que escribiste, solo 1 terminó en cita con tu participación; las otras 4 citas las cerró el bot sin ti. La conversación llega hasta «¿dónde están?» o «¿cuánto cuesta?» y ahí se detiene. <b>Todo lo demás en este reporte es consecuencia de eso.</b>"], "kpis": [{"k": "Leads de anuncio", "s": "Leads", "v": 25, "ant": 26, "t": "25", "at": "26"}, {"k": "Les escribiste antes", "s": "Escribiste", "v": 16, "ant": 23, "t": "16", "at": "23 de 26"}, {"k": "Con nota de voz", "s": "Voz", "v": 12, "ant": 20, "t": "12", "at": "20 de 26"}, {"k": "Agendaron", "s": "Agendaron", "v": 5, "ant": 3, "t": "5", "at": "3"}, {"k": "Les escribiste después", "s": "Después", "v": 4, "ant": 3, "t": "4", "at": "3 de 3"}, {"k": "Les mandaste la foto", "s": "Foto", "v": 0, "ant": 0, "t": "0", "at": "0 de 3"}], "barras": [{"label": "Leads a los que le escribiste", "num": 16, "den": 25, "meta": 60}, {"label": "Leads con nota de voz", "num": 12, "den": 25, "meta": 40}, {"label": "Citas a las que mandaste la foto", "num": 0, "den": 5, "meta": 60, "vacio": "Esta semana no hubo citas, así que esta barra no aplica."}], "origen": [{"k": "El bot", "v": 5, "c": "#2F6F68"}], "origenNota": "Las 5 citas las creó el bot, pero en 1 de ellas tú habías puesto conversación antes —y fue justo la que atendiste con un audio—. Eso no quiere decir que el bot venda mejor: tú estás en 16 de las 25 conversaciones y él en todas. La diferencia está en el último paso, el del horario concreto.", "metodo": [{"c": "En la clase te enseñamos no responder únicamente con el precio y usar el molde: «claro que sí, con mucho gusto te doy toda la información, pero antes cuéntame, ¿qué te gustaría mejorar exactamente?». La pregunta de precio es la puerta de entrada.", "h": "5 leads preguntaron el costo. En 1 entraste tú y le contestaste con un <b>audio</b>: fue el contacto del 24/10 a las 19:11 que preguntó «Cuánto sería el costo para poder ir preparada?». En los otros 4 contestó el bot. <b>Suyapa</b> preguntó «Precio» el 25/10 a las 11:53, le respondió el bot, y a las 17:23 cerró con «No gracias».", "p": "La que recibió tu audio agendó —tiene cita el sábado 31 a las 4—. Suyapa recibió solo la respuesta del bot y se fue cinco horas después. Mismo día, misma pregunta, dos finales distintos."}, {"c": "En la clase de seguimiento diario te explicamos que la rutina es diaria: todos los días revisar las conversaciones de por lo menos los dos días anteriores y buscar cuatro grupos —quien dejó de responder, quien preguntó y no agendó, quien quedó a medias, a quien se le dieron horarios y no confirmó.", "h": "Escribiste seis de los siete días —28 mensajes el lunes, 37 el viernes, 35 el domingo— pero el <b>sábado 24 estuviste en cero</b>. <b>Alicia</b> escribió el 25/10 a las 11:28 «Dónde están ubicados?» y no recibió respuesta tuya. <b>Leyli</b> y <b>Capricornio</b> pidieron información de la evaluación y tampoco.", "p": "Alicia preguntó la dirección: ya estaba decidida a ir. Es el mensaje más fácil de contestar de toda la semana y quedó sin contestar."}, {"c": "En la clase te enseñamos el embudo de opciones para agendar, en tres pasos: ¿entre semana o fin de semana? → ¿mañana o tarde? → ¿a las 10 o a las 11? Y nunca preguntar «¿cuándo quieres venir?», porque eso invita al «yo te aviso».", "h": "De las 16 conversaciones en las que entraste, solo 1 terminó en cita con tu participación. Las otras 15 avanzaron y se quedaron sin una hora concreta sobre la mesa.", "p": "Tu parte más difícil —entrar, preguntar, grabar el audio— ya la haces mejor que casi nadie. El paso que falta es el más corto: ofrecer dos horarios y dejar que elija."}], "cierre": "Nada de esto es una opinión nuestra: está grabado en la clase de seguimiento diario, en la de nota de voz y en la del embudo de opciones, y esta semana quedó probado en tu propia cuenta. La persona a la que le mandaste el audio cuando preguntó el precio tiene cita para el sábado; Suyapa, que preguntó lo mismo y solo tuvo al bot, dijo «no gracias» cinco horas después. Y mientras la conversación termine sin un horario concreto, el 20% no va a subir más: quien te vio en un anuncio está comparando, y lo que la decide no es más información, es una hora reservada a su nombre.", "funciono": "Esta semana tienes el mejor número de gestión de toda la cartera y hay que decirlo claro: <b>16 de 25 leads tocados (64%) y 12 notas de voz (48%)</b>, las dos metas pasadas. Nadie más está ahí. Y el caso concreto: el 24/10 a las 19:11 alguien te preguntó «Cuánto sería el costo para poder ir preparada?» y en vez de mandarle un texto le mandaste un <b>audio</b>. Esa persona agendó para el sábado 31 a las 4 de la tarde. Eso es literalmente el ejemplo de la clase, hecho por ti, en tu cuenta, esta semana. Además respondiste después de la cita a 4 de las 5 que agendaron.", "acciones": [{"t": "Alicia, hoy, con la dirección y una hora", "d": "Preguntó dónde están el domingo. No le mandes solo la dirección: mándale la dirección y dos horarios.", "g": "Hola Alicia, soy Andrea. Estoy en 4230 LBJ Freeway, Suite 360-I, Dallas. La evaluación facial es gratis, dura 30 minutos y ahí veo y toco tu piel para decirte exactamente qué necesita. Tengo esta semana el miércoles a las 10 o el jueves a las 4: ¿cuál te queda mejor?"}, {"t": "Cierra siempre con dos horarios", "d": "Es lo único que te falta. Cuando la conversación ya avanzó —y tú las haces avanzar—, no preguntes cuándo quiere venir: dale dos opciones concretas.", "g": "¿Te acomoda entre semana o el fin de semana? … Perfecto, ¿mañana o tarde? … Tengo el jueves a las 10 o a las 4, ¿cuál te aparto?"}, {"t": "Entra tú en la pregunta de precio", "d": "5 personas preguntaron el precio y entraste en 1; esa agendó. Las otras 4 las atendió el bot y una se fue. Cuando veas la pregunta de precio, manda un audio de 30 segundos antes de que pasen dos horas."}], "pie": "Los números salen de tu cuenta de EpikFlow entre el lunes 19 y el domingo 25 de octubre. Solo cuentan como tuyos los mensajes que salieron de tu teléfono o de tu equipo desde la plataforma, así que si algo quedó fuera es porque no pudimos verlo, nunca al revés."}</script><script src="/assets/a.js" defer></script></html>
