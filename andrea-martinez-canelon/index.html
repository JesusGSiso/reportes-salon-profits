sación está hecho; lo que no está cerrando es el paso final, el de poner día y hora.", "p": "Cuando la cobertura es del 88% y la tasa es del 12%, el cuello está en el cierre, no en el contacto. Es el único mandato de la clase que todavía no se ve en tus datos."}], "cierre": "Este reporte no te pide trabajar más: estás entre las dos o tres clientas que mejor ejecutan el método en toda la cartera, y los números de cobertura y de notas de voz lo prueban. Lo que queda es el último metro — el embudo de tres pasos para poner día y hora, y la foto a quien ya agendó. Y la parte que no es tuya la asumimos nosotros: con 23 conversaciones y 20 audios, 3 citas es poco, y vamos a revisar de nuestro lado qué está frenando el paso de la conversación a la agenda. Nota técnica: dos de tus adjuntos de esta semana no pudimos clasificarlos, así que tus notas de voz y fotos pueden estar contadas por debajo — nunca por encima.", "funciono": "El 18/10, cuando una lead preguntó «¿cuál es el precio de la consulta?», le contestaste con una nota de voz en lugar de una cifra. Eso es exactamente el molde de la clase. Y la semana completa: 56 mensajes el martes, 51 el miércoles, 30 el sábado, con audio a 20 de los 26 leads. Pasaste de 0 citas la semana pasada a 3 esta. Nadie en la cartera cubre como tú.", "acciones": [{"t": "El embudo de tres pasos, en cada audio", "d": "Cierra cada nota de voz con la pregunta cerrada en vez de dejar la puerta abierta.", "g": "…y para que no se te complique: ¿te queda mejor entre semana o el fin de semana? — Perfecto, ¿mañana o tarde? — Listo, ¿a las 10 o a las 11?"}, {"t": "La foto a las 3 que agendaron", "d": "Ninguna la recibió y una ya canceló. Mándala con el recordatorio del día anterior.", "g": "Mira el resultado de una piel parecida a la tuya — eso es a donde vamos. Te espero el [día] a las [hora]."}, {"t": "Los precios, siempre tú", "d": "Tres de las cuatro preguntas de precio las tomó el bot. Son cuatro al mes, no cuarenta: tómalas todas con un audio, c
