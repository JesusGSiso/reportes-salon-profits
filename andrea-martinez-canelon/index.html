<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reporte de Gestión</title><link rel="stylesheet" href="/assets/s.css"><script type="application/json" id="d">{"slug": "andrea-martinez-canelon", "nombre": "Andrea Martinez Canelon", "estado": "listo", "rango": "Semana del 21 al 27 de septiembre de 2026", "rangoCorto": "21–27 sep", "rangoAnt": "14–20 sep", "tasa": {"pct": 12, "num": 3, "den": 25, "botSola": 8, "ella": 0, "mutuo": 4, "leadSola": 0, "pctAnt": 3}, "historico": [{"etq": "14–20 sep", "tasa": 3}, {"etq": "21–27 sep", "tasa": 12}], "intro": ["Andrea, 20 de tus 25 leads de anuncio recibieron una nota de voz tuya esta semana. Ocho de cada diez. No hay nadie en toda la cartera de Salon Profits que se acerque a ese número, y tu tasa subió de 3% a 12%. Lo que la clase te pidió, lo estás haciendo.", "Por eso el punto de esta semana no es «trabaja más». Es que todo ese esfuerzo se está quedando en la puerta: 3 de 25 agendaron, a ninguna de las 3 le mandaste una foto, y el sábado y el domingo se enfriaron conversaciones que estaban abiertas. <b>Todo lo demás en este reporte es consecuencia de eso.</b>"], "kpis": [{"k": "Leads de anuncio", "s": "Leads", "v": 25, "ant": 36, "t": "25", "at": "36"}, {"k": "Les escribiste antes", "s": "Escribiste", "v": 20, "ant": 31, "t": "20", "at": "31 de 36"}, {"k": "Con nota de voz", "s": "Voz", "v": 20, "ant": 30, "t": "20", "at": "30 de 36"}, {"k": "Agendaron", "s": "Agendaron", "v": 3, "ant": 1, "t": "3", "at": "1"}, {"k": "Les escribiste después", "s": "Después", "v": 2, "ant": 0, "t": "2", "at": "0 de 1"}, {"k": "Les mandaste la foto", "s": "Foto", "v": 0, "ant": 0, "t": "0", "at": "0 de 1"}], "barras": [{"label": "Leads a los que le escribiste", "num": 20, "den": 25, "meta": 60}, {"label": "Leads con nota de voz", "num": 20, "den": 25, "meta": 40}, {"label": "Citas a las que mandaste la foto", "num": 0, "den": 3, "meta": 60, "vacio": "Esta semana no h s de siempre agendan solas porque ya saben cómo funciona; quien te vio en un anuncio necesita que le pongas la fecha delante. Ahí está tu 12% esperando a subir.", "funciono": "Las notas de voz, sin discusión. 20 de 25 leads escucharon tu voz esta semana, y lo hiciste seis días seguidos, con 34 mensajes el viernes y 28 el lunes. Esa es exactamente la herramienta que la clase señala como la que construye confianza con una desconocida, y nadie más en la cartera la usa así. Tu tasa pasó de 3% a 12% por eso.", "acciones": [{"t": "Cierra con dos opciones, no con una pregunta abierta", "d": "Es lo único que te falta. Después de cada audio, propón día y hora concretos.", "g": "Entonces cuéntame, ¿te queda mejor entre semana o el fin de semana? — y cuando responda — perfecto, ¿mañana o tarde? Tengo el jueves a las 10 o a las 3, ¿cuál te aparto?"}, {"t": "Contéstale a Leonard", "d": "Escribió el 26 pidiendo la evaluación facial y sigue sin respuesta tuya. Es la más fácil de la semana.", "g": "Hola Leonard, soy Andrea. Claro que sí, te aparto la evaluación, que es gratis y sin compromiso. ¿Te sirve mejor entre semana o el fin de semana?"}, {"t": "La foto a las 3 que agendaron", "d": "0 de 3. Con tan pocas citas, que aparezcan las tres es lo que hace la diferencia.", "g": "Te dejo una foto de un resultado parecido al que hablamos para que veas de qué se trata. Nos vemos el [día] a las [hora] ✨"}], "pie": "Los números salen de tu cuenta de EpikFlow entre el lunes 21 y el domingo 27 de septiembre. Solo cuentan como tuyos los mensajes que salieron de tu teléfono o de tu equipo desde la plataforma, así que si algo quedó fuera es porque no pudimos verlo, nunca al revés."}</script><script src="/assets/a.js" defer></script></html>
