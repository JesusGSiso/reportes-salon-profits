<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reporte de Gestión</title><link rel="stylesheet" href="/assets/s.css"><script type="application/json" id="d">{"slug": "andrea-martinez-canelon", "nombre": "Andrea Martinez Canelon", "estado": "listo", "rango": "Semana del 14 al 20 de septiembre de 2026", "rangoCorto": "14–20 sep", "rangoAnt": "7–13 sep", "tasa": {"pct": 3, "num": 1, "den": 36, "botSola": 3, "ella": 0, "mutuo": 0, "leadSola": 0, "pctAnt": 0}, "historico": [{"etq": "14–20 sep", "tasa": 3}], "intro": ["Empecemos por lo que nadie más en la cartera hizo esta semana: escribiste los siete días, 139 mensajes, le llegaste a 31 de las 36 personas que entraron y <b>30 de ellas recibieron una nota de voz tuya</b>. Es el nivel de dedicación más alto de toda la cartera, con diferencia.", "Y solo una agendó. Eso no es falta de trabajo — el trabajo está ahí, medido — es que la conversación nunca llega a la parte donde se pone una fecha. Ese es el único punto de este reporte. <b>Todo lo demás en este reporte es consecuencia de eso.</b>"], "kpis": [{"k": "Leads de anuncio", "s": "Leads", "v": 36, "ant": 8, "t": "36", "at": "8"}, {"k": "Les escribiste antes", "s": "Escribiste", "v": 31, "ant": 6, "t": "31", "at": "6 de 8"}, {"k": "Con nota de voz", "s": "Voz", "v": 30, "ant": 5, "t": "30", "at": "5 de 8"}, {"k": "Agendaron", "s": "Agendaron", "v": 1, "ant": 0, "t": "1", "at": "0"}, {"k": "Les escribiste después", "s": "Después", "v": 0, "ant": 0, "t": "0", "at": "0"}, {"k": "Les mandaste la foto", "s": "Foto", "v": 0, "ant": 0, "t": "0", "at": "0"}], "barras": [{"label": "Leads a los que le escribiste", "num": 31, "den": 36, "meta": 60}, {"label": "Leads con nota de voz", "num": 30, "den": 36, "meta": 40}, {"label": "Citas a las que mandaste la foto", "num": 0, "den": 1, "meta": 60}], "origen": [{"k": "El bot", "v": 1, "c": "#2F6F68"}], "origenNota": "La única cita de la semana la creó el bot. Con 36 personas atendidas por ti y una sola cita, el número no está diciendo que trabajes poco: está diciendo que las conversaciones se están quedando en la información y no llegan a la fecha.", "metodo": [{"c": "«Embudo de opciones para agendar.» Tres pasos: ¿entre semana o fin de semana? → ¿mañana o tarde? → ¿a las 10 o a las 11? Nunca dejar la puerta abierta.", "h": "Romell preguntó el 20/09 a las 16:42 «Que precio tendria» y enseguida «Y q hora disponibles». Nadie le respondió. Love escribió el 19/09 «Oh disculpa sería mañana porque me acabo d maquillar» — estaba moviendo el día — y tampoco recibió respuesta.", "p": "Los dos estaban pidiendo hora. Ninguno de los dos agendó. Son las conversaciones más cerca de la cita que tuviste en toda la semana."}, {"c": "«No respondas únicamente con el precio.» El molde: “claro que sí, con mucho gusto te doy toda la información, pero antes cuéntame, ¿qué te gustaría mejorar exactamente de tu piel?”", "h": "9 personas preguntaron precio. En 8 contestó el bot con alguna variante de «el precio depende del servicio». En la única en la que entraste tú, Marco el 17/09, respondiste con una nota de voz.", "p": "«Depende del servicio» no abre nada: no da precio y tampoco pide información. La conversación queda en el aire, que es justo donde quedaron esas ocho."}, {"c": "A quien ya agendó hay que sostenerla hasta el día de la cita: un mensaje tuyo y una foto de un resultado real.", "h": "La única persona que agendó esta semana no ha recibido nada tuyo después de agendar.", "p": "Con una sola cita en la semana, esa es la que no se puede perder."}], "cierre": "Quiero que quede muy claro: este 3% no es un problema de esfuerzo. Treinta notas de voz en treinta y seis leads y siete días seguidos de trabajo es más de lo que hace cualquier otra clienta de la cartera. El método de la clase de seguimiento lo estás aplicando en casi todo —la voz, la constancia, la cobertura— y falta la última pieza, que es la más corta: ofrecer dos horarios concretos y cerrar. Mientras la conversación termine en información y no en una fecha, el número no se va a mover por mucho que trabajes. Tus clientas de siempre se agendan solas porque ya saben cómo funciona; la que te vio en un anuncio necesita que tú le digas «¿jueves a las 10 o sábado a las 2?».", "funciono": "El 17 de septiembre Marco preguntó «Cuanto vale la consulta» y en vez de la respuesta de siempre le mandaste una nota de voz tuya. Eso es exactamente el molde de la clase, y lo repetiste 30 veces esta semana. Ninguna otra clienta se acerca a ese número. Tienes la parte difícil resuelta: la confianza la estás construyendo. Solo falta pedir la cita.", "acciones": [{"t": "Romell y Love pidieron hora", "d": "Los dos escribieron pidiendo horarios el 19 y el 20 y siguen sin respuesta. Escríbeles hoy con dos opciones cerradas.", "g": "Hola [nombre], soy Andrea 😊 perdona la demora. Tengo dos espacios para la evaluación facial, que es gratis: jueves a las 10 de la mañana o sábado a las 2 de la tarde. ¿Cuál te queda mejor?"}, {"t": "Cierra cada nota de voz con dos horarios", "d": "Mandaste 30 audios. Añádele a cada uno la última frase: dos opciones concretas. Es el cambio más pequeño y el que más te va a mover el número.", "g": "…y cuéntame, ¿te queda mejor entre semana o el fin de semana? Te aparto el espacio ahora mismo."}, {"t": "La que agendó no sabe nada de ti", "d": "Es la única cita de la semana. Un mensaje y una foto de un resultado real, el día antes.", "g": "Hola 😊 te confirmo tu evaluación facial. Mira este resultado de una clienta con una piel parecida a la tuya, para que vayas viendo. ¿Alguna duda antes de venir?"}], "pie": "Los números salen de tu cuenta de EpikFlow entre el 14 y el 20 de septiembre. Solo cuentan como tuyos los mensajes que salieron de tu teléfono o de tu equipo desde la plataforma, así que si algo quedó fuera es porque no pudimos verlo, nunca al revés."}</script><script src="/assets/a.js" defer></script></html>
