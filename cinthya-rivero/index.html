<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reporte de Gestión</title><link rel="stylesheet" href="/assets/s.css"><script type="application/json" id="d">{"slug": "cinthya-rivero", "nombre": "Cinthya Rivero", "estado": "listo", "rango": "Semana del 2 al 8 de noviembre de 2026", "rangoCorto": "2–8 nov", "rangoAnt": "26 oct–1 nov", "tasa": {"pct": 9, "num": 1, "den": 11, "botSola": 0, "ella": 0, "mutuo": 9, "leadSola": 0, "pctAnt": 40}, "historico": [{"etq": "14–20 sep", "tasa": 100}, {"etq": "21–27 sep", "tasa": null}, {"etq": "28 sep–4 oct", "tasa": 0}, {"etq": "5–11 oct", "tasa": 6}, {"etq": "12–18 oct", "tasa": 40}, {"etq": "19–25 oct", "tasa": 10}, {"etq": "26 oct–1 nov", "tasa": 40}, {"etq": "2–8 nov", "tasa": 9}], "intro": ["Cinthya, antes de los números: esta semana entraron <b>11 leads de publicidad</b> y la semana pasada entraron 5. Son muestras chicas, así que un agendamiento de más o de menos mueve el porcentaje muchísimo. Mira los absolutos, no el porcentaje: <b>de 11 personas, le escribiste a 9, y a 5 les mandaste nota de voz.</b> Eso es casi la mitad de tu cartera con audio tuyo, y es el porcentaje de notas de voz más alto de todas las cuentas que medimos.", "Lo que pasó es que de esas 11, solo 1 agendó. Y cuando se miran las conversaciones una por una, el patrón se repite: <b>donde entró el precio como primera respuesta, la conversación se murió</b>. Donde entró una pregunta tuya, siguió. <b>Todo lo demás en este reporte es consecuencia de eso.</b>"], "kpis": [{"k": "Leads de anuncio", "s": "Leads", "v": 11, "ant": 5, "t": "11", "at": "5"}, {"k": "Les escribiste antes", "s": "Escribiste", "v": 9, "ant": 2, "t": "9", "at": "2 de 5"}, {"k": "Con nota de voz", "s": "Voz", "v": 5, "ant": 1, "t": "5", "at": "1 de 5"}, {"k": "Agendaron", "s": "Agendaron", "v": 1, "ant": 2, "t": "1", "at": "2"}, {"k": "Les escribiste después", "s": "Después", "v": 1, "ant": 1, "t": "1", "at": "1 de 2"}, {"k": "Les mandaste la foto", "s": "Foto", "v": 0, "ant": 0, "t": "0", "at": "0 de 2"}], "barras": [{"label": "Leads a los que le escribiste", "num": 9, "den": 11, "meta": 60}, {"label": "Leads con nota de voz", "num": 5, "den": 11, "meta": 40}, {"label": "Citas a las que mandaste la foto", "num": 0, "den": 1, "meta": 60}], "origen": [{"k": "El bot", "v": 1, "c": "#2F6F68"}], "origenNota": "La única cita la creó el bot, pero tú habías escrito antes en esa conversación: por eso el desglose de arriba marca «esfuerzo de los dos» y no «el bot sola». De las 11 leads de la semana, esa es la que llegó hasta el calendario.", "metodo": [{"c": "En la clase te enseñamos que no se responde únicamente con el precio. El molde es: «claro que sí, con mucho gusto te doy toda la información, pero antes cuéntame, ¿qué te gustaría mejorar exactamente?». La pregunta primero; la cifra después, y con el por qué.", "h": "3 leads preguntaron precio esta semana y las tres terminaron distinto. A Margoth, el 7/11, le respondiste directo: «Empieza en 85 le incluye su tratamiento y su estilizado». A Alejandra, que el 6/11 contó que tiene el pelo hasta la cintura y dudaba entre balayage y mechitos, le contestó el bot con «desde $280». A Ania, el 6/11, le mandaste una nota de voz.", "p": "Ania y Margoth siguieron conversando; Alejandra, que era la que más había contado de sí misma, no volvió. La cifra sola no cierra ni mata: lo que decide es si antes hubo una pregunta."}, {"c": "En la clase te explicamos la rutina diaria: revisar las conversaciones de por lo menos los dos días anteriores y buscar cuatro grupos — quien dejó de responder, quien preguntó y no agendó, quien quedó a medias, y a quien se le dieron horarios y no confirmó.", "h": "Tus mensajes a leads de publicidad empezaron el jueves 5. El lunes 2, el martes 3 y el miércoles 4 no salió ninguno. Después trabajaste fuerte: 10 el jueves, 27 el viernes, 11 el sábado, 6 el domingo.", "p": "Cuando arrancaste, arrancaste en serio. Pero las que entraron lunes, martes y miércoles ya llevaban dos o tres días con el bot cuando llegaste tú, y a esa altura la conversación ya se había enfriado."}, {"c": "En la clase te recordamos que las sardinas también compran: el bot ayuda a encontrar a los peces dorados, pero eso no autoriza a abandonar al resto. Hay quien escribe un año después.", "h": "Mary preguntó el sábado 8 a las 21:13: «Y el cobro cuál es!! Yo sé q según lo q quiera uno pero para hacer Rubia…». Nadie le contestó. Gaby mandó 5 mensajes y cerró el 7/11 con un «Igualmente» y ahí quedó.", "p": "Son las únicas 2 de las 11 que no recibieron ni un mensaje tuyo, y las dos habían preguntado o escrito más de una vez. Con 11 leads en la semana, esas dos valen 18 puntos de tasa."}], "cierre": "Cinthya, tu problema no es el método: es la hora de llegada. El método ya está grabado, ya lo viste, y esta semana se probó en tu propia cuenta — la nota de voz que le mandaste a Ania y la pregunta que le hiciste a Margoth sostuvieron las dos conversaciones, mientras que la única que recibió una cifra pelada se fue. Mientras se siga entrando al chat tres días después de que la persona escribió, el número no se va a mover, por buena que sea la nota de voz. Y hay algo más: tus clientas de siempre te preguntan el precio y te lo aceptan, porque ya saben cómo te queda el color. Quien te vio en un anuncio el martes solo tiene una cifra y tres salones más abiertos en otra pestaña; la confianza se la tienes que dar tú antes del número.", "funciono": "La nota de voz que le mandaste a <b>Ania</b> el 6 de noviembre es el ejemplo de la semana. Ella preguntó «puedes más o menos decirme el precio para un cabello corto» — la pregunta más fácil de contestar mal — y en vez de escribir una cifra le mandaste tu voz. Esa conversación siguió. Cinco de tus once leads recibieron audio tuyo esta semana; eso es más alto que cualquier otra cuenta de la cartera y es la pieza que ya dominas.", "acciones": [{"t": "Contéstale a Mary hoy", "d": "Mary preguntó el precio el sábado a las 9 de la noche y todavía no tiene respuesta. Es la más caliente que te queda de la semana. No empieces por la cifra.", "g": "Hola Mary, soy Cinthya. Para decirte bien el costo necesito ver tu cabello, porque llevar a rubio depende mucho de cómo está ahora. Mándame una foto de cómo lo tienes hoy y otra de cómo te gustaría quedar, y te digo exactamente qué se puede hacer y cuánto."}, {"t": "Llega el lunes, no el jueves", "d": "El lunes, martes y miércoles no salió ningún mensaje tuyo. Con 11 leads a la semana, diez minutos cada mañana te alcanzan para tocar a todas. La persona que escribe el lunes y recibe tu voz el lunes es otra conversación."}, {"t": "La pregunta antes de la cifra, siempre", "d": "Lo hiciste con Ania y funcionó. Con Margoth diste el número primero y con Alejandra lo dio el bot. Que ninguna cifra salga de tu cuenta sin una pregunta tuya delante.", "g": "Con mucho gusto te doy toda la información, pero antes cuéntame: ¿qué te gustaría mejorar exactamente de tu cabello ahora mismo?"}], "pie": "Los números salen de tu cuenta de EpikFlow entre el lunes 2 y el domingo 8 de noviembre. Esta semana la muestra es chica — 11 leads — así que conviene leer los absolutos y no el porcentaje. Solo cuentan como tuyos los mensajes que salieron de tu teléfono o de tu equipo desde la plataforma, así que si algo quedó fuera es porque no pudimos verlo, nunca al revés."}</script><script src="/assets/a.js" defer></script></html>
