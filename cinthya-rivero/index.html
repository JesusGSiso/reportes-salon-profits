<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reporte de Gestión</title><link rel="stylesheet" href="/assets/s.css"><script type="application/json" id="d">{"slug": "cinthya-rivero", "nombre": "Cinthya Rivero", "estado": "listo", "rango": "Semana del 28 de septiembre al 4 de octubre de 2026", "rangoCorto": "28 sep–4 oct", "rangoAnt": "21–27 sep", "tasa": {"pct": 0, "num": 0, "den": 7, "botSola": 0, "ella": 0, "mutuo": 0, "leadSola": 0, "pctAnt": 13}, "historico": [{"etq": "14–20 sep", "tasa": 100}, {"etq": "28 sep–4 oct", "tasa": 0}], "intro": ["Esta semana entraron 7 leads de publicidad, así que te damos los números en absolutos: con 7 personas, una sola cita mueve la tasa trece puntos y no se puede leer como tendencia. Le escribiste a 5 de las 7 y a 5 les mandaste nota de voz. Las dos cifras están muy por encima de la meta, y la semana pasada fue igual: 14 de 15 tocadas y 13 notas de voz. Trabajo no te falta.", "Lo que falta es el último paso. De 7 leads, cero agendaron. Hiciste todo lo que enseña la clase — tocaste, mandaste audio, construiste la conversación — y después nadie pidió la hora. Eso es lo que separa tu trabajo de una cita en la agenda. <b>Todo lo demás en este reporte es consecuencia de eso.</b>"], "kpis": [{"k": "Leads de anuncio", "s": "Leads", "v": 7, "ant": 15, "t": "7", "at": "15"}, {"k": "Les escribiste antes", "s": "Escribiste", "v": 5, "ant": 14, "t": "5", "at": "14 de 15"}, {"k": "Con nota de voz", "s": "Voz", "v": 5, "ant": 13, "t": "5", "at": "13 de 15"}, {"k": "Agendaron", "s": "Agendaron", "v": 0, "ant": 2, "t": "0", "at": "2"}, {"k": "Les escribiste después", "s": "Después", "v": 0, "ant": 2, "t": "—", "at": "2 de 2"}, {"k": "Les mandaste la foto", "s": "Foto", "v": 0, "ant": 0, "t": "—", "at": "0 de 2"}], "barras": [{"label": "Leads a los que le escribiste", "num": 5, "den": 7, "meta": 60}, {"label": "Leads con nota de voz", "num": 5, "den": 7, "meta": 40}, {"label": "Citas a las que mandaste la foto", "num": 0, "den": 0, "meta": 60, "vacio": "Esta semana ninguna lead de publicidad agendó, así que esta barra no aplica."}], "origen": [], "origenNota": "Esta semana ninguna de las 7 leads de publicidad agendó, así que no hay citas que repartir. Tu agenda sí tuvo movimiento con clientas de siempre, pero de la pauta de esta semana no salió ninguna. La semana pasada, con 15 leads, salieron 2 y en una de ellas apareció tu trabajo.", "metodo": [{"c": "En la clase te enseñamos que nunca se responde únicamente con el precio, y que la respuesta siempre tiene que llevar una pregunta: \"claro que sí, con mucho gusto te doy toda la información, pero antes cuéntame, ¿qué te gustaría mejorar exactamente?\"", "h": "Johanna te escribió el 3 de octubre a las 13:45 una sola palabra: \"Precios\". Le respondiste: \"Estamos en Aurora Co.,\". No agendó.", "p": "Johanna preguntó el precio y recibió la ciudad. No es que le dieras una cifra de más: es que la respuesta no tenía nada que ver con lo que preguntó, y eso cierra la conversación igual de rápido. Era una lead nueva de ese mismo día."}, {"c": "En la clase te enseñamos el embudo de opciones para agendar. Nunca \"¿cuándo quieres venir?\" ni dejar la conversación abierta: tres pasos — ¿entre semana o fin de semana? → ¿mañana o tarde? → ¿a las 10 o a las 11?", "h": "Mandaste 22 mensajes y 5 notas de voz a 5 leads distintas entre el 1 y el 4 de octubre. Ninguna de esas conversaciones terminó con una propuesta de horario concreta, y ninguna agendó.", "p": "Ahí está el reporte completo. Hiciste la parte difícil — tocar a casi todas y hablarles con tu voz — y te detuviste justo antes de la parte fácil. Las 5 leads que trabajaste estaban más calientes que el promedio de la cartera y se enfriaron esperando que alguien les diera una hora."}, {"c": "En la clase te explicamos que las sardinas también compran, y que un \"más adelante\" no es un no: hay quien escribe un año después. Lo que no se puede  ya con lo que me contaste tengo claro qué te queda bien. Vamos a dejarlo agendado para que no se te pase: ¿te queda mejor entre semana o fin de semana? … Perfecto, ¿mañana o tarde? … Listo, ¿a las 10 o a las 11?"}, {"t": "Johanna: contéstale el precio como enseña la clase", "d": "Preguntó \"Precios\" y le mandaste la ciudad. Es una lead de hace dos días, todavía se recupera.", "g": "Johanna, perdón, te mandé la ubicación y no lo que me preguntaste. Los precios te los puedo dar, pero primero cuéntame: ¿cómo tienes el cabello ahora y qué resultado te gustaría lograr? Mándame una foto de cómo lo tienes y otra de lo que te gusta, y te digo exactamente qué necesitas y cuánto es. La evaluación y la prueba de mechón son gratis."}, {"t": "Deyanira: agéndala a futuro, no la sueltes", "d": "Dijo que le interesa más adelante, cuando le crezca el frente. Dale una fecha concreta en vez de dejarlo en el aire.", "g": "Deyanira, perfecto, me parece bien esperar a que te crezca un poco. Hagamos esto: te reservo la evaluación gratis para dentro de tres semanas y, si para entonces quieres moverla, la movemos sin problema. Así cuando estés lista ya tienes tu lugar. ¿Te sirve entre semana o fin de semana?"}], "pie": "Los números salen de tu cuenta de EpikFlow entre el lunes 28 de septiembre y el domingo 4 de octubre de 2026. Solo cuentan como tuyos los mensajes que salieron de tu teléfono o de tu equipo desde la plataforma, así que si algo quedó fuera es porque no pudimos verlo, nunca al revés."}</script><script src="/assets/a.js" defer></script></html>
