ión: preguntó el 24/10 «Bueno me gustaria saber mas o menos los precios», le respondieron desde $280 y se despidió con «Gracias». <b>Luppita</b> tuvo 15 mensajes y cerró con «Gracias igualmente». En ninguna de las dos apareciste tú.", "p": "Esas dos conversaciones eran las más avanzadas de la semana: 31 mensajes entre las dos. Las dos se fueron educadamente y ninguna agendó."}], "cierre": "Nada de esto es una opinión nuestra: está grabado en la clase de seguimiento diario y en la de nota de voz, y lo mejor es que esta vez no hace falta creernos a nosotros, porque la prueba está en tu propia cuenta hace siete días: 6 audios, 2 fotos, 40%. Y mientras el trabajo se amontone el sábado el número no va a volver a subir: tus clientas de siempre vuelven solas porque ya confían en ti, pero quien te vio en un anuncio no trae esa confianza, y hay que construírsela antes de que se despida con un «gracias».", "funciono": "Tu mejor caso no está en esta semana, está en la pasada, y por eso lo traigo: con <b>15 leads mandaste 6 notas de voz y 2 fotos, y agendaron 6</b>. Ese 40% fue el segundo número más alto de toda la cartera ese mes. No hay nada nuevo que aprender ni nada que ensayar: ya lo hiciste, en tu cuenta, con tus leads y con tu voz. Y esta semana demostraste además que el volumen lo tienes: el sábado solo mandaste 16 mensajes a leads. Falta repartirlos y volver a grabar los audios.", "acciones": [{"t": "Yannel y Silvia, antes de nada", "d": "Yannel dijo «si porfavor» el sábado por la noche y Silvia preguntó dónde estás el viernes. Son dos mensajes y están las dos a un paso de la cita.", "g": "Hola Yannel, soy Cinthya, perdona la demora del fin de semana. Te aparto la prueba de mechón gratis, que es sin compromiso y te deja ver el color antes de decidir. Estoy en 2260 Xanadu W, Suite 290, Aurora. ¿Te acomoda entre semana o el fin de semana?"}, {"t": "Vuelve a los 6 audios", "d": "La semana pasada mandaste 6 notas de voz a 15 leads y agendaron 6. Esta semana 3 de 21. Ponte
