<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reporte de Gestión</title><link rel="stylesheet" href="/assets/s.css"><script type="application/json" id="d">{"slug": "cinthya-rivero", "nombre": "Cinthya Rivero", "estado": "listo", "rango": "Semana del 5 al 11 de octubre de 2026", "rangoCorto": "5–11 oct", "rangoAnt": "28 sep–4 oct", "tasa": {"pct": 6, "num": 1, "den": 16, "botSola": 6, "ella": 0, "mutuo": 0, "leadSola": 0, "pctAnt": 0}, "historico": [{"etq": "14–20 sep", "tasa": 100}, {"etq": "28 sep–4 oct", "tasa": 0}, {"etq": "5–11 oct", "tasa": 6}], "intro": ["Empecemos por lo que hiciste bien, porque es mucho: de 16 personas que llegaron por publicidad le escribiste a <b>12</b> y mandaste <b>8 notas de voz</b>. Las dos cifras están por encima de la meta y son de las mejores de toda la cartera. Nadie va a decir que no trabajaste esta semana.", "Y aun así agendó 1 persona, y esa la cerró el bot sola. Las 12 conversaciones que trabajaste con tu voz no terminaron en cita. El caso que lo resume: Helena te escribió el lunes 5 a las 17:28 «<b>Quisiera agendar una cita</b>» y no recibió un solo mensaje tuyo en toda la semana. Lo que falta no es esfuerzo: es pedir el día y la hora. <b>Todo lo demás en este reporte es consecuencia de eso.</b>"], "kpis": [{"k": "Leads de anuncio", "s": "Leads", "v": 16, "ant": 7, "t": "16", "at": "7"}, {"k": "Les escribiste antes", "s": "Escribiste", "v": 12, "ant": 5, "t": "12", "at": "5 de 7"}, {"k": "Con nota de voz", "s": "Voz", "v": 8, "ant": 5, "t": "8", "at": "5 de 7"}, {"k": "Agendaron", "s": "Agendaron", "v": 1, "ant": 0, "t": "1", "at": "0"}, {"k": "Les escribiste después", "s": "Después", "v": 0, "ant": 0, "t": "0", "at": "—"}, {"k": "Les mandaste la foto", "s": "Foto", "v": 0, "ant": 0, "t": "0", "at": "—"}], "barras": [{"label": "Leads a los que le escribiste", "num": 12, "den": 16, "meta": 60}, {"label": "Leads con nota de voz", "num": 8, "den": 16, "meta": 40}, {"label": "Citas a las que mandaste la foto", "num": 0, "den": 1, "meta": 60, "vacio": "Esta semana no hubo citas, así que esta barra no aplica."}], "origen": [{"k": "El bot", "v": 1, "c": "#2F6F68"}], "origenNota": "La única cita de la semana la creó el bot, y también fue el bot el único que había hablado con esa persona antes. Con 8 notas de voz tuyas en la semana, que ninguna cita lleve tu huella significa algo muy concreto: tus conversaciones son buenas pero se quedan abiertas. El trabajo de confianza está hecho; falta el último paso.", "metodo": [{"c": "Vende el siguiente paso, no el procedimiento. Cuando alguien ya pidió el siguiente paso, lo único que falta es ponerle día y hora.", "h": "Helena escribió el 5/10 a las 17:28: «<b>Quisiera agendar una cita</b>». Es la frase más fácil de cerrar que existe. No recibió ningún mensaje tuyo en los seis días siguientes.", "p": "Esa es una cita regalada que se perdió. Y es todavía más caro porque esa semana sí estabas trabajando: el 6 de octubre mandaste 29 mensajes. Helena escribió el día anterior y se quedó fuera del barrido."}, {"c": "El embudo de opciones para agendar. Nunca «¿cuándo quieres venir?», porque invita al «yo te aviso». Tres pasos: ¿entre semana o fin de semana? → ¿mañana o tarde? → ¿a las 10 o a las 11?", "h": "12 conversaciones trabajadas a mano, 8 con tu voz, y <b>ninguna terminó en cita creada con tu participación</b>. Kate cambió 13 mensajes y cerró el 8/10 preguntando «This is partial yea?» sin respuesta tuya. Mithzy cambió 16 mensajes y terminó agendando con el bot, sin escucharte.", "p": "Kate estaba preguntando un detalle técnico del servicio: eso es alguien decidiendo. Mithzy habló 16 veces y la cerró un sistema. Las dos estaban listas; faltó que alguien dijera «te doy el martes a las 10 o el jueves a las 2»."}, {"c": "No respondas únicamente con el precio ni solo con la logística: devuelve la necesidad antes del dato. «Claro que sí, con mucho gusto te doy toda la información, pero antes cuéntame, ¿qué te gustaría mejorar exactamente?»", "h": "Tres personas preguntaron el precio. A Andrea el 11/10 y a Mateo el 6/10 les contestó el bot con «desde $280». A la tercera le contestaste tú el 6/10, pero solo con la dirección: «Nos ubicamos en Aurora… 2260 Xanadu w Suite 290», sin preguntarle qué quería lograr.", "p": "Fue tu oportunidad de entrar y la usaste para dar un dato. El dato no construye confianza; la pregunta sí. Esa conversación tampoco terminó en cita."}, {"c": "La rutina diaria: revisar todos los días las conversaciones de por lo menos los dos días anteriores.", "h": "Tus mensajes por día: lunes 9, martes 29, miércoles 11, <b>jueves 0</b>, viernes 3, sábado 4, domingo 4. El martes hiciste la mitad de la semana y a partir del jueves el ritmo cayó a 3 o 4 diarios.", "p": "Helena entró el lunes y se perdió; Kate quedó colgada el jueves, el día en blanco. Repartir esos 29 mensajes del martes en los días siguientes habría alcanzado a las dos."}], "cierre": "Lo que te falta es un paso y siempre el mismo: la clase te dio el molde del embudo de tres opciones, nunca la pregunta abierta, y es lo único que no está apareciendo en tus conversaciones. El método ya está grabado, ya lo viste, y esta semana se probó en tu propia cuenta: 12 conversaciones trabajadas con tu voz y ninguna cita, contra una cita cerrada por un sistema que sí pide el día. Mientras el cierre quede a criterio de la persona, el número se va a quedar en 6%. Tus clientas de siempre vuelven solas porque ya confían en ti; quien te vio en un anuncio no trae esa confianza y hay que llevarla de la mano hasta la hora exacta.", "funciono": "Las 8 notas de voz de 16 leads. Es el 50%, por encima de la meta del 40%, y de las mejores proporciones de toda la cartera esta semana. Estás poniendo tu voz delante de gente que no te conoce — que es lo más difícil del método y lo que casi nadie hace. Todo este reporte dice una sola cosa: ya tienes resuelto lo caro, te falta lo barato.", "acciones": [{"t": "Helena, hoy. Ya pidió la cita.", "d": "Escribió «Quisiera agendar una cita» el lunes pasado. Siete días después sigue sin respuesta tuya. Es la más fácil que tienes.", "g": "Hola Helena, soy Cinthya. Perdón la demora, te contesto yo directamente. Claro que sí, te aparto tu cita. ¿Te queda mejor entre semana o el fin de semana? Y si puedes, mándame una foto de cómo tienes el cabello ahora y otra de cómo te gustaría verlo."}, {"t": "Cambia el cierre de tus audios", "d": "Tus 8 notas de voz están bien hechas — lo que falta es cómo las terminas. Cada audio tuyo tiene que acabar con dos opciones concretas, no con una puerta abierta.", "g": "…y para que no se nos pase, te propongo algo concreto: ¿te queda mejor entre semana o el fin de semana? — y después: ¿mañana o tarde? — y después: ¿a las 10 o a las 2?"}, {"t": "Kate y Mithzy, para cerrar", "d": "Kate cambió 13 mensajes y preguntó un detalle del servicio; Mithzy cambió 16 y agendó con el bot sin oírte nunca. A Mithzy mándale la foto del lugar y confirma; a Kate, contéstale la duda y propón hora.", "g": "Hola [nombre], soy Cinthya. Te contesto yo. [respuesta a su duda]. Te dejo la foto del lugar — estamos en 2260 Xanadu W, Suite 290, segundo piso, en Aurora. ¿Te confirmo [día] a las [hora]?"}], "pie": "Los números salen de tu cuenta de EpikFlow entre el lunes 5 y el domingo 11 de octubre. Solo cuentan como tuyos los mensajes que salieron de tu teléfono o de tu equipo desde la plataforma, así que si algo quedó fuera es porque no pudimos verlo, nunca al revés."}</script><script src="/assets/a.js" defer></script></html>
