<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reporte de Gestión</title><link rel="stylesheet" href="/assets/s.css"><script type="application/json" id="d">{"slug": "yadix-hernandez", "nombre": "Yadix Hernandez", "estado": "listo", "rango": "Semana del 2 al 8 de noviembre de 2026", "rangoCorto": "2–8 nov", "rangoAnt": "26 oct–1 nov", "tasa": {"pct": 46, "num": 6, "den": 13, "botSola": 46, "ella": 0, "mutuo": 0, "leadSola": 0, "pctAnt": 16}, "historico": [{"etq": "2–8 nov", "tasa": 46}], "intro": ["Yadix, el número de arriba es el más alto de toda la cartera esta semana: <b>46%</b>. De 13 personas que llegaron por la pauta, 6 agendaron. Tu bot está funcionando mejor que ningún otro, y eso es una buena noticia de verdad.", "Y hay otro número que cuenta la otra mitad de la historia. En tu cuenta salieron <b>1.080 mensajes con tu firma</b> esta semana — trabajas muchísimo, eso está medido — pero <b>solo uno de esos 1.080 fue para un lead de publicidad</b>. A 12 de las 13 personas que llegaron por el anuncio no les escribiste nunca. No es que no trabajes: es que todo tu trabajo está puesto en las clientas que ya tienes, y la pauta vive y muere con el bot. <b>Todo lo demás en este reporte es consecuencia de eso.</b>"], "kpis": [{"k": "Leads de anuncio", "s": "Leads", "v": 13, "ant": 32, "t": "13", "at": "32"}, {"k": "Les escribiste antes", "s": "Escribiste", "v": 0, "ant": 18, "t": "0", "at": "18 de 32"}, {"k": "Con nota de voz", "s": "Voz", "v": 0, "ant": 7, "t": "0", "at": "7 de 32"}, {"k": "Agendaron", "s": "Agendaron", "v": 6, "ant": 5, "t": "6", "at": "5"}, {"k": "Les escribiste después", "s": "Después", "v": 1, "ant": 2, "t": "1", "at": "2 de 5"}, {"k": "Les mandaste la foto", "s": "Foto", "v": 0, "ant": 0, "t": "0", "at": "0 de 5"}], "barras": [{"label": "Leads a los que le escribiste", "num": 0, "den": 13, "meta": 60}, {"label": "Leads con nota de voz", "num": 0, "den": 13, "meta": 40}, {"label": "Citas a las que mandaste la foto", "num": 0, "den": 6, "meta": 60}], "origen": [{"k": "El bot", "v": 6, "c": "#2F6F68"}], "origenNota": "Las 6 citas las creó el bot, y en ninguna de las 6 conversaciones hubo un mensaje tuyo antes de la cita. Por eso el desglose marca «el bot sola 46%» y tú 0%: no es un reproche, es una descripción. Los 46 puntos son del sistema. Lo que puedas sumar tú esta semana va encima de eso, no en lugar de eso.", "metodo": [{"c": "En la clase te explicamos que la intención se dirige al lead de publicidad, que es el que no te conoce. La clienta de siempre ya trae la confianza hecha; la que te vio en un anuncio no.", "h": "1.080 mensajes salieron con tu firma esta semana. Uno solo fue a un lead de publicidad, el 5 de noviembre. Los otros 1.079 fueron a gente que ya era tu clienta.", "p": "Es el corte que explica tu reporte entero. El trabajo está hecho — y es mucho — pero está apuntado al grupo que ya iba a venir. Las 13 personas nuevas de esta semana nunca escucharon tu voz."}, {"c": "En la clase te enseñamos que el bot es apoyo y no reemplazo: responde rápido, inicia y filtra, pero la necesidad la interpretas tú y el cierre lo haces tú.", "h": "El bot mandó 120 mensajes a estos 13 leads y cerró 6 citas sin ti. Pero también dejó 7 conversaciones abiertas que nadie recogió: Yohanma mandó 18 mensajes y cerró con «Gracias ☺️ cuídate igual»; Delia mandó 15 y cerró con un «Si».", "p": "Yohanma y Delia son las dos conversaciones más largas de la semana y las dos acabaron sin cita. Eso es lo que el bot no sabe hacer y tú sí: leer que alguien que escribió 18 veces está interesada y no sabe cómo decidir."}, {"c": "En la clase te recordamos que las sardinas también compran, y que una objeción no es un no. La de distancia se contesta con el tiempo real de viaje y dos horarios concretos.", "h": "Zu escribió el 5/11: «Pensé que era más cerquita de mi». Carmen, el 7/11: «Déjame ver y te aviso pronto, gracias». Gloria, el 4/11: «No gracias, así está bien…». Ninguna de las tres recibió un mensaje tuyo.", "p": "Zu se fue por distancia, Carmen con el «te aviso» de manual, Gloria con un no cortés después de 5 mensajes. Con 13 leads en la semana, esas tres valen 23 puntos de tasa."}], "cierre": "Yadix, aquí no hay nada roto: tienes el mejor bot de la cartera y trabajas más que casi nadie. El método ya está grabado y tú ya lo viste, y lo que dice es exactamente esto: el bot filtra, tú cierras. Mientras los 1.080 mensajes sigan yendo a las clientas que ya te conocen y ninguno a las que acaban de verte en un anuncio, el 46% va a seguir siendo el techo de lo que el sistema puede hacer solo — y no vas a poder subirlo, porque no hay nada tuyo encima. La razón es la de siempre: a tu clienta de siempre le mandas un recordatorio y viene, porque ya sabe cómo le queda. Zu, que te vio en un anuncio el jueves, pensó que estabas más cerca y se fue; a ella no le faltaba información, le faltaba una razón, y esa solo la puedes dar tú.", "funciono": "Las 6 citas de la semana son reales y están en tu calendario: Maison, Kathy, Milu, Paola, Marimily e Ingrid, todas de gente que no te conocía hace una semana. Y el embudo del bot está impecable — a 🤍 le ofreció horarios concretos para el sábado 14 y cerró. Eso es la prueba de que el sistema que tienes montado funciona. Lo único que falta es tu voz encima de las que el bot no logra cerrar.", "acciones": [{"t": "Yohanma y Delia, hoy", "d": "18 y 15 mensajes respectivamente, las dos sin cita y las dos sin un mensaje tuyo. Son las conversaciones más calientes que perdiste esta semana.", "g": "Yohanma, soy Yadix 💜 Vi toda nuestra conversación y quería escribirte yo misma. Cuéntame una cosa: ¿lo que te detiene es el tiempo, la distancia o todavía no estás segura de si la papada se te puede trabajar? Dime con confianza y te oriento."}, {"t": "Una nota de voz a Zu por la distancia", "d": "Se fue diciendo que pensó que estabas más cerca. Es la objeción más fácil de resolver y la más difícil de resolver por texto.", "g": "Zu, soy Yadix. Sé que no quedo a la vuelta de tu casa, pero la evaluación son 15 minutos y es gratis, y así sales sabiendo exactamente qué se puede hacer con tu papada antes de gastar un peso. La mayoría de mis clientas viene de lejos la primera vez y después ya no les importa. ¿Te sirve un sábado?"}, {"t": "Uno de cada veinte mensajes, a la pauta", "d": "Mandaste 1.080 mensajes y uno fue a un lead nuevo. No hace falta trabajar más: con que cinco de esos mil vayan cada día a las personas que acaban de llegar por el anuncio, este reporte cambia de arriba abajo."}], "pie": "Los números salen de tu cuenta de EpikFlow entre el lunes 2 y el domingo 8 de noviembre. Esta semana entraron 13 leads, así que conviene leer los absolutos y no solo el porcentaje. Solo cuentan como tuyos los mensajes que salieron de tu teléfono o de tu equipo desde la plataforma, así que si algo quedó fuera es porque no pudimos verlo, nunca al revés."}</script><script src="/assets/a.js" defer></script></html>
