"den": 28, "meta": 60}, {"label": "Leads con nota de voz", "num": 4, "den": 28, "meta": 40}, {"label": "Citas a las que mandaste la foto", "num": 0, "den": 0, "meta": 60, "vacio": "Esta semana no hubo citas nuevas de leads de anuncio, así que esta barra no aplica."}], "origen": [], "origenNota": "Esta semana no se creó ninguna cita con leads de publicidad, así que no hay nada que repartir. La semana pasada fueron 3 y las tres las creó el bot. Dicho sin rodeos: en las 28 conversaciones que tú trabajaste a mano, ninguna llegó a una hora reservada, y eso es lo único que hay que arreglar, porque lo demás ya lo estás haciendo.", "metodo": [{"c": "Embudo de opciones para agendar. Nunca «¿cuándo quieres venir?» ni «¿desearías agendar?», porque invitan al «yo te aviso». Son tres pasos: ¿entre semana o fin de semana? → ¿mañana o tarde? → ¿a las 10 o a las 11?", "h": "A Yaydi, que te preguntó si su hijo de 21 podía hacerse el tratamiento, le respondiste <b>«si claro que tú puede hacerlo, tenemos muchos clientes adolescentes, desearías agendar una cita?»</b>. Ella contestó preguntando dónde estabas y tú dijiste <b>«En coral springs»</b>. Ahí terminó.", "p": "Yaydi estaba a un paso: ya sabía que sí se podía y solo quería saber dónde. Faltaron dos líneas con dos horarios. En 28 conversaciones no apareció ninguna propuesta concreta de día y hora, y el resultado fueron 0 citas."}, {"c": "No respondas únicamente con el precio, pero tampoco esquives la pregunta: «con mucho gusto te doy toda la información, pero antes cuéntame, ¿qué te gustaría mejorar exactamente?».", "h": "<b>Dorysmilan</b> escribió «me gustaría saber el precio de las limpiezas faciales» y tu respuesta fue <b>«Hola buenos días como estás?»</b>. A <b>Lr</b>, que preguntó «Ese precio es solo manos?», le dijiste «Si la promoción es builder gel».", "p": "En el primer caso la pregunta se quedó sin contestar y sin reemplazo; en el segundo contestaste el dato pero no ofreciste el siguiente paso. Las dos personas se quedaron esperando algo que no llegó."}, {"c": "Gestiona desde la computadora, no desde el teléfono. El teléfono apaga incendios; el seguimiento organizado se hace sentada, revisando los dos días anteriores y cerrando conversaciones.", "h": "<b>Los 71 mensajes de la semana salieron de tu teléfono</b>, ninguno desde la plataforma. Y se nota en el patrón: contestas rápido y a todo el mundo, pero las conversaciones se quedan en una o dos líneas y sin cierre.", "p": "Por eso llegas a las 28 personas y no cierras ninguna: desde el teléfono se responde, pero no se trabaja la conversación hasta la cita. Es el mismo esfuerzo con un resultado distinto."}], "cierre": "Tu problema no es trabajo: es el último paso de cada conversación. 28 de 28 leads tocados es el mejor número de gestión que vamos a ver esta semana en toda la cartera, y las 4 notas de voz son un cambio real respecto a la semana pasada. El método completo ya está grabado en el área de miembros y lo único que te falta es el embudo de opciones: dejar de preguntar si quiere una cita y empezar a preguntar cuál de los dos horarios le sirve. Tu clienta de siempre te escribe y se agenda sola porque ya confía; la que te vio en un anuncio necesita que tú le pongas la hora delante, y esta semana no se la pusiste a nadie. Y lo repetimos: una parte del cero no es tuya y la estamos revisando nosotros.", "funciono": "Dos cosas, y las dos son tuyas. Primero, <b>28 de 28</b>: no dejaste ni un lead sin respuesta, con mensajes todos los días de la semana (5, 4, 13, 18, 20, 5 y 6). Segundo, el mensaje con el que abres está bien construido: «La evaluación dura 30 minutos: reviso tu piel en persona, conversamos sobre tus hábitos y tratamientos previos y te preparo un plan escrito personalizado. Es gratis, sin compromiso ni depósito. ¿Qué te gustaría mejorar de tu piel?». Eso vende el siguiente paso y termina en pregunta: es exactamente el método. Y con Amelia hiciste el recordatorio de la cita el mismo día («Para recordarte tu cita hoy 12:30 pm»), que es justo lo que hay que hacer.", "acciones": [{"t": "Cambia una sola frase en tu mensaje", "d": "Donde hoy pones «¿desearías agendar una cita?», pon la elección. Es el cambio más pequeño del reporte y el que más vale.", "g": "Para que te revise la piel con calma, ¿te viene mejor entre semana o fin de semana? (y cuando contesten) Perfecto, ¿mañana o tarde? (y después) ¿A las 10 o a las 11?"}, {"t": "Yaydi y Dorysmilan, hoy", "d": "Yaydi solo preguntó dónde estabas; Dorysmilan preguntó un precio y no recibió respuesta. Las dos están a un mensaje.", "g": "Hola Yaydi, estamos en 7501 Wiles Rd, Coral Springs. Te aparto el espacio para tu hijo: ¿te viene mejor entre semana o fin de semana?"}, {"t": "Un rato al día desde la computadora", "d": "Esta semana todo salió del teléfono. Siéntate 20 minutos con la plataforma abierta y repasa las conversaciones de los dos días anteriores que quedaron sin cita.", "g": "Nota de voz para las que quedaron a medias: «Hola [nombre], soy Diana. Me quedé pensando en lo que me contaste de tu piel. Te aparté un espacio para la evaluación, que es gratis y sin compromiso: ¿te sirve mejor mañana o tarde?»"}], "pie": "Los números salen de tu cuenta de EpikFlow entre el lunes 26 de octubre y el domingo 1 de noviembre. Solo cuentan como tuyos los mensajes que salieron de tu teléfono o de tu equipo desde la plataforma, así que si algo quedó fuera es porque no pudimos verlo, nunca al revés."}</script><script src="/assets/a.js" defer></script></html>
