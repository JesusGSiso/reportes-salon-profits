 foto", "num": 0, "den": 20, "meta": 60}], "origen": [{"k": "El bot", "v": 19, "c": "#2F6F68"}, {"k": "Tú, desde el teléfono", "v": 1, "c": "#C0522F"}], "origenNota": "De las 20 personas que agendaron, 12 las cerró el bot solo, en 7 participaron los dos y 1 la agendaste tú. Que el bot cierre está bien: para eso está. Lo que hay que mirar es que en 12 de 20 tú no apareciste en la conversación antes de la cita — y las que el bot no logra cerrar solo son justamente las que necesitan que entres tú.", "metodo": [{"c": "«No respondas únicamente con el precio.» El molde es: “claro que sí, con mucho gusto te doy toda la información, pero antes cuéntame, ¿qué te gustaría mejorar exactamente?”", "h": "35 personas preguntaron por el precio esta semana. En las conversaciones que revisamos, la que contestó fue la máquina y contestó con la cifra: a Carolina, el 20/09 a las 12:11 («Cuánto Cuesta y domde están»), le llegó «Nuestros servicios de micropigmentación comienzan desde $450». Igual con Dunia, Myrna, Margarita y Milly. Solo en una entraste tú: Lidia, el 19/09.", "p": "Un precio suelto, sin saber qué quiere la persona, cierra la conversación en vez de abrirla. De esas 35, la mayoría no volvió a escribir."}, {"c": "«Revisa todos los días las conversaciones de por lo menos los dos días anteriores» y busca a quien preguntó y no agendó, a quien quedó a medias y a quien dejó de responder.", "h": "42 de los 109 leads no recibieron ni un mensaje tuyo. Le escribió «Dónde estás ubicada» el domingo 20 a las 21:03 y nadie le contestó; Flaca escribió «¡Hola! Quiero más información» a las 20:56; Teresita mandó 10 mensajes y terminó pidiendo «I need the address of the place… the day and the time».", "p": "Son 42 personas que pagamos para traerte y que se quedaron solo con la máquina."}, {"c": "A quien ya agendó hay que empujarla para que asista: un mensaje y una foto de un resultado real tuyo, para que llegue el día de la cita con la imagen en la cabeza.", "h": "A las 20 que agendaron les
