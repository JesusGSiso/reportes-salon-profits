<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reporte de Gestión</title><link rel="stylesheet" href="/assets/s.css"><script type="application/json" id="d">{"slug": "karla-bellorin", "nombre": "Karla Bellorin", "estado": "listo", "rango": "Semana del 26 de octubre al 1 de noviembre de 2026", "rangoCorto": "26 oct–1 nov", "rangoAnt": "19–25 oct", "tasa": {"pct": 15, "num": 16, "den": 110, "botSola": 12, "ella": 0, "mutuo": 3, "leadSola": 0, "pctAnt": 5}, "historico": [{"etq": "7–13 sep", "tasa": 13}, {"etq": "14–20 sep", "tasa": 18}, {"etq": "21–27 sep", "tasa": 24}, {"etq": "28 sep–4 oct", "tasa": 15}, {"etq": "5–11 oct", "tasa": 21}, {"etq": "12–18 oct", "tasa": 16}, {"etq": "19–25 oct", "tasa": 16}, {"etq": "26 oct–1 nov", "tasa": 15}], "intro": ["Esta semana trabajaste, y se ve: le escribiste a <b>47 de 110 leads</b> y mandaste <b>45 notas de voz</b>, más del triple que la semana pasada. Escribiste los siete días, sin un solo día en blanco. Eso no es poco y no lo vamos a tratar como si lo fuera.", "El problema es <b>dónde</b> cae ese trabajo. De las 16 personas que agendaron, tú estabas en la conversación en <b>3</b>; en las otras 13 agendaron hablando solo con el bot. Y <b>50 de los 110 leads</b> no recibieron ni un mensaje tuyo. Estás atendiendo lo que entra hoy y dejando ir lo que entró ayer. <b>Todo lo demás en este reporte es consecuencia de eso.</b>"], "kpis": [{"k": "Leads de anuncio", "s": "Leads", "v": 110, "ant": 88, "t": "110", "at": "88"}, {"k": "Les escribiste antes", "s": "Escribiste", "v": 47, "ant": 22, "t": "47", "at": "22 de 88"}, {"k": "Con nota de voz", "s": "Voz", "v": 45, "ant": 12, "t": "45", "at": "12 de 88"}, {"k": "Agendaron", "s": "Agendaron", "v": 16, "ant": 4, "t": "16", "at": "4"}, {"k": "Les escribiste después", "s": "Después", "v": 16, "ant": 4, "t": "16", "at": "4 de 4"}, {"k": "Les mandaste la foto", "s": "Foto", "v": 1, "ant": 0, "t": "1", "at": "0 de 4"}], "barras": [{"label": "Leads a los que le escribiste", "num": 47, "den": 110, "meta": 60}, {"label": "Leads con nota de voz", "num": 45, "den": 110, "meta": 40}, {"label": "Citas a las que mandaste la foto", "num": 1, "den": 16, "meta": 60, "vacio": "Esta semana no hubo citas, así que esta barra no aplica."}], "origen": [{"k": "El bot", "v": 16, "c": "#2F6F68"}], "origenNota": "Las 16 citas de la semana las creó el bot. Eso no es malo: el bot está para responder rápido y filtrar. Lo que dice el número es que en 13 de esas 16 conversaciones tú no apareciste antes de que se agendara la cita, y en las que sí apareciste (3) el resultado fue el mismo que buscábamos. El bot agenda en minutos; tú llegas después. Lo que el bot no puede hacer es lo que quedó sin hacer: recuperar a las 50 que no contestaron y empujar a las 16 que ya tienen cita para que lleguen.", "metodo": [{"c": "La rutina diaria es revisar las conversaciones de por lo menos los dos días anteriores, no solo las de hoy: quien dejó de responder, quien preguntó y no agendó, quien quedó a medias.", "h": "Escribiste los siete días (16, 16, 12, 17, 34, 40 y 9 mensajes), pero siempre sobre los que entraban ese día. <b>50 de los 110 leads no recibieron ni un mensaje tuyo</b>: Amarily preguntó «Donde se encuentran ustedes» y nadie volvió; Maripily escribió «Vibo en Cape Coral. Gracias» y ahí quedó.", "p": "Esas 50 personas pagadas con pauta se perdieron sin que nadie las trabajara. Si las hubieras tocado al mismo ritmo que a las otras 60, hablaríamos de 30 leads más gestionados sin trabajar ni una hora extra."}, {"c": "El bot es apoyo, no reemplazo: responde rápido, inicia y filtra, pero tú interpretas la necesidad y cierras.", "h": "<b>40 leads preguntaron por el precio</b> esta semana. En las que revisamos, el bot contestó siempre y tú en ninguna: Jackeline preguntó «Para las cejas, qué precio tiene?», el bot respondió bien (que el precio lo da la especialista en la consulta) y la conversación se quedó ahí.", "p": "El bot hizo su parte: no soltó el precio y empujó a la cita. Pero la que convierte una pregunta de precio en una cita es la que pregunta «¿qué te gustaría mejorar exactamente?». Jackeline cerró con «me comunicaré más adelante», que es el «yo te aviso» de siempre."}, {"c": "A la que ya agendó hay que empujarla para que asista: el mensaje y la foto antes de la cita.", "h": "De las <b>16 citas</b> de la semana, mandaste la foto en <b>1</b>. Mensaje después de agendar sí: a las 16.", "p": "Mandas el mensaje pero no el material que hace que la persona se vea en la silla. Es el paso más corto del reporte y el que está más vacío."}, {"c": "Las sardinas también compran: el bot ayuda a ver quién está más caliente, pero eso no autoriza a soltar al resto. Hay quien escribe un año después.", "h": "Virginia escribió cuatro veces, la última «Just in case how much for the permanent eyebrow». Suset mandó una foto. Nlove contó que ya se hizo el procedimiento hace dos años. Ninguna recibió un mensaje tuyo.", "p": "Son las tres que más señal dieron de la semana y las tres están frías. Una foto o un «ya me lo hice antes» es exactamente la puerta abierta que la clase te dice que no dejes pasar."}], "cierre": "Nada de esto es porque no trabajes: 45 notas de voz en una semana es más de lo que hace la mayoría. Es que el método completo ya está grabado en el área de miembros y esta semana se probó en tu propia cuenta: en las 3 citas donde tú entraste antes, entró; en las 50 que no tocaste, no pasó nada. Mientras sigas atendiendo solo lo del día, el número se va a quedar donde está, porque tus clientas de siempre llegan solas —ya confían en ti— y la que te vio en un anuncio no trae esa confianza: hay que construírsela, y eso no lo hace el bot.", "funciono": "Lo mejor de la semana son tus 45 notas de voz: pasaste de 12 a 45 y eso es trabajo real, de los que no se improvisan. Y funcionó donde lo usaste: en las 3 citas en las que estuviste en la conversación antes de que se agendara, se agendó. Además el bot te está dando el molde de respuesta perfecto para copiar: cuando Susan preguntó «¿Cuánto cuesta una consulta de cejas?», la respuesta fue «la consulta de cejas es gratuita y sin compromiso; en ella una especialista evalúa tus cejas…». Esa es la estructura: no sueltes el precio, vende el siguiente paso. Úsala tú y añádele la pregunta que el bot no hace.", "acciones": [{"t": "Los lunes y jueves, barre dos días atrás", "d": "Antes de contestar lo nuevo, abre las conversaciones de los dos días anteriores y busca a quien se quedó a medias. Esta semana eran 50 personas. Empieza por Virginia, Suset y Nlove, que son las que más señal dieron.", "g": "Hola Virginia, soy Karla del estudio. Vi que preguntaste por las cejas permanentes. Antes de darte precios, mándame una foto de cómo están tus cejas ahora y te digo qué se puede hacer en tu caso, ¿te parece?"}, {"t": "Cuando el bot ya contestó el precio, entra tú con una pregunta", "d": "Fueron 40 leads preguntando precio esta semana. No repitas la respuesta del bot: mete la pregunta que construye confianza y pide la foto.", "g": "Claro que sí, con mucho gusto te doy toda la información. Pero antes cuéntame: ¿qué te gustaría mejorar exactamente de tus cejas? Mándame una foto de cómo están ahora y una de cómo te gustaría verlas."}, {"t": "A las 16 que ya tienen cita, mándales la foto", "d": "Esta semana la mandaste en 1 de 16. Es un mensaje de treinta segundos y es lo que hace que la persona llegue en vez de olvidarse.", "g": "Mira cómo quedaron las cejas de una clienta con un caso parecido al tuyo [foto]. Te espero el {día} a las {hora}, ¿confirmas?"}], "pie": "Los números salen de tu cuenta de EpikFlow entre el lunes 26 de octubre y el domingo 1 de noviembre. Solo cuentan como tuyos los mensajes que salieron de tu teléfono o de tu equipo desde la plataforma, así que si algo quedó fuera es porque no pudimos verlo, nunca al revés."}</script><script src="/assets/a.js" defer></script></html>
