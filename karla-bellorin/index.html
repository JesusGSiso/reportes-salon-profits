<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reporte de Gestión</title><link rel="stylesheet" href="/assets/s.css"><script type="application/json" id="d">{"slug": "karla-bellorin", "nombre": "Karla Bellorin", "estado": "listo", "rango": "Semana del 28 de septiembre al 4 de octubre de 2026", "rangoCorto": "28 sep–4 oct", "rangoAnt": "21–27 sep", "tasa": {"pct": 15, "num": 13, "den": 84, "botSola": 8, "ella": 0, "mutuo": 7, "leadSola": 0, "pctAnt": 14}, "historico": [{"etq": "24–30 ago", "tasa": 20}, {"etq": "31 ago–6 sep", "tasa": 17}, {"etq": "7–13 sep", "tasa": 13}, {"etq": "14–20 sep", "tasa": 18}, {"etq": "21–27 sep", "tasa": 24}, {"etq": "28 sep–4 oct", "tasa": 15}], "intro": ["Esta semana le escribiste a 39 de tus 84 leads de publicidad, y a 38 de ellas les mandaste nota de voz. Eso es trabajo real y es el trabajo difícil: la nota de voz es lo que más cuesta y lo que mejor construye confianza, y la estuviste mandando los siete días de la semana, del lunes al domingo, sin fallar uno. Casi nadie en la cartera hace eso.", "El problema no es que no trabajes. Es dónde se corta tu trabajo: a las otras 45 leads no les llegó ni un mensaje tuyo, y las 37 que preguntaron el precio las atendió el bot con la frase de \"los precios los manejamos aquí durante la consulta\". Tu tasa de agendamiento quedó en 15%, y de las 13 que agendaron, en ninguna fuiste tú sola la que movió la conversación. <b>Todo lo demás en este reporte es consecuencia de eso.</b>"], "kpis": [{"k": "Leads de anuncio", "s": "Leads", "v": 84, "ant": 80, "t": "84", "at": "80"}, {"k": "Les escribiste antes", "s": "Escribiste", "v": 39, "ant": 46, "t": "39", "at": "46 de 80"}, {"k": "Con nota de voz", "s": "Voz", "v": 38, "ant": 36, "t": "38", "at": "36 de 80"}, {"k": "Agendaron", "s": "Agendaron", "v": 13, "ant": 11, "t": "13", "at": "11"}, {"k": "Les escribiste después", "s": "Después", "v": 11, "ant": 10, "t": "11", "at": "10 de 11"}, {"k": "Les mandaste la foto", "s": "Foto", "v": 0, "ant": 0, "t": "0", "at": "0 de 11"}], "barras": [{"label": "Leads a los que le escribiste", "num": 39, "den": 84, "meta": 60}, {"label": "Leads con nota de voz", "num": 38, "den": 84, "meta": 40}, {"label": "Citas a las que mandaste la foto", "num": 0, "den": 13, "meta": 60}], "origen": [{"k": "El bot", "v": 11, "c": "#2F6F68"}, {"k": "Tú, desde el teléfono", "v": 3, "c": "#C0522F"}], "origenNota": "De las 14 citas que se crearon con leads de publicidad, 11 las creó el bot y 3 las creaste tú. Pero mira el desglose de arriba, que es el que importa: en 6 de las 13 leads que agendaron hubo esfuerzo de las dos, y en 7 el bot lo hizo solo. En ninguna apareces tú sola. Eso significa que cuando entras, ayudas — pero entras en menos de la mitad de los casos, y el resto queda en manos del bot.", "metodo": [{"c": "En la clase de seguimiento te explicamos la rutina diaria: todos los días revisar las conversaciones de por lo menos los dos días anteriores, y buscar a quien dejó de responder, a quien preguntó y no agendó, a quien quedó a medias y a quien se le dieron horarios y no confirmó.", "h": "Escribiste los siete días, pero 45 de tus 84 leads no recibieron ni un mensaje tuyo. Solo del domingo 4 de octubre quedaron sin respuesta tuya Mari (\"Hello! Can I get more info on this?\", 23:22), Noemi (\"¡Hola! Quiero más información\", 23:04), Sara, Itala (\"Si por favor\", 20:22) y Regina (\"Y la dirección\", 15:49).", "p": "Tus 38 notas de voz se concentraron en las 39 leads que sí tocaste. Las otras 45 vivieron y murieron con el bot, y de ahí salen los 7 agendamientos donde el bot trabajó solo. La rutina no es escribir mucho un día: es que nadie se quede sin revisar."}, {"c": "En la clase te enseñamos que nunca se responde únicamente con el precio. El molde es: \"claro que sí, con mucho gusto te doy toda la información, pero antes cuéntame, ¿qué te gustaría mejorar exactamente?\" Primero la pregunta, después el número.", "h": "37 leads preguntaron precio esta semana. En todas las que revisamos respondió el bot con la misma frase de \"los precios los manejamos directamente aquí durante la consulta\": a Norma (\"Me podrías mandar los precios de tus servicios\", 04/10 15:21), a Yuly (\"Cuál es el precio del retoque con usted\", 04/10 17:32) y a Rossana (\"Cual es el precio\", 04/10 20:42).", "p": "Ninguna de las tres recibió la pregunta gancho, y ninguna agendó. Rossana cerró con \"Ok. Gracias. Te aviso 🥰\", que es la forma amable de decir que no. La pregunta del precio es la mejor oportunidad de la semana para abrir conversación, y se está yendo completa en una frase de cierre."}, {"c": "En la clase te explicamos que el bot es apoyo, no reemplazo: responde rápido, inicia y filtra, pero tú interpretas la necesidad y cierras. La confianza la construyes tú.", "h": "De las 13 leads que agendaron, en 6 hubo esfuerzo de las dos y en 7 el bot lo hizo solo. En cero fuiste tú sola la que movió la conversación hasta la cita.", "p": "Las 6 donde entraste subieron tu número; sin ellas tu tasa sería de 8% y no de 15%. El dato dice que cuando apareces, funciona. Lo que falta no es técnica, es cobertura."}, {"c": "Tu segundo trabajo, después de que agendan, es empujar a la que ya tiene cita para que asista: el mensaje de recordatorio y la foto del resultado, que es lo que le baja el miedo antes de venir.", "h": "A 11 de las 13 que agendaron les escribiste después, que es casi todas. Foto no le mandaste a ninguna: 0 de 13, igual que la semana pasada.", "p": "El mensaje solo confirma la hora; la foto es la que convence. Es la pieza más barata del reporte — ya tienes el trabajo hecho y las fotos en el teléfono — y es la única de tus seis números que llevas dos semanas en cero."}], "cierre": "No te estamos pidiendo que trabajes más: 133 mensajes y 38 notas de voz en siete días es más de lo que hace casi toda la cartera. Te estamos pidiendo que lo reparta. El método que estás aplicando bien con 39 leads es el mismo que no llegó a las otras 45, y esta semana se probó en tu propia cuenta: donde entraste, 6 de 6 sumaron a tu tasa; donde no entraste, quedó el bot y la mitad se fue sin responder. Y mientras el precio lo siga contestando el bot con una frase de cierre, el número no se va a mover: tus clientas de siempre llegan solas porque ya confían en ti, pero quien te vio en un anuncio está cotizando y comparando, y si lo primero que recibe es \"te lo digo en la consulta\", se va a la que sí le preguntó qué quería mejorar.", "funciono": "Tus notas de voz. 38 de las 39 leads que tocaste recibieron una, y eso es exactamente lo que enseña la clase: el audio con tu nombre, tu energía y la necesidad que ella te dijo es lo que convierte a una desconocida en alguien que confía. Esas 39 leads son también las que produjeron las 6 citas de esfuerzo mutuo, las únicas donde tu trabajo aparece en el dato. Mantén eso intacto: no hay nada que corregir ahí, solo falta que llegue a más gente.", "acciones": [{"t": "Las 10 del domingo que te escribieron y no tuvieron respuesta tuya", "d": "Mari, Aure, Noemi, Sara, Itala y Regina escribieron el 4 de octubre pidiendo información y solo les contestó el bot. Mándales hoy una nota de voz con la pregunta gancho. Son leads frescas de menos de 48 horas.", "g": "Hola [nombre], soy Karla. Vi que preguntaste por los diseños de cejas. Antes de darte toda la información quiero entender bien qué buscas: mándame una foto de cómo están tus cejas ahora y cuéntame qué es lo que más te gustaría cambiarles. Con eso te digo exactamente qué te queda mejor."}, {"t": "Cuando pregunten el precio, entra tú antes que el bot", "d": "37 leads preguntaron precio esta semana y a ninguna le llegó una pregunta tuya primero. Revisa dos veces al día quién preguntó precio y métete con el molde de la clase antes de que la conversación se cierre.", "g": "Claro que sí, con mucho gusto te doy toda la información. Pero antes cuéntame: ¿qué te gustaría mejorar exactamente? Así te digo el precio de lo que de verdad necesitas y no de algo que no te sirve."}, {"t": "La foto a las 13 que ya tienen cita", "d": "Llevas dos semanas en 0 de 13. Mándale a cada una una foto de un trabajo tuyo parecido a lo que ella pidió, el día antes de su cita. Es el empujón que hace que se presente.", "g": "[nombre], te comparto cómo quedó un trabajo parecido al que vamos a hacerte mañana, para que te vayas imaginando el resultado. ¿Te late que lo hagamos así o quieres que ajustemos algo?"}], "pie": "Los números salen de tu cuenta de EpikFlow entre el lunes 28 de septiembre y el domingo 4 de octubre de 2026. Solo cuentan como tuyos los mensajes que salieron de tu teléfono o de tu equipo desde la plataforma, así que si algo quedó fuera es porque no pudimos verlo, nunca al revés."}</script><script src="/assets/a.js" defer></script></html>
