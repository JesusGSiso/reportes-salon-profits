ant": 2, "t": "12", "at": "2 de 5"}, {"k": "Les mandaste la foto", "s": "Foto", "v": 1, "ant": 0, "t": "1", "at": "0 de 5"}], "barras": [{"label": "Leads a los que le escribiste", "num": 32, "den": 79, "meta": 60}, {"label": "Leads con nota de voz", "num": 24, "den": 79, "meta": 40}, {"label": "Citas a las que mandaste la foto", "num": 1, "den": 13, "meta": 60, "vacio": "Esta semana no hubo citas, así que esta barra no aplica."}], "origen": [{"k": "El bot", "v": 13, "c": "#2F6F68"}, {"k": "Tú, desde el teléfono", "v": 2, "c": "#C0522F"}], "origenNota": "Se crearon 15 citas con leads de anuncio: 13 las puso el bot y 2 se pusieron desde la plataforma. Pero lo que cuenta no es quién pulsó «agendar», sino quién participó antes: de las 13 personas que agendaron, 12 llegaron ahí solo con el bot. Eso no significa que tu trabajo no sirva —significa que está cayendo en las conversaciones que todavía no agendan.", "metodo": [{"c": "En la clase de seguimiento te explicamos que el bot es apoyo, no reemplazo: él responde rápido y filtra, pero cuando alguien pregunta el precio ya está levantando la mano, y ahí entras tú. El molde es «claro que sí, con mucho gusto te doy toda la información, pero antes cuéntame, ¿qué te gustaría mejorar exactamente?».", "h": "20 leads preguntaron precio esta semana. En todas las que revisamos respondió el bot, con la misma frase: a Wendy el 15/10 («Los precios los manejamos directamente aquí durante la consulta»), a Pilar el 17/10 la misma, a Yeimy el 18/10 la misma. Ninguna recibió tu pregunta de necesidad.", "p": "De las 13 que agendaron, 12 las cerró el bot sin que tú hubieras escrito antes. Tu tasa es 16% y 15 de esos puntos son del bot solo."}, {"c": "La rutina diaria: revisar las conversaciones de por lo menos los dos días anteriores, y buscar cuatro grupos — quien dejó de responder, quien preguntó y no agendó, quien quedó a medias, y a quien le diste horarios y no confirmó.", "h": "Lunes, martes y miércoles escribiste 23, 30 y 29 mensajes. De jueves a domingo: 10, 7, 6 y 5. Los del fin de semana quedaron sin revisar — Jazmin el 18/10 («¡Hola! Quiero más información»), Jazzy el 18/10 («Hello! Can I get more info on this?»), Fiorella el 18/10 («Si gracias  atienden domingos»).", "p": "36 de los 79 leads de la semana no recibieron ni un mensaje tuyo. Ahí quedaron las 7 personas que escribieron el domingo."}, {"c": "Las sardinas también compran. El bot ayuda a identificar a los peces dorados, pero eso no autoriza a abandonar al resto: hay quien escribe un año después.", "h": "Osmayda te mandó una foto de sus cejas el 18/10 y preguntó el precio ella misma («Nunca me las he hecho solo sacar con pinza, quisiera hacérmelas y saber el precio»). Nivia también mandó imagen el 18/10. Ninguna de las dos recibió un mensaje tuyo.", "p": "Una lead que ya manda foto es la que está más cerca de agendar, y es justo la que se quedó sola con el bot."}], "cierre": "Nada de esto es que trabajes poco: 24 notas de voz en una semana es más de lo que hace casi cualquiera. El método que falta aplicar ya está grabado en la clase de seguimiento, ya lo viste, y esta semana se probó solo en tu propia cuenta: la única lead que agendó contigo dentro fue la única a la que escribiste antes de que existiera la cita. Mientras el trabajo siga cayendo después de agendar y no antes, el número no se va a mover. Tus clientas de siempre llegan solas porque ya confían en ti; quien te vio en un anuncio no trae esa confianza y hay que construírsela antes, no después.", "funciono": "De las 13 personas que agendaron, le escribiste a 12 después de que la cita estuviera puesta. Eso es exactamente lo que enseña la clase para que la persona no se caiga, y lo estás haciendo casi perfecto — la semana pasada eran 2 de 5. Y escribiste los siete días de la semana, sin un solo día en blanco. Nota honesta: varias de las citas de esta semana son para los próximos días (hay citas puestas para el 20, 21, 23 y 24 de octubre), así que todavía no han ocurrido; eso no es un pendiente tuyo.", "acciones": [{"t": "Hoy, antes de abrir la agenda: los 36 que no tocaste", "d": "36 de los 79 leads de la semana no tienen ni un mensaje tuyo, y 7 de ellos escribieron el domingo. Empieza por esos 7.", "g": "Hola [nombre], soy Karla. Vi tu mensaje y te quiero atender yo misma. Para recomendarte bien, mándame una foto de cómo están tus cejas ahora."}, {"t": "Las 20 que preguntaron el precio", "d": "20 personas preguntaron precio esta semana y a todas les contestó el bot lo mismo. Esas 20 ya levantaron la mano: tómalas tú con la pregunta de necesidad antes de dar cualquier número.", "g": "Claro que sí, con mucho gusto te doy toda la información, pero antes cuéntame: ¿qué te gustaría mejorar exactamente de tus cejas?"}, {"t": "La foto a las que ya agendaron", "d": "Le escribiste a 12 de las 13 que agendaron, pero solo 1 recibió la foto del resultado. Mándala pegada al recordatorio: es lo que hace que no se caiga la cita."}], "pie": "Los números salen de tu cuenta de EpikFlow entre el lunes 12 y el domingo 18 de octubre de 2026. Solo cuentan como tuyos los mensajes que salieron de tu teléfono o de tu equipo desde la plataforma, así que si algo quedó fuera es porque no pudimos verlo, nunca al revés."}</script><script src="/assets/a.js" defer></script></html>
