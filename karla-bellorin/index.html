"s": "Foto", "v": 2, "ant": 0, "t": "2", "at": "0 de 5"}], "barras": [{"label": "Leads a los que le escribiste", "num": 45, "den": 97, "meta": 60}, {"label": "Leads con nota de voz", "num": 38, "den": 97, "meta": 40}, {"label": "Citas a las que mandaste la foto", "num": 2, "den": 20, "meta": 60, "vacio": "Esta semana no hubo citas, así que esta barra no aplica."}], "origen": [{"k": "El bot", "v": 17, "c": "#2F6F68"}, {"k": "Tú, desde el teléfono", "v": 5, "c": "#C0522F"}], "origenNota": "De las 22 citas que se crearon con leads de publicidad, 17 las creó el bot y 5 las creaste tú a mano. Pero quién crea la cita no es quién la gana: mirando quién habló con la persona <b>antes</b> de que hubiera cita, en 8 de las 20 el trabajo fue de los dos y en 12 el bot llegó solo. En ninguna apareces tú sola, y eso es información, no un reclamo: significa que cuando entras, entras después de que el bot ya abrió. El margen está en entrar antes.", "metodo": [{"c": "La rutina diaria: revisar todos los días las conversaciones de por lo menos los dos días anteriores, y buscar cuatro grupos — quien dejó de responder, quien preguntó y no agendó, quien quedó a medias, y a quien se le dieron horarios y no confirmó.", "h": "Abriste conversaciones los 7 días, eso está. Pero <b>42 de 97 leads cerraron la semana sin un mensaje tuyo</b>: Martha escribió «¡Hola! Quiero más información» el 11/10 a las 19:24, Brenda «Sí, me gustaría información por favor» el 11/10 a las 13:47, Iris «Hello! Can I get more info on this?» el 11/10 a las 12:53. Ninguna recibió nada tuyo.", "p": "No es que no revises: es que revisas lo de hoy y lo de ayer se queda atrás. Esas 42 personas son casi la mitad de lo que pagamos en publicidad esta semana, y se quedaron solo con lo que el bot alcanzó a decirles."}, {"c": "No respondas únicamente con el precio. El molde de la clase: «claro que sí, con mucho gusto te doy toda la información, pero antes cuéntame, ¿qué te gustaría mejorar exactamente?»", "h": "<b>29 leads preguntaron por el precio esta semana y a las 29 les respondió el bot, no tú.</b> Alexa preguntó «¿Cuánto cuesta una consulta de cejas?» el 11/10 a las 18:01; Lulu escribió «Precio por favor» el 11/10 a las 11:33; Daylin «Que precio tienen» el 10/10 a las 21:35. En las tres contestó el bot con la información general y ahí murió la conversación.", "p": "Preguntar el precio es la señal más clara de que alguien está interesada. El bot hace bien su parte —no suelta cifras—, pero no puede preguntarle a la persona qué quiere mejorar y conectar con eso. Esa es la pregunta que convierte, y es tuya."}, {"c": "Crea confianza antes de agendar con dos o tres preguntas, y usa la pregunta gancho ligada a lo que ella dijo. Para cejas y micropigmentación: pedirle una foto de cómo están sus cejas ahora.", "h": "Yluminada te dijo el 11/10 «Bien, ya se las cejas por ahora» y Gloria respondió «Si» a lo que el bot le preguntó. Ninguna de las dos recibió una pregunta tuya después. En toda la semana solo 2 de tus seguimientos fueron genéricos, así que el problema no es cómo escribes: es cuántas conversaciones quedan abiertas sin que nadie las cierre.", "p": "Las conversaciones que se quedan a medias no se enfrían por tu forma de escribir —escribes bien—, sino por el tiempo. Una respuesta de una palabra como el «Si» de Gloria es una puerta abierta que se cierra en 24 horas."}, {"c": "Después de que agenda, el trabajo no termina: hay que empujar a la que ya agendó para que asista, y mandarle la foto del lugar es lo que más baja los plantones.", "h": "De las 20 que agendaron, le escribiste a 16 — eso es muy bueno — pero <b>solo 2 recibieron la foto</b>.", "p": "Pasaste de 0 a 2 fotos, pero 18 personas van a llegar (o no llegar) a una dirección que nunca vieron. Es el gesto más corto del reporte y el que menos te cuesta."}], "cierre": "Nada de esto es una forma nueva de trabajar: es la clase de seguimiento diario que ya viste, aplicada a tu propia semana. Y la prueba de que funciona está en tu misma cuenta — pasaste de 5 agendadas a 20 justamente en la semana en que más le escribiste a la gente. El método ya está grabado y ya lo tienes. Lo que falta no es esfuerzo, es alcance: mientras 4 de cada 10 leads de publicidad no reciban nada tuyo, el número se va a quedar donde está. Tus clientas de siempre llegan solas porque ya confían en ti; quien te vio en un anuncio no trae esa confianza, y si nadie se la construye, se queda cotizando en otro lado.", "funciono": "Las 38 notas de voz. Esa es la jugada más fuerte de toda la cartera esta semana y es tuya: de los 45 leads a los que le escribiste, a 38 les mandaste audio. Ahí estás haciendo exactamente lo que enseña la clase — tu voz, tu energía, tu nombre — y es la razón más probable de que las agendadas se cuadruplicaran. No cambies eso. Lo único que hay que hacer es que le llegue a más gente.", "acciones": [{"t": "Mañana, antes de abrir, las 42 del fin de semana", "d": "Son 42 personas que llegaron esta semana y nadie tuyo les habló. Empieza por las 10 del sábado y domingo que ya tienen un mensaje suyo esperando: Martha, Brenda, Iris, Gloria, Yluminada. Una nota de voz de 20 segundos a cada una.", "g": "Hola [nombre], soy Karla. Vi tu mensaje y quería contestarte yo directamente. Cuéntame una cosa: ¿qué es lo que más te gustaría mejorar de tus cejas? Y si puedes, mándame una foto de cómo las tienes ahora, así te digo exactamente qué te queda mejor."}, {"t": "Las que preguntaron precio son tu lista caliente", "d": "29 esta semana. El bot ya les dio la información general; lo que falta eres tú con una pregunta. Empieza por Alexa, Lulu, Daylin y Monik.", "g": "Claro que sí, con mucho gusto te doy toda la información. Pero antes cuéntame, ¿qué te gustaría mejorar exactamente? Así te digo qué servicio te conviene y cuánto te sale a ti, no el precio general."}, {"t": "La foto, a las 18 que faltan", "d": "Le escribiste a 16 de las 20 que agendaron, pero solo 2 recibieron la foto del lugar. Mándala a todas las que tienen cita esta semana.", "g": "Te dejo una foto del lugar para que lo reconozcas al llegar 💛 Estamos en 4801 S University Drive, Suite 120, Davie. ¿Te confirmo tu cita de [día] a las [hora]?"}], "pie": "Los números salen de tu cuenta de EpikFlow entre el lunes 5 y el domingo 11 de octubre. Solo cuentan como tuyos los mensajes que salieron de tu teléfono o de tu equipo desde la plataforma, así que si algo quedó fuera es porque no pudimos verlo, nunca al revés."}</script><script src="/assets/a.js" defer></script></html>
