<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reporte de Gestión</title><link rel="stylesheet" href="/assets/s.css"><script type="application/json" id="d">{"slug": "karla-bellorin", "nombre": "Karla Bellorin", "estado": "listo", "rango": "Semana del 2 al 8 de noviembre de 2026", "rangoCorto": "2–8 nov", "rangoAnt": "26 oct–1 nov", "tasa": {"pct": 12, "num": 9, "den": 74, "botSola": 9, "ella": 0, "mutuo": 3, "leadSola": 0, "pctAnt": 5}, "historico": [{"etq": "14–20 sep", "tasa": 18}, {"etq": "21–27 sep", "tasa": 24}, {"etq": "28 sep–4 oct", "tasa": 15}, {"etq": "5–11 oct", "tasa": 21}, {"etq": "12–18 oct", "tasa": 16}, {"etq": "19–25 oct", "tasa": 16}, {"etq": "26 oct–1 nov", "tasa": 15}, {"etq": "2–8 nov", "tasa": 12}], "intro": ["Karla, esta semana trabajaste los siete días. Hubo mensajes tuyos a leads de publicidad el lunes, el martes, el miércoles, el jueves, el viernes, el sábado y el domingo, y mandaste <b>24 notas de voz</b> a 74 personas nuevas. Eso no es poco: de todas las cuentas que medimos, eres la que más usa la nota de voz, que es justo la herramienta que la clase de seguimiento pone en el centro. Y de las 9 que agendaron, les escribiste a las 9 después de agendar. Nada de esto está roto.", "Lo que pasó es otra cosa: <b>de las 74 personas que llegaron por la pauta, 39 no recibieron ni un mensaje tuyo</b>. Ni uno. Y entre esas 39 están las que estaban más cerca de entrar por la puerta: Patricia pidió la dirección el sábado, Perla la pidió también, Regla escribió «es la primera vez», Sandy preguntó cuánto cuesta una consulta de cejas. A todas las atendió el bot y ahí se quedaron. Tu trabajo es bueno; está repartido sobre la mitad de la cartera. <b>Todo lo demás en este reporte es consecuencia de eso.</b>"], "kpis": [{"k": "Leads de anuncio", "s": "Leads", "v": 74, "ant": 104, "t": "74", "at": "104"}, {"k": "Les escribiste antes", "s": "Escribiste", "v": 28, "ant": 52, "t": "28", "at": "52 de 104"}, {"k": "Con nota de voz", "s": "Voz", "v": 24, "ant": 44, "t": "24", "at": "44 de 104"}, {"k": "Agendaron", "s": "Agendaron", "v": 9, "ant": 5, "t": "9", "at": "5"}, {"k": "Les escribiste después", "s": "Después", "v": 9, "ant": 5, "t": "9", "at": "5 de 5"}, {"k": "Les mandaste la foto", "s": "Foto", "v": 0, "ant": 0, "t": "0", "at": "0 de 5"}], "barras": [{"label": "Leads a los que le escribiste", "num": 28, "den": 74, "meta": 60}, {"label": "Leads con nota de voz", "num": 24, "den": 74, "meta": 40}, {"label": "Citas a las que mandaste la foto", "num": 0, "den": 9, "meta": 60}], "origen": [{"k": "El bot", "v": 8, "c": "#2F6F68"}, {"k": "Tú, desde el teléfono", "v": 1, "c": "#C0522F"}], "origenNota": "De las 9 citas, 8 las creó el bot y 1 la creaste tú desde la página del calendario. En 2 de las 9 habías escrito tú antes de que existiera la cita: ahí el agendamiento es de los dos. En las otras 7 el bot trabajó solo. No es que el bot convierta mejor que tú: es que en 39 de 74 conversaciones el bot fue el único que habló.", "metodo": [{"c": "En la clase de seguimiento te explicamos la rutina diaria: revisar las conversaciones de por lo menos los dos días anteriores y buscar cuatro grupos — quien dejó de responder, quien preguntó y no agendó, quien quedó a medias, y a quien se le dieron horarios y no confirmó.", "h": "Escribiste los siete días, pero siempre hacia adelante: 39 de las 74 leads de la semana nunca recibieron un mensaje tuyo. Patricia escribió «La dirección please» el 8/11 a las 14:58 y nadie de carne y hueso le contestó; Regla escribió «Es la primera vez» el 8/11 a las 14:22, igual; Deunet mandó 7 mensajes y cerró con «Ok».", "p": "Esas tres estaban a un mensaje de agendar. Las tres se quedaron fuera de las 9 citas de la semana."}, {"c": "En la clase te enseñamos que no se responde únicamente con el precio: «claro que sí, con mucho gusto te doy toda la información, pero antes cuéntame, ¿qué te gustaría mejorar exactamente?». La pregunta primero, la cifra después.", "h": "21 leads preguntaron el precio esta semana. El bot las atendió a las 21 y lo hizo bien (consulta gratis + una pregunta de vuelta). Tú no entraste en ninguna. Sandy preguntó «¿Cuánto cuesta una consulta de cejas?» el 8/11 a las 17:47 y la conversación terminó con la respuesta del bot.", "p": "Las que preguntan precio son las más calientes de la semana, y ninguna de las 21 recibió una nota de voz tuya. Fue el grupo que menos trabajaste y el que más valía."}, {"c": "En la clase te enseñamos que el bot es apoyo y no reemplazo: responde rápido, inicia y filtra, pero la necesidad la interpretas tú y el cierre lo haces tú.", "h": "El bot mandó 351 mensajes a estas 74 leads; tú mandaste mensajes a 28 de ellas. En las 7 citas que salieron del bot solo, nunca hubo un mensaje tuyo antes de la cita.", "p": "El número que ves — 12% — es casi todo bot: 9 puntos de 12. Tu parte propia fue 0 y el esfuerzo de los dos juntos, 3 puntos."}, {"c": "En la clase te explicamos que después de que agenda hay un segundo trabajo: empujarla para que asista, y la foto del antes/referencia es lo que la sostiene.", "h": "Les escribiste a las 9 que agendaron — eso está perfecto. Pero ninguna de las 9 recibió la foto.", "p": "El mensaje solo recuerda la cita; la foto es lo que hace que la persona se imagine el resultado y no se arrepienta el día antes."}], "cierre": "Karla, esto no es un problema de ganas ni de método: tú ya aplicas el método. Las 24 notas de voz de esta semana lo demuestran, y están grabadas en tu propia cuenta como prueba de que sabes hacerlo. El problema es de alcance: estás haciendo un trabajo de primera sobre la mitad de la cartera, y la otra mitad — incluidas las 21 que preguntaron precio — vive y muere con el bot. Mientras siga así, el número no se va a mover, porque las que te buscan solas ya confían en ti: te conocen, te vieron, alguien se las recomendó. Quien te vio en un anuncio el martes no trae nada de eso, y esa confianza hay que construírsela una por una. El bot abre la puerta; tú eres la que hace entrar.", "funciono": "La semana pasada Dadila entró por la pauta el 25 de octubre. El bot la enganchó, agendó para el 7 de noviembre y <b>asistió</b>: quedó marcada como «showed». Rosanna Portes, que llegó el 29 de octubre, también agendó y ya pagó su retoque. Son las dos conversaciones donde el embudo funcionó entero — anuncio, bot, cita, silla — y las dos empezaron con una lead que no te conocía. Eso es exactamente lo que puede pasar 39 veces más si entras tú.", "acciones": [{"t": "Esta semana, tus notas de voz van para quien preguntó precio", "d": "21 personas preguntaron precio y las 21 las atendió solo el bot. Son las más calientes que tuviste. Mándale una nota de voz a cada una antes del miércoles, con el molde de la clase: su nombre, una validación, lo que ella dijo, la solución posible y una pregunta.", "g": "Hola Sandy, soy Karla. Vi que preguntaste por la consulta de cejas y te cuento que es gratis, sin compromiso. Pero antes de darte números, cuéntame: ¿qué te gustaría mejorar exactamente de tus cejas ahora mismo? Mándame una foto de cómo las tienes y te digo qué se puede hacer."}, {"t": "Diez minutos al día hacia atrás, no hacia adelante", "d": "Escribes todos los días, pero siempre a lo nuevo. Antes de abrir el chat del día, abre los dos días anteriores y busca a las que quedaron a medias. Esta semana había 39.", "g": "Patricia, te leí que pedías la dirección. Estamos en 4801 S University Drive, Suite 120, Davie. ¿Te sirve mejor entre semana o un sábado?"}, {"t": "La foto, a las 9 que ya agendaron", "d": "Ninguna de las 9 citas de esta semana recibió foto. Es el gesto más corto del reporte y el que más sostiene la asistencia: una foto de un trabajo tuyo parecido a lo que ella pidió, el día antes de la cita."}], "pie": "Los números salen de tu cuenta de EpikFlow entre el lunes 2 y el domingo 8 de noviembre. Solo cuentan como tuyos los mensajes que salieron de tu teléfono o de tu equipo desde la plataforma, así que si algo quedó fuera es porque no pudimos verlo, nunca al revés."}</script><script src="/assets/a.js" defer></script></html>
