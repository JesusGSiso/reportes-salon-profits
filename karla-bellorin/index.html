<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reporte de Gestión</title><link rel="stylesheet" href="/assets/s.css"><script type="application/json" id="d">{"slug": "karla-bellorin", "nombre": "Karla Bellorin", "estado": "listo", "rango": "Semana del 19 al 25 de octubre de 2026", "rangoCorto": "19–25 oct", "rangoAnt": "12–18 oct", "tasa": {"pct": 16, "num": 15, "den": 91, "botSola": 15, "ella": 0, "mutuo": 1, "leadSola": 0, "pctAnt": 9}, "historico": [{"etq": "31 ago–6 sep", "tasa": 17}, {"etq": "7–13 sep", "tasa": 13}, {"etq": "14–20 sep", "tasa": 18}, {"etq": "21–27 sep", "tasa": 24}, {"etq": "28 sep–4 oct", "tasa": 15}, {"etq": "5–11 oct", "tasa": 21}, {"etq": "12–18 oct", "tasa": 16}, {"etq": "19–25 oct", "tasa": 16}], "intro": ["Karla, esta semana escribiste <b>todos los días</b> de la semana: lunes, martes, miércoles, jueves, viernes, sábado y domingo. Eso no lo hace casi nadie en la cartera. Y de las 15 personas que agendaron, a <b>14 les escribiste después</b> de que la cita existía, que es exactamente lo que pedimos. Tu problema esta semana no es que no trabajes.", "El problema es a cuántas le llegó ese trabajo. Entraron <b>91 leads de anuncio</b> y 62 de ellos no recibieron ni un solo mensaje tuyo. Todo tu esfuerzo cayó sobre 16 personas. Las 15 citas que salieron las cerró el bot: en 14 no apareciste y en 1 participaste junto con él. <b>Todo lo demás en este reporte es consecuencia de eso.</b>"], "kpis": [{"k": "Leads de anuncio", "s": "Leads", "v": 91, "ant": 75, "t": "91", "at": "75"}, {"k": "Les escribiste antes", "s": "Escribiste", "v": 16, "ant": 34, "t": "16", "at": "34 de 75"}, {"k": "Con nota de voz", "s": "Voz", "v": 11, "ant": 25, "t": "11", "at": "25 de 75"}, {"k": "Agendaron", "s": "Agendaron", "v": 15, "ant": 7, "t": "15", "at": "7"}, {"k": "Les escribiste después", "s": "Después", "v": 14, "ant": 7, "t": "14", "at": "7 de 7"}, {"k": "Les mandaste la foto", "s": "Foto", "v": 1, "ant": 1, "t": "1", "at": "1 de 7"}], "barras": [{"label": "Leads a los que le escribiste", "num": 16, "den": 91, "meta": 60}, {"label": "Leads con nota de voz", "num": 11, "den": 91, "meta": 40}, {"label": "Citas a las que mandaste la foto", "num": 1, "den": 15, "meta": 60, "vacio": "Esta semana no hubo citas, así que esta barra no aplica."}], "origen": [{"k": "El bot", "v": 15, "c": "#2F6F68"}], "origenNota": "Las 15 citas de la semana las creó el bot. Ninguna salió de una conversación que hubieras llevado tú hasta el cierre. Eso no quiere decir que el bot sea mejor que tú vendiendo: quiere decir que a las 62 personas que no tocaste solo las atendió él, y de las que tú sí tocaste la mayoría no llegó a cita. Donde el bot llega bien es en la respuesta rápida; donde llegas tú es en la confianza, y esta semana esa parte no se usó.", "metodo": [{"c": "En la clase de seguimiento diario te explicamos revisar todos los días las conversaciones de por lo menos los dos días anteriores, y buscar cuatro grupos: quien dejó de responder, quien preguntó y no agendó, quien quedó a medias y a quien se le dieron horarios y no confirmó.", "h": "Escribiste los siete días, pero el reparto fue muy desigual: 26 mensajes el lunes, 20 el martes y luego 2 el sábado y 6 el domingo. 62 de los 91 leads no recibieron ni un mensaje tuyo. Zoraya escribió el 25/10 a las 22:49 «¡Hola! Quiero más información» y Gladis ese mismo día «Sí, me gustaría información por favor», y ninguna de las dos tuvo respuesta tuya.", "p": "El fin de semana es cuando más entra pauta y es cuando menos revisaste. Esas conversaciones quedaron solo en manos del bot."}, {"c": "En la clase te enseñamos no responder únicamente con el precio: «claro que sí, con mucho gusto te doy toda la información, pero antes cuéntame, ¿qué te gustaría mejorar exactamente?». La pregunta de precio es la puerta de entrada.", "h": "29 leads preguntaron el precio esta semana. A los 29 les respondió el bot y a ninguno le respondiste tú. Ismael preguntó el 25/10 a las 19:12 «cuál es el precio» y contestó el bot; Maria el 22/10 a las 19:04 «Estoy interesada en las cejas quería saber el precio y si ubicación», también el bot.", "p": "29 puertas abiertas y le dejaste las 29 al bot. Es el momento exacto en que la lead está dispuesta a hablar, y es el momento en el que tú no apareciste."}, {"c": "En la clase de nota de voz te explicamos que el audio con tus cinco elementos —su nombre, una validación, la necesidad que ella te dijo, una solución posible y una pregunta para continuar— es lo que construye la confianza que un lead de publicidad no trae.", "h": "La semana pasada mandaste 25 notas de voz a 75 leads. Esta semana mandaste 11 a 91 leads.", "p": "Entraron 16 leads más y mandaste 14 audios menos. Justo la semana con más oportunidades fue la semana con menos voz tuya."}, {"c": "En la clase te explicamos que la intención se dirige al lead de publicidad, porque es el que no te conoce. La clienta de siempre ya trae la confianza hecha y llega sola.", "h": "Esta semana se agendaron 46 citas de contactos que no vienen de la pauta, contra 15 de leads de anuncio. Además entraron 20 contactos tuyos propios, que tampoco vienen del anuncio.", "p": "Tu agenda se llena, pero se llena de quien ya te conocía. La pauta te está trayendo gente nueva y esa gente se queda esperando."}], "cierre": "Nada de esto es nuevo ni es una opinión: está grabado en el área de miembros, lo viste en la clase de seguimiento diario y en la de nota de voz, y esta semana se probó en tu propia cuenta. Los días que escribiste más, se movió; el fin de semana que casi no revisaste, no se movió nada. Y mientras se siga trabajando a tu manera el número no va a cambiar, porque tus clientas de siempre llegan solas —ya confían en ti— y quien te vio en un anuncio no trae esa confianza: hay que construírsela, y eso no lo puede hacer el bot por ti.", "funciono": "Lo que hiciste bien esta semana está en el otro extremo del embudo: de las 15 personas que agendaron, a <b>14 les escribiste después</b> de que la cita existía. Eso es 14 de 15, y es el número más alto que has tenido. Cuando una lead ya tiene cita, tú la empujas. Mandaste además 11 notas de voz, que no es poco. El trabajo existe y funciona; lo que falta es moverlo unos pasos hacia atrás, a la conversación que todavía no tiene cita. Como referencia de cómo suena bien hecho, mira lo que le respondió el bot a Marlenis el 22/10 cuando preguntó precio: «Entiendo que quieras tener una idea antes de venir…» y siguió con una pregunta en vez de con una cifra. Ese es el molde, y dicho con tu voz y tu audio pesa mucho más que dicho por el bot.", "acciones": [{"t": "Empieza por las 62 que nadie tocó", "d": "Hay 62 leads de esta semana sin un solo mensaje tuyo. No las tomes todas: toma las 10 del viernes, sábado y domingo, que son las más frescas, y mándales una nota de voz con la pregunta gancho.", "g": "Hola [nombre], soy Karla. Vi que preguntaste por las cejas y te quiero ayudar bien, no mandarte un precio y ya. Mándame una foto de cómo están tus cejas ahora y te digo exactamente qué te haría falta. ¿Te las has hecho antes o sería tu primera vez?"}, {"t": "Las 29 que preguntaron precio son tuyas, no del bot", "d": "29 personas preguntaron el precio y a las 29 les contestó el bot. Esta semana entra tú a esas conversaciones: cuando veas la pregunta de precio, responde tú antes de que pasen dos horas.", "g": "Claro que sí, con mucho gusto te doy toda la información. Pero antes cuéntame, ¿qué te gustaría mejorar exactamente? Según cómo lo tengas ahora te puedo decir si necesitas el procedimiento completo o solo un retoque, y así no te doy un precio que no es el tuyo."}, {"t": "La foto: 1 de 15", "d": "De las 15 que agendaron, a 14 les escribiste pero solo a 1 le mandaste la foto del resultado. Es el paso más barato de todos y el que más levanta la asistencia. Mándasela a las que tengan cita esta semana."}], "pie": "Los números salen de tu cuenta de EpikFlow entre el lunes 19 y el domingo 25 de octubre. Solo cuentan como tuyos los mensajes que salieron de tu teléfono o de tu equipo desde la plataforma, así que si algo quedó fuera es porque no pudimos verlo, nunca al revés."}</script><script src="/assets/a.js" defer></script></html>
