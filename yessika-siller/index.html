abel": "Leads a los que le escribiste", "num": 10, "den": 27, "meta": 60}, {"label": "Leads con nota de voz", "num": 2, "den": 27, "meta": 40}, {"label": "Citas a las que mandaste la foto", "num": 2, "den": 10, "meta": 60}], "origen": [{"k": "El bot", "v": 5, "c": "#2F6F68"}, {"k": "Tú, desde el teléfono", "v": 5, "c": "#C0522F"}], "origenNota": "De las 10 citas de leads de publicidad, 5 las creó el bot y 5 las creaste tú — mitad y mitad, y eso es poco común. En participación: 3 fueron solo tuyas, 2 de esfuerzo de las dos y 5 del bot solo. Una nota sobre la comparación con la semana pasada: en tu cuenta no hay mensajes salientes registrados antes del 30 de septiembre, así que las cifras de gestión de la semana del 21 al 27 no se pueden leer. Lo estamos revisando por nuestro lado. La tasa sí es comparable, porque se calcula con las citas, y esas están completas.", "metodo": [{"c": "En la clase de seguimiento te dijimos: nada de \"hola, ¿sigues interesada?\". No da ninguna razón para responder y la lead sabe que es un mensaje de lista. En su lugar va la pregunta gancho, ligada a algo que ella misma dijo.", "h": "A Senona le escribiste el 1 de octubre a las 19:46: \"Hola cómo estás sigues interesada en una evaluación tengo citas la Próxima Semana\". A Erika: \"gracias por su consulta el dia de hoy. quedo atenta a tu cita para empezar tu tratamiento\".", "p": "Ninguna de las dos respondió ni agendó. El de Senona es literalmente el ejemplo que usamos en clase de lo que no funciona, y el de Erika deja la pelota en su cancha — \"quedo atenta\" significa que la próxima jugada le toca a ella, y nunca llega. Son dos mensajes y los dos se podían reescribir en treinta segundos."}, {"c": "En la clase te enseñamos la nota de voz con cinco elementos: tu nombre, una validación, la necesidad que la lead expresó, una solución posible y una pregunta para continuar. Con energía, y nunca la misma para dos personas.", "h": "Mandaste 2 notas de voz en 27 leads. 81 mensajes tuyos salieron el 1 y el 2 de octubre, casi todos de texto.", "p": "En estética facial la nota de voz es lo que convierte un precio en un diagnóstico: la lead te cuenta su piel y oye a una profesional respondiéndole a ella. Tienes el volumen de trabajo — 81 mensajes en dos días — y le estás poniendo la herramienta más débil. Dos de esas 27 lo recibieron; las otras 25, texto."}, {"c": "En la clase de seguimiento te explicamos la rutina diaria: todos los días revisar las conversaciones de por lo menos los dos días anteriores, y buscar a quien dejó de responder, a quien preguntó y no agendó y a quien quedó a medias.", "h": "12 de 27 leads no recibieron mensaje tuyo. Amy escribió 11 mensajes y el 4 de octubre a las 21:34 dejó: \"Si porfavor lo que pasa que el sábado mi cuñada tiene compromiso nose si tengo como alas 3\". Raul escribió ese mismo día \"Hola, quiero la evaluación para mi piel por favor\". Tus mensajes se concentraron el 1 y el 2 de octubre: el sábado 3 mandaste 4 y el domingo 4 ninguno.", "p": "Amy está negociando la hora sola. Raul pidió exactamente lo que vendes, gratis, y nadie le contestó. El fin de semana es cuando más entra y es justo cuando tu cuenta se apagó."}], "cierre": "Tu reporte es distinto al del resto porque tu problema no es que el bot te esté reemplazando — eres la única esta semana que cerró citas sola. Tu problema es la cobertura y la herramienta: llegas a 10 de 27 personas, y a las que llegas les mandas texto en vez de audio. El método ya está grabado y ya lo viste en la clase de seguimiento, y esta semana se probó en tu propia cuenta: las 3 citas que cerraste tú salieron de conversaciones donde entraste con intención, y los dos \"¿sigues interesada?\" no produjeron nada. Mientras se siga trabajando así el número se va a quedar donde está — tus clientas de siempre llegan solas porque ya confían en ti, pero quien te vio en un anuncio y recibió un mensaje de lista no tiene ninguna razón para contestarlo.", "funciono": "Las 3 citas que cerraste sola. En toda la cartera de esta semana no hay otra clienta con una sola cita enteramente propia, y tú tienes tres. Eso significa que cuando entras en una conversación con intención, cierras — no es un problema de técnica ni de carisma. Y rompiste el cero de la foto: a 2 de las 10 que agendaron les mandaste imagen del resultado antes de la cita, y a 6 de 10 les escribiste después de agendar. Esa parte la tienes.", "acciones": [{"t": "Amy y Raul, hoy", "d": "Amy escribió 11 veces y está tratando de encajar el sábado a las 3; Raul pidió la evaluación de piel el domingo. Los dos son del fin de semana y los dos están esperando.", "g": "Hola Amy, soy Yessika. Perfecto, las 3 del sábado te la guardo. Antes cuéntame una cosa para preparar tu evaluación: ¿qué es lo que más te gustaría mejorar de tu piel ahora mismo? Mándame una foto si puedes, con luz natural y sin maquillaje."}, {"t": "Cambia los dos mensajes de lista por la pregunta gancho", "d": "Senona y Erika recibieron \"sigues interesada\" y \"quedo atenta\". Reescríbelos hoy con la pregunta gancho de estética facial y mándalos de nuevo.", "g": "Senona, soy Yessika. Te escribo porque me quedé pensando en lo que me contaste. Dime una cosa: ¿qué es lo que más te gustaría mejorar de tu piel — las manchas, la textura, el acné? Con eso te digo si lo tuyo se resuelve en una sesión o necesita un plan, y la evaluación sigue siendo gratis."}, {"t": "Cinco notas de voz esta semana", "d": "Mandaste 2 en 27 leads. No te pedimos 27: te pedimos 5, a las cinco leads que más han escrito. Tú ya sabes cerrar — el audio es lo que hace que te dejen cerrar.", "g": "Hola [nombre], soy Yessika. Me cuentas que llevas tiempo con [lo que ella dijo]. Eso lo veo muy seguido y casi siempre tiene solución, pero depende de cómo esté tu piel ahora. ¿Te parece si te veo en la evaluación, que es gratis y son 30 minutos, y te digo exactamente qué necesitas? ¿Entre semana o fin de semana te queda mejor?"}], "pie": "Los números salen de tu cuenta de EpikFlow en
