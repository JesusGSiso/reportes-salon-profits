oto", "num": 8, "den": 17, "meta": 60}], "origen": [{"k": "El bot", "v": 13, "c": "#2F6F68"}, {"k": "Tú, desde el teléfono", "v": 5, "c": "#C0522F"}], "origenNota": "De las 17 personas que agendaron, en 7 participaste tú antes de la cita y 10 las cerró el bot solo. Cinco de las 18 citas las creaste tú misma. Ojo con una lectura que suele confundir: que el bot cierre muchas no quiere decir que tu gestión no sirva — tú estás tocando también a las difíciles, y aun así tu tasa total es la más alta de la cartera.", "metodo": [{"c": "A quien ya agendó hay que sostenerla hasta el día de la cita: un mensaje tuyo y una foto de un resultado real, para que llegue con la imagen en la cabeza.", "h": "14 de las 17 recibieron tu mensaje, pero tres no: Lau, que habló 15 mensajes y te mandó una foto el 19/09; Amalia, que cerró con «Sí por favor» el 19/09; y Mildred, que respondió «12» el 20/09 confirmando una hora.", "p": "Son las tres que más lejos llegaron en la conversación, y son justo las que quedaron sin confirmación tuya."}, {"c": "«Revisa todos los días las conversaciones de por lo menos los dos días anteriores» y busca a quien preguntó y no agendó, y a quien quedó a medias.", "h": "Juany escribió el 15/09 a la 1:18 de la madrugada: «Hola, quiero la evaluación para mi piel por favor». Un solo mensaje, pidiendo exactamente lo que vendes, y no recibió respuesta tuya. No agendó.", "p": "Esa es la lead más barata de la semana: ya había dicho que sí."}, {"c": "La foto antes de la cita no es un extra: es lo que sostiene la decisión entre el día que agenda y el día que viene.", "h": "Pasaste de 2 fotos de 10 citas a 8 de 17. Casi la mitad. La meta que nos pusimos es 60%.", "p": "Vas en la dirección correcta y te faltan tres fotos por semana para llegar. Es el único número tuyo que todavía no está donde queremos."}], "cierre": "Este reporte es distinto a los demás porque tu número es el mejor de la cartera y no hay nada grande que corregir. El método de la clase de seguimiento lo es
