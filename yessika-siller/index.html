<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reporte de Gestión</title><link rel="stylesheet" href="/assets/s.css"><script type="application/json" id="d">{"slug": "yessika-siller", "nombre": "Yessika Siller", "estado": "listo", "rango": "Semana del 24 al 30 de agosto de 2026", "rangoCorto": "24–30 ago", "rangoAnt": "17–23 ago", "tasa": {"pct": 47, "num": 29, "den": 62, "botSola": 36, "ella": 0, "mutuo": 11, "leadSola": 0, "pctAnt": 38}, "historico": [{"etq": "24–30 ago", "tasa": 47}], "intro": ["Tu semana fue buena: entraron <b>62 leads</b> de publicidad —casi el doble que la semana pasada— y agendaron <b>29</b>. Tu tasa subió de 38% a <b>47%</b>. Y hay dos cosas tuyas que mejoraron muchísimo: le escribiste a 18 de las 29 que agendaron (antes 7) y le mandaste la foto a <b>9</b> (antes a ninguna). Escribiste todos los días, sin faltar uno.", "Pero mira dónde está cayendo tu trabajo. De las 29 citas, el bot cerró <b>22 él solo</b>, sin que tú aparecieras en la conversación. Tú participaste en 7. Y a <b>25 de los 62 leads</b> no les llegó ni un mensaje tuyo en toda la semana. No es que no trabajes —mandaste más de 150 mensajes a leads de anuncio— es que casi todo tu esfuerzo entra <i>después</i> de que la cita ya existe, y muy poco antes, que es donde se decide si hay cita. <b>Todo lo demás en este reporte es consecuencia de eso.</b>"], "kpis": [{"k": "Leads de anuncio", "s": "Leads", "v": 62, "ant": 32, "t": "62", "at": "32"}, {"k": "Les escribiste antes", "s": "Escribiste", "v": 22, "ant": 18, "t": "22", "at": "18 de 32"}, {"k": "Con nota de voz", "s": "Voz", "v": 3, "ant": 2, "t": "3", "at": "2 de 32"}, {"k": "Agendaron", "s": "Agendaron", "v": 29, "ant": 12, "t": "29", "at": "12"}, {"k": "Les escribiste después", "s": "Después", "v": 18, "ant": 7, "t": "18", "at": "7 de 12"}, {"k": "Les mandaste la foto", "s": "Foto", "v": 9, "ant": 0, "t": "9", "at": "0 de 12"}], "barras": [{"label": "Leads a los que le escribiste", "num": 22, "den": 62, "meta": 60}, {"label": "Leads con nota de voz", "num": 3, "den": 62, "meta": 40}, {"label": "Citas a las que mandaste la foto", "num": 9, "den": 29, "meta": 60, "vacio": "Esta semana no hubo citas, así que esta barra no aplica."}], "origen": [{"k": "El bot", "v": 26, "c": "#2F6F68"}, {"k": "Tú, desde el teléfono", "v": 10, "c": "#C0522F"}], "origenNota": "De tus 29 leads que agendaron salieron 36 citas. El bot creó 26 y tú creaste 10 desde tu teléfono o la plataforma. Pero ojo con la diferencia entre <b>crear</b> la cita y <b>ganársela</b>: arriba verás que el bot cerró él solo el 36% de tus leads y que tu columna está en 0%. Eso quiere decir que en ninguna de las 29 conversaciones que terminaron en cita fuiste tú sola la que la construyó. En 7 estuvieron los dos. En 22 el bot llevó la conversación completo. Varias de esas citas todavía no ocurren: no son un pendiente tuyo, están en calendario.", "metodo": [{"c": "«El bot es apoyo, no reemplazo.» Él responde rápido, inicia y filtra; tú interpretas lo que la persona necesita y cierras. La confianza la construyes tú.", "h": "13 leads preguntaron precio esta semana. <b>Once los contestó el bot y solo dos las contestaste tú.</b> Mariela (30/08, «Y Los Precios o Los tienes por Paquete»), Laurai (30/08), Cecy (29/08) y An (30/08) recibieron todas la misma respuesta automática de «desde $220».", "p": "El bot cerró 22 citas él solo. Funciona, pero te deja fuera del momento donde la persona decide, y por eso tu columna de «tú» quedó en 0%."}, {"c": "«Rutina diaria: revisa las conversaciones de por lo menos los dos días anteriores», y busca a quien preguntó y no agendó o quedó a medias. Las sardinas también compran.", "h": "<b>25 de los 62 leads no recibieron ni un mensaje tuyo.</b> Cuatro de ellas escribieron exactamente la frase del anuncio —«Hola, quiero la evaluación para mi piel por favor»— el 29 y el 30 de agosto: Jessica, Carolina, Jacky y Lupita. Ninguna volvió a saber de ti. Y Angie te dijo el 30/08 «Sii. Solo que no estoy en casa.. pero si la envío en cuanto esté en casa»: quedó a medias y ahí se quedó.", "p": "Ninguna de esas cinco agendó. Son las más fáciles de toda la semana: escribieron pidiendo justo lo que vendes."}, {"c": "«Nada de <i>hola, ¿sigues interesada?</i>»: no le da a la persona ninguna razón para responderte. En su lugar va la pregunta gancho, pegada a lo que ella misma dijo.", "h": "El 26/08 a las 14:10 le escribiste a Mauricia: «Mauricia sigues interesada en tu evaluacion gratis».", "p": "No respondió. Es el único seguimiento genérico de la semana, así que esto no es un vicio tuyo —pero es el molde exacto que no funciona, y es el que aparece cuando hay que reactivar a alguien con prisa."}, {"c": "«Crea confianza antes de agendar»: dos o tres preguntas —qué te gustaría mejorar, cómo lo tienes ahora, te lo has hecho antes— y la nota de voz con tu nombre, la validación, su necesidad, una solución y una pregunta.", "h": "3 notas de voz en 62 leads.", "p": "Es la palanca más barata que tienes sin tocar. Una compañera pasó de 1 a 25 notas de voz en una semana y su número de citas pasó de 0 a 10."}], "cierre": "El método ya está grabado y tú ya lo viste; esta semana quedó probado dentro de tu propia cuenta, en las dos conversaciones donde sí lo aplicaste. Mientras el trabajo tuyo siga entrando después de la cita y no antes, tu número va a seguir siendo el número del bot y no el tuyo: puede sostener el 47%, pero no lo sube. Tus clientas de siempre llegan solas porque ya confían en ti; quien te vio en un anuncio no trae esa confianza y hay que construírsela en los primeros dos mensajes, justo cuando pregunta el precio.", "funciono": "Tus dos respuestas de precio, que son de manual. A Brenda (28/08, «Mas o menos precio») le contestaste: «Tengo muy variado dependiendo el tipo de facial y además mis faciales son personalizados…», y a Magdalena (27/08, «Cual es el precio del facial»): «Pues tengo varios, tendría que
