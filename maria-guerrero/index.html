que ella expresó, una solución posible y una pregunta para continuar.", "h": "Cero notas de voz esta semana. La semana pasada mandaste 3 — a 3 de los 23 leads — y de esa semana salieron 7 citas, 2 de ellas cerradas por ti sola.", "p": "No es coincidencia: las semanas en que mandas audios son las semanas en que apareces tú en las citas. Con 5 personas al mes, 5 audios de 30 segundos es todo el trabajo que hay que hacer."}], "cierre": "Esto no es un reporte sobre si trabajas: tu agenda estuvo llena toda la semana y tu equipo mandó cientos de mensajes. Es sobre a quién. Las clientas que ya tienes vuelven solas porque ya confían en ti, y por eso llenan los días; quien te vio en un anuncio no trae esa confianza y, si nadie le escribe primero, no vuelve a aparecer. El método ya está grabado y ya lo viste, y la prueba de que funciona está en tu propia cuenta hace siete días: 3 audios, 7 citas, 2 cerradas por ti sola. Lo que falta no es técnica, es acordarse de los cinco nombres nuevos cada semana.", "funciono": "La semana pasada, y vale la pena subrayarlo: de 7 citas de publicidad, <b>2 las cerraste tú sola, sin el bot</b>, y en una más el trabajo fue compartido. Casi ninguna clienta de la cartera tiene una cita «ella sola» — tú tienes dos. Cuando entras en la conversación, cierras sin ayuda. Esa es tu palanca.", "acciones": [{"t": "Los 5 nombres, hoy", "d": "Rosa, Morelia, Andre, Leslie y Elenita dejaron su número en el anuncio y nadie les ha escrito. Mándales un audio corto a cada una.", "g": "Hola [nombre], soy Maria Gabriela, de Davenport. Vi que dejaste tus datos porque te interesaba cuidar tu piel y quería escribirte yo misma. Cuéntame una cosa: ¿qué es lo que más te gustaría mejorar ahora mismo? Con eso te digo si el análisis de piel te sirve — es gratis y dura 30 minutos."}, {"t": "Cinco minutos cada mañana", "d": "Con 5 leads a la semana, revisar quién entró ayer y escribirle toma menos que un café. Es literalmente la diferencia entre 0% y 30%.", "g": ""}, {"t": "
