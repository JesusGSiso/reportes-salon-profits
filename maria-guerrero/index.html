r ti en la cuenta y solo 6 fueron a leads de anuncio. Se agendaron 13 citas de contactos que no vienen de la pauta y 3 de los 9 leads nuevos. Además entraron 13 contactos tuyos propios.", "p": "No es que no trabajes: trabajas más que casi nadie en la cartera. Es que de esos 1.183 mensajes, 1.177 fueron a personas que ya iban a volver de todos modos."}, {"c": "En la clase te explicamos que después de que la cita existe tu trabajo no termina: hay que empujar a la que ya agendó para que asista, con un mensaje y con la foto del resultado.", "h": "Las 3 personas que agendaron esta semana —Jennifer, Kate y Astrid— no recibieron ningún mensaje tuyo después de que la cita quedó puesta. Jennifer agendó el sábado a las 19:01 diciendo «A las 1 y 30 esta bien» y Kate ese mismo día eligiendo horario de la lista que le dio el bot.", "p": "Son 3 personas y 3 mensajes. Es el paso más corto del método y es el único que puede subir la asistencia de alguien que te conoció por un anuncio hace dos días."}], "cierre": "Nada de esto es una opinión nuestra: está grabado en la clase de seguimiento diario y en la de nota de voz, y esta semana quedó probado en tu propia cuenta. Astrid agendó porque tú entraste; Vanesita, que ya había dicho «estaría bien para el lunes», no agendó porque nadie entró. Y mientras los 1.183 mensajes vayan a quien ya te conoce, el número de la pauta no se va a mover: tus clientas de siempre vuelven solas porque ya confían en ti, pero quien te vio en un anuncio está comparando. A esa hay que construirle la confianza, y con 6 mensajes a la semana no alcanza.", "funciono": "<b>Astrid</b> es tu caso de la semana. Llegó por un anuncio de Instagram el viernes, y el domingo 25 le pusiste la cita a mano desde el teléfono para el sábado 31 a las 11. Esa cita no la creó el bot: la creaste tú. Y mandaste 2 notas de voz a 9 leads, que proporcionalmente es más de lo que hace la mitad de la cartera. Lo que haces funciona cuando lo haces; el problema es el volumen, no la calidad.", "acciones": [{"t": "Vanesita y Maye, hoy mismo", "d": "Vanesita ya dijo que el lunes le venía bien y Maye pidió agendar la evaluación. Las dos están esperando que alguien les dé una hora.", "g": "Hola Vanesita, soy Maria. Vi que me dijiste que el lunes te venía bien y te quiero apartar el espacio. La evaluación es gratis, presencial y dura 30 minutos, sin abono. Tengo el lunes a las 11 o a las 2: ¿cuál te queda mejor?"}, {"t": "Un mensaje a Jennifer, Kate y Astrid", "d": "Las tres tienen cita y ninguna ha recibido nada tuyo desde que agendaron. Un mensaje tuyo y una foto de un resultado de la zona que quieren aclarar: son 3 mensajes y bajan los no-show."}, {"t": "Reparte el trabajo que ya haces", "d": "De 1.183 mensajes, 6 fueron a la pauta. No te pido trabajar más: te pido 15 minutos al día dentro de todo lo que ya haces, dedicados solo a los leads nuevos. Con 9 leads a la semana, eso son 2 por día."}], "pie": "Los números salen de tu cuenta de EpikFlow entre el lunes 19 y el domingo 25 de octubre. Entraron 9 leads de anuncio, así que la muestra es chica y los porcentajes se mueven mucho con una sola persona. Solo cuentan como tuyos los mensajes que salieron de tu teléfono o de tu equipo desde la plataforma, así que si algo quedó fuera es porque no pudimos verlo, nunca al revés."}</script><script src="/assets/a.js" defer></script></html>
