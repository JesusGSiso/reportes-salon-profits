<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reporte de Gestión</title><link rel="stylesheet" href="/assets/s.css"><script type="application/json" id="d">{"slug": "maria-guerrero", "nombre": "Maria Guerrero", "estado": "listo", "rango": "Semana del 26 de octubre al 1 de noviembre de 2026", "rangoCorto": "26 oct–1 nov", "rangoAnt": "19–25 oct", "tasa": {"pct": 38, "num": 3, "den": 8, "botSola": 13, "ella": 13, "mutuo": 12, "leadSola": 0, "pctAnt": 22}, "historico": [{"etq": "7–13 sep", "tasa": 42}, {"etq": "14–20 sep", "tasa": 18}, {"etq": "21–27 sep", "tasa": 40}, {"etq": "28 sep–4 oct", "tasa": 30}, {"etq": "5–11 oct", "tasa": 0}, {"etq": "19–25 oct", "tasa": 33}, {"etq": "26 oct–1 nov", "tasa": 38}], "intro": ["Semana buena: <b>3 de 8 leads agendaron</b>, un 38% contra el 22% de la semana pasada, y en <b>2 de esas 3 citas estabas tú</b> en la conversación antes de que se agendara. Con solo 8 leads la muestra es muy chica —una cita más o menos mueve el porcentaje doce puntos—, así que mira los números absolutos y no el porcentaje.", "Y aun siendo una semana buena, hay una frase en tus conversaciones que duele leer: <b>Abbs te escribió «Qué día y hora?» el 29 de octubre y nadie le contestó</b>. Alguien pidiendo una hora es lo más cerca que vas a tener de una cita hecha. De los 8 leads, <b>4 no recibieron ningún mensaje tuyo</b>, y tres de esos cuatro ya habían preguntado algo concreto. <b>Todo lo demás en este reporte es consecuencia de eso.</b>"], "kpis": [{"k": "Leads de anuncio", "s": "Leads", "v": 8, "ant": 9, "t": "8", "at": "9"}, {"k": "Les escribiste antes", "s": "Escribiste", "v": 3, "ant": 2, "t": "3", "at": "2 de 9"}, {"k": "Con nota de voz", "s": "Voz", "v": 3, "ant": 2, "t": "3", "at": "2 de 9"}, {"k": "Agendaron", "s": "Agendaron", "v": 3, "ant": 2, "t": "3", "at": "2"}, {"k": "Les escribiste después", "s": "Después", "v": 3, "ant": 0, "t": "3", "at": "0 de 2"}, {"k": "Les lo preguntaron dónde estás. Son tres mensajes de dos líneas.", "g": "Yin09, tranquila, varias clientas vienen de lejos y les armo todo en un solo viaje para que no tengas que volver dos veces. Estamos en 131 Champions Vue Loop, Davenport. ¿Qué día de la semana te queda mejor para organizarte?"}, {"t": "La foto a las 3 que ya tienen cita", "d": "Fue 0 de 3. Un antes y después de un caso parecido, el día antes de la cita.", "g": "Mira el antes y después de una clienta con un caso muy parecido al tuyo [foto]. Te espero el {día} a las {hora}, ¿confirmas?"}], "pie": "Los números salen de tu cuenta de EpikFlow entre el lunes 26 de octubre y el domingo 1 de noviembre. Solo cuentan como tuyos los mensajes que salieron de tu teléfono o de tu equipo desde la plataforma, así que si algo quedó fuera es porque no pudimos verlo, nunca al revés."}</script><script src="/assets/a.js" defer></script></html>
