<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reporte de Gestión</title><link rel="stylesheet" href="/assets/s.css"><script type="application/json" id="d">{"slug": "maria-guerrero", "nombre": "Maria Guerrero", "estado": "listo", "rango": "Semana del 28 de septiembre al 4 de octubre de 2026", "rangoCorto": "28 sep–4 oct", "rangoAnt": "21–27 sep", "tasa": {"pct": 30, "num": 7, "den": 23, "botSola": 4, "ella": 0, "mutuo": 26, "leadSola": 0, "pctAnt": 40}, "historico": [{"etq": "24–30 ago", "tasa": 12}, {"etq": "31 ago–6 sep", "tasa": 36}, {"etq": "7–13 sep", "tasa": 42}, {"etq": "14–20 sep", "tasa": 18}, {"etq": "21–27 sep", "tasa": 40}, {"etq": "28 sep–4 oct", "tasa": 30}], "intro": ["Tu tasa bajó de 40% a 30% y aun así esta es la mejor semana de trabajo de toda la cartera. Te explicamos por qué, porque el titular engaña. La semana pasada hiciste 10 citas y en 8 de ellas el bot trabajó solo: tú apareciste en 2. Esta semana hiciste 7 citas y en 6 apareces tú. Le escribiste a 17 de tus 23 leads y mandaste 16 notas de voz, contra 11 y 10 la semana pasada.", "Dicho de otro modo: el 26% de tus leads agendó con tu trabajo dentro de la conversación. Ninguna otra clienta de la cartera llegó al 15% esta semana. Lo que bajó fue el total; lo que subió fue la parte que es tuya, y la parte que es tuya es la que construye clientas que vuelven. Lo que te falta son seis conversaciones. <b>Todo lo demás en este reporte es consecuencia de eso.</b>"], "kpis": [{"k": "Leads de anuncio", "s": "Leads", "v": 23, "ant": 25, "t": "23", "at": "25"}, {"k": "Les escribiste antes", "s": "Escribiste", "v": 17, "ant": 11, "t": "17", "at": "11 de 25"}, {"k": "Con nota de voz", "s": "Voz", "v": 16, "ant": 10, "t": "16", "at": "10 de 25"}, {"k": "Agendaron", "s": "Agendaron", "v": 7, "ant": 10, "t": "7", "at": "10"}, {"k": "Les escribiste después", "s": "Después", "v": 4, "ant": 3, "t": "4", "at": "3 de 10"}, {"k": "Les mandaste la foto", "s": "Foto", "v": 1, "ant": 1, "t": "1", "at": "1 de 10"}], "barras": [{"label": "Leads a los que le escribiste", "num": 17, "den": 23, "meta": 60}, {"label": "Leads con nota de voz", "num": 16, "den": 23, "meta": 40}, {"label": "Citas a las que mandaste la foto", "num": 1, "den": 7, "meta": 60}], "origen": [{"k": "El bot", "v": 4, "c": "#2F6F68"}, {"k": "Tú, desde el teléfono", "v": 3, "c": "#C0522F"}], "origenNota": "De las 7 citas de leads de publicidad, 4 las creó el bot y 3 las creaste tú. Pero el dato que importa está arriba: en 6 de las 7 hubo esfuerzo de las dos y solo en 1 el bot trabajó solo. La semana pasada era al revés — 8 del bot solo y 2 compartidas. Es la misma cuenta, el mismo bot y la misma pauta: lo que cambió es que esta semana entraste tú en casi todas las conversaciones.", "metodo": [{"c": "En la clase de seguimiento te explicamos la rutina diaria: todos los días revisar las conversaciones de por lo menos los dos días anteriores, y buscar a quien dejó de responder, a quien preguntó y no agendó y a quien quedó a medias.", "h": "6 de 23 leads no recibieron mensaje tuyo, y dos de esas seis escribieron textualmente \"Hola, Quiero agendar una evaluación de las zonas que deseo aclarar\": Mafe el 3 de octubre a las 18:54 y Daniela el 4 a las 22:01. Tus mensajes empezaron el miércoles 30: el lunes 28 y el martes 29 no salió ninguno.", "p": "Mafe y Daniela no pedían información: pedían agendar, con esas palabras. Son las dos citas más fáciles de la semana y están ahí sin tocar. Con tu nivel de trabajo, seis leads sin tocar es lo único que te separa de volver al 40% — y esta vez sería un 40% tuyo."}, {"c": "En la clase te enseñamos el embudo de opciones para agendar: nunca dejar la pelota en su cancha, sino tres pasos — ¿entre semana o fin de semana? → ¿mañana o tarde? → ¿a las 10 o a las 11?", "h": "Liliana contestó el 3 de octubre \"No. Seria primera vez\" y ahí se detuvo la conversación. Otra lead respondió \"Primera vez\" el 2 de octubre y también se quedó ahí. Las dos estaban contestando una pregunta y esperando la siguiente.", "p": "Cuando alguien dice \"es primera vez\" está pidiendo que la guíes. Ese es el momento del embudo de tres pasos, y en las dos conversaciones el siguiente mensaje nunca llegó. Dos personas que ya habían dicho que sí a empezar."}, {"c": "Tu segundo trabajo, después de que agendan, es empujar a la que ya tiene cita para que asista: el mensaje de recordatorio y la foto de un resultado parecido, que es lo que le baja el miedo antes de venir.", "h": "De las 7 que agendaron, a 4 les escribiste después y a 1 le mandaste foto. Alicia escribió 9 mensajes, agendó, y no recibió nada tuyo ni antes ni después.", "p": "En despigmentación la foto del antes y después es la prueba que la lead no se atreve a pedir. Tu número de foto lleva dos semanas en 1, y es la única de tus seis cifras que no se mueve mientras las otras cinco van hacia arriba."}], "cierre": "No hay nada que corregir en tu método esta semana: lo estás aplicando mejor que nadie en la cartera. 17 de 23 leads tocadas, 16 notas de voz, el precio contestado con tu voz en vez de con una cifra. El método ya está grabado, ya lo viste en la clase de seguimiento, y esta semana se probó en tu propia cuenta de la forma más limpia posible — la semana pasada 8 de 10 citas eran del bot y esta semana 6 de 7 son tuyas. Lo único que falta es que nadie se quede fuera: Mafe y Daniela pidieron cita por escrito y no la tuvieron. Tus clientas de siempre llegan solas porque ya confían en ti; estas dos escribieron pidiendo exactamente lo que vendes y se van a quedar con quien les contestó.", "funciono": "Dos cosas y las dos son de manual. Primero: el 3 de octubre Aurora preguntó \"Y cual es el precio?\" y le contestaste con una nota de voz. El 4 de octubre Maxi preguntó \"Son muy costoso?\" y también le contestaste con audio. Eso es exactamente lo que enseña la clase — nunca el precio solo, y mejor aún con tu voz. Segundo: 16 notas de voz en 23 leads, el 70%, cuando la meta es 40%. Y tus dos barras de trabajo están por encima de la meta, las únicas de la cartera que lo están las dos al mismo tiempo. Las 6 citas de esfuerzo mutuo salieron de ahí.", "acciones": [{"t": "Mafe y Daniela: hoy, antes que nada", "d": "Las dos escribieron pidiendo agendar la evaluación de aclaramiento y ninguna tuvo respuesta tuya. Daniela escribió anoche. Mándales una nota de voz con el embudo de hora.", "g": "Hola Daniela, soy María. Claro que sí, te agendo la evaluación — es gratis, son 45 minutos y es solo nosotras dos, no hay sala de espera ni nadie más. Cuéntame qué zonas quieres aclarar para ir preparada. Y dime: ¿te queda mejor entre semana o fin de semana?"}, {"t": "Liliana y la de \"primera vez\": dales el tercer paso", "d": "Las dos dijeron que es su primera vez y la conversación se detuvo ahí. Les falta el embudo.", "g": "Perfecto, que sea tu primera vez es lo más común — por eso la evaluación es gratis, para que veas la zona conmigo antes de decidir nada. ¿Te queda mejor entre semana o fin de semana? … ¿Mañana o tarde? … ¿A las 10 o a las 11?"}, {"t": "La foto a las 7 que ya agendaron", "d": "Llevas dos semanas en 1 de cada 10. Mándale a cada una un antes y después de una zona parecida a la suya, el día antes de su cita. Con todo lo demás que ya haces bien, esto es lo único que te queda.", "g": "[nombre], te mando un antes y después de una zona parecida a la tuya para que veas qué tan real es el cambio. El tuyo lo vamos a medir en la evaluación, pero esto es lo que se puede lograr. ¿Nos vemos mañana a las [hora]?"}], "pie": "Los números salen de tu cuenta de EpikFlow entre el lunes 28 de septiembre y el domingo 4 de octubre de 2026. Solo cuentan como tuyos los mensajes que salieron de tu teléfono o de tu equipo desde la plataforma, así que si algo quedó fuera es porque no pudimos verlo, nunca al revés."}</script><script src="/assets/a.js" defer></script></html>
