<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reporte de Gestión</title><link rel="stylesheet" href="/assets/s.css"><script type="application/json" id="d">{"slug": "maria-guerrero", "nombre": "Maria Guerrero", "estado": "listo", "rango": "Semana del 31 de agosto al 6 de septiembre de 2026", "rangoCorto": "31 ago–6 sep", "rangoAnt": "24–30 ago", "tasa": {"pct": 36, "num": 13, "den": 36, "botSola": 25, "ella": 0, "mutuo": 11, "leadSola": 0, "pctAnt": 12}, "historico": [{"etq": "24–30 ago", "tasa": 12}, {"etq": "31 ago–6 sep", "tasa": 36}], "intro": ["María, esta semana entraron <b>36 personas por la publicidad</b> y agendaron <b>13</b>. La semana pasada, con 25 leads, habían agendado 3. Pasaste de 12% a 36%: es la mejor tasa de toda la cartera y la mayor subida de la semana.", "Ahora, mira de dónde salió: de esos 36 puntos, <b>25 los hizo el bot solo</b> y 11 son citas donde tú participaste. Y hay un detalle que explica el resto: el sábado 6 de septiembre escribiste <b>un solo mensaje</b>, y ese día tres personas escribieron pidiendo la evaluación. <b>Todo lo demás en este reporte es consecuencia de eso.</b>"], "kpis": [{"k": "Leads de anuncio", "s": "Leads", "v": 36, "ant": 25, "t": "36", "at": "25"}, {"k": "Les escribiste antes", "s": "Escribiste", "v": 14, "ant": 16, "t": "14", "at": "16 de 25"}, {"k": "Con nota de voz", "s": "Voz", "v": 10, "ant": 13, "t": "10", "at": "13 de 25"}, {"k": "Agendaron", "s": "Agendaron", "v": 13, "ant": 3, "t": "13", "at": "3"}, {"k": "Les escribiste después", "s": "Después", "v": 4, "ant": 1, "t": "4", "at": "1 de 3"}, {"k": "Les mandaste la foto", "s": "Foto", "v": 1, "ant": 0, "t": "1", "at": "0 de 3"}], "barras": [{"label": "Leads a los que le escribiste", "num": 14, "den": 36, "meta": 60}, {"label": "Leads con nota de voz", "num": 10, "den": 36, "meta": 40}, {"label": "Citas a las que mandaste la foto", "num": 1, "den": 13, "meta": 60, "vacio": "Esta na que no aparece es una hora vacía."}], "cierre": "María, la subida de esta semana es real y hay que celebrarla — de 3 citas a 13. Pero conviene mirar de dónde vino, porque el bot ya está dando casi todo lo que puede dar solo. La diferencia entre 36% y más está en las 15 personas que nadie tocó y en las 12 citas que no recibieron ni tu mensaje ni tu foto. Eso está en la clase de seguimiento del área de miembros que ya viste, y no exige más horas: exige que el sábado también entres. Recuerda por qué: quien te escribe desde un anuncio no te conoce, está preguntando por una zona íntima de su cuerpo y necesita confiar en una persona antes de venir. Tu clienta de siempre ya confía; esta señora te está evaluando a ti.", "funciono": "El martes y el jueves-viernes trabajaste fuerte: 23, 21 y 22 mensajes, con 10 notas de voz en la semana. Y esa semana fue justo la de mejor tasa que has tenido. Además el bot está manejando bien la pregunta del precio: cuando Kaufa preguntó «Cuanto cuesta la cita por la evaluación?» el 31/08, la respuesta fue que la evaluación es gratuita, presencial, sin abono y sin compromiso — exactamente el molde de la clase, primero el siguiente paso y no la cifra. Ese guion ya está funcionando; lo que falta es que tú entres detrás.", "acciones": [{"t": "Contesta a Eli y a Dany hoy", "d": "Las dos escribieron la frase exacta del anuncio pidiendo la evaluación y ninguna tuvo respuesta tuya:", "g": "Hola Eli, soy María 💚 vi que quieres tu evaluación de aclaramiento. Cuéntame, ¿qué zona te gustaría trabajar: axilas, zona íntima, o las dos? Con eso te reservo el cupo, es gratis y sin compromiso."}, {"t": "Responde tú a Ramón y a Isa", "d": "Ramón preguntó si usas láser o cremas e Isa pidió un rango de precios; los dos se quedaron con la respuesta del bot. Mándales una nota de voz: son preguntas de confianza, no de información."}, {"t": "Escribe a las 13 que agendaron", "d": "Solo tocaste a 4 y mandaste 1 foto. El día antes de cada cita, con su nombre y la foto. Es lo único en tu mano para que la que dijo que sí, llegue."}], "pie": "Los números salen de tu cuenta de EpikFlow entre el lunes 31 de agosto y el domingo 6 de septiembre. Solo cuentan como tuyos los mensajes que salieron de tu teléfono o de tu equipo desde la plataforma, así que si algo quedó fuera es porque no pudimos verlo, nunca al revés."}</script><script src="/assets/a.js" defer></script></html>
