<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reporte de Gestión</title><link rel="stylesheet" href="/assets/s.css"><script type="application/json" id="d">{"slug": "monica-sanchez", "nombre": "Monica Sanchez", "estado": "listo", "rango": "Semana del 5 al 11 de octubre de 2026", "rangoCorto": "5–11 oct", "rangoAnt": "28 sep–4 oct", "tasa": {"pct": 23, "num": 3, "den": 13, "botSola": 23, "ella": 0, "mutuo": 0, "leadSola": 0, "pctAnt": 35}, "historico": [{"etq": "24–30 ago", "tasa": 31}, {"etq": "31 ago–6 sep", "tasa": 31}, {"etq": "7–13 sep", "tasa": 16}, {"etq": "14–20 sep", "tasa": 23}, {"etq": "21–27 sep", "tasa": 38}, {"etq": "28 sep–4 oct", "tasa": 39}, {"etq": "5–11 oct", "tasa": 23}], "intro": ["Esta semana entraron 13 leads de publicidad (la pasada fueron 23) y agendaron 3. Con 13 personas la muestra es chica, así que vamos a mirar los números absolutos y no el porcentaje: le escribiste a 7, mandaste 6 notas de voz y 3 agendaron. Tu proporción de audios sigue por encima de la meta, y eso es tuyo.", "Lo que duele de esta semana son dos mensajes concretos. George el lunes y Rosy el miércoles escribieron exactamente esto: «<b>Quiero reservar mi cupo para la prueba de mechón GRATIS</b>». Las dos personas pidieron reservar, con esas palabras, y ninguna de las dos recibió un mensaje tuyo. <b>Todo lo demás en este reporte es consecuencia de eso.</b>"], "kpis": [{"k": "Leads de anuncio", "s": "Leads", "v": 13, "ant": 23, "t": "13", "at": "23"}, {"k": "Les escribiste antes", "s": "Escribiste", "v": 7, "ant": 13, "t": "7", "at": "13 de 23"}, {"k": "Con nota de voz", "s": "Voz", "v": 6, "ant": 11, "t": "6", "at": "11 de 23"}, {"k": "Agendaron", "s": "Agendaron", "v": 3, "ant": 8, "t": "3", "at": "8"}, {"k": "Les escribiste después", "s": "Después", "v": 2, "ant": 4, "t": "2", "at": "4 de 8"}, {"k": "Les mandaste la foto", "s": "Foto", "v": 0, "ant": 0, "t": "0", "at": "0 de 8"}], "barras": [{"label": "Leads a los que le escribiste", "num": 7, "den": 13, "meta": 60}, {"label": "Leads con nota de voz", "num": 6, "den": 13, "meta": 40}, {"label": "Citas a las que mandaste la foto", "num": 0, "den": 3, "meta": 60, "vacio": "Esta semana no hubo citas, así que esta barra no aplica."}], "origen": [{"k": "El bot", "v": 3, "c": "#2F6F68"}, {"k": "Tú, desde el teléfono", "v": 1, "c": "#C0522F"}], "origenNota": "De las 4 citas creadas con leads de publicidad, 3 las creó el bot y 1 la creaste tú. Mirando quién habló con la persona <b>antes</b> de que hubiera cita, en las 3 fue el bot solo. No apareces en ninguna, y eso con 6 notas de voz tuyas en la semana significa que tus audios están saliendo hacia conversaciones que no terminan en cita, mientras las que sí agendan las cierra el sistema.", "metodo": [{"c": "Vende el siguiente paso, no el procedimiento. Cuando alguien ya pidió el siguiente paso, lo único que falta es ponerle día y hora.", "h": "George escribió el 5/10 a las 17:40 «<b>Quiero reservar mi cupo para la prueba de mechón GRATIS</b>». Rosy escribió lo mismo el 7/10 a las 20:50, añadiendo «y cuál es el precio?». <b>Ninguna de las dos recibió un mensaje tuyo</b>, y ninguna agendó.", "p": "Esas dos personas ya estaban convencidas: venían del anuncio con la frase de reserva escrita. Eran dos citas hechas y se perdieron por no contestar. En una semana de 13 leads, son el 15% de todo lo que entró."}, {"c": "No respondas únicamente con el precio. El molde: «claro que sí, con mucho gusto te doy toda la información, pero antes cuéntame, ¿qué te gustaría mejorar exactamente?»", "h": "5 personas preguntaron precio. A dos les contestaste tú — y es la parte buena — pero a Dyd le respondiste el 7/10 «mis precios varían dependiendo del trabajo que tenga que hacer, pero mi presupuesto está en...» sin preguntarle primero qué quería lograr. A Ingimar, que preguntó por el balayage el 7/10, le contestó el bot con «desde $350» y ahí se cerró la conversación.", "p": "Cuando el número llega antes que la pregunta, la persona lo compara con otros números y decide sin ti. A Gres, en cambio, le contestaste «no, es completamente gratis 😊» dentro de una conversación tuya — y Gres agendó."}, {"c": "La rutina diaria: revisar todos los días las conversaciones de por lo menos los dos días anteriores.", "h": "Tus mensajes salieron así: lunes 5, martes 3, <b>miércoles 12</b>, jueves 1, viernes 2, sábado 0, domingo 1. El miércoles hiciste el trabajo de toda la semana.", "p": "George escribió el lunes y Rosy el miércoles por la noche, justo después de tu bloque de trabajo. Ninguna volvió a tener un día con tu atención encima. Repartir esos 24 mensajes en siete días en vez de concentrarlos habría alcanzado a las dos."}, {"c": "Después de que agenda, empujar a la que ya agendó para que asista, con el mensaje y la foto del lugar.", "h": "De las 3 que agendaron le escribiste a 2 y a <b>ninguna</b> le mandaste la foto. Llevas dos semanas sin mandar una sola foto del lugar: 0 de 8 la semana pasada y 0 de 3 esta.", "p": "Lluvia cambió 21 mensajes contigo y con el bot, cerró con «Sí, por favor» y tiene cita el 13 — y no ha visto dónde queda tu salón. Tu dirección es una casa en Plano; para alguien que nunca ha ido, la foto es la diferencia entre llegar y dudar."}], "cierre": "El método ya está grabado y ya lo viste, y esta semana se probó en tu propia cuenta en los dos sentidos: a Gres le contestaste tú la pregunta del precio dentro de tu conversación y Gres agendó; a George y a Rosy, que pidieron reservar con esas palabras, no les llegó nada y no agendaron. No hay nada que aprender aquí, hay que contestar. Mientras los leads nuevos dependan de si ese día te sentaste a revisar, el número va a subir y bajar solo. Tus clientas de siempre vuelven porque ya confían en ti; quien te vio en un anuncio no trae esa confianza y se va con la primera que le responda.", "funciono": "Gres Manzur, el 7 de octubre. Preguntó «¿y la prueba de mechón tiene algún costo?» y le contestaste tú en dos segundos: «no, es completamente gratis 😊». Siguió la conversación contigo y quedó agendada para el 18. Es la única de las cinco que preguntaron precio donde entraste de verdad, y es la que cerró. Eso es exactamente lo que enseña la clase: el precio contestado por ti, dentro de una conversación tuya, no espanta a nadie.", "acciones": [{"t": "George y Rosy, hoy mismo", "d": "Las dos pidieron reservar su cupo de la prueba de mechón y nunca recibieron respuesta tuya. Son las dos citas más fáciles que tienes pendientes.", "g": "Hola [nombre], soy Mónica. Perdón la demora, te contesto yo. Claro que sí, te aparto tu cupo para la prueba de mechón — es gratis. ¿Te queda mejor entre semana o el fin de semana? Y si puedes, mándame una foto de cómo tienes el cabello ahora y otra de cómo te gustaría verlo."}, {"t": "Ingimar, con una pregunta antes del precio", "d": "Preguntó por el balayage, le contestó el bot con «desde $350» y se apagó. Reábrela tú con la pregunta de la clase.", "g": "Hola Ingimar, soy Mónica. Vi que preguntaste por el balayage. Antes de hablar de precio cuéntame: ¿qué te gustaría mejorar exactamente de tu color ahora mismo? Mándame una foto de cómo lo tienes y una de referencia, y te digo qué te queda mejor y cuánto sale en tu caso."}, {"t": "La foto del lugar, a las 3 que agendaron", "d": "Llevas 11 citas seguidas sin mandar la foto. Lluvia tiene cita el 13 y no sabe cómo es el sitio.", "g": "Hola [nombre] 💛 Te confirmo tu cita de [día] a las [hora]. Te dejo una foto del lugar para que lo ubiques fácil al llegar: 2904 Knollwood Dr, Plano. Aquí te espero."}], "pie": "Los números salen de tu cuenta de EpikFlow entre el lunes 5 y el domingo 11 de octubre. Solo cuentan como tuyos los mensajes que salieron de tu teléfono o de tu equipo desde la plataforma, así que si algo quedó fuera es porque no pudimos verlo, nunca al revés."}</script><script src="/assets/a.js" defer></script></html>
