<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reporte de Gestión</title><link rel="stylesheet" href="/assets/s.css"><script type="application/json" id="d">{"slug": "monica-sanchez", "nombre": "Monica Sanchez", "estado": "listo", "rango": "Semana del 28 de septiembre al 4 de octubre de 2026", "rangoCorto": "28 sep–4 oct", "rangoAnt": "21–27 sep", "tasa": {"pct": 39, "num": 9, "den": 23, "botSola": 26, "ella": 0, "mutuo": 13, "leadSola": 0, "pctAnt": 38}, "historico": [{"etq": "24–30 ago", "tasa": 31}, {"etq": "31 ago–6 sep", "tasa": 31}, {"etq": "7–13 sep", "tasa": 16}, {"etq": "14–20 sep", "tasa": 23}, {"etq": "21–27 sep", "tasa": 38}, {"etq": "28 sep–4 oct", "tasa": 39}], "intro": ["39% de agendamiento: 9 citas de 23 leads. Es tu mejor número de las seis semanas que llevamos midiéndote y uno de los dos más altos de toda la cartera. Eso es real y es tuyo.", "Pero hay algo debajo que conviene mirar antes de que se note en el número. La semana pasada hiciste las mismas 9 citas, y en 7 de ellas tu trabajo aparecía en la conversación. Esta semana tu trabajo aparece en 3, y el bot cerró 6 solo. Le escribiste a 13 leads en lugar de 18, y mandaste 11 notas de voz en lugar de 15. El resultado se sostuvo porque el bot tapó el hueco, no porque el hueco no exista. <b>Todo lo demás en este reporte es consecuencia de eso.</b>"], "kpis": [{"k": "Leads de anuncio", "s": "Leads", "v": 23, "ant": 24, "t": "23", "at": "24"}, {"k": "Les escribiste antes", "s": "Escribiste", "v": 13, "ant": 18, "t": "13", "at": "18 de 24"}, {"k": "Con nota de voz", "s": "Voz", "v": 11, "ant": 15, "t": "11", "at": "15 de 24"}, {"k": "Agendaron", "s": "Agendaron", "v": 9, "ant": 9, "t": "9", "at": "9"}, {"k": "Les escribiste después", "s": "Después", "v": 4, "ant": 5, "t": "4", "at": "5 de 9"}, {"k": "Les mandaste la foto", "s": "Foto", "v": 0, "ant": 0, "t": "0", "at": "0 de 9"}], "barras": [{"label": "Leads a los que le escribiste", "num": 13, "den": 23, "meta": 60}, {"label": "Leads con nota de voz", "num": 11, "den": 23, "meta": 40}, {"label": "Citas a las que mandaste la foto", "num": 0, "den": 9, "meta": 60}], "origen": [{"k": "El bot", "v": 7, "c": "#2F6F68"}, {"k": "Tú, desde el teléfono", "v": 4, "c": "#C0522F"}], "origenNota": "De las 11 citas que se crearon con leads de publicidad, 7 las creó el bot y 4 las creaste tú desde el teléfono. En participación: 3 de esfuerzo mutuo y 6 del bot solo. Compara con la semana pasada — 7 de esfuerzo mutuo y 2 del bot solo — y verás que el mismo 39% está hecho de materiales distintos. El de la semana pasada era más tuyo.", "metodo": [{"c": "En la clase te explicamos que el bot es apoyo, no reemplazo: responde rápido, inicia y filtra, pero tú interpretas la necesidad y cierras. La confianza la construyes tú.", "h": "Citas con tu participación: 7 la semana pasada, 3 esta semana. Citas que el bot cerró solo: 2 la semana pasada, 6 esta semana. Cuatro de las nueve que agendaron — Esther, Marilu, Yusmila y Patty — no recibieron un solo mensaje tuyo antes de la cita.", "p": "Las cuatro van a llegar a tu silla sin haberte oído la voz. El número de esta semana no lo notó porque el bot es bueno, pero esas cuatro son las que más fácil se caen: cancelan, no se presentan, o vienen y no vuelven. Tu 39% está apoyado en una pata que esta semana se adelgazó a la mitad."}, {"c": "En la clase de seguimiento te explicamos la rutina diaria: todos los días revisar las conversaciones de por lo menos los dos días anteriores, y buscar a quien dejó de responder, a quien preguntó y no agendó y a quien quedó a medias.", "h": "8 de 23 leads no recibieron mensaje tuyo. Laura escribió 10 mensajes y el domingo 4 a las 22:25 dejó esto: \"Como a las 4 está bien, mañana te mando las fotos sin falta\". Laura ya se puso de acuerdo en la hora y prometió fotos, y nunca habló contigo. Luzia preguntó \"Que parte de Dallas estas?\" y también se quedó con el bot.", "p": "Laura es la lead más avanzada de la semana y está esperando a alguien. El lunes por la mañana, cuando mande las fotos, o hay una persona del otro lado o se enfría. Y tus días lo explican: 20 mensajes el lunes 28, luego 2, 11, 1, 6 y 14 — el jueves 1 de octubre mandaste un solo mensaje."}, {"c": "Tu segundo trabajo, después de que agendan, es empujar a la que ya tiene cita para que asista: el mensaje de recordatorio y la foto de un trabajo parecido, que es lo que le baja el miedo antes de venir.", "h": "De las 9 que agendaron, a 4 les escribiste después. Foto no le mandaste a ninguna: 0 de 9, igual que la semana pasada y que todas las semanas anteriores.", "p": "En balayage y transformaciones de color la foto no es un detalle: la lead está imaginando un tono que no sabe nombrar, y paga $350 o más por él. En tu cuenta ese contador lleva seis semanas en cero, y es la única de tus seis cifras que nunca se ha movido."}], "cierre": "Tu 39% es el mejor de tu historia con nosotros y no hay nada que corregir en el resultado. Lo que te estamos señalando es la mezcla: el método ya está grabado, ya lo viste en la clase de seguimiento, y esta semana se probó en tu propia cuenta — la semana pasada 7 de 9 citas llevaban tu huella, esta semana 3, y el que compensó fue el bot. Mientras la tendencia siga en esa dirección el número va a aguantar un par de semanas más y después va a bajar, porque tus clientas de siempre llegan solas y ya confían en ti, pero quien te vio en un anuncio y solo habló con un bot no tiene ninguna razón para volver una segunda vez.", "funciono": "El lunes 28 de septiembre: 20 mensajes a leads de publicidad en un día, y de ahí salieron las notas de voz que sostienen las 3 citas de esfuerzo mutuo. Y en general, 11 notas de voz sobre 23 leads es casi uno de cada dos — muy por encima de la meta del 40% y de lo que hace la mayoría de la cartera. Tu 39% de agendamiento, sumado a los 38% de la semana pasada, es el techo más alto que ha tenido tu cuenta. Lo que te pedimos no es cambiar de método: es no soltarlo a mitad de semana.", "acciones": [{"t": "Laura, antes de que mande las fotos", "d": "Dijo que a las 4 está bien y que mañana manda las fotos. Escríbele tú primero, hoy, para que cuando las mande ya sepa con quién habla.", "g": "Hola Laura, soy Mónica. Perfecto lo de las 4. Mándame las dos fotos cuando puedas: una de cómo tienes el cabello ahora y otra de la referencia que te gusta. Así cuando llegues ya tengo pensado el camino del color y no perdemos tiempo. ¿Te late?"}, {"t": "Las cuatro que agendaron sin oírte", "d": "Esther, Marilu, Yusmila y Patty agendaron con el bot y no han hablado contigo. Una nota de voz corta a cada una antes de su cita, presentándote.", "g": "Hola [nombre], soy Mónica, la que te va a atender. Vi que ya tienes tu cita. Cuéntame antes para ir preparada: ¿cómo tienes el cabello ahora y qué resultado te gustaría lograr? Y si tienes una foto de referencia, mándamela."}, {"t": "Rompe el cero de la foto", "d": "Seis semanas en 0. A cada una de las 9 que tienen cita, mándale una foto de un balayage tuyo parecido a lo que pidió, el día antes. Es lo que convierte el \"a ver qué sale\" en \"quiero eso\".", "g": "[nombre], te mando cómo quedó un color parecido al que vamos a hacerte. Mira el movimiento en las puntas — así se te va a ver con tu base. ¿Te gusta por ahí o quieres algo más claro?"}], "pie": "Los números salen de tu cuenta de EpikFlow entre el lunes 28 de septiembre y el domingo 4 de octubre de 2026. Solo cuentan como tuyos los mensajes que salieron de tu teléfono o de tu equipo desde la plataforma, así que si algo quedó fuera es porque no pudimos verlo, nunca al revés."}</script><script src="/assets/a.js" defer></script></html>
