0}], "origen": [{"k": "El bot", "v": 2, "c": "#2F6F68"}], "origenNota": "Las dos citas de la semana las creó el bot y fue él quien llevó la conversación. Con solo dos citas no hay que sacar una ley de esto, pero sí una pregunta: de las 15 personas que llegaron, 13 no agendaron, y en varias de ellas tú sí estabas escribiendo. Lo que faltó no fue trabajo, fue rematar.", "metodo": [{"c": "«Nada de “hola, ¿sigues interesada?”.» En su lugar, la pregunta gancho, atada a lo que ella misma dijo: una foto de cómo tiene el cabello ahora y otra de cómo le gustaría verse.", "h": "More te escribió el 15/09: «Ok voy a esperar que me la tome mi hija bien y te la envío y me asesoras bien que me queda». Quedó esperando para mandarte una foto y nadie volvió a escribirle. Igual Luzmarina (14 mensajes), Yolimar (8) y Akira_Mery (12): conversaciones largas que terminaron en «Gracias».", "p": "Ninguna de esas cuatro agendó. No se fueron porque no les interesara: se fueron porque la conversación se quedó sin siguiente paso."}, {"c": "«Revisa todos los días las conversaciones de por lo menos los dos días anteriores.»", "h": "Escribiste el 14, 15, 16, 17, 18 y 20. El sábado 19 no hubo ningún mensaje tuyo, y el jueves y viernes —tus días fuertes, con 10 y 9 mensajes— fueron justo los días en los que quedaron colgadas Yolimar y Luzmarina.", "p": "El día que no se revisa es el día en que una conversación caliente se enfría."}, {"c": "A quien ya agendó hay que sostenerla hasta la cita: un mensaje tuyo y una foto de un resultado real.", "h": "Zoraida agendó el 18/09 y su último mensaje fue «Te lo enseño el día de la cita». No recibió ni un mensaje tuyo después de agendar, ni una foto. De las 2 citas, 1 recibió mensaje y ninguna recibió foto.", "p": "Es el paso más corto del reporte y el único que depende solo de ti."}, {"c": "«No respondas únicamente con el precio»: primero entender qué quiere, después la cifra.", "h": "4 personas preguntaron precio. A Yolimar, el 18/09 a las 07:17 («Que precio tiene.»), la respuesta fue la duración y la dirección, sin precio y sin pregunta. Contestó «Gracias» y no volvió.", "p": "Cuando la respuesta no abre nada, la conversación se cierra sola."}], "cierre": "Esto no es que no trabajes: 9 de 15 personas recibieron un mensaje tuyo y 7 recibieron tu voz, que es de lo mejor que hemos visto en la cartera. El método de la clase de seguimiento ya lo viste y esta misma semana se probó en tu cuenta: la única conversación de precio en la que entraste tú, con Dolera, la resolviste con una nota de voz. Lo que falta es el remate — la pregunta gancho al día siguiente, la foto a la que ya agendó. Mientras eso no esté, tus clientas de siempre seguirán llenándote la agenda porque ya confían en ti, pero la que te vio en un anuncio se va a quedar en «Gracias»: no te conoce, está comparando, y esa confianza hay que terminársela de construir tú.", "funciono": "El 18 de septiembre Dolera insistió con el precio: «no es igual estando en persona, más o menos un aproximado del precio, $, tener idea». En vez de soltar una cifra o esquivarla, le mandaste una nota de voz. Eso es exactamente lo que enseña la clase: tu voz, explicando por qué el precio depende de lo que ella necesita. Siete veces esta semana usaste esa herramienta. Llévala también a las que quedaron a medias.", "acciones": [{"t": "More te está esperando", "d": "Quedó en mandarte la foto de su hija y nunca volvieron a hablar. Escríbele tú primero, hoy.", "g": "Hola More 😊 me quedé pendiente de la foto. Mándamela cuando puedas y te digo exactamente qué le queda mejor y cuánto sería. ¿La quieres para entre semana o para un fin de semana?"}, {"t": "Zoraida tiene cita y no sabe nada de ti", "d": "Agendó el 18 y no ha recibido nada tuyo. Un mensaje y una foto de un balayage real tuyo el día antes.", "g": "Hola Zoraida, soy Rosa 😍 Te espero [día] a las [hora]. Mira este resultado de una clienta con un cabello parecido al tuyo, para que vayas viendo a dónde vamos. ¿Alguna duda antes de venir?
