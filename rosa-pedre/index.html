<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reporte de Gestión</title><link rel="stylesheet" href="/assets/s.css"><script type="application/json" id="d">{"slug": "rosa-pedre", "nombre": "Rosa Pedre", "estado": "listo", "rango": "Semana del 28 de septiembre al 4 de octubre de 2026", "rangoCorto": "28 sep–4 oct", "rangoAnt": "21–27 sep", "tasa": {"pct": 25, "num": 5, "den": 20, "botSola": 20, "ella": 0, "mutuo": 5, "leadSola": 0, "pctAnt": 22}, "historico": [{"etq": "24–30 ago", "tasa": 23}, {"etq": "31 ago–6 sep", "tasa": 10}, {"etq": "7–13 sep", "tasa": 5}, {"etq": "14–20 sep", "tasa": 13}, {"etq": "21–27 sep", "tasa": 22}, {"etq": "28 sep–4 oct", "tasa": 25}], "intro": ["Esta semana le escribiste a 13 de tus 20 leads de publicidad y a 12 les mandaste nota de voz. Las dos cifras están por encima de la meta que nos pusimos (60% y 40%), y tu tasa de agendamiento subió de 22% a 25%: es la tercera semana seguida que mejora, desde el 5% del 7 al 13 de septiembre. Esto no es casualidad y hay que decírtelo primero.", "Y ahora lo que no se está moviendo. De las 5 leads que agendaron, en 4 el bot lo hizo solo y en 1 hubo esfuerzo de las dos. En ninguna fuiste tú sola la que llevó la conversación hasta la cita. Estás haciendo el trabajo de volumen — escribes y mandas audios — pero en el momento exacto donde se decide la cita, el que responde es el bot. <b>Todo lo demás en este reporte es consecuencia de eso.</b>"], "kpis": [{"k": "Leads de anuncio", "s": "Leads", "v": 20, "ant": 18, "t": "20", "at": "18"}, {"k": "Les escribiste antes", "s": "Escribiste", "v": 13, "ant": 13, "t": "13", "at": "13 de 18"}, {"k": "Con nota de voz", "s": "Voz", "v": 12, "ant": 11, "t": "12", "at": "11 de 18"}, {"k": "Agendaron", "s": "Agendaron", "v": 5, "ant": 4, "t": "5", "at": "4"}, {"k": "Les escribiste después", "s": "Después", "v": 2, "ant": 2, "t": "2", "at": "2 de 4"}, {"k": "Les mandaste la foto", "s": "Fot n quedó a medias.", "h": "5 leads no recibieron ni un mensaje tuyo. Raisa escribió 31 mensajes y su último, del 28 de septiembre, fue \"Y su Instagram?\". George escribió 8 y cerró con \"Te escribo en horas del medio dia\" el 30 de septiembre. Ninguno de los dos agendó.", "p": "Raisa con 31 mensajes es la lead más caliente de la semana: alguien que escribe 31 veces y pide tu Instagram está buscando confianza, no información. George te avisó a qué hora iba a escribir y no volvió. Los dos eran recuperables con un mensaje tuyo el mismo día."}, {"c": "En la clase te explicamos el embudo de opciones para agendar: nunca \"¿cuándo quieres venir?\", sino tres pasos — ¿entre semana o fin de semana? → ¿mañana o tarde? → ¿a las 10 o a las 11?", "h": "Escribiste 20 mensajes el jueves 1 de octubre y 15 el lunes 28, pero las 5 citas de la semana las cerró el bot ofreciendo horarios. Yanet preguntó el 28 \"Para este sábado si fuera posible Y que precio sería?\" y le mandaste una nota de voz — bien — pero la conversación no terminó en cita.", "p": "Tu trabajo llega hasta construir el interés y ahí se detiene; el paso de cerrar la hora se lo dejas al bot. Por eso la columna de \"tú\" está en cero aunque tus otras dos cifras estén sobre la meta."}, {"c": "Tu segundo trabajo, después de que agendan, es empujar a la que ya tiene cita para que asista: el mensaje de recordatorio y la foto de un resultado parecido, que es lo que le baja el miedo antes de venir.", "h": "De las 5 que agendaron, a 2 les escribiste después. Foto no le mandaste a ninguna: 0 de 5, igual que la semana pasada.", "p": "En color y balayage la foto es media venta: la lead está imaginando un tono que no sabe describir. Tú tienes el portafolio en el teléfono y ya mandas audios sin problema, así que es la pieza más barata que te queda pendiente."}], "cierre": "Lo tuyo no es falta de trabajo — eso ya quedó claro con 13 de 20 y 12 notas de voz, las dos cifras sobre la meta. Lo tuyo es dónde se corta el trabajo: justo ant "Cierra tú el horario", "d": "Después de cada nota de voz, no esperes a que el bot ofrezca la hora. Dale el embudo de tres pasos y la cita queda con tu nombre encima.", "g": "Para la prueba de mechón, ¿te queda mejor entre semana o fin de semana? … Perfecto, ¿mañana o tarde? … Listo, ¿a las 10 o a las 11?"}], "pie": "Los números salen de tu cuenta de EpikFlow entre el lunes 28 de septiembre y el domingo 4 de octubre de 2026. Solo cuentan como tuyos los mensajes que salieron de tu teléfono o de tu equipo desde la plataforma, así que si algo quedó fuera es porque no pudimos verlo, nunca al revés."}</script><script src="/assets/a.js" defer></script></html>
