ntes del precio— es la más corta de todas, y tú ya haces la parte difícil, que es la voz. Mientras el cierre se deje para después, el número se va a quedar donde está, porque tus clientas de siempre llegan solas —ya confían en ti— y quien te vio en un anuncio no trae esa confianza: hay que llevarla de la mano hasta la fecha y la hora.", "funciono": "El 10 de septiembre Margarita te preguntó «¿más o menos cuánto me sale?» y no le mandaste una cifra: le respondiste con una nota de voz. Eso es exactamente el molde de la clase — no responder solo con el precio y usar tu voz para que te sienta cerca. Con 12 notas de voz en 20 leads tienes la mejor materia prima de la cartera; solo falta que cada una termine con una pregunta de fecha.", "acciones": [{"t": "Cierra las cuatro que quedaron abiertas", "d": "Alina, Elianni, Llugo y Kami💞 se quedaron sin respuesta tuya el fin de semana. Alina hasta te dio la hora que quería.", "g": "Hola Alina, soy Rosa 💗 Me dijiste 9am, perfecto. ¿Te viene mejor el miércoles o el jueves a esa hora? Te reservo el cupo ya mismo."}, {"t": "Antes del precio, una pregunta", "d": "Cada vez que te pregunten cuánto cuesta, contesta con el molde de la clase antes de dar la cifra.", "g": "Claro que sí, con mucho gusto te doy toda la información. Antes cuéntame: ¿cómo tienes el cabello ahora y qué resultado te gustaría lograr? Mándame una foto de cómo lo tienes y otra de lo que te gusta."}, {"t": "Los tres pasos para agendar", "d": "Nunca «¿cuándo quieres venir?». Primero entre semana o fin de semana, después mañana o tarde, después la hora exacta.", "g": "Para tu evaluación, ¿te queda mejor entre semana o el sábado?"}], "pie": "Los números salen de tu cuenta de EpikFlow entre el lunes 7 y el domingo 13 de septiembre. Solo cuentan como tuyos los mensajes que salieron de tu teléfono o de tu equipo desde la plataforma, así que si algo quedó fuera es porque no pudimos verlo, nunca al revés. Con 20 leads la muestra es chica: mira los números en absolutos más
