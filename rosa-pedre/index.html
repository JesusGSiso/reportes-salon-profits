ta": 60, "vacio": "Esta semana no hubo citas, así que esta barra no aplica."}], "origen": [{"k": "El bot", "v": 3, "c": "#2F6F68"}], "origenNota": "Las 3 citas de esta semana las creó el bot, sin que tú participaras en ninguna conversación antes de que existieran. Eso no es un mérito del bot ni un demérito tuyo: es simplemente el techo de lo que el bot puede hacer solo. Las 27 que no agendaron también las atendió el bot.", "metodo": [{"c": "«El bot es apoyo, no reemplazo.» Él responde rápido, inicia y filtra; tú interpretas lo que la persona necesita y cierras.", "h": "<b>0 mensajes tuyos</b> a los 30 leads de publicidad en toda la semana. Ningún día. La semana pasada habían sido 4.", "p": "La tasa cayó de 23% a 10% en esa misma semana. Es la caída más común y la más cara: cuando el bot queda solo, la cuenta se queda en el techo del bot."}, {"c": "«Revisa las conversaciones de por lo menos los dos días anteriores» y busca a quien quedó a medias o a quien se le dieron horarios y no confirmó.", "h": "El domingo 06/09 Amanda tuvo <b>19 mensajes</b> con el bot: te mandó dos fotos de su cabello, contó todo su historial químico, dijo «Exacto» a la propuesta y pidió fin de semana. El bot solo tenía miércoles y jueves, y cerró con «te aviso apenas tenga un espacio». Amanda respondió: «yo le avisaria antes ,porque mi trabajo es bien complicado».", "p": "Amanda quedó a un mensaje de agendar y nadie volvió. Ese es exactamente el segundo grupo que la clase te pide buscar todos los días: la que quedó a medias."}, {"c": "«Las sardinas también compran.» El bot ayuda a identificar a los peces dorados, pero eso no autoriza a abandonar al resto.", "h": "Tres leads levantaron la mano el mismo domingo y ninguna recibió un mensaje tuyo: Lorena mandó <b>tres notas de voz</b> preguntando por hidratación, Yesenia escribió «necesito alguien que sepa corregir el color al de mi base y luego hacerme los baby light para disimular canas», y Yaimara dijo «Vivo en tampa» y se quedó ahí.", "p": "Son tres personas que ya dijeron qué quieren y dónde están. Siguen abiertas hoy."}], "cierre": "Rosa, esto no es que estés trabajando mal: es que esta semana no entraste. El método ya está grabado en la clase de seguimiento del área de miembros, ya lo viste, y se acaba de probar en tu propia cuenta — la semana en que tú tocaste 4 conversaciones la tasa fue de 23%; la semana en que tocaste 0 fue de 10%. Mientras el bot siga solo, ese número no se va a mover, porque quien te escribe desde un anuncio no te conoce: está cotizando y comparando, y lo que la hace elegirte a ti no es la información, es que alguien de carne y hueso le conteste. Tu clienta de siempre llega sola porque ya confía en ti; esta señora todavía no tiene por qué.", "funciono": "La conversación del bot con Amanda el domingo es de manual y vale la pena que la leas entera: le preguntó el nombre antes de dar el precio, le preguntó qué quería lograr, le pidió una foto de cómo tiene el cabello y otra de referencia, revisó su historial químico y recién entonces propuso horarios. Eso es exactamente el método. Le faltó una sola cosa — que alguien volviera a buscarla cuando pidió fin de semana — y esa parte es tuya. Si haces solo eso con las conversaciones que el bot deja calientes, no necesitas trabajar más horas.", "acciones": [{"t": "Rescata a Amanda hoy", "d": "Tuvo 19 mensajes, mandó fotos y quería fin de semana. Es la más cerca de agendar que tienes:", "g": "Hola Amanda, soy Rosa 😊 vi tus fotos y me encantó lo que quieres lograr. Te escribo yo directamente porque te quiero acomodar en fin de semana: ¿te sirve mejor un sábado en la mañana o en la tarde?"}, {"t": "Contesta a Lorena, Yesenia y Yaimara", "d": "Las tres escribieron el domingo y ninguna ha recibido un mensaje tuyo. Lorena hasta te mandó tres notas de voz. Contéstale con otra nota de voz, con su nombre y devolviéndole lo que ella te dijo."}, {"t": "Vuelve a la revisión diaria", "d": "Diez minutos al día, desde la computadora, mirando las conversaciones de los dos días anteriores. Busca las cuatro: quien dejó de responder, quien preguntó y no agendó, quien quedó a medias, y a quien se le dieron horarios y no confirmó."}], "pie": "Los números salen de tu cuenta de EpikFlow entre el lunes 31 de agosto y el domingo 6 de septiembre. Solo cuentan como tuyos los mensajes que salieron de tu teléfono o de tu equipo desde la plataforma, así que si algo quedó fuera es porque no pudimos verlo, nunca al revés."}</script><script src="/assets/a.js" defer></script></html>
