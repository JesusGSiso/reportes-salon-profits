<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reporte de Gestión</title><link rel="stylesheet" href="/assets/s.css"><script type="application/json" id="d">{"slug": "karyme-rios", "nombre": "Karyme Rios", "estado": "listo", "rango": "Semana del 12 al 18 de octubre de 2026", "rangoCorto": "12–18 oct", "rangoAnt": "5–11 oct", "tasa": {"pct": 22, "num": 14, "den": 64, "botSola": 22, "ella": 0, "mutuo": 0, "leadSola": 0, "pctAnt": 24}, "historico": [{"etq": "21–27 sep", "tasa": 18}, {"etq": "5–11 oct", "tasa": 24}, {"etq": "12–18 oct", "tasa": 22}], "intro": ["Tu cuenta es la que más leads recibe de toda la cartera: 64 esta semana. Agendaron 14, y tu tasa quedó en 22%, casi igual que la semana pasada. Escribiste los siete días, con 13 mensajes el sábado y 15 el domingo: no es falta de ganas.", "Pero las 14 citas, <b>las 14</b>, las cerró el bot solo: ninguna de esas personas había hablado contigo antes de agendar. Y de los 64 leads, 47 no recibieron ni un mensaje tuyo. Esta semana no salió ninguna nota de voz. Con 64 leads por semana no se puede llegar a todos — por eso lo que importa es a cuáles llegas, y ahora mismo no estás llegando a los que preguntan el precio ni a los que piden la evaluación. <b>Todo lo demás en este reporte es consecuencia de eso.</b>"], "kpis": [{"k": "Leads de anuncio", "s": "Leads", "v": 64, "ant": 71, "t": "64", "at": "71"}, {"k": "Les escribiste antes", "s": "Escribiste", "v": 11, "ant": 11, "t": "11", "at": "11 de 71"}, {"k": "Con nota de voz", "s": "Voz", "v": 0, "ant": 1, "t": "0", "at": "1 de 71"}, {"k": "Agendaron", "s": "Agendaron", "v": 14, "ant": 17, "t": "14", "at": "17"}, {"k": "Les escribiste después", "s": "Después", "v": 6, "ant": 9, "t": "6", "at": "9 de 17"}, {"k": "Les mandaste la foto", "s": "Foto", "v": 0, "ant": 0, "t": "0", "at": "0 de 17"}], "barras": [{"label": "Leads a los que le escribiste", "num": 11, "den": 64, "meta": 60}, {"label": "Leads con nota de voz", "num": 0, "den": 64, "meta": 40}, {"label": "Citas a las que mandaste la foto", "num": 0, "den": 14, "meta": 60, "vacio": "Esta semana no hubo citas, así que esta barra no aplica."}], "origen": [{"k": "El bot", "v": 14, "c": "#2F6F68"}], "origenNota": "Las 14 citas de leads de anuncio las creó el bot, y mirando quién participó antes de la cita el resultado es el mismo: ninguna de las 14 personas te tenía escrito. Tu cuenta está sostenida por el bot, y el bot trae 14 citas por semana sin ti — imagina el número con tus conversaciones dentro. Varias de esas citas son para los próximos días; eso no es un pendiente tuyo.", "metodo": [{"c": "En la clase de seguimiento te explicamos que cuando alguien pregunta el precio ya está levantando la mano, y el molde es «claro que sí, con mucho gusto te doy toda la información, pero antes cuéntame, ¿qué te gustaría mejorar exactamente?».", "h": "15 leads preguntaron precio esta semana. Entraste en una: Zuly, el 17/10, y le contestaste tú. A las demás respondió el bot. Y a Maria, que escribió el 16/10 a las 23:25 «¿Cómo a cuánto sale todo si llegara a hacerme las cejas? Ojalá y sí se pudiera, ya estoy cansada», <b>no le respondió nadie</b>.", "p": "Maria volvió sola dos días después, el 18/10, diciendo «no está tan mal, pero me gustaría algo más marcada pero no exagerada» — se estaba vendiendo a sí misma el procedimiento y nadie la acompañó. Eso que no haya recibido respuesta lo estamos revisando nosotros, pero era la conversación más caliente de la semana."}, {"c": "Nada de «¿sigues interesada?»: la clase es explícita en que ese mensaje no le da a la persona ninguna razón para contestar. En su lugar va la pregunta gancho ligada a lo que ella dijo — para cejas, una foto de cómo las tiene ahora.", "h": "A Mirna, el 12/10, le escribiste «Déjame saber si aún te interesa la evaluación?».", "p": "Es exactamente el mensaje que la clase pide no mandar. No contestó."}, {"c": "Las sardinas también compran: a quien ya avanzó o quedó debiendo algo se le vuelve, no se le deja morir.", "h": "Fely te escribió el 18/10 «Uyyy, aquí no tengo luz suficiente para mandar foto, lo puedo hacer mañana 😊» — quedó a deber la foto y nadie se la volvió a pedir. Yuliet y Alma pidieron la evaluación gratuita el viernes 17 con la misma frase y no recibieron nada tuyo.", "p": "47 de los 64 leads no tienen ni un mensaje tuyo, y entre ellos están las tres que estaban listas para agendar."}, {"c": "A quien ya agendó hay que empujarlo para que asista: el mensaje y la foto del resultado antes de la cita.", "h": "De las 14 que agendaron, le escribiste a 6 y a ninguna le mandaste la foto. Yahaira, que ya tiene cita, seguía confirmando la hora el 17/10 con un «A las 11».", "p": "Son 14 personas en la agenda, no 64. Es el arreglo más rápido y el que más citas salva."}], "cierre": "Con 64 leads a la semana no hay manera de tocar a todos, y nadie te lo va a pedir. Lo que la clase de seguimiento sí pide es elegir: de esos 64, los 15 que preguntaron el precio y los que piden la evaluación son los que ya levantaron la mano, y ahí es donde tu voz vale más que cien mensajes. Esta semana se probó en tu propia cuenta: la única conversación de precio en la que entraste tú siguió viva, y la única que no recibió respuesta de nadie volvió sola dos días después pidiendo que alguien la atendiera. Quien te vio en un anuncio no te conoce; una nota de voz tuya de treinta segundos es lo que lo cambia, y esta semana no salió ninguna.", "funciono": "Escribiste los siete días de la semana, con 13 mensajes el sábado y 15 el domingo: eres constante. Y entraste en la conversación de Zuly el 17/10, que preguntó el precio del efecto polvo — le contestaste tú, con la promoción, en vez de dejarla con el bot. Ese es el movimiento correcto; solo falta hacerlo con las otras catorce y empezar con la pregunta antes del número. Y el bot te está trayendo 14 citas por semana sin que tengas que hacer nada: eso es una base enorme sobre la que construir.", "acciones": [{"t": "Hoy, antes que nada: Maria", "d": "Preguntó el precio el viernes y nadie le respondió; el domingo volvió sola diciendo lo que quiere. Es la conversación más avanzada de la semana y está abierta.", "g": "Hola Maria, soy Karyme. Perdón por la demora, te escribo yo directo. Leí que quieres algo más marcado pero natural — eso es justo lo que hago. Mándame una foto de cómo tienes las cejas ahora y te digo en la evaluación, que es gratis, exactamente qué técnica te queda mejor."}, {"t": "Fely, Yuliet y Alma", "d": "Fely quedó debiendo la foto, y Yuliet y Alma pidieron la evaluación el viernes. Las tres están a un mensaje de la cita.", "g": "Hola [nombre], soy Karyme. La evaluación de cejas es gratis y en ella te digo qué técnica te queda mejor. Mándame una foto de cómo las tienes ahora. ¿Te queda mejor entre semana o el fin de semana?"}, {"t": "Una nota de voz al día, a quien pregunte precio", "d": "Esta semana salieron cero y hubo 15 oportunidades. No hace falta más: una al día, a quien acaba de preguntar el precio, con la pregunta antes de la cifra."}], "pie": "Los números salen de tu cuenta de EpikFlow entre el lunes 12 y el domingo 18 de octubre de 2026. Solo cuentan como tuyos los mensajes que salieron de tu teléfono o de tu equipo desde la plataforma, así que si algo quedó fuera es porque no pudimos verlo, nunca al revés."}</script><script src="/assets/a.js" defer></script></html>
