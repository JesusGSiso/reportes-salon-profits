<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reporte de Gestión</title><link rel="stylesheet" href="/assets/s.css"><script type="application/json" id="d">{"slug": "karyme-rios", "nombre": "Karyme Rios", "estado": "listo", "rango": "Semana del 2 al 8 de noviembre de 2026", "rangoCorto": "2–8 nov", "rangoAnt": "26 oct–1 nov", "tasa": {"pct": 32, "num": 19, "den": 59, "botSola": 25, "ella": 0, "mutuo": 7, "leadSola": 0, "pctAnt": 23}, "historico": [{"etq": "21–27 sep", "tasa": 18}, {"etq": "28 sep–4 oct", "tasa": null}, {"etq": "5–11 oct", "tasa": 24}, {"etq": "12–18 oct", "tasa": 22}, {"etq": "19–25 oct", "tasa": 19}, {"etq": "26 oct–1 nov", "tasa": 23}, {"etq": "2–8 nov", "tasa": 32}], "intro": ["Karyme, 32% es tu mejor número desde que medimos: 19 de 59 leads de publicidad agendaron, y subiste nueve puntos respecto a la semana pasada. Tu agenda de esta semana y la próxima está llena de citas que salieron de la pauta. Eso es un buen resultado y conviene decirlo tal cual.", "Y aquí está el dato que importa: de esos 32 puntos, <b>25 los puso el bot solo</b> y 7 salieron de conversaciones donde entraste tú. De las 59 personas que llegaron, <b>a 39 no les escribiste nunca</b>, y a ninguna de las 59 le mandaste una nota de voz. El bot mandó 410 mensajes; tú tocaste 14 conversaciones. La buena noticia es evidente: si 25 puntos los hace el sistema solo, lo que puedas sumar tú va encima. <b>Todo lo demás en este reporte es consecuencia de eso.</b>"], "kpis": [{"k": "Leads de anuncio", "s": "Leads", "v": 59, "ant": 57, "t": "59", "at": "57"}, {"k": "Les escribiste antes", "s": "Escribiste", "v": 14, "ant": 10, "t": "14", "at": "10 de 57"}, {"k": "Con nota de voz", "s": "Voz", "v": 0, "ant": 1, "t": "0", "at": "1 de 57"}, {"k": "Agendaron", "s": "Agendaron", "v": 19, "ant": 13, "t": "19", "at": "13"}, {"k": "Les escribiste después", "s": "Después", "v": 9, "ant": 4, "t": "9", "at": "4 de 13"}, {"k": "Les mandaste la foto", "s": "Foto", "v": 1, "ant": 0, "t": "1", "at": "0 de 13"}], "barras": [{"label": "Leads a los que le escribiste", "num": 14, "den": 59, "meta": 60}, {"label": "Leads con nota de voz", "num": 0, "den": 59, "meta": 40}, {"label": "Citas a las que mandaste la foto", "num": 1, "den": 19, "meta": 60}], "origen": [{"k": "El bot", "v": 15, "c": "#2F6F68"}, {"k": "Tú, desde el teléfono", "v": 5, "c": "#C0522F"}], "origenNota": "De las 20 citas que se crearon esta semana, 15 las creó el bot y 5 las creaste tú desde el teléfono. En el desglose de arriba «Tú» marca 0 porque en todas esas conversaciones el bot también había hablado antes de la cita: cuando los dos ponen algo, el crédito es compartido. Esos son tus 7 puntos de esfuerzo mutuo. Los otros 25 el bot los hizo sin ti.", "metodo": [{"c": "En la clase te enseñamos que el bot es apoyo, no reemplazo: responde rápido, inicia y filtra, pero la necesidad la interpretas tú y el cierre lo haces tú. La caída a cero cuando arranca el bot es el patrón más común y el más caro.", "h": "El bot mandó 410 mensajes a estos 59 leads. Tú entraste en 14 conversaciones: 10 el lunes, 8 el martes, 6 el miércoles, 1 el jueves, 8 el viernes, 4 el sábado y 28 el domingo.", "p": "Tu 32% es un piso muy alto hecho por el sistema. Pero las 39 conversaciones donde nunca entraste son 39 oportunidades de subirlo, y ahí el bot ya hizo lo que sabe hacer: filtrar. Lo que falta es lo que solo puedes hacer tú."}, {"c": "En la clase te dimos la nota de voz de 5 elementos: tu nombre, una validación, la necesidad que ella expresó, una solución posible y una pregunta para continuar. Con energía, y nunca la misma para dos personas.", "h": "Esta semana: 0 notas de voz a 59 leads. Y había material perfecto. Ninfa escribió el 8/11 a las 17:55: «Tengo casi 60 tengo muy claras las cejas y se puede decir que son de poco pelo». Solmar, el mismo día: «Tengo muy poco, quiero darle forma».", "p": "Ninfa y Solmar contaron su edad, su inseguridad y lo que quieren — exactamente los cinco elementos servidos en bandeja. Las dos recibieron solo texto del bot y ninguna agendó."}, {"c": "En la clase te enseñamos que no se responde únicamente con el precio: «con mucho gusto te doy toda la información, pero antes cuéntame, ¿qué te gustaría mejorar exactamente?»", "h": "13 leads preguntaron precio esta semana. A las 13 les contestó el bot. Tú no entraste en ninguna. Elda escribió «Precio de las cejas» el 8/11 a las 23:43 y sigue así.", "p": "El bot contesta bien — remite a la evaluación gratis — pero contesta igual a las 13. Una de esas 13 escuchando tu voz es otra conversación."}, {"c": "En la clase te explicamos que después de que agenda hay un segundo trabajo: empujarla para que asista, y la foto es lo que sostiene la espera.", "h": "De las 19 que agendaron, les escribiste a 9 y le mandaste foto a 1. Maribel cerró el 8/11 con «Me parece bien grs» y Lucy con «Gracias», las dos con cita y sin un mensaje tuyo.", "p": "Esa 1 foto es la prueba de que sabes hacerlo. Faltan 18."}], "cierre": "Karyme, tu cuenta demuestra algo importante: el sistema funciona. 25 de tus 32 puntos los produjo el bot sin que tú tocaras nada, y eso es un piso que casi nadie tiene. Pero el método ya está grabado y tú ya lo viste, y lo que la clase dice es justamente esto: el bot filtra, tú cierras. Mientras las 39 conversaciones que el bot deja abiertas sigan sin tu voz, el número se va a quedar en el techo de lo que el sistema puede hacer solo. Y hay una razón concreta: a tus clientas de siempre les basta el recordatorio; ya saben cómo trabajas. Quien te vio en un anuncio y le escribió a las once de la noche no sabe nada de ti — y a esa, un audio tuyo de cuarenta segundos le dice más que veinte mensajes perfectos del bot.", "funciono": "El domingo 8 de noviembre entraste 28 veces al chat: fue tu día más fuerte de la semana con diferencia, y de ahí salieron citas para el lunes, el martes y el miércoles. Esa tarde demostró que cuando entras, se mueve. Y de las 19 que agendaron, a una le mandaste la foto antes de la cita — es una sola, pero es la prueba de que el gesto está en tu mano y no cuesta nada.", "acciones": [{"t": "Dos notas de voz: Ninfa y Solmar", "d": "Las dos escribieron el sábado contando exactamente lo que les pasa con sus cejas, y las dos siguen sin agendar. Son las más fáciles de la semana para un audio. No escribas: graba.", "g": "Hola Ninfa, soy Karyme 🩷 Escuché lo que me cuentas de tus cejas, que las tienes claritas y con poco pelo — eso lo trabajo muchísimo y se ve precioso cuando se hace respetando tu forma natural. En la evaluación gratis te hago el diseño sobre tu cara para que lo veas antes de decidir nada. Dime una cosa: ¿te gustaría que se notaran más definidas o buscas algo muy natural?"}, {"t": "Repite el domingo el lunes", "d": "El domingo tocaste 28 conversaciones y fue tu mejor día. El jueves solo 1. Si esos 28 mensajes se reparten en los siete días, las 39 que nadie tocó bajan a casi cero."}, {"t": "La foto a las 18 que faltan", "d": "De 19 citas, una recibió foto. El día antes de cada cita, una foto de un trabajo tuyo parecido a lo que ella pidió: es lo que hace que no se arrepienta."}], "pie": "Los números salen de tu cuenta de EpikFlow entre el lunes 2 y el domingo 8 de noviembre. Solo cuentan como tuyos los mensajes que salieron de tu teléfono o de tu equipo desde la plataforma, así que si algo quedó fuera es porque no pudimos verlo, nunca al revés."}</script><script src="/assets/a.js" defer></script></html>
