<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reporte de Gestión</title><link rel="stylesheet" href="/assets/s.css"><script type="application/json" id="d">{"slug": "karyme-rios", "nombre": "Karyme Rios", "estado": "listo", "rango": "Semana del 19 al 25 de octubre de 2026", "rangoCorto": "19–25 oct", "rangoAnt": "12–18 oct", "tasa": {"pct": 19, "num": 11, "den": 58, "botSola": 19, "ella": 0, "mutuo": 0, "leadSola": 0, "pctAnt": 22}, "historico": [{"etq": "21–27 sep", "tasa": 18}, {"etq": "28 sep–4 oct", "tasa": null}, {"etq": "5–11 oct", "tasa": 24}, {"etq": "12–18 oct", "tasa": 22}, {"etq": "19–25 oct", "tasa": 19}], "intro": ["Karyme, esta semana entraron 58 leads de anuncio y 11 agendaron. Escribiste cinco de los siete días y entraste personalmente en varias conversaciones de precio: a <b>Archilaalma82</b> le analizaste la foto y le respondiste tú, y eso es exactamente el método. Tu problema no es que no trabajes.", "Hay un número que explica el resto: mandaste <b>0 notas de voz</b> a 58 leads. Cero, y es la segunda semana seguida. Las 11 citas las cerró el bot sin que tú estuvieras en ninguna. <b>Todo lo demás en este reporte es consecuencia de eso.</b>"], "kpis": [{"k": "Leads de anuncio", "s": "Leads", "v": 58, "ant": 64, "t": "58", "at": "64"}, {"k": "Les escribiste antes", "s": "Escribiste", "v": 13, "ant": 11, "t": "13", "at": "11 de 64"}, {"k": "Con nota de voz", "s": "Voz", "v": 0, "ant": 0, "t": "0", "at": "0 de 64"}, {"k": "Agendaron", "s": "Agendaron", "v": 11, "ant": 14, "t": "11", "at": "14"}, {"k": "Les escribiste después", "s": "Después", "v": 4, "ant": 6, "t": "4", "at": "6 de 14"}, {"k": "Les mandaste la foto", "s": "Foto", "v": 0, "ant": 0, "t": "0", "at": "0 de 14"}], "barras": [{"label": "Leads a los que le escribiste", "num": 13, "den": 58, "meta": 60}, {"label": "Leads con nota de voz", "num": 0, "den": 58, "meta": 40}, {"label": "Citas a las que mandaste la foto", "num": 0, "den": 11, "meta": 60, "vacio": "Esta semana no hubo citas, así que esta barra no aplica."}], "origen": [{"k": "El bot", "v": 11, "c": "#2F6F68"}], "origenNota": "Las 11 citas las creó el bot y en ninguna habías puesto conversación antes. Tu bot responde bien la pregunta de precio —«la evaluación de cejas es completamente gratis y sin compromiso»— y eso se nota en el volumen de citas. Pero el bot consigue la cita de la evaluación; quien convence de hacerse la micropigmentación eres tú, y a las 11 que agendaron solo 4 recibieron un mensaje tuyo después.", "metodo": [{"c": "En la clase de nota de voz te explicamos los cinco elementos: su nombre, una validación, la necesidad que te expresó, una solución posible y una pregunta para continuar. Con energía. Es lo que construye la confianza que un lead de publicidad no trae, porque no es un referido: está cotizando y comparando.", "h": "0 notas de voz esta semana, con 58 leads. Y 0 la semana pasada, con 64. Son 122 leads seguidos sin que ninguno escuchara tu voz.", "p": "Escribes bien y se nota, pero un texto no transmite lo que transmiten 40 segundos de tu voz diciéndole su nombre. Es la herramienta que te falta entera."}, {"c": "En la clase de seguimiento diario te explicamos revisar todos los días las conversaciones de por lo menos los dos días anteriores y buscar cuatro grupos: quien dejó de responder, quien preguntó y no agendó, quien quedó a medias, a quien se le dieron horarios y no confirmó.", "h": "41 de los 58 leads no recibieron ni un mensaje tuyo. El domingo 25 estuviste en cero. <b>Tania</b> escribió el 24/10 a las 20:11 «Si claro» y nadie le respondió. <b>Reina</b> escribió el 25/10 «En cuanto pueda te la envio, gracias» —te estaba prometiendo la foto— y tampoco.", "p": "Tania dijo que sí y Reina quedó a medias con la foto pendiente. Las dos eran de los grupos exactos que la clase te pide revisar y las dos se quedaron ahí."}, {"c": "En la clase te explicamos que las sardinas también compran y que la objeción de precio no se deja sin trabajar: la lead de publicidad está comparando, y si solo recibe una cifra se va con quien se la dé más barata.", "h": "<b>Maria</b> preguntó el precio el 25/10 a las 20:46, el bot le respondió que la evaluación es gratis, y a las 20:52 ella cerró con: «No es muy caro lo haré en Mexi co gracias». Seis minutos entre la pregunta y la decisión de irse, y en esos seis minutos no apareciste.", "p": "Maria no se fue por el precio: se fue porque nadie le explicó por qué vale lo que vale. Eso solo se arregla con tu voz y con una pregunta."}], "cierre": "Nada de esto es una opinión nuestra: está grabado en la clase de seguimiento diario y en la de nota de voz, y esta semana quedó probado en tu propia cuenta. Donde entraste —la foto que le analizaste a Archilaalma82— la conversación avanzó; donde no entraste, Maria se fue a hacérselo a México en seis minutos. Y mientras no salga ni un audio el número no se va a mover del 19%: tus clientas de siempre vuelven solas porque ya confían en ti, pero quien te vio en un anuncio está comparando con otras tres micropigmentadoras. A esa hay que construirle la confianza, y la voz es lo más rápido que tienes para hacerlo.", "funciono": "Mira lo que le escribiste a <b>Archilaalma82</b> el 24/10, porque es el molde: «me puse a analizar tu foto y veo que tus cejas están un poco oscuras…». Ahí hiciste las tres cosas de la clase a la vez: miraste su caso concreto, le devolviste lo que ella te había mandado y abriste la puerta sin dar una cifra pelada. Eso mismo le respondiste a <b>Agueda</b> y a <b>Enma</b>: de las 16 personas que preguntaron el precio, en 3 entraste tú. También subiste la gestión antes de agendar de 11 a 13 con menos leads. Sabes hacerlo. Lo que falta es grabarlo en vez de escribirlo, y hacerlo más veces.", "acciones": [{"t": "Tania y Reina, con audio", "d": "Tania dijo «si claro» el sábado y Reina te prometió la foto el domingo. Las dos están a un audio de la cita.", "g": "Hola Tania, soy Karyme. Me quedé esperando para apartarte el cupo de la evaluación, que es gratis y sin compromiso. Mándame una foto de cómo están tus cejas ahora y en la evaluación te hago el diseño sobre tu rostro para que veas cómo te quedarían. ¿Te acomoda entre semana o el fin de semana?"}, {"t": "Cinco audios esta semana", "d": "Van 122 leads seguidos sin una sola nota de voz. No te pido 58: te pido 1 al día, a la persona que te mandó la foto o que te contó más. Con los cinco elementos de la clase: su nombre, validación, lo que ella te dijo, qué harías y una pregunta."}, {"t": "Las 11 que ya agendaron", "d": "Solo 4 de las 11 recibieron un mensaje tuyo después de la cita. A las otras 7 mándales un audio corto y una foto de un trabajo parecido al que quieren: es lo que más baja los no-show, y esta semana tuviste varios."}], "pie": "Los números salen de tu cuenta de EpikFlow entre el lunes 19 y el domingo 25 de octubre. Solo cuentan como tuyos los mensajes que salieron de tu teléfono o de tu equipo desde la plataforma, así que si algo quedó fuera es porque no pudimos verlo, nunca al revés."}</script><script src="/assets/a.js" defer></script></html>
