<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reporte de Gestión</title><link rel="stylesheet" href="/assets/s.css"><script type="application/json" id="d">{"slug": "karyme-rios", "nombre": "Karyme Rios", "estado": "listo", "rango": "Semana del 5 al 11 de octubre de 2026", "rangoCorto": "5–11 oct", "rangoAnt": "28 sep–4 oct", "tasa": {"pct": 24, "num": 17, "den": 71, "botSola": 24, "ella": 0, "mutuo": 0, "leadSola": 0, "pctAnt": 34}, "historico": [{"etq": "21–27 sep", "tasa": 18}, {"etq": "5–11 oct", "tasa": 24}], "intro": ["Esta semana entraron 71 personas por publicidad y agendaron 17: un <b>24%</b>. La semana pasada fueron 82 leads y 28 citas, un 34%. Bajaron los leads y bajó la tasa, pero sigues muy por encima de la media de la cartera y tu agenda llegó llena hasta el 23 de octubre.", "El dato que explica casi todo lo demás: de esas 71 personas, <b>50 no recibieron nunca un mensaje tuyo</b>. Las 17 citas las cerró el bot solo, las 17. Tú apareciste en 11 conversaciones de 71, y en ninguna de las que terminó en cita. No es que trabajes poco —tu cuenta mandó cientos de mensajes— es que el bot está haciendo el 100% del cierre y tú estás llegando después."], "kpis": [{"k": "Leads de anuncio", "s": "Leads", "v": 71, "ant": 82, "t": "71", "at": "82"}, {"k": "Les escribiste antes", "s": "Escribiste", "v": 11, "ant": 14, "t": "11 de 71", "at": "14 de 82"}, {"k": "Con nota de voz", "s": "Voz", "v": 1, "ant": 0, "t": "1", "at": "0"}, {"k": "Agendaron", "s": "Agendaron", "v": 17, "ant": 28, "t": "17", "at": "28"}, {"k": "Les escribiste después", "s": "Después", "v": 9, "ant": 12, "t": "9 de 17", "at": "12 de 28"}, {"k": "Les mandaste la foto", "s": "Foto", "v": 0, "ant": 0, "t": "0 de 17", "at": "0 de 28"}], "barras": [{"label": "Leads a los que le escribiste", "num": 11, "den": 71, "meta": 60}, {"label": "Leads con nota de voz", "num": 1, "den": 71, "meta": 40}, {"label": "Citas a las que mand  necesidad que ella expresó, una solución posible y una pregunta para continuar.", "h": "Esta semana mandaste <b>1</b> nota de voz. Es la primera que registramos: la semana pasada fueron 0 y la anterior también.", "p": "Una es mejor que cero y marca el camino. En una cuenta con 71 leads, 10 audios a la semana —uno cada vez que alguien pregunta el precio— es un trabajo de veinte minutos que el bot no puede hacer por ti."}], "cierre": "Tu número es de los mejores de la cartera y eso no es casualidad: tienes el embudo más limpio y una agenda llena hasta el 23 de octubre. Pero el 24% de esta semana lo cerró el bot solo, igual que el 34% de la pasada, y por eso la tasa sube y baja sin que tú puedas hacer nada: depende de qué tan buena venga la gente del anuncio, no de ti. El día que entres en diez conversaciones a la semana —las diez que preguntan el precio y se quedan dudando— tu número deja de depender del anuncio y empieza a depender de ti. Y lo que vimos esta semana es que cuando respondes, respondes bien: a Anisleidis le diste el rango de precios tú misma y la conversación siguió.", "funciono": "El seguimiento después de agendar: a <b>9 de las 17</b> citas les escribiste algo después de reservar. Más de la mitad. Es el único punto del método donde apareces de forma consistente, y se nota en que tu agenda del 13 al 23 de octubre está casi completa. Lo que falta es hacer eso mismo <i>antes</i> de la cita, con quien todavía no agendó.", "acciones": [{"t": "Las que preguntaron precio y no agendaron", "d": "22 personas preguntaron cuánto cuesta esta semana. El bot les respondió bien —«la evaluación es gratis»— pero varias no siguieron: Luz, Sandy, Nat, ♡Albita♡. Mándales un audio corto a cada una.", "g": "Hola [nombre], soy Karyme, de Barbie Brows. Vi que preguntaste por el precio y quería contestarte yo misma. El costo depende de cómo estén tus cejas ahora: no es lo mismo un diseño desde cero que un retoque sobre algo que ya tienes. Por eso la evaluación es gratis y dura media hora. Cuéntame una cosa: ¿tienes micropigmentación previa o sería la primera vez?"}, {"t": "Diez minutos cada mañana", "d": "Entran unas diez personas al día. Revisar las de ayer y escribirle a las que se quedaron sin respuesta tuya toma menos que un café, y es la diferencia entre 24% y 40%.", "g": ""}, {"t": "La foto del antes y después", "d": "De las 17 que agendaron, a ninguna le mandaste una foto de tu trabajo antes de la cita. Es lo que hace que no se arrepientan el día anterior: de las 17 citas de la semana, varias terminaron en no-show o cancelación.", "g": "Hola [nombre], ya quedó tu evaluación. Te dejo un antes y después de una clienta que llegó con las cejas muy parecidas a las tuyas, para que veas de qué hablamos. Nos vemos el [día] 🩷"}], "pie": "Los números salen de tu cuenta de EpikFlow entre el lunes 5 y el domingo 11 de octubre. Solo cuentan como tuyos los mensajes que salieron de tu teléfono o de tu equipo desde la plataforma, así que si algo quedó fuera es porque no pudimos verlo, nunca al revés."}</script><script src="/assets/a.js" defer></script></html>
