m": 0, "den": 4, "meta": 60}], "origen": [{"k": "El bot", "v": 3, "c": "#2F6F68"}, {"k": "Tú, desde el teléfono", "v": 1, "c": "#C0522F"}], "origenNota": "De las 4 citas, en 2 participaron los dos y 2 las cerró el bot solo. Fíjate en un detalle: en las semanas en que tú entras antes de que se agende, se agenda. El problema no es que el bot te quite citas; es que hay 31 conversaciones en las que nadie más que él estuvo.", "metodo": [{"c": "«Rutina diaria: revisa las conversaciones de por lo menos los dos días anteriores, todos los días.» No es un día largo a la semana: es un rato cada día.", "h": "Escribiste el martes 15 (14 mensajes), el miércoles 16 (2) y el jueves 17 (5). El lunes, viernes, sábado y domingo: cero. El domingo 20 entraron Gaínza, Luis, 𝑪𝒆𝒍𝒊, Claudia, Irina, Linsy y Marz, y ninguna recibió un mensaje tuyo.", "p": "Ese domingo fue el día de más leads de la semana y se atendió solo con el bot. Ninguno de esos siete agendó."}, {"c": "«No respondas únicamente con el precio.» Primero: “claro que sí, con mucho gusto te doy toda la información, pero antes cuéntame, ¿qué te gustaría mejorar exactamente?”", "h": "21 personas preguntaron precio esta semana. En las 21 contestó el bot con la cifra: «la sesión integral terapéutica es $165 por 80 minutos». A Marz, el 20/09 a las 11:42, y a Gaínza el mismo día a las 18:54. En ninguna entraste tú.", "p": "$165 sin contexto es caro. $165 después de que la persona te cuenta que tiene tensión acumulada y no duerme, es barato. La diferencia la pone la pregunta."}, {"c": "«Las sardinas también compran»: quien preguntó y no agendó no está descartada, está esperando que alguien retome.", "h": "Sandra habló 15 mensajes y terminó el 18/09 con «Muchisimas gracias, no, yo no tengo instagram». Gaínza escribió 8 mensajes y dijo lo que quería: «de relajarse y liberar tensión». Linsy preguntó directamente «cuales son las fechas y horas disponibles?». Ninguna volvió a saber de ti.", "p": "Linsy estaba pidiendo agendar. Se quedó sin Hola [nombre], soy Mariely 🤍 me quedé pensando en lo que me escribiste, que necesitas liberar tensión acumulada. Justo eso es lo que trabajo en la sesión integral. Cuéntame, ¿hace cuánto la vienes cargando?"}, {"t": "Un rato fijo todos los días", "d": "Tres días de trabajo y cuatro en blanco. Pon 15 minutos en la mañana, en la computadora, para revisar los dos días anteriores. Es el cambio que más te va a mover el número.", "g": ""}], "pie": "Los números salen de tu cuenta de EpikFlow entre el 14 y el 20 de septiembre. Solo cuentan como tuyos los mensajes que salieron de tu teléfono o de tu equipo desde la plataforma, así que si algo quedó fuera es porque no pudimos verlo, nunca al revés."}</script><script src="/assets/a.js" defer></script></html>
