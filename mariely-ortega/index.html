guimiento, y esta semana tu propia cuenta mostró lo que pasa cuando no se aplica: cuatro días sin revisar y 18 de 19 personas se fueron. Y ojo con la diferencia que lo explica todo: tus clientas de siempre te esperan porque ya confían en ti; quien te vio en un anuncio no tiene esa paciencia, y a las 48 horas ya está hablando con otra.", "funciono": "Las 8 notas de voz. De los 11 leads a los que escribiste, a 8 les mandaste audio: es la proporción más alta que has tenido y es justo lo que pide la clase para que una desconocida te empiece a conocer. La herramienta la estás usando bien; lo que falta es usarla todos los días y no solo los sábados.", "acciones": [{"t": "Diez minutos todos los días", "d": "Tus mensajes salieron en 3 de 7 días. Abre las conversaciones de los dos días anteriores cada mañana, aunque sea diez minutos."}, {"t": "Empieza por Kiki y Abraham", "d": "Kiki te escribió 19 veces y Abraham 8, y ninguno tuvo respuesta tuya. Son los dos leads más calientes que dejaste enfriar.", "g": "Hola Kiki, soy Mariely. Vi todo lo que me escribiste y quiero atenderte yo directamente. Cuéntame, ¿qué es lo que más te está molestando ahora mismo? Con eso te digo qué sesión te conviene."}, {"t": "Entra después de que el bot dé el precio", "d": "Ocho personas preguntaron precio esta semana. El bot les respondió y ahí quedó. Entra tú después con una pregunta.", "g": "Hola [nombre], soy Mariely. Ya viste el valor de la sesión. Antes de que decidas, cuéntame: ¿qué te gustaría mejorar exactamente, y hace cuánto lo vienes sintiendo?"}], "pie": "Los números salen de tu cuenta de EpikFlow entre el lunes 21 y el domingo 27 de septiembre. Solo cuentan como tuyos los mensajes que salieron de tu teléfono o de tu equipo desde la plataforma, así que si algo quedó fuera es porque no pudimos verlo, nunca al revés."}</script><script src="/assets/a.js" defer></script></html>
