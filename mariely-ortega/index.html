<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reporte de Gestión</title><link rel="stylesheet" href="/assets/s.css"><script type="application/json" id="d">{"slug": "mariely-ortega", "nombre": "Mariely Ortega", "estado": "listo", "rango": "Semana del 28 de septiembre al 4 de octubre de 2026", "rangoCorto": "28 sep–4 oct", "rangoAnt": "21–27 sep", "tasa": {"pct": 2, "num": 1, "den": 44, "botSola": 2, "ella": 0, "mutuo": 0, "leadSola": 0, "pctAnt": 5}, "historico": [{"etq": "24–30 ago", "tasa": 10}, {"etq": "31 ago–6 sep", "tasa": 12}, {"etq": "7–13 sep", "tasa": 11}, {"etq": "14–20 sep", "tasa": 11}, {"etq": "21–27 sep", "tasa": 5}, {"etq": "28 sep–4 oct", "tasa": 2}], "intro": ["Esta semana entraron 44 leads de publicidad, más del doble que la semana pasada, y agendó 1. Uno. La tasa quedó en 2%, el número más bajo de las seis semanas que llevamos midiéndote. Y la causa está en un dato muy simple: de los siete días de la semana, le escribiste a leads de publicidad en dos.", "El martes 29 mandaste 6 mensajes y el miércoles 30 mandaste 28. El lunes, el jueves, el viernes, el sábado y el domingo no salió ni un mensaje tuyo hacia una lead de publicidad. Esos cinco días entraron la mayoría de las 44 personas, y las atendió el bot de principio a fin. <b>Todo lo demás en este reporte es consecuencia de eso.</b>"], "kpis": [{"k": "Leads de anuncio", "s": "Leads", "v": 44, "ant": 19, "t": "44", "at": "19"}, {"k": "Les escribiste antes", "s": "Escribiste", "v": 14, "ant": 11, "t": "14", "at": "11 de 19"}, {"k": "Con nota de voz", "s": "Voz", "v": 10, "ant": 8, "t": "10", "at": "8 de 19"}, {"k": "Agendaron", "s": "Agendaron", "v": 1, "ant": 1, "t": "1", "at": "1"}, {"k": "Les escribiste después", "s": "Después", "v": 0, "ant": 1, "t": "0", "at": "1 de 1"}, {"k": "Les mandaste la foto", "s": "Foto", "v": 0, "ant": 0, "t": "0", "at": "0 de 1"}], "barras": [{"label": "Leads a los que le escribiste", "num": 14, "den": 44, "meta": 60}, {"label": "Leads con nota de voz", "num": 10, "den": 44, "meta": 40}, {"label": "Citas a las que mandaste la foto", "num": 0, "den": 1, "meta": 60}], "origen": [{"k": "El bot", "v": 1, "c": "#2F6F68"}], "origenNota": "La única cita de la semana la creó el bot, y en esa conversación tú no apareciste. En el desglose de arriba: cero citas tuyas, cero de esfuerzo mutuo. La semana pasada, con 19 leads, la única cita sí fue de esfuerzo mutuo — tú habías entrado. Es la diferencia entre 5% y 2%.", "metodo": [{"c": "En la clase de seguimiento te explicamos la rutina diaria: todos los días revisar las conversaciones de por lo menos los dos días anteriores, y buscar a quien dejó de responder, a quien preguntó y no agendó, a quien quedó a medias y a quien se le dieron horarios y no confirmó. Todos los días.", "h": "Mensajes tuyos a leads de publicidad por día: lunes 28 ninguno, martes 29 seis, miércoles 30 veintiocho, jueves 1 ninguno, viernes 2 ninguno, sábado 3 ninguno, domingo 4 ninguno. 30 de las 44 leads no recibieron ni un mensaje tuyo.", "p": "Héctor escribió el sábado 4 a las 15:29 \"Háblame de la duración y el costo por favor\" — una persona lista para comprar — y no tuvo respuesta tuya. Yami preguntó el precio ese mismo día. Jonathan y Sylvia escribieron el formulario del anuncio y nadie más que el bot les habló. Cinco días sin revisar es la razón completa del 2%."}, {"c": "En la clase te enseñamos a crear confianza antes de agendar con dos o tres preguntas, y que las sardinas también compran: el bot ayuda a identificar a los peces dorados, pero eso no autoriza a abandonar al resto. Hay quien escribe un año después.", "h": "Ivy le contó al bot que tiene ansiedad generalizada, artritis reumatoide sin diagnosticar y hemoglobina baja. Isabel le contó presión alta, tiroides y artritis. Una lead le escribió que hace tres semanas perdió a su esposo y que le duele el alma. Alma escribió 15 mensajes. Ninguna de las cuatro recibió un mensaje tuyo.", "p": "Esas mujeres no estaban pidiendo precio: estaban contando su dolor a alguien que creían que era tú. En masaje terapéutico eso es el momento de la venta, y es exactamente lo que la clase llama construir confianza. Llegó solo, sin que tuvieras que provocarlo, y se quedó sin respuesta."}, {"c": "En la clase te explicamos que el bot es apoyo, no reemplazo: responde rápido, inicia y filtra, pero tú interpretas la necesidad y cierras. La confianza la construyes tú.", "h": "El bot atendió solo a 30 de tus 44 leads y cerró 1 cita. La semana pasada, cuando entraste en 11 de 19 conversaciones, la proporción de cierre fue más del doble.", "p": "El bot está haciendo bien su parte: saluda, pregunta por el dolor, recoge las condiciones médicas y deja la conversación lista. Lo que no puede hacer es lo que solo tú puedes: que la persona sienta que hay una terapeuta de carne y hueso del otro lado. Por eso 44 leads produjeron una cita."}, {"c": "En la clase te enseñamos el embudo de opciones para agendar: nunca \"¿cuándo quieres venir?\", sino tres pasos — ¿entre semana o fin de semana? → ¿mañana o tarde? → ¿a las 10 o a las 11?", "h": "A María el bot le ofreció un horario concreto para el viernes el 1 de octubre, después de darle el precio. Nadie volvió a esa conversación. No hubo un solo seguimiento tuyo a ninguna de las 22 personas que preguntaron precio esta semana.", "p": "El embudo solo funciona si alguien lo recorre hasta el final. La oferta de horario quedó colgada y la lead se fue. Un mensaje tuyo al día siguiente — \"¿te sirvió el viernes o te busco otro día?\" — es todo lo que faltaba."}], "cierre": "No te vamos a decir que no sabes hacerlo, porque sí sabes: el miércoles 30 mandaste 28 mensajes en un día y esta semana mandaste 10 notas de voz. El problema es que ese miércoles fue una isla. El método ya está grabado y ya lo viste en la clase de seguimiento, y esta semana se probó en tu propia cuenta: la única cita salió de la única zona donde hubo actividad, y los cinco días sin revisar produjeron cero. Mientras se siga trabajando a ráfagas el número no se va a mover — tus clientas de siempre llegan solas porque ya confían en ti, pero quien te vio en un anuncio y contó que perdió a su esposo hace tres semanas necesitaba que le contestaras tú ese mismo día, no el miércoles siguiente.", "funciono": "Tus 10 notas de voz, y el miércoles 30 de septiembre con 28 mensajes en un día. Ese día demuestra la capacidad: cuando te sientas a trabajar las conversaciones, las trabajas. Y mira lo que el bot consiguió en la conversación con Ivonne el domingo, porque es el guion que te va a servir: preguntó \"antes de darle el valor, quisiera entender un poquito mejor lo que necesita\", y en cuatro mensajes Ivonne contó el hombro, el vértigo, la ansiedad y la artritis. La gente te va a contar todo si se lo preguntas antes del precio. Esa conversación estaba lista para que entraras tú y la cerraras.", "acciones": [{"t": "Héctor, Yami y Alma: hoy", "d": "Héctor pidió duración y costo el sábado, Yami preguntó el precio ese mismo día, Alma escribió 15 mensajes. Los tres están tibios y ninguno habló contigo. Empieza por Héctor: ya dijo que quiere saber para decidir.", "g": "Hola Héctor, soy Mariely de Valley Holistic Center. Perdón por no escribirte yo antes. La sesión son 80 minutos y la adapto a lo que tu cuerpo necesite ese día. Cuéntame para prepararla bien: ¿qué dolor o molestia es lo que más te está incomodando ahora? Y dime, ¿te queda mejor entre semana o fin de semana?"}, {"t": "Las cuatro que te contaron su dolor", "d": "Ivy, Isabel, la señora que perdió a su esposo y Alma le abrieron su historia médica al bot. Son las leads más calientes que vas a tener este mes. Una nota de voz tuya a cada una, nombrando lo que ellas dijeron.", "g": "Hola [nombre], soy Mariely. Leí lo que me contaste y quiero que sepas que lo recibí con mucho respeto. Con la artritis y la ansiedad trabajo distinto: más suave, más lento, enfocada en bajar el sistema nervioso antes de tocar la zona que duele. ¿Te parece si te reservo un espacio esta semana y lo vemos en persona? ¿Mañana o tarde te sirve mejor?"}, {"t": "Quince minutos al día, los siete días", "d": "No te pedimos otro miércoles de 28 mensajes. Te pedimos quince minutos cada día: abres las conversaciones de los dos días anteriores y te aseguras de que nadie que preguntó precio se quedó solo con el bot. Esta semana se quedaron 22."}], "pie": "Los números salen de tu cuenta de EpikFlow entre el lunes 28 de septiembre y el domingo 4 de octubre de 2026. Solo cuentan como tuyos los mensajes que salieron de tu teléfono o de tu equipo desde la plataforma, así que si algo quedó fuera es porque no pudimos verlo, nunca al revés."}</script><script src="/assets/a.js" defer></script></html>
