"0 de 3"}], "barras": [{"label": "Leads a los que le escribiste", "num": 6, "den": 27, "meta": 60}, {"label": "Leads con nota de voz", "num": 0, "den": 27, "meta": 40}, {"label": "Citas a las que mandaste la foto", "num": 1, "den": 5, "meta": 60, "vacio": "Esta semana no hubo citas, así que esta barra no aplica."}], "origen": [{"k": "El bot", "v": 2, "c": "#2F6F68"}, {"k": "Tú, desde el teléfono", "v": 3, "c": "#C0522F"}], "origenNota": "De las 5 citas, 3 las pusiste tú a mano desde el teléfono y 2 las creó el bot. Y en 3 de las 5 tú habías escrito antes de que la cita existiera. Ese es tu punto fuerte y hay que decirlo: tú cierras. Lo que no está pasando es que llegues a las conversaciones, porque de 27 solo entraste en 6.", "metodo": [{"c": "En la clase de seguimiento diario te explicamos que la rutina es diaria: todos los días revisar las conversaciones de por lo menos los dos días anteriores y buscar cuatro grupos —quien dejó de responder, quien preguntó y no agendó, quien quedó a medias, a quien se le dieron horarios y no confirmó.", "h": "Tu primer mensaje a un lead de esta semana fue el viernes 23. Lunes, martes, miércoles y jueves: cero. <b>Nayirly</b> escribió el 21/10 a las 17:26 «Preferiría la próxima semana pero aún no te confirmo porque tengo que organizar gastos…» y nadie volvió a hablarle. Mayra tuvo 17 mensajes en su conversación y Elizabeth 14, y ninguno era tuyo.", "p": "Nayirly es el grupo «quedó a medias» en estado puro: dijo que sí quería y que el tema era el dinero. Pasaron cuatro días sin que nadie la tocara, y no agendó."}, {"c": "En la clase de nota de voz te explicamos los cinco elementos: su nombre, una validación, la necesidad que te expresó, una solución posible y una pregunta para continuar. Con energía. Es lo que construye la confianza que un lead de publicidad no trae, porque ese lead no es un referido: quizá nunca te había visto y está comparando.", "h": "Esta semana no mandaste ninguna nota de voz a ningún lead. Cero de 27. <b>Eliezer</b> escribió el 23/10 a las 12:05: «Molestia en un hombro… cierto dolor en la columna pero no padezco de hernias… y cansancio». Te contó exactamente lo que le pasa y no recibió nada tuyo.", "p": "Eliezer era un audio de 40 segundos: su nombre, «entiendo lo del hombro y la columna», lo que haces con eso y una pregunta. Era la nota de voz más fácil de la semana y no salió."}, {"c": "En la clase te enseñamos no responder únicamente con el precio: «claro que sí, con mucho gusto te doy toda la información, pero antes cuéntame, ¿qué te gustaría mejorar exactamente?». Primero la necesidad, después la cifra.", "h": "20 de los 27 leads preguntaron el precio. A 19 les respondió el bot con los $165. Dalycolon preguntó el 22/10 «En donde estas ubicada? Y cuanto es el costo por sección?», Fabian el 23/10 «Cuanto sale?», Dexy el 23/10 «Cuanto seria el costo»: los tres recibieron la cifra y ninguno de ellos la recibió de ti.", "p": "20 personas abrieron la puerta preguntando el precio. En 19 de esas 20 conversaciones no apareciste. En la única en que apareciste —Jota, el domingo— agendó."}], "cierre": "Nada de esto es una opinión nuestra: está grabado en la clase de seguimiento diario y en la de nota de voz, en el área de miembros, y esta semana quedó probado en tu propia cuenta. Las 3 citas con tu conversación detrás salieron de los dos días en que sí entraste; los cuatro días en cero produjeron a Nayirly, Eliezer, Mayra y Elizabeth sin una sola palabra tuya. Y mientras entres solo el viernes, el número no se va a mover: tus pacientes de siempre vuelven solas porque ya confían en ti y saben cómo trabajas, pero quien te vio en un anuncio está comparando precios de masajes. A esa hay que construirle la confianza, y tú ya demostraste esta semana que sabes hacerlo.", "funciono": "Mira lo de Jota, porque es la prueba de todo el reporte. Preguntó el 25/10 a las 19:56 «Si y el precio?», le contestaste <b>tú</b> y agendó para el 1 de noviembre. De las 20 personas que preguntaron el precio esta semana, esa fue la única en la que entraste tú, y fue la única de ese grupo que terminó en cita. Además, de las 5 citas de la semana 3 llevan tu conversación detrás, cuando la semana pasada eran 0 de 3, y a 4 de las 5 les escribiste después de agendar. Tu cierre funciona. Lo que falta es que llegues a más conversaciones, y antes.", "acciones": [{"t": "Eliezer y Nayirly, hoy", "d": "Eliezer te contó su dolor y Nayirly te dijo que quería pero tenía que organizar gastos. Las dos son nota de voz, no texto. Son las dos primeras de la mañana.", "g": "Hola Eliezer, soy Mariely, de Valley Holistic Center. Vi lo que me contaste del hombro, la columna y el cansancio, y eso es exactamente lo que trabajo en la sesión integral: no es un masaje relajante, es una sesión hecha para ese cuadro. Cuéntame una cosa: ¿hace cuánto tienes la molestia del hombro y empeora al final del día o al despertar?"}, {"t": "Una nota de voz al día, mínimo", "d": "Esta semana fueron cero. No hace falta mandar 20: con una al día a la persona que más claro te dijo qué le duele, cierras la semana con 7 y ninguna otra clienta de la cartera hace eso bien."}, {"t": "Entra cuando pregunten el precio", "d": "20 personas preguntaron el precio esta semana y entraste en 1, y esa agendó. Esta semana entra en todas: el bot ya dio la cifra, tú entra después con una pregunta.", "g": "Hola [nombre], soy Mariely. Ya le pasaron el valor de la sesión, pero quiero entender su caso antes de que decida: ¿qué es lo que más le molesta ahora mismo y desde cuándo lo tiene? Según lo que me cuente le digo si la sesión integral es lo que necesita o si hay algo más conveniente para usted."}], "pie": "Los números salen de tu cuenta de EpikFlow entre el lunes 19 y el domingo 25 de octubre. Solo cuentan como tuyos los mensajes que salieron de tu teléfono o de tu equipo desde la plataforma, así que si algo quedó fuera es porque no pudimos verlo, nunca al revés."}</script><script src="/assets/a.js" defer></script></html>
