<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reporte de Gestión</title><link rel="stylesheet" href="/assets/s.css"><script type="application/json" id="d">{"slug": "mariely-ortega", "nombre": "Mariely Ortega", "estado": "listo", "rango": "Semana del 5 al 11 de octubre de 2026", "rangoCorto": "5–11 oct", "rangoAnt": "28 sep–4 oct", "tasa": {"pct": 26, "num": 6, "den": 23, "botSola": 17, "ella": 0, "mutuo": 9, "leadSola": 0, "pctAnt": 2}, "historico": [{"etq": "24–30 ago", "tasa": 10}, {"etq": "31 ago–6 sep", "tasa": 12}, {"etq": "7–13 sep", "tasa": 11}, {"etq": "14–20 sep", "tasa": 11}, {"etq": "21–27 sep", "tasa": 5}, {"etq": "28 sep–4 oct", "tasa": 2}, {"etq": "5–11 oct", "tasa": 26}], "intro": ["Esta es, de lejos, tu mejor semana desde que medimos: pasaste de <b>2% a 26%</b> de agendamiento. La semana pasada entraron 44 leads y agendó 1; esta semana entraron 23 y agendaron 6. Con la mitad de gente sacaste seis veces más citas, y en 2 de esas 6 el trabajo fue tuyo y del bot juntos — la semana pasada no hubo ninguna con tu huella.", "Y aun así queda la mitad de la semana sin tocar: <b>12 de 23 personas cerraron el domingo sin un mensaje tuyo</b>, y tus mensajes salieron solo 4 días — martes 3, miércoles 9, jueves 1, y 12 el domingo. Lunes, viernes y sábado no salió ninguno. Lo que acabas de demostrar es que cuando entras, conviertes; lo que falta es entrar todos los días. <b>Todo lo demás en este reporte es consecuencia de eso.</b>"], "kpis": [{"k": "Leads de anuncio", "s": "Leads", "v": 23, "ant": 44, "t": "23", "at": "44"}, {"k": "Les escribiste antes", "s": "Escribiste", "v": 10, "ant": 14, "t": "10", "at": "14 de 44"}, {"k": "Con nota de voz", "s": "Voz", "v": 6, "ant": 10, "t": "6", "at": "10 de 44"}, {"k": "Agendaron", "s": "Agendaron", "v": 6, "ant": 1, "t": "6", "at": "1"}, {"k": "Les escribiste después", "s": "Después", "v": 3, "ant": 0, "t": "3", "at": "0 de 1"}, {"k": "Les mandaste la foto", "s": "Foto", "v": 0, "ant": 0, "t": "0", "at": "0 de 1"}], "barras": [{"label": "Leads a los que le escribiste", "num": 10, "den": 23, "meta": 60}, {"label": "Leads con nota de voz", "num": 6, "den": 23, "meta": 40}, {"label": "Citas a las que mandaste la foto", "num": 0, "den": 6, "meta": 60, "vacio": "Esta semana no hubo citas, así que esta barra no aplica."}], "origen": [{"k": "El bot", "v": 4, "c": "#2F6F68"}, {"k": "Tú, desde el teléfono", "v": 2, "c": "#C0522F"}], "origenNota": "De las 6 citas, 4 las creó el bot y 2 las creaste tú desde el teléfono. Mirando quién habló con la persona <b>antes</b> de que existiera la cita, en 2 de las 6 el trabajo fue de los dos. Ese es el cambio real de la semana: la semana pasada no apareciste en ninguna.", "metodo": [{"c": "La rutina diaria: revisar todos los días las conversaciones de por lo menos los dos días anteriores.", "h": "Tus mensajes a leads salieron solo 4 de los 7 días: martes 3, miércoles 9, jueves 1 y domingo 12. <b>Lunes, viernes y sábado: ninguno.</b> Y 12 de 23 personas cerraron la semana sin un mensaje tuyo.", "p": "Esos tres días en blanco son donde se quedó la otra mitad de la semana. Con 23 leads, cada día sin revisar son 3 o 4 personas que se enfrían — y ya probaste esta misma semana que las que tocas agendan."}, {"c": "Vende el siguiente paso, no el procedimiento, y usa el embudo de opciones: ¿entre semana o fin de semana? → ¿mañana o tarde? → ¿a las 10 o a las 11?", "h": "Monica te escribió el 11/10 a las 14:49: «<b>Hi, can you send me your address please... I'll like to schedule an appointment</b>». No recibió nada tuyo. Madeline y Star pidieron el masaje holístico ese mismo día y tampoco.", "p": "Monica no estaba preguntando: estaba pidiendo agendar. Es la conversión más barata de la semana y se quedó esperando. Star y Madeline llegaron con la intención ya escrita en su primer mensaje."}, {"c": "Crea confianza antes de agendar con dos o tres preguntas, y no dejes que la conversación se quede en «yo te aviso».", "h": "Leonardo cambió 13 mensajes el domingo, preguntó el valor y terminó en «Supee» sin agendar. Jotho cambió 8 y cerró con «Igualmente». Ninguno de los dos recibió un mensaje tuyo.", "p": "Las dos conversaciones llegaron hasta el precio y ahí se apagaron. Un «yo te aviso» no es un no: es una persona esperando que alguien le proponga una fecha concreta. Esa propuesta solo la puedes hacer tú."}, {"c": "Después de que agenda, empujar a la que ya agendó para que asista, con el mensaje y la foto del lugar.", "h": "De las 6 que agendaron le escribiste a 3, y a <b>ninguna</b> le mandaste la foto del lugar. Debbie, Vane y Brenders cerraron sus citas con el bot sin escuchar tu voz.", "p": "Tienes seis citas nuevas en la agenda, que es el doble de lo normal — y tres de esas personas no saben todavía ni cómo es el sitio ni quién las va a atender. Es donde se pierden las citas ya ganadas."}], "cierre": "Esto no es una corrección, es una confirmación: el método ya está grabado, ya lo viste, y esta semana se probó en tu propia cuenta. Hiciste exactamente lo que enseña la clase con 10 personas y seis de ellas terminaron en cita; con las otras 13 no entraste y ninguna agendó. Mientras los días en blanco sigan ahí, el número va a oscilar entre el 2% y el 26% según la semana. Tus clientes de siempre vuelven solos porque ya confían en ti; quien te vio en un anuncio no trae esa confianza y se va con quien le conteste primero.", "funciono": "El salto de 2% a 26%, y vale la pena ver cómo lo hiciste. En la conversación con el cliente del sábado 17 preguntaste el nombre, el apellido, explicaste el servicio y el precio, y cuando el horario no estaba disponible <b>ofreciste dos opciones concretas en vez de dejarlo abierto</b>: «viernes 16 a las 11:30 AM o 4:30 PM, ¿cuál prefiere?». Esa cita se cerró. Eso es exactamente el embudo de opciones de la clase, hecho por ti, y es la razón del 26%.", "acciones": [{"t": "Monica, Madeline y Star — hoy", "d": "Las tres escribieron el domingo pidiendo cita o información y ninguna tiene respuesta tuya. Monica literalmente pidió agendar.", "g": "Hola [nombre], soy Mariely de Valley Holistic Center. Perdón la demora, le respondo yo. Estoy en 1664 Pleasant Hill Road, Kissimmee. Para su sesión, ¿le queda mejor entre semana o el fin de semana?"}, {"t": "Leonardo y Jotho, con una nota de voz", "d": "Cambiaron 13 y 8 mensajes, llegaron hasta el precio y se quedaron ahí. Un audio corto con una pregunta concreta los reabre.", "g": "Hola [nombre], soy Mariely. Vi nuestra conversación y quería hablarle yo directamente. Cuénteme: ¿qué es lo que más le molesta ahora mismo del cuerpo? Con eso le digo exactamente cómo trabajaría su sesión. ¿Le reviso disponibilidad para esta semana?"}, {"t": "La foto del lugar a las 6 que agendaron", "d": "Ninguna de las 6 la recibió. Es un mensaje de 10 segundos y baja los plantones.", "g": "Hola [nombre] 🤍 Le confirmo su sesión de [día] a las [hora]. Le dejo una foto del lugar para que lo ubique fácil: 1664 Pleasant Hill Road, Kissimmee. Aquí la espero."}], "pie": "Los números salen de tu cuenta de EpikFlow entre el lunes 5 y el domingo 11 de octubre. Solo cuentan como tuyos los mensajes que salieron de tu teléfono o de tu equipo desde la plataforma, así que si algo quedó fuera es porque no pudimos verlo, nunca al revés."}</script><script src="/assets/a.js" defer></script></html>
