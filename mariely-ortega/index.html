<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reporte de Gestión</title><link rel="stylesheet" href="/assets/s.css"><script type="application/json" id="d">{"slug": "mariely-ortega", "nombre": "Mariely Ortega", "estado": "listo", "rango": "Semana del 12 al 18 de octubre de 2026", "rangoCorto": "12–18 oct", "rangoAnt": "5–11 oct", "tasa": {"pct": 16, "num": 3, "den": 19, "botSola": 16, "ella": 0, "mutuo": 0, "leadSola": 0, "pctAnt": 26}, "historico": [{"etq": "24–30 ago", "tasa": 10}, {"etq": "31 ago–6 sep", "tasa": 12}, {"etq": "7–13 sep", "tasa": 11}, {"etq": "14–20 sep", "tasa": 11}, {"etq": "21–27 sep", "tasa": 5}, {"etq": "28 sep–4 oct", "tasa": 2}, {"etq": "5–11 oct", "tasa": 26}, {"etq": "12–18 oct", "tasa": 16}], "intro": ["Entraron 19 leads de la pauta y agendaron 3. La tasa bajó de 26% a 16%, y lo que cambió no es el volumen: es de quién son las citas. La semana pasada 2 de las 6 citas llevaban tu conversación dentro. Esta semana, de las 3, <b>ninguna</b>: las tres las cerró el bot solo, sin que tú hubieras escrito antes.", "El otro número que cayó es el que más duele: las notas de voz pasaron de 6 a 1. Y la única que mandaste, a Marleny el 14/10, fue exactamente en el momento correcto — cuando preguntó por los paquetes y el precio. Esa sola nota de voz es la prueba de que sabes hacerlo. <b>Todo lo demás en este reporte es consecuencia de eso.</b>"], "kpis": [{"k": "Leads de anuncio", "s": "Leads", "v": 19, "ant": 23, "t": "19", "at": "23"}, {"k": "Les escribiste antes", "s": "Escribiste", "v": 8, "ant": 10, "t": "8", "at": "10 de 23"}, {"k": "Con nota de voz", "s": "Voz", "v": 1, "ant": 6, "t": "1", "at": "6 de 23"}, {"k": "Agendaron", "s": "Agendaron", "v": 3, "ant": 6, "t": "3", "at": "6"}, {"k": "Les escribiste después", "s": "Después", "v": 3, "ant": 3, "t": "3", "at": "3 de 6"}, {"k": "Les mandaste la foto", "s": "Foto", "v": 0, "ant": 0, "t": "0", "at": "0 de 6"}], "barras": [{"label": "Leads a los que le escribiste", "num": 8, "den": 19, "meta": 60}, {"label": "Leads con nota de voz", "num": 1, "den": 19, "meta": 40}, {"label": "Citas a las que mandaste la foto", "num": 0, "den": 3, "meta": 60, "vacio": "Esta semana no hubo citas, así que esta barra no aplica."}], "origen": [{"k": "El bot", "v": 3, "c": "#2F6F68"}], "origenNota": "Las 3 citas de leads de anuncio las creó el bot, y mirando quién participó antes de la cita el resultado es el mismo: ninguna de las 3 personas había hablado contigo. A las 3 sí les escribiste después, y eso está bien hecho. El problema es que llegaron a la cita sin ti.", "metodo": [{"c": "En la clase de seguimiento te explicamos que el bot es apoyo, no reemplazo: cuando alguien pregunta el precio ya está levantando la mano, y ahí entras tú — «claro que sí, con mucho gusto te doy toda la información, pero antes cuéntame, ¿qué te gustaría mejorar exactamente?».", "h": "9 leads preguntaron precio esta semana. Entraste en uno: a Marleny el 14/10 («Si me podrías decir qué paquetes tienes y precio») le mandaste una nota de voz. En los otros ocho contestó el bot — Rocio el 15/10, Nelson el 16/10, Sandra el 18/10 a las 22:08 con un «Precio» a secas.", "p": "Ninguno de esos ocho agendó. En el único donde entraste tú con tu voz, la conversación avanzó."}, {"c": "Las sardinas también compran. A quien ya avanzó mucho no se le abandona, y la pregunta gancho para cuerpo es concreta: qué zonas y qué resultado espera.", "h": "Felimon cruzó 18 mensajes y el 16/10 escribió «Llamada». Rocio, 12 mensajes. Carlos, 9. Sandra te dijo el 18/10 exactamente dónde le duele: «En los hombros y parte baja de la espalda». Ninguno de los cuatro recibió un mensaje tuyo.", "p": "8 de los 19 leads de la semana no tienen ni un mensaje tuyo, y son justo los que más habían hablado. Sandra ya respondió la pregunta gancho sin que nadie se la hiciera."}, {"c": "Nada de «quedo atenta» ni «¿sigues interesada?»: eso no le da a la persona ninguna razón para contestar. En su lugar va la pregunta gancho, ligada a lo que ella misma dijo.", "h": "A Giovanni, el 18/10 a las 18:30, le escribiste «Quedo atenta a su respuesta... gracias». Y a Esperanza nadie la empujó después de que ella cerrara con «Tranquila, yo te escribo» el 18/10.", "p": "«Yo te escribo» y «quedo atenta» son la misma conversación muerta vista desde los dos lados. Ninguno de los dos agendó."}], "cierre": "Esta semana el número no bajó porque entrara menos gente: bajó porque tu voz no estuvo en las conversaciones. Las notas de voz pasaron de 6 a 1 y los leads que más habían hablado se quedaron sin ti. El método ya está grabado en la clase de seguimiento, ya lo viste, y esta semana se probó en tu propia cuenta: la única lead a la que le mandaste un audio en el momento del precio es la única donde la conversación siguió. Tus clientas de siempre vuelven porque ya saben cómo trabajas; quien te vio en un anuncio no lo sabe, y una nota de voz tuya es lo más rápido que existe para que lo sepa.", "funciono": "Marleny, el 14/10: preguntó por los paquetes y el precio y en lugar de una cifra le mandaste una nota de voz. Eso es el molde completo de la clase. Y a las 3 personas que agendaron les escribiste a todas después de tener la cita — eso lo haces bien y lo hiciste también la semana pasada. Nota honesta: parte de las citas de esta semana son para los próximos días, así que todavía no han ocurrido; eso no es un pendiente tuyo.", "acciones": [{"t": "Hoy: Sandra, que ya te dijo dónde le duele", "d": "Escribió el domingo a las 22:10 «En los hombros y parte baja de la espalda» y nadie entró. Mándale un audio hoy.", "g": "Hola Sandra, soy Mariely. Escuché lo de los hombros y la parte baja de la espalda. Cuéntame: ¿hace cuánto lo tienes y qué te gustaría poder volver a hacer sin dolor? Con eso te armo la sesión."}, {"t": "Felimon, Rocio y Carlos", "d": "18, 12 y 9 mensajes cada uno, y ninguno habló contigo. Son los tres más cerca de agendar de toda la semana.", "g": "Hola [nombre], soy Mariely. Vi todo lo que me contaste. Dime: ¿qué zona te está molestando más ahora mismo y qué resultado te gustaría sentir después de la primera sesión?"}, {"t": "Una nota de voz por cada precio", "d": "9 personas preguntaron el precio y solo una escuchó tu voz. Esta semana la regla es simple: si preguntan precio, contestas tú con un audio, como hiciste con Marleny."}], "pie": "Los números salen de tu cuenta de EpikFlow entre el lunes 12 y el domingo 18 de octubre de 2026. Solo cuentan como tuyos los mensajes que salieron de tu teléfono o de tu equipo desde la plataforma, así que si algo quedó fuera es porque no pudimos verlo, nunca al revés."}</script><script src="/assets/a.js" defer></script></html>
