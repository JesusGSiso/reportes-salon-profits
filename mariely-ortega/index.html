e tuviste esta semana."}], "cierre": "Mariely, lo tuyo no es un problema de capacidad: es de constancia. La prueba está en tu propia cuenta hace siete días — 21 conversaciones tocadas y 20 notas de voz — y ese método es exactamente el que está grabado en la clase de seguimiento del área de miembros, el que ya viste. Mientras la semana dependa de si te alcanzó el día, el número va a subir y bajar solo. Y hay una razón por la que importa tanto en tu caso: quien te escribe desde un anuncio no te conoce, está comparando precios de masajes; tu clienta de siempre vuelve porque ya sabe cómo trabajas, pero esta señora todavía tiene que descubrirlo, y eso solo pasa si le hablas tú.", "funciono": "El sábado 06/09 le escribiste tú a Liz para avisarle que se te había desocupado un espacio. Eso es exactamente lo que enseña la clase: no un «¿sigues interesada?», sino una razón concreta y nueva para volver a escribir. Y esa fue de tus 5 notas de voz de la semana. Si el lunes haces eso mismo con Diegol, Markins, Orlando y Yankee, tienes cuatro conversaciones abiertas antes del mediodía.", "acciones": [{"t": "Contesta a Diegol y a Markins hoy", "d": "Los dos pidieron el siguiente paso el fin de semana y siguen sin respuesta tuya. Con Diegol usa el embudo de tres pasos, no le preguntes cuándo quiere:", "g": "Hola Diegol, soy Mariely 🤍 vi que preguntaste por disponibilidad. Para acomodarte bien: ¿te sirve mejor entre semana o el fin de semana?"}, {"t": "Nota de voz a Orlando y a Yankee", "d": "Los dos contaron su condición completa y solo hablaron con el bot. Mándales audio, con su nombre, devolviéndoles lo que ellos te dijeron y cerrando con una pregunta."}, {"t": "Vuelve a los 7 días", "d": "La semana pasada tocaste 21 conversaciones; esta, 8 en cuatro días. Diez minutos cada mañana revisando los dos días anteriores te devuelven el número sin trabajar más horas."}], "pie": "Los números salen de tu cuenta de EpikFlow entre el lunes 31 de agosto y el domingo 6 de septiembre. Solo cuen
