<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reporte de Gestión</title><link rel="stylesheet" href="/assets/s.css"><script type="application/json" id="d">{"slug": "mariely-ortega", "nombre": "Mariely Ortega", "estado": "listo", "rango": "Semana del 7 al 13 de septiembre de 2026", "rangoCorto": "7–13 sep", "rangoAnt": "31 ago–6 sep", "tasa": {"pct": 11, "num": 3, "den": 27, "botSola": 7, "ella": 0, "mutuo": 4, "leadSola": 0, "pctAnt": 12}, "historico": [{"etq": "24–30 ago", "tasa": 10}, {"etq": "31 ago–6 sep", "tasa": 12}, {"etq": "7–13 sep", "tasa": 11}], "intro": ["A las 3 personas que agendaron les escribiste a las tres después de la cita. Eso lo haces bien y no es poca cosa: el seguimiento posterior es lo que hace que la gente llegue.", "El problema está antes: de los 27 leads que entraron por la publicidad, 21 no recibieron ni un solo mensaje tuyo y no mandaste ninguna nota de voz en toda la semana. El bot llevó las conversaciones prácticamente solo. <b>Todo lo demás en este reporte es consecuencia de eso.</b>"], "kpis": [{"k": "Leads de anuncio", "s": "Leads", "v": 27, "ant": 42, "t": "27", "at": "42"}, {"k": "Les escribiste antes", "s": "Escribiste", "v": 3, "ant": 8, "t": "3", "at": "8 de 42"}, {"k": "Con nota de voz", "s": "Voz", "v": 0, "ant": 5, "t": "0", "at": "5 de 42"}, {"k": "Agendaron", "s": "Agendaron", "v": 3, "ant": 5, "t": "3", "at": "5"}, {"k": "Les escribiste después", "s": "Después", "v": 3, "ant": 5, "t": "3", "at": "5 de 5"}, {"k": "Les mandaste la foto", "s": "Foto", "v": 0, "ant": 0, "t": "0", "at": "0 de 5"}], "barras": [{"label": "Leads a los que le escribiste", "num": 3, "den": 27, "meta": 60}, {"label": "Leads con nota de voz", "num": 0, "den": 27, "meta": 40}, {"label": "Citas a las que mandaste la foto", "num": 0, "den": 3, "meta": 60}], "origen": [{"k": "El bot", "v": 2, "c": "#2F6F68"}, {"k": "Tú, desde el teléfono", "v": 1, "c": "#C0522F"}], "origenNota": "De las 3 leads que agendaron, 2 las cerró el bot sin que tú entraras. Que el bot agende está bien, para eso está. El asunto es que las otras 24 conversaciones también eran tuyas y ahí no entró nadie más.", "metodo": [{"c": "«El bot es apoyo, no reemplazo». Él responde rápido, inicia y filtra; tú interpretas lo que la persona necesita y cierras. La confianza la construyes tú, no el sistema.", "h": "De 27 leads, 21 no recibieron ningún mensaje tuyo. Tus mensajes a leads fueron 5 el lunes, 1 el miércoles, 1 el jueves y 5 el domingo: 12 en toda la semana.", "p": "El bot puede filtrar, pero no puede darle a alguien una razón humana para venir. Esas 21 conversaciones se apagaron solas."}, {"c": "La rutina diaria: revisar todos los días las conversaciones de por lo menos los dos días anteriores y buscar a quien dejó de responder, a quien preguntó y no agendó, a quien quedó a medias.", "h": "Olga te dijo el 10/09 «Te escribo cuando esté en Orlando», Alfredo el 08/09 «Yo te llamo cuando regrese» y Angel contestó «Si» el 13/09 a las 15:49. Ninguno recibió un mensaje tuyo después.", "p": "«Yo te llamo» casi nunca es un no: es un «ahora no puedo pensarlo». El que vuelve a preguntar a los tres días es el que agenda."}, {"c": "La nota de voz con los cinco elementos: su nombre, una validación, la necesidad que expresó, una solución posible y una pregunta para continuar. Con energía, nunca la misma para dos personas.", "h": "Cero notas de voz esta semana. La semana pasada mandaste 5.", "p": "En un servicio como el tuyo, donde la persona llega con un dolor que le cuesta explicar, tu voz es el argumento más fuerte que tienes. Y es el único que el bot no puede copiar."}, {"c": "«Las sardinas también compran». El bot ayuda a identificar a los peces dorados, pero eso no autoriza a abandonar al resto: hay quien escribe un año después.", "h": "Jannette («te estaré notificando más adelante»), Nilda («gracias, no por ahora») y Dagoberto se quedaron sin un solo seguimiento tuyo.", "p": "Son personas que ya te dijeron qué les duele. Volver a ellas cuesta un mensaje y no cuesta publicidad nueva."}], "cierre": "Esta semana la publicidad te trajo 27 personas y el sistema las atendió solo. El método ya está grabado y ya lo viste: no te pide más horas, te pide entrar tú en las conversaciones que el bot deja a medias. Mientras eso no pase, el número se va a quedar donde está, porque tus clientas de siempre llegan solas —ya confían en ti— y quien te vio en un anuncio no trae esa confianza: hay que construírsela, y eso solo lo puedes hacer tú.", "funciono": "El 13 de septiembre Sara te preguntó cuánto cuesta y cuánto dura la sesión, y no le tiraste el precio: le explicaste que trabajas de manera integral, con masaje terapéutico, respiraciones conscientes y reflexología. Eso es exactamente lo que enseña la clase — vender el siguiente paso, no el procedimiento. Con tres respuestas así al día, la semana cambia de color.", "acciones": [{"t": "Los 21 que no recibieron nada", "d": "Hoy abre las conversaciones de la semana pasada y escríbele a los que quedaron a medias. Empieza por Angel, Olga, Jannette, Jorge y Dagoberto.", "g": "Hola [nombre], soy Mariely 🤍 Me quedé pensando en lo que me contaste. ¿Qué es lo que más le está molestando ahora mismo: la espalda, el cuello o el cansancio general?"}, {"t": "Tres notas de voz al día", "d": "Una nota de voz de 30 segundos a cada lead nuevo que ya te dijo qué le duele. Tu nombre, validación, lo que te dijo, una solución y una pregunta.", "g": "Hola [nombre], soy Mariely del Valley Holistic Center 🤍 Entiendo perfecto lo que me cuenta del dolor de espalda, y sí se puede trabajar. En la sesión integral vemos justo eso. ¿Desde cuándo lo viene sintiendo?"}, {"t": "Los que dijeron «yo te llamo»", "d": "Alfredo, Olga y Jannette dijeron que te escribirían. Escríbeles tú a los tres días, con una pregunta concreta, no con un «¿sigues interesada?».", "g": "[nombre], ¿cómo ha seguido de la espalda esta semana? Si quiere le aparto
