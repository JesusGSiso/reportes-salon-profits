<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reporte de Gestión</title><link rel="stylesheet" href="/assets/s.css"><script type="application/json" id="d">{"slug": "mariely-ortega", "nombre": "Mariely Ortega", "estado": "listo", "rango": "Semana del 2 al 8 de noviembre de 2026", "rangoCorto": "2–8 nov", "rangoAnt": "26 oct–1 nov", "tasa": {"pct": 5, "num": 1, "den": 20, "botSola": 5, "ella": 0, "mutuo": 0, "leadSola": 0, "pctAnt": 21}, "historico": [{"etq": "14–20 sep", "tasa": 11}, {"etq": "21–27 sep", "tasa": 5}, {"etq": "28 sep–4 oct", "tasa": 2}, {"etq": "5–11 oct", "tasa": 26}, {"etq": "12–18 oct", "tasa": 16}, {"etq": "19–25 oct", "tasa": 19}, {"etq": "26 oct–1 nov", "tasa": 21}, {"etq": "2–8 nov", "tasa": 5}], "intro": ["Mariely, la semana pasada cerraste 5 citas de 24 leads: un 21%, el mejor número que habías tenido en un mes. Esta semana cerraste 1 de 20. No es que llegara menos gente — llegaron casi las mismas — y no es que no trabajaras: les escribiste a 11 de las 20. Pero algo cambió entre una semana y la otra.", "Lo que cambió es <b>cuándo</b> y <b>cómo</b>. La semana pasada en 3 de las 5 citas habías puesto algo tú antes de que la cita existiera, y mandaste 2 fotos a quien ya tenía cita. Esta semana escribiste solo el martes, el jueves, el viernes y el sábado — el lunes, el miércoles y el domingo no hubo un mensaje tuyo a ningún lead nuevo — y la única cita de la semana la cerró el bot sin que tú entraras. <b>Todo lo demás en este reporte es consecuencia de eso.</b>"], "kpis": [{"k": "Leads de anuncio", "s": "Leads", "v": 20, "ant": 24, "t": "20", "at": "24"}, {"k": "Les escribiste antes", "s": "Escribiste", "v": 11, "ant": 12, "t": "11", "at": "12 de 24"}, {"k": "Con nota de voz", "s": "Voz", "v": 0, "ant": 0, "t": "0", "at": "0 de 24"}, {"k": "Agendaron", "s": "Agendaron", "v": 1, "ant": 5, "t": "1", "at": "5"}, {"k": "Les escribiste después", "s": "Después", "v": 0, "ant": 4, "t": "0", "at": "4 de 5"}, {"k": "Les mandaste la foto", "s": "Foto", "v": 0, "ant": 2, "t": "0", "at": "2 de 5"}], "barras": [{"label": "Leads a los que le escribiste", "num": 11, "den": 20, "meta": 60}, {"label": "Leads con nota de voz", "num": 0, "den": 20, "meta": 40}, {"label": "Citas a las que mandaste la foto", "num": 0, "den": 1, "meta": 60}], "origen": [{"k": "El bot", "v": 1, "c": "#2F6F68"}], "origenNota": "La única cita de la semana la creó el bot, y en esa conversación no hubo ningún mensaje tuyo antes de que la cita existiera. La semana pasada fue distinto: de 5 citas, en 3 habías participado tú antes. Esa diferencia es exactamente la diferencia entre 21% y 5%.", "metodo": [{"c": "En la clase de seguimiento te explicamos el embudo de opciones: nunca «¿cuándo quieres venir?», porque eso invita al «yo te aviso». Son tres pasos — ¿entre semana o fin de semana? → ¿mañana o tarde? → ¿a las 10 o a las 11?", "h": "Yose mandó 9 mensajes y el 7/11 a las 08:13 escribió textualmente «Si comparte los horarios y disponibilidad». Nadie le mandó horarios. Salofe cerró el 7/11 con «Yo t confirmo x q no esta semana y la otra tengo mi agenda ocupada gracias».", "p": "Yose pidió la agenda con esas palabras y no agendó. Salofe es el «yo te aviso» de manual, y es lo que pasa cuando la agenda se deja abierta en vez de ofrecer dos horas concretas."}, {"c": "En la clase te enseñamos que no se responde únicamente con el precio, y que el molde es: «claro que sí, con mucho gusto te doy toda la información, pero antes cuéntame, ¿qué te gustaría mejorar exactamente?»", "h": "9 de las 20 leads preguntaron precio o duración esta semana: Irene, Yaneth, Salofe, Jessica, Marineli, Ileana, Myr, Bernice. A las 9 les contestó el bot con la cifra. Tú no entraste en ninguna de esas 9 conversaciones antes de que se enfriaran.", "p": "De esas 9, ninguna agendó. Son las que levantaron la mano y preguntaron cuánto cuesta: el grupo más caliente de la semana, y el único al que no llegó tu voz."}, {"c": "En la clase te enseñamos que nada de «hola, ¿sigues interesada?» ni «cualquier duda a la orden» — eso no le da a la persona ninguna razón para contestar. En su lugar, la pregunta gancho, ligada a lo que ella dijo.", "h": "A Marineli, que había preguntado si atendías caballeros y por el costo, el seguimiento fue: «con mucho gusto, cualquier duda sobre esta sesión o cualquiera de nuestros otros servicios…». Fue tu único seguimiento de la semana a una lead que había preguntado.", "p": "Marineli no volvió a escribir. La pregunta gancho habría sido «¿qué zona te está molestando más ahora mismo?» — eso sí tiene respuesta."}, {"c": "En la clase te explicamos la rutina diaria: revisar las conversaciones de por lo menos los dos días anteriores y buscar a quien dejó de responder, quien preguntó y no agendó, quien quedó a medias y a quien se le dieron horarios y no confirmó.", "h": "Hubo mensajes tuyos a leads nuevos solo 4 de los 7 días: el 3, el 5, el 6 y el 7. El lunes 2, el miércoles 4 y el domingo 8 no salió ninguno. Yaneth escribió el 8/11 a la 01:44 «te escribo el lunes y te explico mi situación» y nadie la retomó.", "p": "9 de las 20 leads de la semana no recibieron ni un mensaje tuyo. Entre ellas, Yose, Irene y Yaneth — las tres habían escrito más de 4 veces."}], "cierre": "Mariely, no hace falta buscar un método nuevo: el método ya está grabado, tú ya lo viste, y la semana pasada funcionó en tu propia cuenta. 21% no fue suerte: fue que en 3 de 5 citas tú pusiste algo antes, y que a 2 de las que ya tenían cita les mandaste una foto. Esta semana no hiciste ninguna de las dos cosas y el número se fue a 5%. Mientras se siga trabajando así, no se va a mover, y la razón es simple: a quien te busca por recomendación ya alguien le dijo que eres buena, llega creyendo. Quien te vio en un anuncio el jueves no tiene a nadie que le haya dicho nada; está comparando precios de masajes en Kissimmee y la confianza se la tienes que construir tú, en los primeros dos mensajes.", "funciono": "La conversación con <b>💫</b> es el ejemplo de la semana: 24 mensajes de ida y vuelta, y cerró con «Perfect see you nxt Thursday 😇». Eso es una persona que llegó por un anuncio, se quedó hablando y terminó con una cita en el calendario del jueves. Esa conversación no se cerró con un precio: se cerró porque alguien la sostuvo hasta el final. Es la prueba de que sigue funcionando — solo pasó una vez esta semana.", "acciones": [{"t": "Mándale horarios concretos a Yose hoy", "d": "Yose pidió los horarios con esas palabras el sábado y no los recibió. Es la más fácil de la semana. No le preguntes cuándo quiere: dale dos opciones.", "g": "Yose, perdona la demora. Esta semana tengo martes a las 10 de la mañana o jueves a las 4 de la tarde. ¿Cuál de las dos te queda mejor?"}, {"t": "Una nota de voz a cada una de las 9 que preguntaron precio", "d": "A las 9 les respondió el bot con la cifra de $165 y ahí se quedó la cosa. Una nota de voz tuya de 40 segundos cambia la conversación: tu nombre, una validación, lo que ella dijo, lo que se puede hacer y una pregunta.", "g": "Hola Jessica, soy Mariely. Vi que preguntaste por la sesión. Antes de hablar de tiempo y precio quiero entenderte: ¿qué es lo que más te está molestando ahora mismo — cuello, espalda baja, o es más cansancio general?"}, {"t": "Diez minutos los días que no abriste el chat", "d": "El lunes, el miércoles y el domingo no salió un mensaje tuyo a ningún lead nuevo. No hace falta más que diez minutos: abre los dos días anteriores y busca a las que quedaron a medias. Esta semana eran 9."}], "pie": "Los números salen de tu cuenta de EpikFlow entre el lunes 2 y el domingo 8 de noviembre. Solo cuentan como tuyos los mensajes que salieron de tu teléfono o de tu equipo desde la plataforma, así que si algo quedó fuera es porque no pudimos verlo, nunca al revés."}</script><script src="/assets/a.js" defer></script></html>
