nta gancho.", "p": "Sin tu voz ni tus preguntas, la lead no distingue tu estudio de cualquier otro que también cobra desde $380."}], "cierre": "El método ya está grabado en la clase de seguimiento y ya lo viste; esta semana quedó demostrado en tu propia cuenta que la parte automática funciona — el bot cerró 6 citas — y que la parte que solo puedes hacer tú no se hizo: 0 mensajes después de agendar, 1 nota de voz, 15 personas sin un solo mensaje tuyo. Mientras se siga trabajando así el número no va a subir: tus clientas de siempre llegan solas porque ya confían en ti, pero la que te vio en un anuncio no te conoce, está comparando estudios, y esa confianza hay que construírsela tú. Son 23 personas en la semana: es una muestra chica, y por eso cada una pesa mucho.", "funciono": "El 15 de septiembre Ayme preguntó «Y los precios» y la respuesta no fue una cifra seca: fue «la evaluación de cejas sí es gratis 😊» y enseguida un horario concreto para el 16. Eso es exactamente el embudo de la clase — en vez de abrir la puerta al «yo te aviso», se ofrece el siguiente paso. Ayme agendó. Lo hizo el bot, y funcionó; imagina ese mismo movimiento hecho por ti, con tu voz, en las 17 que el bot no alcanzó.", "acciones": [{"t": "Escríbele a las 6 que ya agendaron", "d": "Deysi, Jessica, Ayme, Karina y Marycarmen tienen cita y no han recibido nada tuyo. Un mensaje y una foto de un trabajo real tuyo, el día antes.", "g": "Hola [nombre], soy Nadyma 😊 Te espero [día] a las [hora]. Mira cómo quedaron unas cejas parecidas a las tuyas — así vas viendo a dónde vamos. ¿Alguna duda antes de venir?"}, {"t": "Cuando pregunten precio, pregunta tú primero", "d": "7 personas preguntaron esta semana. Entra tú antes de que salga la cifra.", "g": "Claro que sí, con mucho gusto te doy toda la información 😊 pero antes cuéntame: ¿cómo tienes tus cejas ahora y qué te gustaría mejorar? ¿Me mandas una foto?"}, {"t": "Rescata a las que quedaron a medias", "d": "Sonia pidió cupo para la evaluación el 17 y no agendó. Yadira preguntó dónde están el 20. Abre la computadora y revisa los dos últimos días, todos los días.", "g": "Hola [nombre], soy Nadyma del estudio 😊 Vi tu mensaje. La evaluación es gratis y dura 30 minutos. ¿Te queda mejor entre semana o el fin de semana?"}], "pie": "Los números salen de tu cuenta de EpikFlow entre el 14 y el 20 de septiembre. Solo cuentan como tuyos los mensajes que salieron de tu teléfono o de tu equipo desde la plataforma, así que si algo quedó fuera es porque no pudimos verlo, nunca al revés."}</script><script src="/assets/a.js" defer></script></html>
