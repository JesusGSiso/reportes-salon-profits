<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reporte de Gestión</title><link rel="stylesheet" href="/assets/s.css"><script type="application/json" id="d">{"slug": "nadyma-saif", "nombre": "Nadyma Saif", "estado": "listo", "rango": "Semana del 7 al 13 de septiembre de 2026", "rangoCorto": "7–13 sep", "rangoAnt": "31 ago–6 sep", "tasa": {"pct": 28, "num": 9, "den": 32, "botSola": 19, "ella": 0, "mutuo": 9, "leadSola": 0, "pctAnt": 11}, "historico": [{"etq": "7–13 sep", "tasa": 28}], "intro": ["Esta semana entraron 32 leads de anuncio y agendaron 9: subiste del 11% al 28%. Es tu mejor número y no es casualidad — el jueves y el viernes te metiste en las conversaciones (18 y 20 mensajes) y esos son los días de donde salieron casi todas las citas.", "Lo que falta es que eso pase los siete días. 17 de esos 32 leads no recibieron ni un solo mensaje tuyo, y de los 9 que agendaron, en 6 el bot hizo todo el trabajo solo. <b>Todo lo demás en este reporte es consecuencia de eso.</b>"], "kpis": [{"k": "Leads de anuncio", "s": "Leads", "v": 32, "ant": 35, "t": "32", "at": "35"}, {"k": "Les escribiste antes", "s": "Escribiste", "v": 10, "ant": 12, "t": "10", "at": "12 de 35"}, {"k": "Con nota de voz", "s": "Voz", "v": 2, "ant": 9, "t": "2", "at": "9 de 35"}, {"k": "Agendaron", "s": "Agendaron", "v": 9, "ant": 4, "t": "9", "at": "4"}, {"k": "Les escribiste después", "s": "Después", "v": 6, "ant": 1, "t": "6", "at": "1 de 4"}, {"k": "Les mandaste la foto", "s": "Foto", "v": 0, "ant": 0, "t": "0", "at": "0 de 4"}], "barras": [{"label": "Leads a los que le escribiste", "num": 10, "den": 32, "meta": 60}, {"label": "Leads con nota de voz", "num": 2, "den": 32, "meta": 40}, {"label": "Citas a las que mandaste la foto", "num": 0, "den": 9, "meta": 60}], "origen": [{"k": "El bot", "v": 6, "c": "#2F6F68"}, {"k": "Tú, desde el teléfono", "v": 5, "c": "#C0522F"}], "origenNota": "De las 9 leads que agendaron, 6 las cerró el bot sin que tú entraras y en 3 participaron los dos. Que el bot cierre está bien —para eso está— pero las que él no logra convertir solo son justo las que necesitan tu voz, y esas se quedaron sin nadie.", "metodo": [{"c": "En la clase de seguimiento te explicamos la rutina diaria: todos los días revisar las conversaciones de por lo menos los dos días anteriores y buscar a quien dejó de responder, a quien preguntó y no agendó y a quien quedó a medias.", "h": "Tus mensajes por día fueron 3 el martes, 3 el miércoles, 10 el jueves, 18 el viernes, 20 el sábado y 2 el domingo. 17 de tus 32 leads no recibieron ni un mensaje tuyo: ❤️Fe escribió el 13/09 a las 18:34 «Quiero reservar un cupo para la evaluación gratuita de cejas» y Red lo mismo el 11/09 a las 23:45.", "p": "Las dos pidieron cupo con todas sus letras y la semana se cerró sin que tú les hablaras."}, {"c": "La nota de voz con los cinco elementos: su nombre, una validación, la necesidad que ella expresó, una solución posible y una pregunta para continuar. Es lo que más rápido construye confianza con alguien que no te conoce.", "h": "Mandaste 2 notas de voz en toda la semana, sobre 32 leads. La semana pasada habían sido 9.", "p": "La voz es lo único que te distingue del bot. Sin ella, para la lead tú y el sistema son la misma persona."}, {"c": "«No respondas únicamente con el precio». El molde es: claro que sí, con mucho gusto te doy toda la información, pero antes cuéntame, ¿qué te gustaría mejorar exactamente?", "h": "9 leads preguntaron precio. Cuando entraste tú, contestaste el dato: a Elva, el 08/09 a las 17:50, «Hola bella la evaluación es gratuita».", "p": "Está bien dicho, pero cierra la conversación en vez de abrirla. Una pregunta después de esa frase es la diferencia entre un «gracias» y una cita."}, {"c": "A la que ya agendó hay que empujarla para que asista: el mensaje y la foto de un trabajo parecido al que ella quiere.", "h": "Les escribiste a 6 de las 9 que agendaron — muy por encima de la semana pasada. Foto no le mandaste a ninguna.", "p": "El mensaje sostiene la cita; la foto es la que hace que llegue con ganas y no la mueva."}], "cierre": "Esta semana probaste en tu propia cuenta que el método funciona: los dos días que te metiste a fondo en las conversaciones son los días de donde salió el 28%. El método ya está grabado y ya lo viste; lo que falta no es aprender nada nuevo, es sostenerlo de lunes a domingo. Mientras el bot trabaje solo cinco de cada siete días, el número se va a quedar donde está, porque tus clientas de siempre llegan solas —ya confían en ti— y quien te vio en un anuncio no trae esa confianza: hay que construírsela conversación por conversación.", "funciono": "De las 9 leads que agendaron, le escribiste a 6 después de la cita. La semana pasada había sido 1 de 4. Eso es exactamente el segundo trabajo que te toca —empujar a la que ya agendó— y lo hiciste casi con todas. Súmale la foto y tienes la fórmula completa.", "acciones": [{"t": "Los 17 que no recibieron nada", "d": "Hoy abre las conversaciones del viernes, sábado y domingo. Son 17 personas, y ❤️Fe y Red pidieron cupo para la evaluación con todas sus letras.", "g": "Hola [nombre], soy Nadyma 💛 Vi que querías tu evaluación gratuita de cejas. ¿Me mandas una foto de cómo las tienes ahora? Así te digo qué técnica te queda mejor antes de que vengas."}, {"t": "Dos notas de voz al día", "d": "Solo dos en toda la semana. Ponte dos diarias, a las leads nuevas que ya dijeron qué quieren: nombre, validación, lo que ella te dijo, una solución y una pregunta.", "g": "Hola [nombre], soy Nadyma 💛 Claro que sí, entiendo que quieras que se te vean más definidas pero sin perder lo natural. Eso justo lo vemos en la evaluación, que es gratis. ¿Hace cuánto te las hiciste por última vez?"}, {"t": "La foto a las que ya agendaron", "d": "9 agendaron esta semana y ninguna recibió una foto de un trabajo tuyo. Es el empujón más barato que tienes para que lleguen.", "g": "[nombre], te dejo una foto de
