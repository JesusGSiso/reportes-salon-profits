<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reporte de Gestión</title><link rel="stylesheet" href="/assets/s.css"><script type="application/json" id="d">{"slug": "nadyma-saif", "nombre": "Nadyma Saif", "estado": "listo", "rango": "Semana del 28 de septiembre al 4 de octubre de 2026", "rangoCorto": "28 sep–4 oct", "rangoAnt": "21–27 sep", "tasa": {"pct": 0, "num": 0, "den": 4, "botSola": 0, "ella": 0, "mutuo": 0, "leadSola": 0, "pctAnt": 0}, "historico": [{"etq": "7–13 sep", "tasa": 28}, {"etq": "14–20 sep", "tasa": 26}, {"etq": "21–27 sep", "tasa": 0}, {"etq": "28 sep–4 oct", "tasa": 0}], "intro": ["Esta semana entraron 4 leads de publicidad. Son números pequeños, así que te los damos en absolutos y no en porcentajes: con 4 personas, un solo caso mueve la cifra entera y no se puede leer como una tendencia. Lo que sí se puede leer es qué pasó con cada una, porque son cuatro.", "A las cuatro les contestó el bot y a ninguna le llegó un mensaje tuyo. Tres de ellas preguntaron por un curso de micropigmentación, que es algo que tú no das — eso es un problema del anuncio y lo estamos revisando nosotros, no es tu culpa. Pero la cuarta, Julia, preguntó precios el 30 de septiembre y también quedó en manos del bot. <b>Todo lo demás en este reporte es consecuencia de eso.</b>"], "kpis": [{"k": "Leads de anuncio", "s": "Leads", "v": 4, "ant": 3, "t": "4", "at": "3"}, {"k": "Les escribiste antes", "s": "Escribiste", "v": 0, "ant": 2, "t": "0", "at": "2 de 3"}, {"k": "Con nota de voz", "s": "Voz", "v": 0, "ant": 1, "t": "0", "at": "1 de 3"}, {"k": "Agendaron", "s": "Agendaron", "v": 0, "ant": 0, "t": "0", "at": "0"}, {"k": "Les escribiste después", "s": "Después", "v": 0, "ant": 0, "t": "—", "at": "—"}, {"k": "Les mandaste la foto", "s": "Foto", "v": 0, "ant": 0, "t": "—", "at": "—"}], "barras": [{"label": "Leads a los que le escribiste", "num": 0, "den": 4, "meta": 60}, {"label": "Leads con nota de voz", "num": 0, "den": 4, "meta": 40}, {"label": "Citas a las que mandaste la foto", "num": 0, "den": 0, "meta": 60, "vacio": "Esta semana ninguna lead de publicidad agendó, así que esta barra no aplica."}], "origen": [], "origenNota": "Esta semana ninguna de las 4 leads de publicidad agendó, así que no hay citas que repartir. Tu agenda sí tuvo movimiento — hubo citas de clientas tuyas de siempre — pero ninguna salió de la publicidad de esta semana.", "metodo": [{"c": "En la clase de seguimiento te explicamos la rutina diaria: todos los días revisar las conversaciones de por lo menos los dos días anteriores, y buscar a quien dejó de responder, a quien preguntó y no agendó y a quien quedó a medias.", "h": "Ninguna de las 4 recibió un mensaje tuyo. Martha escribió 4 veces y su último mensaje, del domingo 4 de octubre a las 20:38, fue \"Tienes información por favor\". Julia escribió 5 veces y cerró el 1 de octubre con \"Igualmente si algún día andas x acá pasa a mi casa a darme algunas clases bonito día\".", "p": "Las cuatro se quedaron en la conversación del bot. La semana pasada sí habías tocado 2 de 3 y mandado una nota de voz; esta semana el contador quedó en cero."}, {"c": "En la clase te enseñamos que nunca se responde únicamente con el precio. Primero la pregunta: \"claro que sí, con mucho gusto te doy toda la información, pero antes cuéntame, ¿qué te gustaría mejorar exactamente?\"", "h": "Julia preguntó \"Me puede dar precios?\" el 30 de septiembre a las 19:43. Respondió el bot. Esa era la única de las cuatro que preguntaba por un servicio que tú sí ofreces.", "p": "Julia siguió escribiendo dos días más y terminó despidiéndose con cariño pero sin cita. Era la conversación rescatable de la semana y nadie la tomó."}, {"c": "En la clase te explicamos que el bot es apoyo, no reemplazo: responde rápido, inicia y filtra, pero tú interpretas la necesidad y cierras. La confianza la construyes tú.", "h": "El bot llevó las 4 conversaciones completas, de principio a fin, sin que tú aparecieras en ninguna.", "p": "Con 4 leads no hace falta una rutina complicada: son cuatro conversaciones que se revisan en diez minutos. Cuando el volumen es bajo, tocar a todas es lo más fácil de la semana — y es justo cuando más pesa cada una."}], "cierre": "Dos cosas separadas, para que no se mezclen. La primera es nuestra: tres de tus cuatro leads venían preguntando por un curso que no das, y eso significa que el anuncio está llamando a la persona equivocada. Lo estamos revisando y no lo pongas en tu lista. La segunda sí es tuya, y es chica pero clara: con solo cuatro conversaciones en siete días, ninguna recibió un mensaje tuyo. El método ya lo tienes y ya lo has usado — hace tres semanas tu tasa estaba en 28% y en 26%, y eso no salió del bot, salió de que tú entrabas. Mientras se siga trabajando a tu manera el número no se va a mover: tus clientas de siempre llegan solas porque ya confían en ti, pero quien te vio en un anuncio no trae esa confianza y hay que construírsela.", "funciono": "La semana pasada, con un volumen igual de chico, le escribiste a 2 de 3 leads y a una le mandaste nota de voz. Eso es la prueba de que sabes hacerlo y de que el volumen bajo no es el obstáculo. Y en tus números de hace tres semanas — 28% y 26% de agendamiento — está el techo real de esta cuenta cuando tú estás dentro de las conversaciones.", "acciones": [{"t": "Escríbele a Martha hoy", "d": "Escribió cuatro veces y su último mensaje es del domingo: \"Tienes información por favor\". Preguntó por el curso, que no das, pero sigue siendo alguien interesada en micropigmentación. Ofrécele el servicio.", "g": "Hola Martha, soy Nadyma. Curso no estoy dando por ahora, pero sí hago la micropigmentación. Cuéntame una cosa: ¿lo querías aprender para ti o estabas buscando hacértelo? Si es para hacértelo, mándame una foto de cómo están tus cejas ahora y te digo qué técnica te queda mejor."}, {"t": "Recupera a Julia", "d": "Preguntó precios el 30 de septiembre, siguió escribiendo dos días y se despidió sin cita. Es la lead más avanzada de la semana y todavía está tibia.", "g": "Julia, soy Nadyma, perdón por la demora en responderte yo misma. Antes de darte los precios cuéntame: ¿qué es lo que más te gustaría mejorar de tus cejas ahora mismo? Con eso te digo exactamente qué necesitas y cuánto es, sin que pagues por algo que no te hace falta."}, {"t": "Diez minutos al día, de lunes a domingo", "d": "Con 4 leads a la semana, revisarlas todas te toma menos de diez minutos. Abre las conversaciones de los dos días anteriores y asegúrate de que ninguna se quedó solo con el bot. Esta semana se quedaron las cuatro."}], "pie": "Los números salen de tu cuenta de EpikFlow entre el lunes 28 de septiembre y el domingo 4 de octubre de 2026. Solo cuentan como tuyos los mensajes que salieron de tu teléfono o de tu equipo desde la plataforma, así que si algo quedó fuera es porque no pudimos verlo, nunca al revés."}</script><script src="/assets/a.js" defer></script></html>
