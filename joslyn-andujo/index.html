<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reporte de Gestión</title><link rel="stylesheet" href="/assets/s.css"><script type="application/json" id="d">{"slug": "joslyn-andujo", "nombre": "Joslyn Andujo", "estado": "listo", "rango": "Semana del 12 al 18 de octubre de 2026", "rangoCorto": "12–18 oct", "rangoAnt": "5–11 oct", "tasa": {"pct": 18, "num": 3, "den": 17, "botSola": 18, "ella": 0, "mutuo": 0, "leadSola": 0, "pctAnt": 100}, "historico": [{"etq": "12–18 oct", "tasa": 18}], "intro": ["Esta semana la pauta arrancó de verdad: entraron 17 leads, cuando la semana pasada entró <b>uno</b>. De los 17, agendaron 3. El 100% que aparece como la semana pasada es engañoso: era una sola persona, así que mira esta semana en personas y no en porcentajes.", "Y aquí está lo que hay que cambiar: de los 17 leads, 16 no recibieron ni un mensaje tuyo. Todos los mensajes que mandaste a leads de la pauta salieron un solo día, el miércoles 14. Las 3 citas las cerró el bot solo. No salió ninguna nota de voz. <b>Todo lo demás en este reporte es consecuencia de eso.</b>"], "kpis": [{"k": "Leads de anuncio", "s": "Leads", "v": 17, "ant": 1, "t": "17", "at": "1"}, {"k": "Les escribiste antes", "s": "Escribiste", "v": 1, "ant": 0, "t": "1", "at": "0 de 1"}, {"k": "Con nota de voz", "s": "Voz", "v": 0, "ant": 0, "t": "0", "at": "0 de 1"}, {"k": "Agendaron", "s": "Agendaron", "v": 3, "ant": 1, "t": "3", "at": "1"}, {"k": "Les escribiste después", "s": "Después", "v": 0, "ant": 0, "t": "0", "at": "0 de 1"}, {"k": "Les mandaste la foto", "s": "Foto", "v": 0, "ant": 0, "t": "0", "at": "0 de 1"}], "barras": [{"label": "Leads a los que le escribiste", "num": 1, "den": 17, "meta": 60}, {"label": "Leads con nota de voz", "num": 0, "den": 17, "meta": 40}, {"label": "Citas a las que mandaste la foto", "num": 0, "den": 3, "meta": 60, "vacio": "Esta semana no hubo citas, así que esta barra no aplica."}], "origen": [{"k": "El bot", "v": 3, "c": "#2F6F68"}], "origenNota": "Las 3 citas de leads de anuncio las creó el bot, y mirando quién participó antes de la cita el resultado es el mismo: ninguna de las 3 personas había hablado contigo. A las 3 tampoco les escribiste después. Las tres están en la agenda de esta semana y llegan sin haber cruzado una palabra contigo.", "metodo": [{"c": "En la clase de seguimiento te explicamos el molde para el precio: «claro que sí, con mucho gusto te doy toda la información, pero antes cuéntame, ¿qué te gustaría mejorar exactamente?». Nunca una cifra a secas, porque la cifra sin contexto cierra la conversación.", "h": "Dos leads preguntaron precio y las dos recibieron «desde $300» del bot. Tatis preguntó el 17/10 a las 20:23 «más o menos qué precios manejas», y trece minutos después cerró con «A ok muchas gracias». Otra lead, después de 14 mensajes, escribió el 18/10 «sí desearía saber más o menos el costo y ir a realizarme la prueba de mechón».", "p": "Tatis se fue con el precio y sin cita. La otra pidió explícitamente ir a hacerse la prueba de mechón y tampoco la tiene. El bot no debía soltar esa cifra —eso lo estamos corrigiendo nosotros— pero esas dos conversaciones eran tuyas."}, {"c": "La rutina diaria: entrar todos los días y revisar las conversaciones de por lo menos los dos días anteriores, buscando a quien preguntó y no agendó y a quien quedó a medias.", "h": "Todos tus mensajes a leads de la pauta salieron el miércoles 14: 6 mensajes, en un solo día. Los otros seis días no salió ninguno. El viernes 17 entraron Clari y Sofi con la misma frase —«Hola ❤️ por favor información sobre la prueba de mechón gratuita»— y nadie les escribió.", "p": "16 de los 17 leads no tienen ni un mensaje tuyo. Clari y Sofi pedían literalmente la prueba de mechón gratis y no tienen cita."}, {"c": "A quien ya agendó hay que empujarlo para que asista, y a quien quedó debiendo algo se le vuelve a pedir — para color, la foto de cómo tiene el cabello ahora.", "h": "Una lead te escribió el 16/10 «Vale, yo salgo de trabajar y te la envío», quedando a deber la foto, y nadie se la pidió. Y de las 3 que agendaron, @Mary seguía preguntando el 17/10 «¿O en un shopping center?» — no sabía bien a dónde ir.", "p": "Ninguna de las 3 que agendaron recibió mensaje ni foto tuya antes de la cita. Son 3 personas, no 30."}], "cierre": "La pauta pasó de 1 lead a 17 en una semana, así que el problema de volumen está resuelto. Lo que falta es lo tuyo, y la clase de seguimiento lo tiene en una frase: entrar todos los días y revisar los dos días anteriores. Esta semana se probó en tu propia cuenta por ausencia — el único día que te sentaste salieron 6 mensajes, y los seis días que no, los leads se quedaron solos con el bot y dos se fueron en cuanto vieron un precio. Tus clientas de siempre vuelven porque ya te conocen; quien te vio en un anuncio no, y lo que construye esa confianza es tu voz antes de la cifra.", "funciono": "El miércoles 14 te sentaste y salieron 6 mensajes a leads de la pauta: ese día es la prueba de que sabes hacerlo. Y el bot está trayendo citas solo —3 esta semana— así que el sistema está puesto y funcionando. Nota honesta: las 3 citas son para los próximos días, así que todavía no han ocurrido; eso no es un pendiente tuyo. Y con 17 leads la muestra sigue siendo chica: lee los números en personas.", "acciones": [{"t": "Hoy: Clari y Sofi", "d": "Las dos pidieron por escrito la prueba de mechón gratuita el viernes y no tienen cita. Son las dos más fáciles de la semana.", "g": "Hola [nombre], soy Joslyn. Vi que quieres tu prueba de mechón, que es gratis. Mándame una foto de cómo tienes el cabello ahora y otra de cómo te gustaría verlo, y te agendo yo misma: ¿entre semana o el fin de semana?"}, {"t": "Tatis y la que pidió el costo", "d": "Las dos se fueron con un «desde $300» del bot. Vuelve tú con la pregunta antes del número.", "g": "Hola [nombre], soy Joslyn. Te escribo yo directo. Antes de hablar de precio cuéntame: ¿qué te gustaría lograr con tu cabello y cómo lo tienes ahora? Con una foto te digo exactamente qué necesitas y cuánto sería en tu caso."}, {"t": "Las 3 que ya tienen cita", "d": "Ninguna recibió un mensaje tuyo y @Mary todavía preguntaba dónde queda el local. Confírmales dirección, día y hora, y mándales la foto del resultado."}], "pie": "Los números salen de tu cuenta de EpikFlow entre el lunes 12 y el domingo 18 de octubre de 2026. Solo cuentan como tuyos los mensajes que salieron de tu teléfono o de tu equipo desde la plataforma, así que si algo quedó fuera es porque no pudimos verlo, nunca al revés."}</script><script src="/assets/a.js" defer></script></html>
