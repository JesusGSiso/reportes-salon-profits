 "Les mandaste la foto", "s": "Foto", "v": 1, "ant": 0, "t": "1", "at": "0 de 2"}], "barras": [{"label": "Leads a los que le escribiste", "num": 38, "den": 52, "meta": 60}, {"label": "Leads con nota de voz", "num": 33, "den": 52, "meta": 40}, {"label": "Citas a las que mandaste la foto", "num": 1, "den": 1, "meta": 60, "vacio": "Esta semana no hubo citas, así que esta barra no aplica."}], "origen": [{"k": "Tú, desde el teléfono", "v": 1, "c": "#C0522F"}], "origenNota": "La única cita de la semana la agendaste tú, a mano, desde el teléfono. No la hizo el bot ni se agendó sola la persona: la cerraste tú. Con una sola cita la muestra es muy chica y no sirve para sacar conclusiones, pero sí dice algo: cuando entras tú, se cierra.", "metodo": [{"c": "Embudo de opciones para agendar. Nunca «¿cuándo quieres venir?», porque invita al «yo te aviso». Son tres pasos: ¿entre semana o fin de semana? → ¿mañana o tarde? → ¿a las 10 o a las 11?", "h": "De los <b>22 leads que preguntaron precio</b>, solo 1 terminó con cita. 🤩 preguntó «Cuánto sería el precio de las cejas» el 30 de octubre, recibió la información y cerró con «Le dejo saber para una cita». Livia hizo lo mismo el 1 de noviembre: «Gracias, cualquier duda te aviso».", "p": "Las dos se fueron con el precio en la mano y sin una hora reservada, que es exactamente el «yo te aviso» que la clase te dice que hay que evitar. Ninguna de las dos volvió."}, {"c": "La rutina diaria es revisar las conversaciones de por lo menos los dos días anteriores y buscar a quien quedó a medias o preguntó y no agendó.", "h": "Escribiste todos los días, así que la rutina la tienes. Pero <b>14 leads no recibieron ni un mensaje tuyo</b>, y cuatro de ellos llevan días fríos: Midenis preguntó «Donde estan ubicados» el 31 de octubre, Jj escribió «Primera» el 30, Yanela pidió información el 29 y 🤩 dijo «Le dejo saber para una cita» el 30.", "p": "Son cuatro personas que ya habían levantado la mano. Los otros diez llegaron el domingo y todavía están fre ene mejor entre semana o fin de semana?"}, {"t": "Recupera a las cuatro que quedaron frías", "d": "Midenis, Jj, Yanela y 🤩. Las cuatro escribieron entre el 29 y el 31 de octubre y nadie volvió a ellas.", "g": "Hola Midenis, soy Gloribel. Estamos en 2946 Pleasant Hill Rd, Kissimmee. Para apartarte el espacio, ¿prefieres mañana o tarde?"}, {"t": "Elsa y Leidiver, con nota de voz", "d": "Una tuvo una mala experiencia antes y la otra tiene diabetes tipo 1. Las dos necesitan oír tu voz, no un texto.", "g": "Nota de voz: su nombre, «claro que sí», le repites lo que ella te dijo con sus palabras, le cuentas cómo se maneja ese caso en tu estudio, y cierras con «¿qué es lo que más te gustaría mejorar de tus cejas?»"}], "pie": "Los números salen de tu cuenta de EpikFlow entre el lunes 26 de octubre y el domingo 1 de noviembre. Solo cuentan como tuyos los mensajes que salieron de tu teléfono o de tu equipo desde la plataforma, así que si algo quedó fuera es porque no pudimos verlo, nunca al revés."}</script><script src="/assets/a.js" defer></script></html>
