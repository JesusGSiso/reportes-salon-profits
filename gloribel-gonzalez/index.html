 "s": "Agendaron", "v": 9, "ant": 19, "t": "9", "at": "19"}, {"k": "Les escribiste después", "s": "Después", "v": 9, "ant": 14, "t": "9", "at": "14 de 19"}, {"k": "Les mandaste la foto", "s": "Foto", "v": 0, "ant": 4, "t": "0", "at": "4 de 19"}], "barras": [{"label": "Leads a los que le escribiste", "num": 41, "den": 59, "meta": 60}, {"label": "Leads con nota de voz", "num": 37, "den": 59, "meta": 40}, {"label": "Citas a las que mandaste la foto", "num": 0, "den": 9, "meta": 60, "vacio": "Esta semana no hubo citas, así que esta barra no aplica."}], "origen": [{"k": "El bot", "v": 7, "c": "#2F6F68"}, {"k": "Tú, desde el teléfono", "v": 3, "c": "#C0522F"}], "origenNota": "Se crearon 10 citas con leads de anuncio: 7 las puso el bot y 3 las pusiste tú desde el teléfono. Mirando quién participó antes de la cita, 3 de las 9 personas que agendaron habían hablado contigo: es el doble que la semana pasada en proporción. La caída de la semana está del otro lado, en las citas que el bot cerraba solo.", "metodo": [{"c": "El bot es apoyo, no reemplazo. Él responde rápido y filtra, pero cuando alguien pregunta el precio ya está levantando la mano: ahí entras tú, interpretas la necesidad y cierras.", "h": "16 leads preguntaron precio esta semana. Entraste en uno: a Guadalupe, el 16/10 a las 22:46 («Cuánto cuesta»), le respondiste con una nota de voz. En los otros quince contestó el bot — ☕ preguntó «Cual es el.precio» el 18/10, Yaxi «Precio porfa» el 17/10, Jackeline «¿Cuánto cuesta el procedimiento?» el 15/10.", "p": "Ninguno de esos quince agendó. El único en el que entraste tú es el que avanzó."}, {"c": "Nada de dejar morir a quien ya avanzó. A quien quedó a medias se le manda la pregunta gancho ligada a lo que dijo — para cejas, una foto de cómo las tiene ahora.", "h": "11 leads no recibieron ni un mensaje tuyo, y casi todos terminaron igual: Jordana «Ok. Gracias» el 17/10 después de 8 mensajes, Militza «Ok muchas gracias», Mel «Ok gracias», Tita «Gracias». Mary cerró el 18/10
