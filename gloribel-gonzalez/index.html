<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reporte de Gestión</title><link rel="stylesheet" href="/assets/s.css"><script type="application/json" id="d">{"slug": "gloribel-gonzalez", "nombre": "Gloribel Gonzalez", "estado": "listo", "rango": "Semana del 28 de septiembre al 4 de octubre de 2026", "rangoCorto": "28 sep–4 oct", "rangoAnt": "21–27 sep", "tasa": {"pct": 41, "num": 26, "den": 63, "botSola": 32, "ella": 0, "mutuo": 9, "leadSola": 0, "pctAnt": 57}, "historico": [{"etq": "24–30 ago", "tasa": 38}, {"etq": "31 ago–6 sep", "tasa": 55}, {"etq": "7–13 sep", "tasa": 56}, {"etq": "14–20 sep", "tasa": 39}, {"etq": "21–27 sep", "tasa": 57}, {"etq": "28 sep–4 oct", "tasa": 41}], "intro": ["Primero el contexto, porque sin él el número engaña. Esta semana entraron 63 leads de publicidad contra 14 la semana pasada: cuatro veces y media más. Agendaron 26, contra 8. Tu tasa bajó de 57% a 41%, pero en personas reales pasaste de 8 citas a 26. Eso es un trimestre de crecimiento en una semana y hay que decirlo así.", "Dicho eso, mira cómo repartiste el trabajo en los siete días: lunes 8 mensajes, martes 8, miércoles 1, jueves 38, viernes 25, sábado 84 y domingo 185. El miércoles 30 de septiembre, con leads entrando todo el día, mandaste un solo mensaje; el domingo mandaste 185. Los 16 puntos que bajó tu tasa están en ese miércoles y en ese martes, no en el anuncio. <b>Todo lo demás en este reporte es consecuencia de eso.</b>"], "kpis": [{"k": "Leads de anuncio", "s": "Leads", "v": 63, "ant": 14, "t": "63", "at": "14"}, {"k": "Les escribiste antes", "s": "Escribiste", "v": 37, "ant": 9, "t": "37", "at": "9 de 14"}, {"k": "Con nota de voz", "s": "Voz", "v": 34, "ant": 5, "t": "34", "at": "5 de 14"}, {"k": "Agendaron", "s": "Agendaron", "v": 26, "ant": 8, "t": "26", "at": "8"}, {"k": "Les escribiste después", "s": "Después", "v": 22, "ant": 7, "t": "22", "at": "7 de 8"}, {"k": "Les mandaste la foto", "s": "Foto", "v": 4, "ant": 0, "t": "4", "at": "0 de 8"}], "barras": [{"label": "Leads a los que le escribiste", "num": 37, "den": 63, "meta": 60}, {"label": "Leads con nota de voz", "num": 34, "den": 63, "meta": 40}, {"label": "Citas a las que mandaste la foto", "num": 4, "den": 26, "meta": 60}], "origen": [{"k": "El bot", "v": 21, "c": "#2F6F68"}, {"k": "Tú, desde el teléfono", "v": 5, "c": "#C0522F"}], "origenNota": "De las 26 citas de leads de publicidad, 21 las creó el bot y 5 las creaste tú desde el teléfono. En el desglose de participación: en 6 hubo esfuerzo de las dos y en 20 el bot lo hizo solo. La semana pasada, con 14 leads, esa proporción era 4 y 4 — mitad y mitad. Cuando el volumen se multiplicó por cuatro y medio, tu presencia por lead se diluyó y el bot tuvo que hacer casi todo.", "metodo": [{"c": "En la clase de seguimiento te explicamos la rutina diaria: todos los días revisar las conversaciones de por lo menos los dos días anteriores, y buscar a quien dejó de responder, a quien preguntó y no agendó, a quien quedó a medias y a quien se le dieron horarios y no confirmó. Todos los días, no un día.", "h": "Tus mensajes por día: 8 el lunes 28, 8 el martes 29, 1 el miércoles 30, 38 el jueves 1, 25 el viernes 2, 84 el sábado 3 y 185 el domingo 4. El 68% de tu trabajo de la semana cayó en el fin de semana.", "p": "Las leads del lunes al miércoles llegaron a un buzón vacío y se quedaron con el bot. Ahí están los 20 agendamientos donde el bot trabajó solo. Y las del sábado y domingo recibieron 269 mensajes en 48 horas, cuando ya habían tenido tiempo de buscar a otra. La misma cantidad de trabajo repartida en siete días vale más que concentrada en dos."}, {"c": "En la clase te enseñamos que nunca se responde únicamente con el precio. El molde es: \"claro que sí, con mucho gusto te doy toda la información, pero antes cuéntame, ¿qué te gustaría mejorar exactamente?\"", "h": "16 leads preguntaron precio y en todas las que revisamos respondió el bot. A Martha, que escribió el 3 de octubre \"Donde están ubicados y precio por favor!!\", el bot le dio dirección y precio; dos minutos después Martha contestó \"Wow!! Es costoso para mí!\" y no volvió a escribir. Julie preguntó \"Cuánto tú cobras\" el 4 de octubre a las 17:36 y no tuvo respuesta tuya.", "p": "Martha es el caso de manual: recibió una cifra sin contexto, la comparó con su presupuesto y se fue sola. Si la primera respuesta hubiera sido \"cuéntame cómo tienes las cejas ahora y qué te gustaría lograr\", el precio habría llegado después de que ella quisiera el resultado, no antes."}, {"c": "En la clase te explicamos que el bot es apoyo, no reemplazo: responde rápido, inicia y filtra, pero tú interpretas la necesidad y cierras. La confianza la construyes tú.", "h": "De las 26 leads que agendaron, en 20 el bot lo hizo solo. Cuatro de las que agendaron — Evelin, Denise, Nayda e Ivelisse — no recibieron un solo mensaje tuyo antes de la cita. Denise escribió 13 mensajes y Nayda 12, todas atendidas por el bot.", "p": "Que el bot cierre 20 citas es una buena noticia operativa, pero significa que 20 personas van a llegar a tu silla sin haber hablado contigo. Las 6 donde entraste son las que llegan sabiendo quién eres. Esa diferencia no se ve en la tasa de esta semana; se ve en quién vuelve el mes que viene."}], "cierre": "Esta semana demostró dos cosas al mismo tiempo. Que tu cuenta aguanta volumen: 63 leads y 26 citas, el mejor número absoluto que has tenido. Y que el método importa justo cuando hay volumen: el método ya está grabado, ya lo viste en la clase de seguimiento, y esta semana se probó en tu propia cuenta — las leads de los días en que trabajaste llegaron a cita contigo, y las de los días en que no, llegaron con el bot o no llegaron. Mientras se siga trabajando a ráfagas el número no se va a mover de ahí: tus clientas de siempre llegan solas porque ya confían en ti, pero quien te vio en un anuncio el miércoles y no recibió nada hasta el domingo ya pidió precio en otros tres lugares.", "funciono": "Dos cosas. La primera: 34 notas de voz en una semana, contra 5 la semana pasada. Multiplicaste por siete la pieza más difícil del método justo cuando más leads tenías, y eso es lo que sostuvo las 6 citas de esfuerzo mutuo y buena parte de las 26. La segunda: la foto. Llevabas semanas en cero y esta semana le mandaste foto a 4 de las 26 que agendaron. Son pocas todavía, pero es la primera vez que ese contador no está en cero, y esas 4 son las que llegan con el miedo ya resuelto. Y le escribiste después de agendar a 22 de 26, que es casi todas.", "acciones": [{"t": "Reparte: 25 mensajes de lunes a viernes", "d": "No te pedimos más trabajo. El domingo mandaste 185 mensajes; el miércoles, 1. Pon la misma energía repartida: una revisión al día, de los dos días anteriores, y las leads del lunes dejan de esperar hasta el sábado.", "g": ""}, {"t": "Julie, Annie y Sonia: te escribieron el sábado", "d": "Julie preguntó cuánto cobras, Annie contó que se le borró un microblading de hace cinco años y Sonia pidió información de la evaluación. Las tres del 4 de octubre, ninguna con respuesta tuya. Annie es la más fácil: ya te contó su problema.", "g": "Hola Annie, soy Gloribel. Me cuentas que el microblading de hace cinco años se te borró — eso lo veo muchísimo y tiene arreglo. Mándame una foto de cómo están tus cejas ahora para ver cuánto pigmento queda, y te digo si vas directo a un retoque o si te conviene empezar de nuevo con nano."}, {"t": "Antes del precio, la pregunta", "d": "16 personas preguntaron precio esta semana y las 16 recibieron una cifra o una dirección antes de que nadie les preguntara qué querían. Martha se fue diciendo \"es costoso para mí\". Métete tú primero con una sola frase.", "g": "Claro que sí, con mucho gusto te doy toda la información. Pero antes cuéntame: ¿qué es lo que más te gustaría mejorar de tus cejas? Mándame una foto de cómo las tienes ahora, porque el precio cambia según el trabajo y no quiero darte un número que no sea el tuyo."}], "pie": "Los números salen de tu cuenta de EpikFlow entre el lunes 28 de septiembre y el domingo 4 de octubre de 2026. Solo cuentan como tuyos los mensajes que salieron de tu teléfono o de tu equipo desde la plataforma, así que si algo quedó fuera es porque no pudimos verlo, nunca al revés."}</script><script src="/assets/a.js" defer></script></html>
