<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reporte de Gestión</title><link rel="stylesheet" href="/assets/s.css"><script type="application/json" id="d">{"slug": "gloribel-gonzalez", "nombre": "Gloribel Gonzalez", "estado": "listo", "rango": "Semana del 5 al 11 de octubre de 2026", "rangoCorto": "5–11 oct", "rangoAnt": "28 sep–4 oct", "tasa": {"pct": 26, "num": 20, "den": 76, "botSola": 24, "ella": 0, "mutuo": 2, "leadSola": 0, "pctAnt": 41}, "historico": [{"etq": "24–30 ago", "tasa": 38}, {"etq": "31 ago–6 sep", "tasa": 55}, {"etq": "7–13 sep", "tasa": 56}, {"etq": "14–20 sep", "tasa": 39}, {"etq": "21–27 sep", "tasa": 57}, {"etq": "28 sep–4 oct", "tasa": 41}, {"etq": "5–11 oct", "tasa": 26}], "intro": ["Esta semana trabajaste más que nunca y convertiste menos que nunca, y la explicación no es el esfuerzo: es <b>cuándo</b> lo pusiste. Le escribiste a 56 de 76 leads y mandaste 56 notas de voz — las dos cifras por encima de la meta y entre las mejores de toda la cartera. Nadie te va a decir que no trabajas.", "Pero mira el reparto de tus mensajes por día: lunes 53, martes 25, miércoles 12, jueves 79, viernes 7, <b>sábado 2</b> y <b>domingo 154</b>. Más de la mitad del trabajo de la semana salió el domingo, de golpe. Las personas que escribieron jueves, viernes y sábado esperaron dos y tres días a que alguien les hablara, y para entonces ya habían decidido. La tasa bajó de 41% a 26% con más leads y más esfuerzo tuyo. <b>Todo lo demás en este reporte es consecuencia de eso.</b>"], "kpis": [{"k": "Leads de anuncio", "s": "Leads", "v": 76, "ant": 63, "t": "76", "at": "63"}, {"k": "Les escribiste antes", "s": "Escribiste", "v": 56, "ant": 37, "t": "56", "at": "37 de 63"}, {"k": "Con nota de voz", "s": "Voz", "v": 56, "ant": 34, "t": "56", "at": "34 de 63"}, {"k": "Agendaron", "s": "Agendaron", "v": 20, "ant": 26, "t": "20", "at": "26"}, {"k": "Les escribiste después", "s": "Después", "v": 14, "ant": 22, "t": "14", "at": "22 de 26"}, {"k": "Les mandaste la foto", "s": "Foto", "v": 4, "ant": 4, "t": "4", "at": "4 de 26"}], "barras": [{"label": "Leads a los que le escribiste", "num": 56, "den": 76, "meta": 60}, {"label": "Leads con nota de voz", "num": 56, "den": 76, "meta": 40}, {"label": "Citas a las que mandaste la foto", "num": 4, "den": 20, "meta": 60, "vacio": "Esta semana no hubo citas, así que esta barra no aplica."}], "origen": [{"k": "El bot", "v": 18, "c": "#2F6F68"}, {"k": "Tú, desde el teléfono", "v": 3, "c": "#C0522F"}], "origenNota": "De las 21 citas creadas con leads de publicidad, 18 las creó el bot y 3 las creaste tú. Pero mirando quién habló con la persona <b>antes</b> de que existiera la cita, en 18 de las 20 el bot trabajó solo y en apenas 2 el trabajo fue de los dos. Con 56 notas de voz tuyas en la semana, que solo 2 citas lleven tu huella antes del agendamiento significa que tus audios están llegando después de que la decisión ya se tomó.", "metodo": [{"c": "La rutina diaria: revisar todos los días las conversaciones de por lo menos los dos días anteriores. Es una rutina diaria, no un repaso semanal.", "h": "Sábado: <b>2 mensajes</b>. Domingo: <b>154</b>. Entre el jueves y el sábado solo salieron 9 mensajes tuyos en tres días, y el domingo saliste a tapar todo de una vez.", "p": "Los leads que entraron viernes y sábado esperaron hasta 48 horas. La mediana entre que una persona llega por un anuncio y agenda es de 18 minutos; a los dos días ya reservó en otro lado o se le pasó el impulso. Es exactamente la diferencia entre el 41% de la semana pasada y el 26% de esta."}, {"c": "No respondas únicamente con el precio. El molde: «claro que sí, con mucho gusto te doy toda la información, pero antes cuéntame, ¿qué te gustaría mejorar exactamente?»", "h": "<b>16 personas preguntaron el precio esta semana y solo a una le contestaste tú</b> — a Mile, el 11/10, y le mandaste un audio. Las otras 15 se quedaron con el bot: Janina preguntó «¿qué precio tienen?» el 10/10, Enid «¿cuánto es el costo de microblading?» el 9/10, Siana escribió «¿Precios?» el 10/10, Isbet preguntó si podía hacerse las cejas el mismo día de la evaluación el 7/10.", "p": "El bot responde bien y no suelta cifras — eso está correcto. Pero a Isbet le estaban preguntando si puede resolver todo en un viaje: eso es una señal de compra y solo tú puedes contestarla con un sí concreto y una hora. Mile, la única que recibió tu audio, es también la única de las 16 con tu huella en la conversación."}, {"c": "Después de que agenda, empujar a la que ya agendó para que asista, con el mensaje y la foto del lugar.", "h": "De las 20 que agendaron le escribiste a 14, pero <b>solo 4 recibieron la foto</b>. Y hay varias que cerraron su propia cita sola con el bot sin un mensaje tuyo: Carmen escribió «10/16 a las 12:00» el 8/10, Millie «El 15 de oct.» el 7/10, Nancy «Estaré ahí» el 7/10 y ❤️ confirmó «5:30» el 8/10.", "p": "Esas cuatro ya tienen fecha y nunca escucharon tu voz. Son las que más riesgo de plantón tienen, porque su compromiso es con un sistema, no contigo. Mandar la foto del local y un audio de 15 segundos a las 16 que faltan es el movimiento más barato de todo este reporte."}, {"c": "La intención se dirige al lead de publicidad, y las sardinas también compran: hay quien escribe un año después.", "h": "Marina te escribió el 11/10 a las 15:22 «<b>Necesito una cita</b>» — tres mensajes suyos, ninguno tuyo, sin cita. Lillian cerró el 6/10 con «¡Claro!!! ¡Gracias!!!» y tampoco agendó.", "p": "«Necesito una cita» es la frase más fácil de cerrar que existe y se quedó sin respuesta tuya en el día de más volumen. Cuando se trabaja de golpe, lo que se cae no son los leads tibios: son los que escribieron justo cuando no estabas mirando."}], "cierre": "Lo que falta acá no es trabajo ni ganas: es ritmo. La clase de seguimiento diario es diaria por esto exactamente — no sirve hacer en un domingo lo que había que hacer el jueves, porque la persona ya no está del otro lado. Y la prueba está en tu propia cuenta: con <b>menos</b> esfuerzo repartido en la semana llegaste a 41% y 57%; con más esfuerzo concentrado en un día bajaste a 26%. El método ya está grabado y ya lo viste. Mientras los leads nuevos esperen al domingo, el número va a seguir cayendo aunque mandes el doble de audios — tus clientas de siempre te esperan porque ya confían en ti, pero quien te vio en un anuncio no espera dos días.", "funciono": "Las 56 notas de voz, y una en particular: a Mile, que el 11/10 preguntó «quería saber el costo», le respondiste tú con un audio en vez de dejarla con el bot. Esa es la única de las 16 que preguntaron precio donde entraste tú, y es exactamente el molde de la clase. Tus 56 audios son de las mejores cifras de toda la cartera — el problema no es lo que mandas, es cuándo.", "acciones": [{"t": "20 minutos cada mañana, de lunes a sábado", "d": "No más. Abre las conversaciones de los dos días anteriores y contesta las que quedaron a medias. Si el sábado hubieras mandado 20 en vez de 2, el domingo no habrías necesitado 154.", "g": ""}, {"t": "Marina, hoy", "d": "Escribió «Necesito una cita» el domingo y nadie le respondió. Es la más fácil de la semana.", "g": "Hola Marina, soy Gloribel. Perdón la demora, te contesto yo. Te aparto tu evaluación gratis esta semana: ¿te queda mejor entre semana o el fin de semana? Y mándame una foto de cómo tienes tus cejas ahora para ir adelantando."}, {"t": "La foto del local a las 16 que faltan", "d": "De 20 citas, solo 4 tienen la foto. Carmen, Millie, Nancy y ❤️ cerraron su cita con el bot y no han escuchado tu voz.", "g": "Hola [nombre], soy Gloribel 💛 Te confirmo tu cita de [día] a las [hora]. Te dejo la foto del lugar para que lo ubiques fácil: 2946 Pleasant Hill Rd, Kissimmee. ¿Nos vemos ahí?"}], "pie": "Los números salen de tu cuenta de EpikFlow entre el lunes 5 y el domingo 11 de octubre. Solo cuentan como tuyos los mensajes que salieron de tu teléfono o de tu equipo desde la plataforma, así que si algo quedó fuera es porque no pudimos verlo, nunca al revés."}</script><script src="/assets/a.js" defer></script></html>
