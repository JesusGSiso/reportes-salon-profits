<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reporte de Gestión</title><link rel="stylesheet" href="/assets/s.css"><script type="application/json" id="d">{"slug": "gloribel-gonzalez", "nombre": "Gloribel Gonzalez", "estado": "listo", "rango": "Semana del 19 al 25 de octubre de 2026", "rangoCorto": "19–25 oct", "rangoAnt": "12–18 oct", "tasa": {"pct": 3, "num": 2, "den": 65, "botSola": 0, "ella": 0, "mutuo": 3, "leadSola": 0, "pctAnt": 14}, "historico": [{"etq": "31 ago–6 sep", "tasa": 55}, {"etq": "7–13 sep", "tasa": 56}, {"etq": "14–20 sep", "tasa": 39}, {"etq": "21–27 sep", "tasa": 57}, {"etq": "28 sep–4 oct", "tasa": 41}, {"etq": "5–11 oct", "tasa": 26}, {"etq": "12–18 oct", "tasa": 15}, {"etq": "19–25 oct", "tasa": 3}], "intro": ["Gloribel, esta semana le escribiste a <b>53 de los 65 leads</b> que entraron, y a <b>esos mismos 53 les mandaste nota de voz</b>. Eso es el 82% en las dos cosas y es, con diferencia, el número más alto de toda la cartera. Nadie más se acerca. Trabajaste 346 mensajes en siete días. Que quede claro antes que nada: el esfuerzo está y es enorme.", "Y aun así solo agendaron 2 personas. Ese número no cuadra con lo que hiciste, y parte de la explicación no está en tus manos: lo estamos revisando de nuestro lado. Lo que sí está en tus manos es dónde se rompe la conversación, y se rompe en dos sitios muy concretos: cuando preguntan el precio y cuando el trabajo se amontona el fin de semana. <b>Todo lo demás en este reporte es consecuencia de eso.</b>"], "kpis": [{"k": "Leads de anuncio", "s": "Leads", "v": 65, "ant": 59, "t": "65", "at": "59"}, {"k": "Les escribiste antes", "s": "Escribiste", "v": 53, "ant": 42, "t": "53", "at": "42 de 59"}, {"k": "Con nota de voz", "s": "Voz", "v": 53, "ant": 38, "t": "53", "at": "38 de 59"}, {"k": "Agendaron", "s": "Agendaron", "v": 2, "ant": 8, "t": "2", "at": "8"}, {"k": "Les escribiste después", "s": "Después", "v": 2, "ant": 8, "t": "2", "at": "8 de 8"}, {"k": "Les mandaste la foto", "s": "Foto", "v": 0, "ant": 0, "t": "0", "at": "0 de 8"}], "barras": [{"label": "Leads a los que le escribiste", "num": 53, "den": 65, "meta": 60}, {"label": "Leads con nota de voz", "num": 53, "den": 65, "meta": 40}, {"label": "Citas a las que mandaste la foto", "num": 0, "den": 2, "meta": 60, "vacio": "Esta semana no hubo citas, así que esta barra no aplica."}], "origen": [{"k": "El bot", "v": 1, "c": "#2F6F68"}, {"k": "Tú, desde el teléfono", "v": 2, "c": "#C0522F"}], "origenNota": "De las 3 citas que se crearon, 2 las pusiste tú a mano desde el teléfono y 1 el bot. En las 2 que vinieron de leads de anuncio tú habías puesto conversación antes: ninguna cita de esta semana salió del bot trabajando solo. Eso dice algo importante: cuando hay cita, es porque tú estuviste. El problema no es que el bot te quite el crédito, es que de 65 conversaciones solo 2 llegaron hasta el final.", "metodo": [{"c": "En la clase te enseñamos no responder únicamente con el precio, y el molde exacto: «claro que sí, con mucho gusto te doy toda la información, pero antes cuéntame, ¿qué te gustaría mejorar exactamente?». El objetivo de esa primera conversación no es vender el procedimiento, es vender el siguiente paso.", "h": "21 leads preguntaron el precio esta semana. A Idaliamelendez le respondiste el 25/10 a las 20:38: «El costo del Powder brows que es como la simulación que te hice es de $375. El nano brows…» — la cifra directa, sin preguntarle antes qué quería mejorar. A Joha, que preguntó el 24/10 a las 23:46 «El precio cual es», le escribiste «Buen día mi corazón ♥️» y la conversación se quedó ahí.", "p": "Los dos extremos fallan: la cifra pelada cierra la conversación y el saludo sin contenido tampoco la abre. Ninguna de las dos agendó."}, {"c": "En la clase de seguimiento diario te explicamos revisar todos los días las conversaciones de por lo menos los dos días anteriores, y buscar cuatro grupos: quien dejó de responder, quien preguntó y no agendó, quien quedó a medias, a quien se le dieron horarios y no confirmó.", "h": "12 leads no recibieron ni un mensaje tuyo. El más caro: <b>Karina</b> escribió el 25/10 a las 17:13 «Quiero reservar un cupo para la evaluación gratuita de cejas» y nadie le contestó. Roxy escribió ese mismo día a las 18:40 «Precio de las cejas» y tampoco. Stella dijo el 23/10 «Primera vez» y quedó ahí.", "p": "Karina pidió el cupo con esas palabras. No hubo que convencerla de nada y se perdió igual."}, {"c": "En la clase te explicamos gestionar desde la computadora, no desde el teléfono: el teléfono sirve para apagar incendios, pero el seguimiento organizado se hace sentada, revisando lista por lista.", "h": "Tu reparto de la semana fue: lunes 30 mensajes, martes 37, miércoles 55, jueves 30, viernes 16, <b>sábado 109 y domingo 69</b>. El 51% de todo el trabajo de la semana cayó en dos días.", "p": "Esa es la firma de apagar incendios: el viernes bajas a 16 y el sábado tienes que mandar 109 de golpe. En ráfaga se contesta, pero no se construye confianza, y la confianza es justo lo que le falta a quien te vio en un anuncio."}], "cierre": "Nada de esto es una opinión nuestra: está grabado en la clase de seguimiento diario y en la de nota de voz, y esta semana quedó probado en tu propia cuenta. Las 2 citas que salieron salieron de conversaciones donde tú estabas, no del bot. Y mientras la pregunta de precio se conteste con una cifra —o con un saludo— y el trabajo se amontone el fin de semana, el número no se va a mover: tus clientas de siempre vuelven solas porque ya confían en ti, pero quien te vio en un anuncio está cotizando y comparando. A esa hay que construirle la confianza, y tú ya sabes hacerlo: 53 notas de voz en una semana lo demuestran.", "funciono": "Hay un dato que quiero que veas aparte de todo lo demás: de los 65 leads que entraron, le escribiste a 53 y a los 53 les mandaste audio. Eso es el <b>82%</b>, cuando la meta que nos pusimos era 60% y 40%. Pasaste las dos. En toda la cartera no hay otra cuenta cerca de ese número. Y las 2 citas de la semana salieron de conversaciones tuyas, no del bot: cuando entras, cierra. El trabajo no hay que inventarlo, ya está hecho; hay que apuntarlo al momento exacto en que la lead pregunta el precio, que es cuando se decide todo.", "acciones": [{"t": "Karina, Roxy y las otras 10", "d": "Karina pidió el cupo por escrito el domingo y Roxy preguntó el precio ese mismo día. Son las dos primeras llamadas de hoy, antes que cualquier otra cosa.", "g": "Hola Karina, soy Gloribel. Vi tu mensaje del domingo pidiendo el cupo para la evaluación gratuita y te lo quiero apartar hoy mismo. Para prepararte la simulación, mándame una foto de cómo están tus cejas ahora y otra de cómo te gustaría verlas. ¿Te viene mejor entre semana o el fin de semana?"}, {"t": "Cuando pregunten el precio, pregunta tú primero", "d": "21 personas preguntaron el precio esta semana y ninguna agendó. Esta semana, antes de dar cualquier cifra, manda una pregunta. Una sola.", "g": "Claro que sí mi amor, con mucho gusto te doy toda la información. Pero antes cuéntame: ¿qué es lo que más te gustaría mejorar de tus cejas, la forma o el color? Mándame una foto de cómo las tienes ahora y te digo exactamente cuál de las técnicas te sirve, porque el precio cambia según eso y no te quiero dar un número que no es el tuyo."}, {"t": "Baja el sábado, sube el viernes", "d": "El sábado mandaste 109 mensajes y el viernes 16. No trabajes más: reparte. Media hora cada mañana de lunes a viernes revisando los dos días anteriores te deja el sábado libre para atender bien, no para correr."}], "pie": "Los números salen de tu cuenta de EpikFlow entre el lunes 19 y el domingo 25 de octubre. Solo cuentan como tuyos los mensajes que salieron de tu teléfono o de tu equipo desde la plataforma, así que si algo quedó fuera es porque no pudimos verlo, nunca al revés."}</script><script src="/assets/a.js" defer></script></html>
