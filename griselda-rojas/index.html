<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reporte de Gestión</title><link rel="stylesheet" href="/assets/s.css"><script type="application/json" id="d">{"slug": "griselda-rojas", "nombre": "Griselda Rojas", "estado": "listo", "rango": "Semana del 2 al 8 de noviembre de 2026", "rangoCorto": "2–8 nov", "rangoAnt": "26 oct–1 nov", "tasa": {"pct": 26, "num": 10, "den": 39, "botSola": 21, "ella": 0, "mutuo": 5, "leadSola": 0, "pctAnt": 11}, "historico": [{"etq": "14–20 sep", "tasa": 0}, {"etq": "21–27 sep", "tasa": 67}, {"etq": "28 sep–4 oct", "tasa": null}, {"etq": "5–11 oct", "tasa": 0}, {"etq": "12–18 oct", "tasa": 21}, {"etq": "19–25 oct", "tasa": 25}, {"etq": "26 oct–1 nov", "tasa": 11}, {"etq": "2–8 nov", "tasa": 26}], "intro": ["Griselda, esta semana entraron 39 leads de publicidad — cuatro veces más que la semana pasada — y agendaron 10. Tu tasa pasó del 11% al <b>26%</b>. Y no fue el volumen: escribiste <b>los siete días de la semana</b>, 140 mensajes a mano a leads de pauta, con 31 el martes y 25 el domingo por la noche. De todas las cuentas que medimos, eres la que más trabaja el chat con sus propias manos. Eso hay que decirlo primero porque es verdad.", "Y aun así, <b>13 de las 39 no recibieron ni un mensaje tuyo</b>. Cuatro de ellas escribieron una sola línea — «Hola, me gustaría información sobre la prueba de mechón gratuita» — y nadie de carne y hueso les contestó nunca. No es que no trabajes: es que el trabajo se te va en las conversaciones largas, las que ya están calientes, y las que acaban de levantar la mano se quedan con el bot. <b>Todo lo demás en este reporte es consecuencia de eso.</b>"], "kpis": [{"k": "Leads de anuncio", "s": "Leads", "v": 39, "ant": 9, "t": "39", "at": "9"}, {"k": "Les escribiste antes", "s": "Escribiste", "v": 20, "ant": 8, "t": "20", "at": "8 de 9"}, {"k": "Con nota de voz", "s": "Voz", "v": 7, "ant": 2, "t": "7", "at": "2 de 9"}, {"k": "Agendaron", "s": "Agendaron", "v": 10, "ant": 1, "t": "10", "at": "1"}, {"k": "Les escribiste después", "s": "Después", "v": 7, "ant": 1, "t": "7", "at": "1 de 1"}, {"k": "Les mandaste la foto", "s": "Foto", "v": 0, "ant": 0, "t": "0", "at": "0 de 1"}], "barras": [{"label": "Leads a los que le escribiste", "num": 20, "den": 39, "meta": 60}, {"label": "Leads con nota de voz", "num": 7, "den": 39, "meta": 40}, {"label": "Citas a las que mandaste la foto", "num": 0, "den": 10, "meta": 60}], "origen": [{"k": "El bot", "v": 10, "c": "#2F6F68"}], "origenNota": "Las 10 citas las creó el bot. En 5 de esas 10 conversaciones tú habías escrito antes de que existiera la cita, y ahí el agendamiento es de los dos: son 5 de tus 26 puntos. En las otras 5 el bot trabajó solo. No es que el bot convierta mejor que tú — es que en 13 de 39 conversaciones fue el único que habló.", "metodo": [{"c": "En la clase te enseñamos que no se responde únicamente con el precio: «con mucho gusto te doy toda la información, pero antes cuéntame, ¿qué te gustaría mejorar exactamente?». La pregunta primero, la cifra después.", "h": "6 leads preguntaron precio y en una sola entraste tú: a Lupita, el 4/11, le escribiste «mándame foto de tu cabello de espalda donde yo lo pueda ver…». Exactamente el molde. En las otras 5 contestó el bot. Y «A», que mandó 10 mensajes, cerró el 8/11 con «muchas gracias por la información 😊 Por ahora se sale de mi presupuesto».", "p": "Lupita siguió conversando. «A» se fue por precio después de 10 mensajes y sin que tú entraras nunca; esa es la conversación más avanzada que se perdió esta semana."}, {"c": "En la clase te explicamos la rutina diaria: revisar las conversaciones de por lo menos los dos días anteriores y buscar cuatro grupos — quien dejó de responder, quien preguntó y no agendó, quien quedó a medias, y a quien se le dieron horarios y no confirmó.", "h": "Escribiste los siete días, eso está hecho. Pero el repaso hacia atrás no: Betty escribió el domingo 8 a las 23:58 pidiendo información de la prueba de mechón y sigue sin respuesta tuya; Yirlesa lo mismo el 8 a las 19:06; Paola y Calles, el 5. Cuatro mensajes idénticos, cuatro silencios.", "p": "Esas cuatro son el grupo más fácil de la semana: acababan de escribir por primera vez, con interés declarado. Ninguna agendó."}, {"c": "En la clase te explicamos que después de que agenda hay un segundo trabajo — empujarla para que asista — y que la foto es lo que sostiene esa espera. No se mide si vino; se mide si le mandaste la foto y el mensaje, que sí está en tu mano.", "h": "De las 10 que agendaron, les escribiste a 7. Eso está bien. Pero a ninguna de las 10 le mandaste una foto. Adis llegó a preguntar «Pregunto por Griselda?» el 5/11 y 💋💋 cerró con «Ok gracias» el 6/11: las dos con cita y sin un mensaje tuyo antes de ella.", "p": "Diez citas sin foto es la pieza más corta de arreglar de todo tu reporte, porque el trabajo difícil — traerlas al calendario — ya está hecho."}], "cierre": "Griselda, a ti no hay que pedirte que trabajes más: 140 mensajes a mano en siete días es más de lo que hace cualquier otra cuenta de la cartera. El método ya está grabado, tú ya lo viste, y esta semana se probó en tu propia cuenta: el mensaje que le mandaste a Lupita — foto primero, precio después — es el molde literal de la clase y funcionó. Lo que hay que cambiar es dónde cae ese esfuerzo. Mientras las conversaciones nuevas esperen al bot y tú sigas en las que ya están abiertas, el número se va a quedar donde está, porque son justo las nuevas las que necesitan tu voz. A tus clientas de siempre les basta un «Igualmente» tuyo; ya confían. Quien te vio en un anuncio el domingo a medianoche todavía no sabe quién eres, y lo único que le puede decir que vales la pena eres tú.", "funciono": "Dos cosas esta semana. La primera, el mensaje a <b>Lupita</b> el 4 de noviembre: ella preguntó «y los precios» y tú, en vez de la cifra, le pediste una foto de su cabello de espalda con buena luz. Eso es vender el siguiente paso. La segunda, la conversación con <b>Willy</b> el domingo por la noche: él preguntaba por su esposa y lo llevaste paso a paso — qué quiere lograr, cómo tiene el cabello, cuándo fue el último proceso, foto de frente y de espalda. Esa es la escalera de preguntas de la clase, hecha entera por ti, a las once de la noche de un domingo.", "acciones": [{"t": "Contesta las cuatro de «prueba de mechón»", "d": "Betty, Yirlesa, Paola y Calles escribieron una sola línea pidiendo información y nunca recibieron un mensaje tuyo. Son cuatro mensajes de dos minutos cada uno.", "g": "Hola Betty, soy Griselda 😊 Claro que sí, la evaluación capilar con prueba de mechón es gratis y dura 45 minutos. Antes de agendarte, mándame una foto de tu cabello ahora, de frente y de espalda, con luz natural — así ya llego con una idea de lo que se puede hacer."}, {"t": "Recupera a «A» antes de que se enfríe", "d": "Mandó 10 mensajes y se fue diciendo que se sale de su presupuesto. Ese no es un no: es un «no a ese número». Es la lead más avanzada que perdiste esta semana.", "g": "Te leí y te entiendo perfectamente. No todo se hace de una vez: en la evaluación gratuita podemos ver qué se puede lograr por partes, empezando por lo que más se te note. ¿Te sirve que la hagamos este sábado por la mañana?"}, {"t": "Una foto a cada una de las 10 que ya agendaron", "d": "Ninguna de las 10 citas de esta semana recibió foto. El día antes, una foto de un trabajo tuyo parecido a lo que ella pidió: es lo que hace que no se arrepienta."}], "pie": "Los números salen de tu cuenta de EpikFlow entre el lunes 2 y el domingo 8 de noviembre. Solo cuentan como tuyos los mensajes que salieron de tu teléfono o de tu equipo desde la plataforma, así que si algo quedó fuera es porque no pudimos verlo, nunca al revés."}</script><script src="/assets/a.js" defer></script></html>
