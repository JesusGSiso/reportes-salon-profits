con nota de voz", "num": 3, "den": 14, "meta": 40}, {"label": "Citas a las que mandaste la foto", "num": 0, "den": 3, "meta": 60, "vacio": "Esta semana no hubo citas, así que esta barra no aplica."}], "origen": [{"k": "El bot", "v": 2, "c": "#2F6F68"}, {"k": "Tú, desde el teléfono", "v": 1, "c": "#C0522F"}], "origenNota": "Se crearon 3 citas con leads de anuncio: 2 las puso el bot y 1 se puso desde la plataforma. Mirando quién participó antes de la cita, una de las 3 personas había hablado contigo. Son números chicos, así que vale más mirarlos en personas que en porcentajes. Las 3 citas son para los próximos días, así que todavía no han ocurrido; eso no es un pendiente tuyo.", "metodo": [{"c": "En la clase de seguimiento te explicamos el molde para el precio: nunca la cifra sola, sino «claro que sí, con mucho gusto te doy toda la información, pero antes cuéntame, ¿qué te gustaría mejorar exactamente?». Y para color, la pregunta es la foto: cómo lo tiene ahora y la referencia que le gusta.", "h": "Tres leads preguntaron precio y en ninguna entraste tú. Yulia, el 12/10, mandó una foto y escribió «dígame los precios para este color de la imagen» — el bot le contestó «desde $320». Vane el 16/10 («quiero saber cuánto cuesta») y Pita el 17/10 («precio promedio balayage cabello a los hombros») también las tomó el bot.", "p": "Yulia ya había hecho el trabajo más difícil: mandó la foto de lo que quiere. Esa conversación era tuya. Pita cerró con un «Gracias» dos minutos después del precio y no agendó. El bot no debía soltar la cifra —eso lo corregimos nosotros— pero el momento era tuyo."}, {"c": "La rutina diaria: entrar todos los días y revisar las conversaciones de por lo menos los dos días anteriores, buscando a quien preguntó y no agendó y a quien quedó a medias.", "h": "El lunes mandaste 15 mensajes y el domingo 8. Entre medias: martes 0, miércoles 3, jueves 1, viernes 1, sábado 1. Angela y Lili pidieron la prueba de mechón el viernes 16 y nadie les escribió.", "p": "4 de los 14 leads no tienen ni un mensaje tuyo, y dos de ellos estaban pidiendo la cita con esas palabras. Los días flojos son exactamente sus días."}, {"c": "A quien quedó debiendo algo se le vuelve a pedir, y a quien ya agendó se le empuja con la foto del resultado antes de la cita.", "h": "Tannia te escribió el 17/10 «En un rato más te mando, estoy en mi trabajo», quedando a deber la foto, y nadie se la volvió a pedir. Y de las 3 que agendaron, le escribiste a 2 pero a ninguna le mandaste la foto del resultado.", "p": "Tannia es una conversación que se apagó a un paso del final. Y las 3 citas llegan sin ver a dónde van."}], "cierre": "Tu cobertura es de las mejores de la cartera: 8 de 14 leads tocados, con 3 notas de voz y una cita que lleva tu trabajo dentro. Eso ya funciona. Lo que la clase de seguimiento pide ahora es llegar primero al momento del precio — es el instante en que la persona ya levantó la mano y, cuando lo toma el bot con una cifra, la conversación se apaga. Las tres de esta semana lo demuestran en tu propia cuenta. Tus clientas de siempre ya saben cómo trabajas; quien te vio en un anuncio solo tiene el número para juzgar, y por eso la pregunta tiene que ir antes.", "funciono": "El lunes 12 mandaste 15 mensajes a leads de la pauta en un día, y el domingo 8 más: cuando te sientas, trabajas de verdad. Las 3 notas de voz y el 57% de cobertura te ponen entre las mejores de la cartera esta semana. Y pasaste de 0 citas a 3 después de una semana en blanco. Nota honesta: con 14 leads la muestra es chica, así que lee los números en personas y no en porcentajes.", "acciones": [{"t": "Hoy: Angela y Lili", "d": "Las dos pidieron información de la prueba de mechón gratuita el viernes y no tienen cita.", "g": "Hola [nombre], soy Griselda. La prueba de mechón va dentro de la evaluación capilar, que es gratis y dura 45 minutos. Mándame una foto de cómo tienes el cabello ahora y otra de cómo te gustaría verlo. ¿Te queda mejor entre semana o el fin de semana?"}, {"t": "Yulia, que ya mandó la foto", "d": "El 12/10 mandó la imagen del color que quiere y solo recibió un precio del bot. Es la conversación más avanzada de la semana.", "g": "Hola Yulia, soy Griselda. Vi la foto del color que quieres y sí se puede. Para decirte exactamente qué necesita tu cabello y cuánto sería en tu caso, te espero en la evaluación, que es gratis: ¿mañana o el fin de semana?"}, {"t": "Tannia y la foto que quedó debiendo", "d": "Dijo «en un rato te mando» el viernes desde su trabajo. Pídesela tú hoy, y mándales la foto del resultado a las 3 que ya tienen cita."}], "pie": "Los números salen de tu cuenta de EpikFlow entre el lunes 12 y el domingo 18 de octubre de 2026. Solo cuentan como tuyos los mensajes que salieron de tu teléfono o de tu equipo desde la plataforma, así que si algo quedó fuera es porque no pudimos verlo, nunca al revés."}</script><script src="/assets/a.js" defer></script></html>
