Esta semana no hubo citas, así que esta barra no aplica."}], "origen": [{"k": "El bot", "v": 9, "c": "#2F6F68"}, {"k": "Tú, desde la plataforma", "v": 3, "c": "#C0522F"}], "origenNota": "Se crearon 12 citas con leads de anuncio: 9 las puso el bot y 3 las pusiste tú desde la plataforma. Pero mirando quién participó antes de la cita, las 9 personas que agendaron esta semana llegaron a la cita sin haber hablado contigo. Varias de esas citas son para los próximos días, así que todavía no han ocurrido; eso no es un pendiente tuyo.", "metodo": [{"c": "En la clase de seguimiento te explicamos que el bot es apoyo, no reemplazo: él filtra y responde rápido, pero quien escribe pidiendo la evaluación ya levantó la mano, y ahí entras tú para cerrarla.", "h": "Liliana el 14/10 a las 16:02 y Adri el 12/10 a las 16:13 escribieron, con las mismas palabras exactas, «Hola, me gustaría información sobre evaluación gratis de aclaramiento íntimo». Ninguna de las dos tiene cita, y ninguna de las dos recibió un mensaje tuyo. Esmeralda, el 12/10, contestó a tu saludo y tampoco volvió a recibir nada tuyo.", "p": "Eran 3 de los 17 leads de la semana. Con esas tres tu 53% habría sido 70%."}, {"c": "A quien ya agendó hay que empujarlo para que asista, y la foto del resultado antes de la cita es lo que lo sostiene — sobre todo cuando la persona no te conoce de nada.", "h": "Las 3 personas que recibieron algo tuyo después de agendar recibieron también la foto: eso está bien hecho. El problema son las otras. De las 9 que agendaron, 4 no tienen ni un mensaje tuyo: Sarkitha, que cruzó 11 mensajes y cerró con «Okis gracias» el 14/10; Zelaya, que terminó con «Muchas gracias» el 13/10 después de 13 mensajes; Gina, con 16 mensajes y un «Ok» el 13/10; y una cuarta que la plataforma guardó sin nombre.", "p": "Son 9 citas puestas en tu agenda por una conversación en la que no apareciste. Un mensaje tuyo y la foto es la diferencia entre que vengan y que se caigan."}, {"c": "Las sardinas también compran: a quien preguntó por un horario concreto y no cerró se le vuelve con la pregunta gancho — en aclaramiento, preguntarle cómo se depila la zona y qué tan sensible la tiene.", "h": "T.W.Z preguntó «Sabado?» el 15/10 a las 10:43 después de 7 mensajes. Y el 14/10 a las 19:07 otra lead preguntó «Entre semana qué días tienes disponible a las 6?» después de 10 mensajes. Las dos estaban eligiendo hueco. Ninguna agendó y ninguna recibió un mensaje tuyo.", "p": "Preguntar por un día y una hora es lo más cerca que está una lead de agendar. Esas dos citas estaban hechas."}], "cierre": "El 53% es un buen número y el doble del de la semana pasada, pero es un número del bot: las 9 citas las cerró él solo y tú apareciste antes de agendar con 1 de 17 leads. Eso tiene dos consecuencias. La primera es que las citas llegan frías, y por eso la clase de seguimiento insiste en el mensaje tuyo y en la foto antes de que vengan. La segunda es que lo que el bot no cierra se queda ahí: las tres que pidieron la evaluación y las dos que estaban eligiendo horario son cinco citas que nadie recogió. Esta semana entraron 49 leads menos, así que cada lead vale mucho más que la semana pasada.", "funciono": "Escribiste 24 mensajes a leads de la pauta repartidos en cuatro días — 3 el lunes 13, 10 el miércoles 14, 10 el jueves 15 y 1 el viernes 16 —, así que la costumbre de entrar a la conversación está ahí: el problema es a quién le llegan. Y lo mejor de la semana: las 3 personas a las que les escribiste después de agendar recibieron la foto del resultado. Eso es exactamente lo que pide el método. Son 3 de 9: repetirlo con las otras 6 es trabajo que ya sabes hacer.", "acciones": [{"t": "Hoy: las tres que pidieron la evaluación", "d": "Liliana, Adri y Esmeralda escribieron pidiéndola y se quedaron sin cita y sin un mensaje tuyo. Son las tres citas más fáciles de la semana.", "g": "Hola [nombre], soy Vany. Vi que quieres tu evaluación gratis de aclaramiento, te la agendo yo misma. ¿Te queda mejor entre semana o el sábado?"}, {"t": "La foto a las 6 que agendaron y no tienen nada tuyo", "d": "Empieza por Sarkitha, Zelaya y Gina, que cruzaron más de 10 mensajes cada una y no tienen ni una línea tuya.", "g": "Hola [nombre], soy Vany, yo te atiendo el [día]. Mira cómo quedó una zona parecida a la tuya — eso es a donde vamos. Te espero a las [hora]."}, {"t": "T.W.Z y la lead del jueves, que estaban eligiendo hora", "d": "Una preguntó por el sábado y la otra por entre semana a las 6. Contéstales con un hueco concreto y la pregunta gancho.", "g": "Hola, soy Vany. Te tengo el sábado a las [hora] para tu evaluación. Cuéntame una cosa mientras: ¿cómo te depilas esa zona ahora y qué tan sensible la tienes?"}], "pie": "Los números salen de tu cuenta de EpikFlow entre el lunes 12 y el domingo 18 de octubre de 2026. Solo cuentan como tuyos los mensajes que salieron de tu teléfono o de tu equipo desde la plataforma, así que si algo quedó fuera es porque no pudimos verlo, nunca al revés."}</script><script src="/assets/a.js" defer></script></html>
