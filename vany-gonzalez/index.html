 [{"label": "Leads a los que le escribiste", "num": 18, "den": 31, "meta": 60}, {"label": "Leads con nota de voz", "num": 0, "den": 31, "meta": 40}, {"label": "Citas a las que mandaste la foto", "num": 1, "den": 5, "meta": 60}], "origen": [{"k": "El bot", "v": 4, "c": "#2F6F68"}, {"k": "Tú, desde el teléfono", "v": 1, "c": "#C0522F"}], "origenNota": "De las 5 citas, 4 las creó el bot y 1 la creaste tú. En una de esas conversaciones solo participaste tú antes de la cita — por eso el desglose marca «Tú 3%», que es la primera vez que aparece en tu reporte. En otra pusieron los dos. Las otras tres las hizo el bot sin ti.", "metodo": [{"c": "En la clase te dimos la nota de voz de 5 elementos: tu nombre, una validación, la necesidad que ella expresó, una solución posible y una pregunta para continuar. Con energía, y nunca la misma para dos personas.", "h": "La semana pasada mandaste 9 notas de voz a 43 leads. Esta semana: 0 a 31. Y había material: «.» escribió el 8/11 a las 20:15 «Zona íntima, buenas noches, dónde están ubicados» — una pregunta directa, de noche, sin respuesta tuya.", "p": "Las 9 notas de voz de la semana pasada están en tu cuenta como prueba de que sabes hacerlo y de que tienes tiempo para hacerlo. Esta semana ninguna de las 31 escuchó tu voz."}, {"c": "En la clase te explicamos la rutina diaria: revisar las conversaciones de por lo menos los dos días anteriores y buscar a quien dejó de responder, quien preguntó y no agendó, quien quedó a medias. Y que las sardinas también compran.", "h": "Tus mensajes empezaron el miércoles 4: 5 ese día, 33 el jueves, 14 el viernes, 6 el sábado, 19 el domingo. El lunes y el martes, cero. Mariangel mandó 11 mensajes el 2/11 y cerró con «Me queda un poco lejos 😬 yo estoy en Dallas mark trail way»; Karla mandó 5 y se presentó por su nombre.", "p": "11 de las 31 no recibieron ni un mensaje tuyo, y las dos más avanzadas — Mariangel con 11 mensajes y Danel con 12 — eran de ese lunes y ese martes. Mariangel puso una objeción de distancia, que es la más fácil de contestar, y nadie la contestó."}, {"c": "En la clase te enseñamos que nada de «quedo atenta» ni «por si aún te interesa» — eso no le da a la persona ninguna razón para responder. En su lugar va la pregunta gancho, atada a lo que ella dijo.", "h": "A Alma, el 5/11: «¡De nada, Alma! Quedo atenta si quieres revisar horarios para tu evaluación gratis». Y a «.», el mismo día: «pasando por aquí por si aún te interesa la valoración gratuita que preguntaste».", "p": "Ninguna de las dos respondió. Son los dos únicos seguimientos tuyos de la semana, y los dos usaron el molde que la clase descarta."}], "cierre": "Vany, el método ya está grabado, tú ya lo viste, y esta semana se probó en tu propia cuenta: la respuesta que le diste a Mara el 5 de noviembre — «la evaluación de 30 min es totalmente gratis, sin depósito y sin compromiso» antes de hablar de costo — es el molde exacto de la clase, y de ahí salieron 3 puntos que son solo tuyos. Lo que falta es constancia y voz. Mientras se arranque el miércoles y las notas de voz entren una semana y desaparezcan la siguiente, el número va a subir y bajar sin control, como viene haciendo desde octubre. Y la razón de fondo: tus clientas de siempre te buscan porque ya saben cómo trabajas. Quien vio tu anuncio un lunes y pregunta por la zona íntima necesita confianza antes que información — y eso, en tu servicio más que en ninguno, se transmite con tu voz, no con texto.", "funciono": "Dos respuestas tuyas de esta semana valen como molde. A <b>Mara</b>, el 5 de noviembre, que preguntó «¿qué costo tiene la sesión?»: le explicaste que la evaluación de 30 minutos es totalmente gratis, sin depósito y sin compromiso, y que el costo se define ahí. A <b>Yenny</b>, el 8 de noviembre, lo mismo. En las otras tres preguntas de precio contestó el bot. Esas dos conversaciones tuyas son la razón de que este reporte tenga, por primera vez, puntos que no comparte nadie contigo.", "acciones": [{"t": "Nueve notas de voz, como la semana pasada", "d": "Mandaste 9 la semana pasada y 0 esta. Empieza por las 11 que no recibieron nada de ti, y sobre todo por las que preguntaron por la zona íntima: ahí la voz vale el doble porque el tema es delicado.", "g": "Hola, soy Vany 🤍 Vi que preguntabas por el aclaramiento de la zona íntima. Te cuento que es el tratamiento que más hago y entiendo perfectamente que da pena preguntar. La evaluación es gratis, de 30 minutos, y ahí reviso tu piel y te digo exactamente qué se puede lograr. Dime una cosa: ¿hace cuánto notaste el cambio de tono?"}, {"t": "Contéstale a Mariangel la distancia", "d": "Mandó 11 mensajes y se fue diciendo que le queda lejos. Es una objeción, no un no, y es la más fácil de resolver de la semana.", "g": "Mariangel, te leí que estás por Mark Trail Way. Estamos en 14110 Dallas Pkwy, son unos 20 minutos por la 75 y la mayoría de mis clientas vienen de tu zona. La evaluación son 30 minutos y es gratis. ¿Te sirve mejor un sábado por la mañana o entre semana por la tarde?"}, {"t": "Empieza el lunes", "d": "El lunes y el martes no salió ningún mensaje tuyo y ahí entraron las dos leads más conversadoras de la semana. Diez minutos el lunes por la mañana cambian eso."}], "pie": "Los números salen de tu cuenta de EpikFlow entre el lunes 2 y el domingo 8 de noviembre. Solo cuentan como tuyos los mensajes que salieron de tu teléfono o de tu equipo desde la plataforma, así que si algo quedó fuera es porque no pudimos verlo, nunca al revés."}</script><script src="/assets/a.js" defer></script></html>
