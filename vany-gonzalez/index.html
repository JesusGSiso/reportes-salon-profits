<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reporte de Gestión</title><link rel="stylesheet" href="/assets/s.css"><script type="application/json" id="d">{"slug": "vany-gonzalez", "nombre": "Vany Gonzalez", "estado": "listo", "rango": "Semana del 26 de octubre al 1 de noviembre de 2026", "rangoCorto": "26 oct–1 nov", "rangoAnt": "19–25 oct", "tasa": {"pct": 12, "num": 5, "den": 43, "botSola": 12, "ella": 0, "mutuo": 0, "leadSola": 0, "pctAnt": 32}, "historico": [{"etq": "12–18 oct", "tasa": 53}, {"etq": "19–25 oct", "tasa": 32}, {"etq": "26 oct–1 nov", "tasa": 12}], "intro": ["Hay una noticia buena de verdad: <b>empezaste a gestionar</b>. La semana pasada le escribiste a 0 de 25 leads; esta semana le escribiste a <b>12 de 43</b> y mandaste <b>9 notas de voz</b> donde antes había cero. Ese es el cambio que estábamos esperando y hay que sostenerlo.", "El porcentaje bajó de 32% a 12% y la razón se ve en los números: entraron <b>43 leads</b> en lugar de 25, y las citas las siguió cerrando el bot solo (5 de 5). O sea, entró más gente y la parte nueva se quedó sin trabajar: <b>30 de 43 leads</b> no recibieron ni un mensaje tuyo, y el sábado 31 y el domingo 1 no mandaste ninguno. <b>Todo lo demás en este reporte es consecuencia de eso.</b>"], "kpis": [{"k": "Leads de anuncio", "s": "Leads", "v": 43, "ant": 25, "t": "43", "at": "25"}, {"k": "Les escribiste antes", "s": "Escribiste", "v": 12, "ant": 0, "t": "12", "at": "0 de 25"}, {"k": "Con nota de voz", "s": "Voz", "v": 9, "ant": 0, "t": "9", "at": "0 de 25"}, {"k": "Agendaron", "s": "Agendaron", "v": 5, "ant": 8, "t": "5", "at": "8"}, {"k": "Les escribiste después", "s": "Después", "v": 1, "ant": 2, "t": "1", "at": "2 de 8"}, {"k": "Les mandaste la foto", "s": "Foto", "v": 0, "ant": 0, "t": "0", "at": "0 de 8"}], "barras": [{"label": "Leads a los que le escribiste", "num": 12, "den": 43, "meta": 60}, {"label": "Leads con nota de voz", "num": 9, "den": 43, "meta": 40}, {"label": "Citas a las que mandaste la foto", "num": 0, "den": 5, "meta": 60, "vacio": "Esta semana no hubo citas, así que esta barra no aplica."}], "origen": [{"k": "El bot", "v": 5, "c": "#2F6F68"}], "origenNota": "Las 5 citas de la semana las creó el bot, y en ninguna de las cinco apareciste tú en la conversación antes de que se agendara. El bot hace su parte —responde rápido y filtra— pero su techo es su techo: con 25 leads cerró 8 y con 43 cerró 5. La diferencia la tienes que poner tú, y esta semana apenas empezaste. Varias de estas citas son para noviembre y aún no han ocurrido.", "metodo": [{"c": "Rutina diaria: revisar las conversaciones de por lo menos los dos días anteriores, todos los días, buscando a quien quedó a medias.", "h": "Mandaste 18 mensajes el miércoles 28 y entre 1 y 5 los otros días; el <b>sábado 31 y el domingo 1 no mandaste ninguno</b>. <b>30 de 43 leads</b> se quedaron sin un mensaje tuyo. Y a <b>Ismar</b>, que preguntó el 30 de octubre «Y que costo tiene los tratamientos», <b>no le contestó nadie</b>.", "p": "El fin de semana es cuando más gente escribe sobre un tema como este, y es justo cuando no hubo nadie. Las 30 sin tocar pasaron solo por el bot."}, {"c": "Crea confianza antes de agendar con dos o tres preguntas, y cuando alguien te cuenta un detalle íntimo de su caso, eso es la puerta abierta más grande que vas a tener.", "h": "<b>Rous</b> te escribió seis mensajes y el último, el 1 de noviembre, fue <b>«Si pero no llego a la parte de las entrepiernas no me rasuro total siempre un pokito»</b>. <b>Šån</b> escribió trece mensajes preguntando por la sensación del tratamiento. Ninguna de las dos recibió un mensaje tuyo.", "p": "Las dos están contando cosas que solo se cuentan cuando hay confianza y ganas reales. Son las dos conversaciones más avanzadas de la semana y las dos se quedaron en el aire."}, {"c": "A la que ya agendó hay que empujarla para que asista: el mensaje y la foto de un resultado parecido antes de la cita.", "h": "De las <b>5 citas</b>, le escribiste después a 1 y mandaste foto a <b>0</b>. <b>Nane</b> tuvo trece mensajes con el bot y cerró con «Listo muchas gracias»; <b>Amo</b> tuvo diez y cerró con «Ok». A ninguna de las dos le escribiste.", "p": "Nane y Amo van a llegar al spa sin haber hablado nunca contigo, para un tratamiento que es íntimo y que da pena. Es el punto donde una foto y dos líneas tuyas cambian si llega o no."}], "cierre": "Lo importante de esta semana no es el 12%: es que pasaste de 0 a 12 leads tocados y de 0 a 9 notas de voz. Eso es el método empezando a funcionar y hay que decirlo. Lo que falta es que no sea un día: el miércoles 28 hiciste 18 mensajes y el fin de semana cero, y en un servicio tan personal como el tuyo la que te escribe un sábado por la noche necesita respuesta el domingo, no el miércoles. Tus clientas de siempre vuelven porque ya te tienen confianza para hablarte de su cuerpo; la que te vio en un anuncio tiene que construir esa confianza desde cero, y eso solo lo haces tú.", "funciono": "<b>9 notas de voz</b> en una semana, de cero. Para un tratamiento íntimo, donde la persona tiene vergüenza de preguntar, tu voz vale más que cualquier texto, y lo empezaste a usar. Y el miércoles 28 mandaste 18 mensajes en un día: ya sabes que puedes. Mantén eso y repártelo de lunes a domingo, y el número se mueve solo.", "acciones": [{"t": "Rous, Šån e Ismar, hoy", "d": "Las tres están a un mensaje: dos te contaron detalles de su caso y la tercera preguntó precio y no recibió respuesta de nadie.", "g": "Nota de voz: «Hola Rous, soy Vany. Tranquila, eso que me cuentas lo veo todos los días y no es ningún problema, al contrario: en la evaluación reviso la zona y vemos cómo está tu piel, es gratis y sin abono. ¿Te viene mejor entre semana o fin de semana?»"}, {"t": "Las 5 que ya tienen cita, con foto", "d": "Fue 0 de 5. Nane y Amo no han hablado contigo nunca. Un antes y después el día anterior.", "g": "Hola Nane, soy Vany, la que te va a atender. Mira el resultado de una clienta con un caso muy parecido al tuyo [foto]. Te espero el {día} a las {hora}, ¿me confirmas?"}, {"t": "No apagues el fin de semana", "d": "El 31 y el 1 no hubo ningún mensaje tuyo y entraron leads los dos días. Veinte minutos el sábado y veinte el domingo.", "g": "Para quien escribió el fin de semana: «Hola [nombre], soy Vany. Vi tu mensaje. Cuéntame, ¿qué zona te gustaría trabajar y qué resultado esperas? Con eso te digo exactamente cómo se hace en tu caso.»"}], "pie": "Los números salen de tu cuenta de EpikFlow entre el lunes 26 de octubre y el domingo 1 de noviembre. Solo cuentan como tuyos los mensajes que salieron de tu teléfono o de tu equipo desde la plataforma, así que si algo quedó fuera es porque no pudimos verlo, nunca al revés."}</script><script src="/assets/a.js" defer></script></html>
