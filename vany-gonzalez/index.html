<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reporte de Gestión</title><link rel="stylesheet" href="/assets/s.css"><script type="application/json" id="d">{"slug": "vany-gonzalez", "nombre": "Vany González", "estado": "listo", "rango": "Semana del 5 al 11 de octubre de 2026", "rangoCorto": "5–11 oct", "rangoAnt": "28 sep–4 oct", "tasa": {"pct": 26, "num": 17, "den": 66, "botSola": 26, "ella": 0, "mutuo": 0, "leadSola": 0, "pctAnt": 31}, "historico": [{"etq": "28 sep–4 oct", "tasa": 31}, {"etq": "5–11 oct", "tasa": 26}], "intro": ["Esta semana te entraron 66 personas por publicidad y agendaron 17: un <b>26%</b>. La semana pasada fueron 91 leads y 28 citas, un 31%. Sigues entre las tres mejores tasas de toda la cartera, y las 17 citas las cerró el bot solo, sin que tú tuvieras que escribir una línea.", "Y tú sí escribiste, y mucho: <b>292 mensajes, 45 notas de voz y 43 fotos</b> salieron de tu teléfono esta semana, a 53 personas distintas. El punto no es cuánto trabajas, es hacia dónde apuntas ese trabajo. De los 66 leads nuevos, <b>59 no recibieron ni un mensaje tuyo</b> y a ninguno le escribiste antes de que agendara. Tus mensajes fueron a las clientas que ya estaban en la suite, a los leads de la semana pasada que ya tenían cita y a gente que llegó por tu cuenta, no por la pauta. Estás llegando después del bot, cuando la persona ya decidió; donde el bot no logró cerrar, no había nadie detrás.", "Todo lo demás en este reporte es consecuencia de eso."], "kpis": [{"k": "Leads de anuncio", "s": "Leads", "v": 66, "ant": 91, "t": "66", "at": "91"}, {"k": "Les escribiste antes", "s": "Escribiste", "v": 0, "ant": 7, "t": "0 de 66", "at": "7 de 91"}, {"k": "Con nota de voz", "s": "Voz", "v": 0, "ant": 0, "t": "0", "at": "0"}, {"k": "Agendaron", "s": "Agendaron", "v": 17, "ant": 28, "t": "17", "at": "28"}, {"k": "Les escribiste después", "s": "Después", "v": 7, "ant": 10, "t": "7 de 17", "at": "10 de 28"}, {"k": "Les mandaste la foto", "s": "Foto", "v": 2, "ant": 0, "t": "2 de 17", "at": "0 de 28"}], "barras": [{"label": "Leads a los que le escribiste", "num": 0, "den": 66, "meta": 60}, {"label": "Leads con nota de voz", "num": 0, "den": 66, "meta": 40}, {"label": "Citas a las que mandaste la foto", "num": 2, "den": 17, "meta": 60}], "origen": [{"k": "El bot", "v": 17, "c": "#2F6F68"}], "origenNota": "Las 17 citas de la semana salieron del bot sin que tú intervinieras antes. Es un bot que convierte bien y por eso tu número es alto. Pero también significa que tu tasa sube y baja con el bot, no contigo: 31% la semana pasada, 26% esta, y en ninguna de las dos pusiste algo antes de la cita. Entre esas 59 personas que no recibieron nada tuyo están todas las conversaciones donde el bot se quedó sin respuesta.", "metodo": [{"c": "Un lead de publicidad no es una referida. La referida llega con la confianza prestada de la amiga; la que te vio en un anuncio no te conoce, está cotizando y comparando. El bot responde y filtra, pero la confianza la construyes tú, y hay que ponerla <i>antes</i> de la cita, no después.", "h": "A <b>0 de los 66 leads</b> les escribiste antes de que agendaran (la semana pasada fueron 7 de 91). Tus 292 mensajes fueron a otra gente: 125 a contactos viejos, 68 a los leads de la semana pasada que ya tenían cita y 74 a personas que llegaron por tu cuenta, no por la pauta. 21 personas preguntaron el precio esta semana y a las 21 les respondió el bot; tú a ninguna.", "p": "15 de esas 21 que preguntaron precio no agendaron: Vanessa, Adriana, Delia, Ruth, Mauricia, Lety, Maria… Son las que más cerca estaban y las que más necesitaban oír una voz humana. El bot cierra a las fáciles; las que dudan quedaron sin nadie."}, {"c": "La rutina diaria: revisar todos los días las conversaciones de por lo menos los dos días anteriores, y buscar a quien dejó de responder, a quien preguntó por el servicio y no agendó, y a quien se le dieron horarios y nunca confirmó.", "h": "Tus mensajes a los leads de la semana por día: lunes 2, martes 5, miércoles 0, jueves 13, viernes 3, sábado 0, domingo 2. Y los 25 fueron a gente que ya tenía cita (11 solo a Yhoanlys, el día de su evaluación). El domingo a las 11:56 pm Alejandra escribió «por favor si se libera algo más tarde» porque quería sábado a las 3 o entre semana a las 5; el bot no tenía ese horario y ahí quedó. Jessy preguntó «dónde están ubicados y qué horarios manejan», recibió la dirección y nada más.", "p": "Alejandra y Jessy no son leads fríos: son dos personas que dijeron «sí por favor» y se quedaron esperando a alguien que les resolviera el horario. Esas son exactamente las que la clase dice que revises cada mañana. 59 de 66 cerraron la semana sin un mensaje tuyo."}, {"c": "La nota de voz con los 5 elementos: su nombre, una validación, la necesidad que ella expresó, una solución y una pregunta para continuar. Es lo que convierte un «¿cuánto cuesta?» en una cita.", "h": "Mandaste <b>45 notas de voz</b> esta semana, y <b>0 a un lead nuevo antes de agendar</b>. 17 fueron a leads de la semana pasada que ya tenían cita, 3 a leads de esta semana después de agendar, 18 a contactos viejos y 7 a personas que llegaron por tu cuenta. A Estefany le mandaste 5, a Mayrena 3, a Cris 2: todas personas que ya habían agendado o ya habían venido.", "p": "Sabes hacerlo, y lo haces bien con quien ya está adentro. Pero la nota de voz de la clase es para la que todavía no entró: la que preguntó el precio, dudó y se fue a comparar. Esta semana esa persona no recibió ninguna, y por eso tu barra de nota de voz está en 0 de 66."}, {"c": "Después de agendar, el trabajo sigue: el mensaje y la foto del antes y después un día antes de la cita, para que la persona llegue. Confirmar una hora antes no es lo mismo que acompañar.", "h": "De lunes a jueves tuviste 15 citas de leads de anuncio. A ninguna le mandaste foto ni audio antes; a 4 no les escribiste nada y a la mayoría de las demás les escribiste con menos de una hora de margen: «me confirmas tu cita de las 2:30 por favor» a la 1:24, «me confirma tu cita de la 1:30» a la 1:19. El viernes 9 cambiaste: a las 11 personas con cita para el sábado les mandaste una nota de voz un día antes, y a 9 de ellas también la foto.", "p": "Según tu propio calendario, de las 15 citas de lunes a jueves llegaron 4 y <b>11 no se presentaron</b>. CVPS te respondió «se me presentó un asunto urgente» diez minutos antes de la cita; Sanchez te avisó el día anterior que no iba y nadie la reagendó. La persona que decide la noche anterior si va o no, necesita la foto esa noche, no el mensaje a la hora."}], "cierre": "Nada de esto es opinión nuestra: es la clase de seguimiento que ya viste en el área de miembros, y esta misma semana se probó en tu cuenta. Cris llegó por un anuncio el 30 de septiembre, el bot le agendó la evaluación gratis, tú la atendiste, le hablaste, le mandaste fotos y audios, y el viernes le hiciste el microneedling y ya tiene su próxima sesión el 17. Eso es el método completo funcionando, de la pauta a la venta. La diferencia es que Cris llegó sola hasta la suite porque el bot pudo con ella; las 49 que no agendaron y las 11 que no se presentaron necesitaban que ese mismo trabajo tuyo empezara antes. Tus clientas de siempre llegan solas porque ya confían en ti; la que te vio por primera vez en un anuncio no trae esa confianza, y mientras el primer mensaje tuyo siga llegando cuando ya está en la puerta, el 26% va a seguir siendo el número del bot, no el tuyo.", "funciono": "El viernes 9 hiciste exactamente lo de la clase: a las 11 personas con cita para el sábado les mandaste <b>una nota de voz un día antes, y a 9 también la foto</b>, y te respondieron. Sandra: «sí, ahí estaré, disculpa que no te haya respondido, es que estoy trabajando». Mayrena: «sí ahí llego». Y con Cris, el ciclo entero: evaluación gratis el sábado 3, atendida, 20 mensajes tuyos esta semana («se te quedó la cadena»), microneedling el viernes y sesión agendada para el 17. Cuando entras en la conversación, cierras. Lo que falta es entrar antes.", "acciones": [{"t": "Diez minutos cada mañana con los leads de ayer y antier", "d": "Esta semana 59 de 66 leads no recibieron nada tuyo y 15 preguntaron el precio y no agendaron. Antes de atender a la primera clienta, abre las conversaciones de los dos últimos días que no tienen cita y mándale a cada una un audio con su nombre, lo que te contó y una pregunta. Empieza hoy por Alejandra (quiere sábado a las 3 o entre semana a las 5) y por Jessy (preguntó ubicación y horarios).", "g": "Hola [nombre], soy Vany, la que te va a atender. Vi que preguntaste por el aclaramiento de zona íntima y quería contestarte yo misma. Lo que me cuentas de que te rasuras seguido es lo más común, y justo por eso la evaluación es gratis: reviso tu piel y te digo cuántas sesiones necesitas tú, no un número genérico. Cuéntame una cosa: ¿te sale más fácil entre semana o el sábado?"}, {"t": "La foto y el audio un día antes, para todas las citas, como hiciste el viernes", "d": "De lunes a jueves 11 de 15 citas no se presentaron y ninguna había recibido foto ni audio antes. Cada tarde, a las citas de mañana: una foto de un antes y después de una clienta parecida y un audio corto. Esta semana ya tienes citas el lunes 12 (Doris, Daniela, Maria Esme), el martes 13 (Itza), el miércoles 14 (Jossy), el viernes 16 (Viviana y una más) y el sábado 17 (Nin, Auri, Keili).", "g": "Hola [nombre], ya quedó tu evaluación mañana a las [hora]. Te dejo un antes y después de una clienta que llegó con la piel parecida a la tuya, para que veas de qué hablamos. Estoy en el piso 2, suite 290. ¿Cuento contigo? 🤍"}, {"t": "A la que no vino, reagéndala tú el mismo día", "d": "Sanchez avisó que no podía y dijo «agendaré para otro día»; Kenia pidió «el otro sábado»; CVPS tuvo un imprevisto. Ninguna quedó reagendada. Un audio el mismo día con dos opciones concretas, y la cita vuelve al calendario.", "g": "Hola [nombre], no te preocupes, estas cosas pasan. Te guardo el espacio: ¿te queda mejor el [día] a las [hora] o el [día] a las [hora]?"}], "pie": "Los números salen de tu cuenta de EpikFlow entre el lunes 5 y el domingo 11 de octubre. Solo cuentan como tuyos los mensajes que salieron de tu teléfono o de tu equipo desde la plataforma, así que si algo quedó fuera es porque no pudimos verlo, nunca al revés. Si una cita entró esta semana para dentro de varios días, todavía está por ocurrir y no cuenta en tu contra."}</script><script src="/assets/a.js" defer></script></html>
